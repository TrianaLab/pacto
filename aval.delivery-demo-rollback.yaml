# Kind acceptance: builds the dashboard and operator images from this tree, creates its own kind
# cluster (kind's pinned node image), installs the packaged chart and drives the scenario.
# Third-party images are pinned by digest. KIND_CLUSTER (reuse a cluster) is fingerprinted.
# Scenario: the Kubernetes delivery demo (examples/story on a real cluster, the dashboard
# journeys, a second cluster through Argo CD); every beat is checked against examples/story.
# One CI shard: DELIVERY_DEMO_SHARD=rollback.
apiVersion: aval.trianalab.io/v1
kind: Test
metadata:
  name: pacto-delivery-demo-rollback
runner:
  command: ["env", "DELIVERY_DEMO_SHARD=rollback", "bash", "tests/acceptance/kind/delivery-demo.sh", "all"]
scope:
  source:
    - "tests/acceptance/kind/delivery.sh"
    - "tests/acceptance/kind/delivery-lib.sh"
    - "tests/acceptance/kind/delivery-identity.sh"
    - "tests/acceptance/kind/delivery-records.sh"
    - "tests/acceptance/kind/delivery-ladder.sh"
    - "tests/acceptance/kind/fixtures/identity/**"
    - "tests/acceptance/kind/delivery-demo.sh"
    - "tests/acceptance/kind/fixtures/delivery-demo/**"
    - "examples/story/**"
    - "pkg/dashboard/frontend/e2e-live/**"
    - "pkg/dashboard/frontend/playwright.live.config.ts"
    - "pkg/dashboard/frontend/tsconfig.json"
  dependencies:
    - "pkg/dashboard/frontend/package.json"
    - "pkg/dashboard/frontend/package-lock.json"
  contracts:
    - "aval.image-pacto.yaml"
    - "aval.image-operator.yaml"
    - "aval.kind-harness.yaml"
  allowMutable:
    - file: "examples/story/contracts/checkout/1.8.0/deploy/checkout.yaml"
      ref: "ghcr.io/stefanprodan/podinfo:6.7.1"
      reason: "podinfo:6.7.1, which the demo pulls by digest (PODINFO_IMG) and loads into the nodes under this tag before any workload starts"
    - file: "examples/story/contracts/checkout/1.9.0/deploy/checkout.yaml"
      ref: "ghcr.io/stefanprodan/podinfo:6.7.1"
      reason: "podinfo:6.7.1, which the demo pulls by digest (PODINFO_IMG) and loads into the nodes under this tag before any workload starts"
    - file: "examples/story/contracts/orders/1.4.0/deploy/orders.yaml"
      ref: "ghcr.io/stefanprodan/podinfo:6.7.1"
      reason: "podinfo:6.7.1, which the demo pulls by digest (PODINFO_IMG) and loads into the nodes under this tag before any workload starts"
    - file: "examples/story/contracts/pay-agent/1.0.0/deploy/pay-agent.yaml"
      ref: "ghcr.io/stefanprodan/podinfo:6.7.1"
      reason: "podinfo:6.7.1, which the demo pulls by digest (PODINFO_IMG) and loads into the nodes under this tag before any workload starts"
    - file: "examples/story/contracts/pay-agent/1.1.0/deploy/pay-agent.yaml"
      ref: "ghcr.io/stefanprodan/podinfo:6.7.1"
      reason: "podinfo:6.7.1, which the demo pulls by digest (PODINFO_IMG) and loads into the nodes under this tag before any workload starts"
    - file: "examples/story/contracts/payments/2.3.0/deploy/payments.yaml"
      ref: "ghcr.io/stefanprodan/podinfo:6.7.1"
      reason: "podinfo:6.7.1, which the demo pulls by digest (PODINFO_IMG) and loads into the nodes under this tag before any workload starts"
    - file: "examples/story/contracts/payments/2.4.0/deploy/payments.yaml"
      ref: "ghcr.io/stefanprodan/podinfo:6.7.1"
      reason: "podinfo:6.7.1, which the demo pulls by digest (PODINFO_IMG) and loads into the nodes under this tag before any workload starts"
    - file: "examples/story/contracts/payments/2.4.1/deploy/payments.yaml"
      ref: "ghcr.io/stefanprodan/podinfo:6.7.1"
      reason: "podinfo:6.7.1, which the demo pulls by digest (PODINFO_IMG) and loads into the nodes under this tag before any workload starts"
    - file: "examples/story/contracts/payments/2.4.2/deploy/payments.yaml"
      ref: "ghcr.io/stefanprodan/podinfo:6.7.1"
      reason: "podinfo:6.7.1, which the demo pulls by digest (PODINFO_IMG) and loads into the nodes under this tag before any workload starts"
    - file: "examples/story/contracts/payments/2.4.3/deploy/payments.yaml"
      ref: "ghcr.io/stefanprodan/podinfo:6.7.1"
      reason: "podinfo:6.7.1, which the demo pulls by digest (PODINFO_IMG) and loads into the nodes under this tag before any workload starts"
    - file: "examples/story/contracts/payments/3.0.0/deploy/payments.yaml"
      ref: "ghcr.io/stefanprodan/podinfo:6.7.1"
      reason: "podinfo:6.7.1, which the demo pulls by digest (PODINFO_IMG) and loads into the nodes under this tag before any workload starts"
    - file: "examples/story/plain/fraud/Dockerfile"
      ref: "python:3.13-alpine"
      reason: "the story's plain fraud service as committed; the demo rewrites its base to the digest-pinned PYTHON_IMG in its working copy before it builds (delivery-demo.sh story_pactify)"
    - file: "examples/story/plain/fraud/k8s/deployment.yaml"
      ref: "registry.example/story/images/fraud:1.0.0"
      reason: "a placeholder registry the demo rewrites to its local registry; the image is the one it builds in the run"
    - file: "tests/acceptance/kind/delivery-demo.sh"
      ref: "docker.io/library/${repo#public.ecr.aws/docker/library/}@$dig"
      reason: "an image or package argument built in this run or pinned by digest in a variable; the scanner cannot resolve shell variables"
    - file: "tests/acceptance/kind/delivery-demo.sh"
      ref: "$"
      reason: "a chart `helm package`d in this run from the in-scope chart (or the digest-checked v4 fixture), installed from the local .tgz"
    - file: "tests/acceptance/kind/delivery-identity.sh"
      ref: "$@"
      reason: "an image or package argument built in this run or pinned by digest in a variable; the scanner cannot resolve shell variables"
    - file: "tests/acceptance/kind/delivery.sh"
      ref: "$"
      reason: "a chart `helm package`d in this run from the in-scope chart (or the digest-checked v4 fixture), installed from the local .tgz"
environment:
  toolchain:
    platform: "Linux x86_64"
    go: "1.27.3"
    cosign: "3.1.4"
    docker-platform: "linux/amd64"
    kind: "0.30.0"
    helm: "4.3.1"
    node: "22.23.4"
  probe:
    platform: ["uname", "-sm"]
    go: ["go", "env", "GOVERSION"]
    cosign: ["cosign", "version"]
    docker-platform: ["docker", "version", "--format", "{{.Server.Os}}/{{.Server.Arch}}"]
    kind: ["kind", "version"]
    helm: ["helm", "version", "--short"]
    node: ["node", "--version"]
  env: [GOFLAGS, GOEXPERIMENT, CGO_ENABLED, GOOS, GOARCH, GOTOOLCHAIN, GOWORK, GODEBUG, DOCKER_DEFAULT_PLATFORM, KIND_CLUSTER, KIND_POLL, PW_BASE_URL]
cacheability: controlled-environment
