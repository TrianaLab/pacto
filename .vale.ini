# Prose gate for the Pacto documentation (`make docs-lint`, run by `make docs-check`).
#
# Vale owns PROSE. markdownlint owns Markdown SYNTAX. docs_lint.py owns
# STRUCTURAL BUDGETS (words per page/section, heading depth). The three do not
# overlap, so a rule has exactly one home.
#
# The rules in .vale/styles/Pacto are deliberately small, and quiet now that the
# 39 alerts they raised at adoption are fixed. They exist as regression guards:
# the failure mode is not the prose that is here, it is the marketing register
# and the unsupported claims that arrive with the next contributor or agent.
# Every rule earned its place on a real hit -- see each file's header.
StylesPath = .vale/styles
MinAlertLevel = error

[*.md]
BasedOnStyles = Pacto

# Built-in: a doubled word ("the the"). Free, and no Pacto rule duplicates it.
Vale.Repetition = error

# MkDocs Material syntax that is not Markdown. The parser would otherwise read
# these as prose and every rule would trip on the marker rather than the text.
#   --8<-- "FILE"    snippet include (pymdownx.snippets)
#   === "Tab title"  content tabs
#   !!! / ??? note   admonition markers
TokenIgnores = (--8<--\s+"[^"]*"), (^(?:===|!!!|\?\?\?)[+!]? *"?[^"\n]*"?$)
