# Demo operational-evidence fixture for the Pacto operational graph.
#
# This models what a platform would INGEST from real environments: pre-produced
# evaluation results (a signed, versioned EvidenceSet in the future). It lets the
# demo show every target state without a live cluster, and never fabricates a
# runtime fact — each entry is an explicit, declared observation with provenance.
#
# It exercises: a compliant target, a non-compliant target (confirmed drift, one
# finding of it recorded from the kernel by the node agent), an
# unknown target (insufficient evidence) and stale targets (old evidence). Under
# --freshness 24h, all three timestamped targets read as stale; fraud-service is
# the oldest by design. The source itself is marked available; a second,
# unreachable environment is modeled separately so partial completeness is visible.
#
# This is an OFFLINE demo/test adapter — precomputed target state, NOT the signed
# external EvidenceSet ingestion protocol.
#
# The provisioning list (schema v2) is what a platform adapter reports about the
# resources consumers request. catalog-service 1.3.0 requests its database by
# configuration reference, and the adapter reports it Ready in production.
# orders-service depends on postgresql, and the adapter could not observe that
# resource (outcome Insufficient), so its status is Unknown. Each entry names the
# consumer revision by its content digest, the digest `pacto fleet --local` gives
# its bundle directory. File entries are unsigned, and every surface says so. A
# report older than the provisioning window (24h, or --freshness) reads as Unknown
# with the phase it last reported.
schemaVersion: pacto.dev/fleet-targets/v2
targets:
  - scope: production-eu
    kind: kubernetes-workload
    name: payments/payments-service
    service: payments-service
    resolvedRef: oci://ghcr.io/trianalab/pacto/payments-service:2.1.0
    compliance: Compliant
    coverage: { evaluated: 6, required: 6 }
    evidenceAt: 2026-07-29T09:40:00Z
    reconciledAt: 2026-07-29T09:41:00Z
    labels: { env: production, region: eu, delivery.pacto.trianalab.io/environment: production }

  - scope: production-eu
    kind: kubernetes-workload
    name: commerce/orders-service
    service: orders-service
    resolvedRef: oci://ghcr.io/trianalab/pacto/orders-service:1.2.0
    compliance: NonCompliant
    coverage: { evaluated: 5, required: 5 }
    evidenceAt: 2026-07-29T09:40:00Z
    reconciledAt: 2026-07-29T09:41:00Z
    labels: { env: production, region: eu, delivery.pacto.trianalab.io/environment: production }
    findings:
      - code: STATELESS_PERSISTENT_CONFLICT
        severity: error
        category: RuntimeDrift
        subjectKind: state
        subjectName: orders-db
        message: declared stateless but the observed workload mounts a persistent volume
      # Recorded kernel-backed finding: the node agent saw nothing listen on the
      # declared port, and the Kubernetes API agreed, so the evidence names the
      # collector k8s-observer+ebpf (Kubernetes + kernel).
      - code: INTERFACE_ABSENT
        severity: error
        category: RuntimeDrift
        subjectKind: interface
        subjectName: http
        message: nothing listens on the declared http interface
        evidenceRefs:
          - source: k8s
            observedAt: 2026-07-29T09:40:00Z
            collector: k8s-observer+ebpf
            detectedAt: 2026-07-29T09:38:00Z

  - scope: production-eu
    kind: kubernetes-workload
    name: identity/auth-service
    service: auth-service
    resolvedRef: oci://ghcr.io/trianalab/pacto/auth-service:1.0.0
    compliance: Unknown
    coverage: { evaluated: 1, required: 4 }
    labels: { env: production, region: eu }
    # No evidenceAt: the collector could not observe this target, so its
    # compliance is Unknown (uncertainty), NOT a confirmed violation.

  - scope: production-us
    kind: kubernetes-workload
    name: payments/fraud-service
    service: fraud-service
    resolvedRef: oci://ghcr.io/trianalab/pacto/fraud-service:1.0.0
    compliance: Compliant
    coverage: { evaluated: 3, required: 3 }
    evidenceAt: 2026-07-20T08:00:00Z
    labels: { env: production, region: us }
    # The oldest evidenceAt in the file, by design. See the header for why every
    # timestamped target here reads as stale under a short freshness window.

provisioning:
  - service: catalog-service
    digest: sha256:c5d2a1618e7db4045843161bda7ffb06a1990c61751da14f20cc3acc51352355
    kind: configuration
    name: database
    environment: production
    provider: platform-db
    externalRef: databases/catalog-production
    phase: Ready
    producer: platform-adapter
    observedAt: 2026-11-06T09:00:00Z
  - service: orders-service
    digest: sha256:67631b06ae23e670b62c2ed42929855df42eab880644a7ff8f0d67a6daa57061
    kind: dependency
    name: postgresql
    outcome: Insufficient
    producer: platform-adapter
    observedAt: 2026-11-06T09:00:00Z

state:
  status: available
