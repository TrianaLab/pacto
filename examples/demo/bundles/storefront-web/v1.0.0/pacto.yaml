pactoVersion: '2.2'
service:
  name: storefront-web
  version: 1.0.0
  owner:
    team: frontend-team
    dri: noah.brown
    contacts:
    - type: email
      value: frontend-team@acme.com
      purpose: ownership
    - type: chat
      value: '#frontend-team'
      purpose: support
    - type: oncall
      value: frontend-oncall
      purpose: oncall
interfaces:
- name: bff
  type: openapi
  ref: interfaces/openapi.json
  visibility: public
configurations:
- name: platform
  ref: oci://ghcr.io/trianalab/pacto/platform-app-config
  required: false
- name: app
  schema: configuration/schema.json
  required: true
  values:
    LOG_LEVEL: info
- name: chart
  schema: chart/values.schema.json
  required: true
  values:
    replicaCount: 2
dependencies:
- name: catalog-service
  ref: oci://ghcr.io/trianalab/pacto/catalog-service
  required: true
  compatibility: ^1.0.0
- name: inventory-service
  ref: oci://ghcr.io/trianalab/pacto/inventory-service
  required: true
  compatibility: ^2.0.0
- name: auth-service
  ref: oci://ghcr.io/trianalab/pacto/auth-service
  required: true
  compatibility: ^1.0.0
workload: service
state:
  type: stateless
  persistence:
    scope: local
    durability: ephemeral
  dataCriticality: medium
metadata:
  tier: domain
  category: frontend
  criticality: medium
  summary: The web shop shoppers browse and buy in
  repo: github.com/trianalab/pacto-demo/storefront-web
  tags:
  - web
  - storefront
  - helm
