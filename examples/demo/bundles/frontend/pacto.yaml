pactoVersion: '2.0'
service:
  name: frontend
  version: 1.0.0
  owner:
    team: frontend-team
    dri: diana.chen
    contacts:
    - type: email
      value: frontend-team@acme.com
      purpose: escalation
    - type: chat
      value: '#frontend-team'
      purpose: support
interfaces:
- name: http
  type: openapi
  ref: interfaces/openapi.json
  visibility: public
configurations:
- name: platform
  ref: oci://ghcr.io/trianalab/pacto/platform-app-config
  required: true
- name: app
  schema: configuration/schema.json
  values:
    OTEL_SERVICE_NAME: frontend
    API_GATEWAY_URL: http://api-gateway:8080
    NEXT_PUBLIC_APP_NAME: Commerce Platform
    NODE_ENV: production
  required: true
policies:
- name: http-security
  ref: oci://ghcr.io/trianalab/pacto/platform-http-policy
dependencies:
- name: api-gateway
  ref: oci://ghcr.io/trianalab/pacto/api-gateway
  required: true
  compatibility: ^1.0.0
workload: service
state:
  type: stateless
  persistence:
    scope: local
    durability: ephemeral
  dataCriticality: low
readiness:
  minScore: 80
  expires: '2027-01-31'
  partialCredit: 0.5
  claims:
  - id: perf-budget
    type: report
    category: testing
    status: done
    evidence: https://lighthouse.acme.com/frontend-perf-2026-05
    weight: 30
    description: Performance budget compliance (Core Web Vitals)
  - id: a11y-audit
    type: report
    category: compliance
    status: done
    evidence: https://axe.acme.com/frontend-a11y-2026-06
    weight: 35
    description: Accessibility audit (WCAG 2.1 AA compliance)
  - id: e2e-tests
    type: report
    category: testing
    status: done
    evidence: https://playwright.acme.com/frontend-e2e
    weight: 25
    description: End-to-end test suite for critical user flows
  - id: security-headers
    type: ticket
    category: security
    status: deferred
    evidence: SEC-2201
    weight: 20
    description: Security headers review (deferred to next sprint)
  - id: seo-audit
    type: report
    category: documentation
    status: deferred
    evidence: TBD
    weight: 15
    description: SEO best practices audit (deferred pending redesign)
  - id: monitoring-rum
    type: url
    category: observability
    status: done
    evidence: https://datadog.acme.com/rum/frontend
    weight: 25
    description: Real user monitoring for frontend performance
metadata:
  tier: edge
  category: frontend
  criticality: high
  summary: Customer-facing web application for the e-commerce platform
  language: typescript
  repo: github.com/trianalab/pacto-demo/frontend
  tags:
  - frontend
  - nextjs
  - web
  - public
