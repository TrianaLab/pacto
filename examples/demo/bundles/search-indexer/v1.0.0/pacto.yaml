pactoVersion: '2.2'
service:
  name: search-indexer
  version: 1.0.0
  owner:
    team: catalog-team
    dri: lena.fischer
    contacts:
    - type: email
      value: catalog-team@acme.com
      purpose: ownership
    - type: chat
      value: '#catalog-team'
      purpose: support
    - type: oncall
      value: catalog-oncall
      purpose: oncall
interfaces:
- name: search
  type: openapi
  ref: interfaces/openapi.json
  visibility: internal
dependencies:
- name: catalog-service
  ref: oci://ghcr.io/trianalab/pacto/catalog-service
  required: true
  compatibility: ^1.0.0
- name: inventory-service
  ref: oci://ghcr.io/trianalab/pacto/inventory-service
  required: true
  compatibility: ^2.0.0
  requires:
  - interface: stock-events
    ordering: per-key
workload: service
state:
  type: stateless
  persistence:
    scope: local
    durability: ephemeral
  dataCriticality: medium
metadata:
  tier: domain
  category: catalog
  criticality: medium
  summary: Keeps the product search index in step with the catalog and stock
  repo: github.com/trianalab/pacto-demo/search-indexer
  tags:
  - search
