pactoVersion: '2.0'
service:
  name: feature-store
  version: 1.0.0
  owner:
    team: data-platform
    dri: kenji.mori
    contacts:
    - type: email
      value: data-platform@acme.com
      purpose: ownership
    - type: chat
      value: '#data-platform'
      purpose: support
    - type: oncall
      value: data-oncall
      purpose: oncall
interfaces:
- name: http
  type: openapi
  ref: interfaces/openapi.json
  visibility: internal
dependencies:
- name: redis
  ref: oci://ghcr.io/trianalab/pacto/redis
  required: true
  compatibility: ^7.0.0
workload: service
state:
  type: stateful
  persistence:
    scope: shared
    durability: persistent
  dataCriticality: high
metadata:
  tier: domain
  category: data
  criticality: medium
  summary: Serves model features with low latency
  repo: github.com/trianalab/pacto-demo/feature-store
  tags:
  - ml
  - features
