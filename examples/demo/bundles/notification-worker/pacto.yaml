pactoVersion: "1.2"

service:
  name: notification-worker
  version: 1.0.0
  owner:
    team: commerce-team
    dri: fatima.ahmed
    contacts:
      - type: email
        value: commerce-team@acme.com
        purpose: escalation
      - type: chat
        value: "#commerce-team"
        purpose: support
  image:
    ref: ghcr.io/trianalab/pacto-demo/notification-worker:1.0.0

interfaces:
  - name: events
    type: event
    visibility: internal
    contract: interfaces/events.json

configurations:
  - name: platform
    ref: oci://ghcr.io/trianalab/pacto-demo/platform-worker-config
  - name: app
    schema: configuration/schema.json
    values:
      OTEL_SERVICE_NAME: notification-worker
      WORKER_CONCURRENCY: 3
      EMAIL_PROVIDER_URL: https://api.sendgrid.com
      EMAIL_FROM: noreply@platform.example.com
      SENDGRID_API_KEY: "${SENDGRID_API_KEY}"

policies:
  - name: http-security
    ref: oci://ghcr.io/trianalab/pacto-demo/platform-http-policy

dependencies:
  - name: email-provider
    ref: oci://ghcr.io/trianalab/pacto-demo/email-provider
    required: true
    compatibility: "^1.0.0"

runtime:
  workload: scheduled
  state:
    type: stateless
    persistence:
      scope: local
      durability: ephemeral
    dataCriticality: low
  lifecycle:
    upgradeStrategy: rolling
    gracefulShutdownSeconds: 30

scaling:
  replicas: 1

metadata:
  tier: domain
  category: notifications
  criticality: medium
  summary: Background worker that processes notification events and sends emails
  language: go
  repo: github.com/trianalab/pacto-demo/notification-worker
  tags:
    - notifications
    - email
    - worker
    - events
    - scheduled

readiness:
  minScore: 70
  expires: "2026-12-31"
  partialCredit: 0.5
  checks:
    - id: worker-dashboard
      type: url
      category: observability
      status: not-done
      evidence: https://grafana.acme.com/d/notification-worker
      weight: 30
      description: Dashboard for notification worker metrics (not created yet)
    - id: retry-logic
      type: ticket
      category: resilience
      status: not-done
      evidence: ENG-1543
      weight: 35
      description: Implement exponential backoff for failed notifications
    - id: runbook
      type: document
      category: documentation
      status: not-done
      evidence: docs/runbooks/notification-worker.md
      weight: 25
      description: On-call runbook (not written)
    - id: dlq-handling
      type: ticket
      category: infrastructure
      status: partial
      evidence: ENG-1598
      weight: 30
      description: Dead letter queue for failed notifications (partially implemented)
    - id: perf-test
      type: report
      category: testing
      status: not-done
      evidence: TBD
      weight: 20
      description: Performance testing under sustained load
