pactoVersion: '2.0'
service:
  name: orders-service
  version: 1.2.0
  owner:
    team: commerce-team
    dri: fatima.ahmed
    contacts:
    - type: email
      value: commerce-team@acme.com
      purpose: escalation
    - type: chat
      value: '#commerce-team'
      purpose: support
    - type: oncall
      value: commerce-oncall
      purpose: oncall
interfaces:
- name: http
  type: openapi
  ref: interfaces/openapi.json
  visibility: internal
- name: events
  type: asyncapi
  ref: interfaces/events.json
  visibility: internal
configurations:
- name: platform
  ref: oci://ghcr.io/trianalab/pacto-demo/platform-app-config
  required: true
- name: app
  schema: configuration/schema.json
  values:
    OTEL_SERVICE_NAME: orders-service
    DATABASE_URL: postgresql://postgres:5432/orders
    PAYMENTS_SERVICE_URL: http://payments-service:8083
    ENABLE_ORDER_TRACKING: true
  required: true
policies:
- name: http-security
  ref: oci://ghcr.io/trianalab/pacto-demo/platform-http-policy
dependencies:
- name: postgresql
  ref: oci://ghcr.io/trianalab/pacto-demo/postgresql
  required: true
  compatibility: ^16.0.0
- name: payments-service
  ref: oci://ghcr.io/trianalab/pacto-demo/payments-service
  required: true
  compatibility: ^1.0.0
- name: notification-worker
  ref: oci://ghcr.io/trianalab/pacto-demo/notification-worker
  required: true
  compatibility: ^1.0.0
workload: service
state:
  type: stateless
  persistence:
    scope: local
    durability: ephemeral
  dataCriticality: high
readiness:
  minScore: 80
  expires: '2099-12-31'
  partialCredit: 0.5
  history:
  - date: '2026-03-10'
    version: 1.2.0
    author: fatima.ahmed
    description: Added order tracking, structured ownership metadata and readiness
      assessment
  claims:
  - id: dashboard
    type: url
    category: observability
    status: done
    evidence: https://grafana.acme.com/d/orders-service
    weight: 40
    description: Production Grafana dashboard
  - id: runbook
    type: document
    category: documentation
    status: done
    evidence: docs/runbooks/orders-service.md
    weight: 30
    description: On-call runbook
  - id: security-review
    type: ticket
    category: security
    status: done
    evidence: SEC-2099
    weight: 30
    description: Annual security review
metadata:
  tier: domain
  category: orders
  criticality: high
  summary: Order management service with tracking, fulfillment, and structured ownership
    metadata
  language: go
  repo: github.com/trianalab/pacto-demo/orders-service
  tags:
  - orders
  - commerce
  - fulfillment
  - tracking
  - events
