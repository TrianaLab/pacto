pactoVersion: "2.0"

service:
  name: orders-service
  version: 1.1.0
  owner:
    team: team/commerce

interfaces:
  - name: http
    type: openapi
    ref: interfaces/openapi.json
    visibility: internal
  - name: events
    type: asyncapi
    ref: interfaces/events.json
    visibility: internal

configurations:
  - name: platform
    ref: oci://ghcr.io/trianalab/pacto-demo/platform-app-config
  - name: app
    schema: configuration/schema.json
    values:
      OTEL_SERVICE_NAME: orders-service
      DATABASE_URL: postgresql://postgres:5432/orders
      PAYMENTS_SERVICE_URL: http://payments-service:8083
      ENABLE_ORDER_TRACKING: true

policies:
  - name: http-security
    ref: oci://ghcr.io/trianalab/pacto-demo/platform-http-policy

dependencies:
  - name: postgresql
    ref: oci://ghcr.io/trianalab/pacto-demo/postgresql
    required: true
    compatibility: "^16.0.0"
  - name: payments-service
    ref: oci://ghcr.io/trianalab/pacto-demo/payments-service
    required: true
    compatibility: "^1.0.0"
  - name: notification-worker
    ref: oci://ghcr.io/trianalab/pacto-demo/notification-worker
    required: true
    compatibility: "^1.0.0"

workload: service
state:
  type: stateless
  persistence:
    scope: local
    durability: ephemeral
  dataCriticality: high

metadata:
  tier: domain
  category: orders
  criticality: high
  summary: Order management service with tracking and fulfillment status
  language: go
  repo: github.com/trianalab/pacto-demo/orders-service
  tags:
    - orders
    - commerce
    - fulfillment
    - tracking
    - events
