pactoVersion: '2.6'
service:
  name: postgresql
  version: 16.1.0
  offering: postgresql
  summary: Primary relational database for transactional data
  lifecycle:
    deprecated: '2026-11-01'
    sunset: '2027-06-30'
    successor: oci://ghcr.io/trianalab/pacto/postgresql:17.0.0
  owner:
    team: infra-data
    dri: carlos.silva
    contacts:
    - type: email
      value: infra-data@acme.com
      purpose: escalation
    - type: chat
      value: '#infra-data'
      purpose: support
    - type: oncall
      value: infra-data-oncall
      purpose: oncall
workload: service
configurations:
- name: provisioning
  schema: configuration/provisioning.schema.json
  required: true
policies:
- name: database-standards
  schema: policy/schema.json
state:
  type: stateful
  persistence:
    scope: shared
    durability: persistent
  dataCriticality: high
metadata:
  tier: infra
  category: storage
  criticality: high
  serviceType: infrastructure
  protocol: postgresql
  repo: github.com/trianalab/pacto-demo/postgresql
  tags:
  - database
  - relational
  - persistence
  - infrastructure
