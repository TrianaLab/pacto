pactoVersion: '2.0'
service:
  name: payments-service
  version: 1.0.0
  owner:
    team: team/payments
interfaces:
- name: http
  type: openapi
  ref: interfaces/openapi.json
  visibility: internal
- name: events
  type: asyncapi
  ref: interfaces/events.json
  visibility: internal
configurations:
- name: platform
  ref: oci://ghcr.io/trianalab/pacto/platform-app-config
  required: true
- name: app
  schema: configuration/schema.json
  values:
    LOG_LEVEL: info
    STRIPE_API_KEY: ${STRIPE_API_KEY}
    PAYMENTS_DB_URL: postgresql://postgres:5432/payments
    ENABLE_REFUNDS: true
  required: true
policies:
- name: http-security
  ref: oci://ghcr.io/trianalab/pacto/platform-http-policy
dependencies:
- name: postgresql
  ref: oci://ghcr.io/trianalab/pacto/postgresql
  required: true
  compatibility: ^16.0.0
- name: stripe-api
  ref: oci://ghcr.io/trianalab/pacto/stripe-api
  required: true
  compatibility: ^2024.01.01
workload: service
state:
  type: stateful
  persistence:
    scope: shared
    durability: persistent
  dataCriticality: high
metadata:
  tier: domain
  category: payments
  criticality: high
  summary: Core payment processing service handling charges and refunds via Stripe
  language: go
  repo: github.com/trianalab/pacto-demo/payments-service
  tags:
  - payments
  - stripe
  - charges
  - refunds
  - pci
