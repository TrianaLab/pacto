pactoVersion: '2.0'
service:
  name: recommendations
  version: 1.0.0
  owner:
    team: growth-team
    dri: priya.raman
    contacts:
    - type: email
      value: growth-team@acme.com
      purpose: ownership
    - type: chat
      value: '#growth-team'
      purpose: support
    - type: oncall
      value: growth-oncall
      purpose: oncall
interfaces:
- name: http
  type: openapi
  ref: interfaces/openapi.json
  visibility: internal
dependencies:
- name: catalog-service
  ref: oci://ghcr.io/trianalab/pacto/catalog-service
  required: true
  compatibility: ^1.0.0
- name: feature-store
  ref: oci://ghcr.io/trianalab/pacto/feature-store
  required: true
  compatibility: ^1.0.0
workload: service
state:
  type: stateless
  persistence:
    scope: local
    durability: ephemeral
  dataCriticality: medium
metadata:
  tier: domain
  category: growth
  criticality: medium
  summary: Products to show each customer
  repo: github.com/trianalab/pacto-demo/recommendations
  tags:
  - personalisation
