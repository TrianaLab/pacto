pactoVersion: "2.0"

service:
  name: api-gateway
  version: 1.2.0
  owner:
    team: platform-foundations
    dri: alice.johnson
    contacts:
      - type: email
        value: platform-foundations@acme.com
        purpose: escalation
      - type: chat
        value: "#platform-foundations"
        purpose: support
      - type: oncall
        value: platform-foundations-oncall
        purpose: oncall

interfaces:
  - name: http
    type: openapi
    ref: interfaces/openapi.json
    visibility: public

configurations:
  - name: platform
    ref: oci://ghcr.io/trianalab/pacto-demo/platform-app-config
  - name: app
    schema: configuration/schema.json
    values:
      OTEL_SERVICE_NAME: api-gateway
      AUTH_SERVICE_URL: auth-service:50051
      ORDERS_SERVICE_URL: http://orders-service:8082
      PAYMENTS_SERVICE_URL: http://payments-service:8083
      REQUEST_TIMEOUT_SECONDS: 30
      ENABLE_WEBSOCKETS: true

policies:
  - name: gateway-routing
    schema: policy/schema.json

dependencies:
  - name: auth-service
    ref: oci://ghcr.io/trianalab/pacto-demo/auth-service
    required: true
    compatibility: "^1.0.0"
  - name: orders-service
    ref: oci://ghcr.io/trianalab/pacto-demo/orders-service
    required: true
    compatibility: "^1.0.0"
  - name: payments-service
    ref: oci://ghcr.io/trianalab/pacto-demo/payments-service
    required: true
    compatibility: "^1.0.0"

workload: service
state:
  type: stateless
  persistence:
    scope: local
    durability: ephemeral
  dataCriticality: low

metadata:
  tier: edge
  category: gateway
  criticality: high
  summary: API gateway with WebSocket support, order tracking, and structured ownership metadata
  language: go
  repo: github.com/trianalab/pacto-demo/api-gateway
  tags:
    - gateway
    - routing
    - websockets
    - authentication
    - public

readiness:
  minScore: 75
  expires: "2025-01-01"
  partialCredit: 0.5
  claims:
    - id: gateway-dashboard
      type: url
      category: observability
      status: done
      evidence: https://grafana.acme.com/d/api-gateway
      weight: 30
      description: API gateway metrics dashboard
    - id: rate-limiting
      type: ticket
      category: infrastructure
      status: done
      evidence: ENG-1234
      weight: 25
      description: Rate limiting implementation
    - id: security-review
      type: ticket
      category: security
      status: done
      evidence: SEC-2045
      weight: 40
      description: Security review for gateway routing and authentication
    - id: load-test
      type: report
      category: testing
      status: done
      evidence: https://k6.acme.com/api-gateway-load-2024-12
      weight: 35
      description: Load testing for peak traffic scenarios (stale report)
    - id: runbook
      type: document
      category: documentation
      status: done
      evidence: docs/runbooks/api-gateway.md
      weight: 20
      description: On-call runbook for gateway incidents
