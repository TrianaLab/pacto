pactoVersion: '2.1'
service:
  name: inventory-service
  version: 2.0.0
  owner:
    team: catalog-team
    dri: lena.fischer
    contacts:
    - type: email
      value: catalog-team@acme.com
      purpose: ownership
    - type: chat
      value: '#catalog-team'
      purpose: support
    - type: oncall
      value: catalog-oncall
      purpose: oncall
interfaces:
- name: stock-v1
  type: openapi
  ref: interfaces/stock-v1.json
  visibility: internal
- name: stock-feed
  type: asyncapi
  ref: interfaces/stock-feed.json
  visibility: internal
dependencies:
- name: postgresql
  ref: oci://ghcr.io/trianalab/pacto/postgresql
  required: true
  compatibility: ^16.0.0
- name: event-bus
  ref: oci://ghcr.io/trianalab/pacto/event-bus
  required: true
  compatibility: ^3.6.0
workload: service
state:
  type: stateful
  persistence:
    scope: shared
    durability: persistent
  dataCriticality: high
metadata:
  tier: domain
  category: catalog
  criticality: high
  summary: Stock levels per SKU, read by the storefront and fulfilment
  repo: github.com/trianalab/pacto-demo/inventory-service
  tags:
  - inventory
  - stock
  - warehouse
