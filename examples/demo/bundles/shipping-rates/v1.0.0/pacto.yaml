pactoVersion: '2.1'
service:
  name: shipping-rates
  version: 1.0.0
  owner:
    team: logistics-team
    dri: tomas.novak
    contacts:
    - type: email
      value: logistics-team@acme.com
      purpose: ownership
    - type: chat
      value: '#logistics-team'
      purpose: support
    - type: oncall
      value: logistics-oncall
      purpose: oncall
interfaces:
- name: rates
  type: openapi
  ref: interfaces/openapi.json
  visibility: internal
dependencies:
- name: carrier-gateway
  ref: oci://ghcr.io/trianalab/pacto/carrier-gateway
  required: true
  compatibility: ^1.0.0
workload: service
state:
  type: stateless
  persistence:
    scope: local
    durability: ephemeral
  dataCriticality: medium
metadata:
  tier: domain
  category: logistics
  criticality: medium
  summary: Quotes carrier rates for a parcel
  repo: github.com/trianalab/pacto-demo/shipping-rates
  tags:
  - shipping
  - rates
