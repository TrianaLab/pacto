# The contract for plain/fraud: the service, its owner and how it is
# published. It is hand-written, because pacto init does not read a Dockerfile
# or manifests yet (ledger B); no test derives it from plain/fraud. It declares
# no dependencies, because fraud calls nobody.
pactoVersion: "2.1"
service:
  name: fraud
  version: 1.0.0
  owner:
    team: risk
workload: service
publish:
  bundle: oci://registry.example/story/fraud
  deploy: manifests
  artifacts:
    - name: api
      type: image
      ref: oci://registry.example/story/images/fraud
      build:
        dockerfile:
          context: .
    - name: manifests
      type: manifests
      ref: oci://registry.example/story/deploy/fraud
      build:
        command: [sh, -c, 'cp k8s/*.yaml "$PACTO_OUT"/']
  sign:
    key: cosign.key
    transparencyLog: false
metadata:
  summary: "Scores a payment for fraud."
