# The contract for plain/fraud: what pacto init --owner risk
# --no-transparency-log writes there (story_test.go checks it; the story signs
# offline), plus a summary added by hand. It declares no
# dependencies, because fraud calls nobody. It publishes only from plain/fraud,
# where its build inputs (Dockerfile, k8s/*.yaml) are.
pactoVersion: "2.1"
service:
  name: fraud
  version: 1.0.0
  owner:
    team: risk
workload: service
publish:
  bundle: oci://registry.example/story/fraud
  deploy: manifests
  artifacts:
    - name: api
      type: image
      ref: oci://registry.example/story/images/fraud
      build:
        dockerfile:
          context: .
    - name: manifests
      type: manifests
      ref: oci://registry.example/story/deploy/fraud
      build:
        command: [sh, -c, 'cp k8s/deployment.yaml k8s/service.yaml "$PACTO_OUT"/ && sed -E "s,(^|[{,[:space:]])(image:[[:space:]]*[\"'']?)registry\.example/story/images/fraud:1\.0\.0([\"'']?[[:space:]]*([,}#]|$)),\1\2$PACTO_REF_API@$PACTO_DIGEST_API\3,g" k8s/deployment.yaml > "$PACTO_OUT"/deployment.yaml && { grep -qF "$PACTO_DIGEST_API" "$PACTO_OUT"/deployment.yaml || { echo "pacto: no image: registry.example/story/images/fraud:1.0.0 line to pin" >&2; exit 1; }; }']
  sign:
    key: cosign.key
    transparencyLog: false
metadata:
  summary: "Scores a payment for fraud."
