pactoVersion: "2.2"
service:
  name: payments
  version: 3.0.0
  owner:
    team: payments
workload: service
interfaces:
  - name: http
    type: openapi
    ref: interfaces/openapi.yaml
    # Charges are retried, so the callers rely on a repeated call charging once.
    guarantees:
      idempotent: true
      timeout: 5s
publish:
  bundle: oci://registry.example/story/payments
  deploy: manifests
  artifacts:
    - name: manifests
      type: manifests
      ref: oci://registry.example/story/deploy/payments
      build:
        command: [sh, -c, 'cp deploy/*.yaml "$PACTO_OUT"/']
  sign:
    key: cosign.key
    transparencyLog: false
metadata:
  summary: "Takes payments and lists refunds; currency is gone from a payment."
