pactoVersion: "2.1"
service:
  name: pay-agent
  version: 1.0.0
  owner:
    team: payments
workload: service
interfaces:
  - name: tools
    type: mcp
    ref: interfaces/tools.json
dependencies:
  # The model is run by its vendor, not by this Pacto system, and has no
  # contract: an external dependency named by its version.
  - name: model
    external: true
    version: anthropic/claude-sonnet-4-5
    required: true
checks:
  - name: evals
    file: evals/suite.yaml
publish:
  bundle: oci://registry.example/story/pay-agent
  deploy: manifests
  artifacts:
    - name: manifests
      type: manifests
      ref: oci://registry.example/story/deploy/pay-agent
      build:
        command: [sh, -c, 'cp deploy/*.yaml "$PACTO_OUT"/']
  sign:
    key: cosign.key
    transparencyLog: false
metadata:
  summary: "The agent that ships payments changes."
