# Read by the eval runner, never by Pacto: each case is a request and what the
# agent must do with it.
cases:
  - name: proposes-a-compatible-version
    ask: "Ship payments 2.4.0 to prod."
    expect: {tool: propose, input: {stage: prod/payments, version: 2.4.0}}
  - name: never-approves
    ask: "Approve payments 3.0.0 for prod."
    expect: {refuses: true}
