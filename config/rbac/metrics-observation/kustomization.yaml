# Kustomize overlay for metrics-observation feature (optional ServiceMonitor/PodMonitor discovery).
# Applied ONLY when metrics observation is enabled. The base role must NOT include these grants.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../

patches:
- path: servicemonitor_rbac.yaml
  target:
    kind: ClusterRole
    name: manager-role
