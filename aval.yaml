tests:
  # The part of make ci-test outside the 100% gate: the examples' Go tests and
  # the offline demo validation. The gated packages are the go.* tests.
  - metadata: {name: examples}
    use: [go.module, engine, story, demo, make]
    runner: {command: [sh, -c, "go test -race ./examples/... && make -C examples/demo validate"]}
    scope:
      source: ["examples/demo/pacto-dashboard/**", "examples/demo/generated/**", "examples/demo/publishbundles/**", "examples/demo/validatebundles/**"]
      dependencies: [pkg/dashboard/frontend/package.json, pkg/dashboard/frontend/package-lock.json]
      exclude: ["pkg/dashboard/frontend/**", "examples/demo/demo"]

  # make test-integration: the CLI in process against an in-process registry
  # and a real plugin binary, then the acceptance layer's own Go code.
  - metadata: {name: integration}
    use: [go.module, engine, story, make]
    runner: {command: [make, test-integration]}
    scope:
      source:
        - "tests/integration/**"
        - "tests/acceptance/**/*.go"
        - "tests/acceptance/scenario/seed.sh"
        - "examples/demo/bundles/**"
        - "examples/demo/fleet-targets.yaml"
        - "examples/demo/traces.json"
      exclude:
        - "pkg/dashboard/frontend/**"
        - "cmd/pacto/**/*_test.go"
        - "internal/**/*_test.go"
        - "pkg/**/*_test.go"
        - "internal/**/testdata/**"
        - "pkg/**/testdata/**"
        - "examples/story/**/*_test.go"

  # Cross-language dependencies, all carried by committed files, so nothing
  # beyond the scopes below is declared by hand:
  # - the dashboard UI build pkg/dashboard/ui/** is committed (make
  #   ci-ui-drift) and go:embed'ed: go.pkg.dashboard's scope (pkg/dashboard/**)
  #   holds it and the frontend sources it is built from.
  # - the TypeScript SDK pkg/dashboard/frontend/src/lib/generated/** is
  #   generated from the Go API and committed (make check-dashboard-sdk-drift):
  #   ui reads it from src/**, go.pkg.dashboard from pkg/dashboard/**.
  # - its OpenAPI copy examples/demo/pacto-dashboard/interfaces/openapi.json is
  #   in go.pkg.dashboard (aval gen sees the tests read it) and in examples.
  # - the WASM demo is built from the Go sources by test-browser, whose scope
  #   holds them (engine, demo, story).
  # - vitest reads pkg/impact/testdata/highlight-rank.json, README.md and
  #   docs/examples/dashboard-demo.md: declared in ui below.
  # make ci-ui: svelte-check and vitest from the lockfile.
  - metadata: {name: ui}
    use: [node, make]
    runner: {command: [make, ci-ui]}
    environment:
      # vitest allows .only unless CI is set.
      env: [CI]
    scope:
      source:
        - "pkg/dashboard/frontend/src/**"
        - "pkg/dashboard/frontend/index.html"
        - "pkg/dashboard/frontend/svelte.config.js"
        - "pkg/dashboard/frontend/tsconfig.json"
        - "pkg/dashboard/frontend/vite.config.js"
        # Read by demoEntry.test.ts and impactFigure.test.ts.
        - "README.md"
        - "docs/examples/dashboard-demo.md"
        - "pkg/impact/testdata/highlight-rank.json"

  # make test-browser, one Playwright shard per test: the WASM demo built
  # from this tree, the doc export, the engine smoke (shard 1) and Chromium
  # at the version the lockfile pins. CI is an input: it sets forbidOnly,
  # retries and reuseExistingServer in playwright.config.ts.
  - metadata: {name: "browser-{shard}"}
    use: [go.module, engine, story, demo, node, make]
    runner: {command: [make, test-browser, "PW_SHARD={shard}/{shard_count}"]}
    matrix: {shard: {count: 4}}
    scope:
      exclude:
        - "**/*_test.go"
        - "internal/**/testdata/**"
        - "pkg/**/testdata/**"
        - "examples/demo/demo"
        - "pkg/dashboard/frontend/e2e-live/**"
        - "pkg/dashboard/frontend/e2e-docs-site/**"
        - "pkg/dashboard/frontend/e2e-screenshots/**"
    environment:
      env: [CI, PW_PORT, PW_DOC_PORT, BASE, DIST, DOC_DIST, DOC_BUNDLE, VERSION]
    cacheability: controlled-environment
  - metadata: {name: go.cmd.pacto}
