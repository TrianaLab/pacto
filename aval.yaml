# Every test CI runs through Aval, and the files each one reads.
# Generated (make aval-gen, checked by ci-gates): the go.* fragments and
# tests, one per Go package with a test, scoped to the package, what it
# imports and the files it reads, plus go.module (toolchain, go.mod/go.work,
# Go environment). Hand-written: what no generator can know, each with its
# reason below.
# Left out, and run as plain make jobs: suites that build an image from an
# unpinned base (Dockerfile, integrations/kubernetes/Dockerfile: every kind,
# Compose and runtime suite), pull tags (registry:2, alpine:3, agnhost),
# download unpinned tools (envtest, helm-unittest, check-jsonschema), call the
# network (sum.golang.org, proxy.golang.org, GHCR), measure time (perf), read
# the user's ~/.cache/pacto and ~/.config/pacto (test-acceptance-local) or
# whose honest scope is the whole tree (ci-static, ci-gates).
apiVersion: aval.trianalab.io/v1
kind: TestSet
defaults:
  scope:
    # Image names that test fixtures hold as text; nothing builds or pulls them.
    allowMutable:
      - {file: internal/pactify/testdata/fraud/Dockerfile, ref: python:3.13-alpine, reason: fixture text; nothing builds it}
      - {file: internal/pactify/testdata/invoices/Dockerfile, ref: node:22-alpine, reason: fixture text; nothing builds it}
      - {file: internal/pactify/testdata/fraud/k8s/deployment.yaml, ref: registry.example/story/images/fraud:1.0.0, reason: fixture text; nothing pulls it}
      - {file: internal/pactify/testdata/invoices/k8s/deployment.yaml, ref: ghcr.io/acme/invoices:1.3.0, reason: fixture text; nothing pulls it}
      - {file: tests/acceptance/kind/runtime-conformance.sh, ref: "$", reason: read as text by a field-coverage test; not run here}
      - {file: tests/acceptance/local/runtime-docker.sh, ref: "${args[@]+${args[@]}}", reason: read as text by a field-coverage test; not run here}
      - {file: tests/acceptance/local/runtime-run.sh, ref: "${mode[@]}", reason: read as text by a field-coverage test; not run here}
      # The story and demo fragments' files, here so that go.pkg.contract and
      # go.pkg.validation, whose '**' scope reaches them, accept them too.
      - {file: examples/story/contracts/checkout/1.8.0/deploy/checkout.yaml, ref: ghcr.io/stefanprodan/podinfo:6.7.1, reason: fixture text the tests parse; nothing pulls it}
      - {file: examples/story/contracts/checkout/1.9.0/deploy/checkout.yaml, ref: ghcr.io/stefanprodan/podinfo:6.7.1, reason: fixture text the tests parse; nothing pulls it}
      - {file: examples/story/contracts/orders/1.4.0/deploy/orders.yaml, ref: ghcr.io/stefanprodan/podinfo:6.7.1, reason: fixture text the tests parse; nothing pulls it}
      - {file: examples/story/contracts/pay-agent/1.0.0/deploy/pay-agent.yaml, ref: ghcr.io/stefanprodan/podinfo:6.7.1, reason: fixture text the tests parse; nothing pulls it}
      - {file: examples/story/contracts/pay-agent/1.1.0/deploy/pay-agent.yaml, ref: ghcr.io/stefanprodan/podinfo:6.7.1, reason: fixture text the tests parse; nothing pulls it}
      - {file: examples/story/contracts/payments/2.3.0/deploy/payments.yaml, ref: ghcr.io/stefanprodan/podinfo:6.7.1, reason: fixture text the tests parse; nothing pulls it}
      - {file: examples/story/contracts/payments/2.4.0/deploy/payments.yaml, ref: ghcr.io/stefanprodan/podinfo:6.7.1, reason: fixture text the tests parse; nothing pulls it}
      - {file: examples/story/contracts/payments/2.4.1/deploy/payments.yaml, ref: ghcr.io/stefanprodan/podinfo:6.7.1, reason: fixture text the tests parse; nothing pulls it}
      - {file: examples/story/contracts/payments/2.4.2/deploy/payments.yaml, ref: ghcr.io/stefanprodan/podinfo:6.7.1, reason: fixture text the tests parse; nothing pulls it}
      - {file: examples/story/contracts/payments/2.4.3/deploy/payments.yaml, ref: ghcr.io/stefanprodan/podinfo:6.7.1, reason: fixture text the tests parse; nothing pulls it}
      - {file: examples/story/contracts/payments/3.0.0/deploy/payments.yaml, ref: ghcr.io/stefanprodan/podinfo:6.7.1, reason: fixture text the tests parse; nothing pulls it}
      - {file: examples/story/plain/fraud/Dockerfile, ref: python:3.13-alpine, reason: fixture text the tests parse; nothing builds it}
      - {file: examples/story/plain/fraud/k8s/deployment.yaml, ref: registry.example/story/images/fraud:1.0.0, reason: fixture text the tests parse; nothing pulls it}
      - {file: examples/demo/Makefile, ref: vite, reason: "npx after npm ci runs the lockfile's vite"}
    # Symlinks are never inputs: npm ci's node_modules and two kind fixture links.
    exclude:
      - "**/node_modules/**"
      # The go.* coverage profiles: outputs (--go-cover-profile), never inputs.
      - "cover/**"
      - "tests/acceptance/kind/fixtures/delivery-demo/audit-policy.yaml"
      - "tests/acceptance/kind/fixtures/delivery-demo/pacto-realm.json"
      # Files only go.pkg.contract and go.pkg.validation reach, through the
      # '**' their repo walks give them, and neither reads (they read
      # pacto.yaml, testdata YAML and the scripts field-coverage.yaml names):
      # their image and tool tags would block reuse of those two results.
      - ".github/workflows/security.yml"
      - "Dockerfile"
      - "Makefile"
      - "integrations/kubernetes/Dockerfile"
      - "integrations/kubernetes/Makefile"
      - "integrations/kubernetes/charts/pacto-operator/Chart.yaml"
      - "integrations/kubernetes/charts/pacto-operator/templates/_helpers.tpl"
      - "integrations/kubernetes/charts/pacto-operator/templates/delivery/admission.yaml"
      - "integrations/kubernetes/charts/pacto-operator/templates/delivery/recorder.yaml"
      - "integrations/kubernetes/charts/pacto-operator/templates/dex-credentials.yaml"
      - "integrations/kubernetes/charts/pacto-operator/tests/golden/default.yaml"
      - "integrations/kubernetes/ci.mk"
      - "integrations/kubernetes/config/samples/demo/kustomization.yaml"
      - "integrations/kubernetes/config/samples/demo/workloads.yaml"
      - "integrations/kubernetes/config/samples/scenarios/00-infrastructure.yaml"
      - "integrations/kubernetes/config/samples/scenarios/08-runtime-conformance.yaml"
      - "release/orchestrator/dry-run.sh"
      - "release/orchestrator/test-release-version.sh"
      - "tests/acceptance/kind/dashboard-modes.sh"
      - "tests/acceptance/kind/delivery-demo.sh"
      - "tests/acceptance/kind/delivery-identity.sh"
      - "tests/acceptance/kind/delivery.sh"
      - "tests/acceptance/kind/evidence.sh"
      - "tests/acceptance/kind/fixtures/pacto-operator-v4/templates/deployment.yaml"
      - "tests/acceptance/kind/gitops-argocd.sh"
      - "tests/acceptance/kind/gitops-flux.sh"
      - "tests/acceptance/kind/lib.sh"
      - "tests/acceptance/kind/observation.sh"
      - "tests/acceptance/kind/operational-graph.sh"
      - "tests/acceptance/kind/reconcile.sh"
      - "tests/acceptance/kind/upgrade-v4-v5.sh"
      - "tests/acceptance/local/compose-demo.sh"
  environment:
    # CI runs on linux/amd64; a result from another platform is not reused.
    toolchain: {platform: "Linux x86_64"}
    probe: {platform: [uname, -sm]}
    # viper reads PACTO_<key> for every key (internal/cli/root.go
    # AutomaticEnv); the CLI reads its config dir (credentials, plugins)
    # outside the tree.
    env: ["PACTO_*", NO_COLOR]
    paths: ["~/.config/pacto", "${XDG_CONFIG_HOME}/pacto"]
  cacheability: hermetic
fragments:
  # The engine: cmd/pacto and everything it builds from. pkg/** also holds the
  # frontend; tests that do not read it exclude pkg/dashboard/frontend/**.
  engine:
    scope:
      source: ["cmd/pacto/**", "internal/**", "pkg/**"]
  # The payments story (examples/story), embedded by the demo and read by the
  # acceptance fixture. Its manifests name images as text (defaults).
  story:
    scope:
      source: ["examples/story/**"]
  # ui and browser: npm ci from the frontend lockfile on Node 22.
  node:
    scope:
      dependencies: [pkg/dashboard/frontend/package.json, pkg/dashboard/frontend/package-lock.json]
    environment:
      toolchain: {node: "22"}
      probe: {node: [node, --version]}
      env: [NODE_OPTIONS]
  # Tests whose command is a make target read the recipe. Aval scans the
  # whole Makefile; the references below sit in targets these tests do not
  # run, except test-browser's, whose npx runs the @playwright/test the
  # lockfile pins, right after npm ci.
  make:
    scope:
      dependencies: [Makefile, ci.mk]
      allowMutable:
        - {file: Makefile, ref: playwright, reason: "npx after npm ci runs the lockfile's version; the other lines are targets no test here runs"}
        - {file: Makefile, ref: "ghcr.io/trianalab/pacto/dashboard:$", reason: docker-run target; no test here runs it}
        - {file: Makefile, ref: clang, reason: bpf-generate target; no test here runs it}
        - {file: Makefile, ref: llvm, reason: bpf-generate target; no test here runs it}
        - {file: Makefile, ref: libbpf-dev, reason: bpf-generate target; no test here runs it}
    # make reads its flags (-i, -k, -n turn a failure into a pass) and extra
    # makefiles from these.
    environment:
      env: [MAKEFLAGS, GNUMAKEFLAGS, MAKEFILES]
  # The WASM demo host and the bundles it embeds.
  demo:
    scope:
      source: ["examples/demo/*", "examples/demo/bundles/**", "examples/demo/partners/**"]
  go.cmd.pacto:
