# Every hand-written test CI runs through Aval, and the files each one reads.
# The Go packages' unit tests are generated into aval.go.yaml.
# Left out, and run as plain make jobs: suites that build an image from an
# unpinned base (Dockerfile, integrations/kubernetes/Dockerfile: every kind,
# Compose and runtime suite), pull tags (registry:2, alpine:3, agnhost),
# download unpinned tools (envtest, helm-unittest, check-jsonschema), call the
# network (sum.golang.org, proxy.golang.org, GHCR), measure time (perf), read
# the user's ~/.cache/pacto and ~/.config/pacto (test-acceptance-local) or
# whose honest scope is the whole tree (ci-static, ci-gates).
apiVersion: aval.trianalab.io/v1
kind: TestSet
defaults:
  scope:
    # Symlinks are never inputs: npm ci's node_modules, and two fixture links
    # under delivery-demo (kind suites only) that tests/** globs reach.
    exclude:
      - "**/node_modules/**"
      - "tests/acceptance/kind/fixtures/delivery-demo/audit-policy.yaml"
      - "tests/acceptance/kind/fixtures/delivery-demo/pacto-realm.json"
  environment:
    toolchain: {platform: "Linux x86_64"}
    probe: {platform: [uname, -sm]}
  cacheability: hermetic
fragments:
  # The Go workspace: minimum version selection spans both modules.
  go:
    scope:
      dependencies: [go.work, go.work.sum, go.mod, go.sum, integrations/kubernetes/go.mod, integrations/kubernetes/go.sum]
    environment:
      toolchain: {go: "1.27.4"}
      probe: {go: [go, env, GOVERSION]}
      env: [GOFLAGS, GOEXPERIMENT, CGO_ENABLED, GOOS, GOARCH, GOWORK, GODEBUG]
  # The engine: cmd/pacto and everything it builds from. pkg/** also holds the
  # frontend; tests that do not read it exclude pkg/dashboard/frontend/**.
  engine:
    scope:
      source: ["cmd/pacto/**", "internal/**", "pkg/**"]
    # viper reads PACTO_<key> for every key (internal/cli/root.go AutomaticEnv);
    # the CLI reads its config dir (credentials, plugins) outside the tree.
    environment:
      env: ["PACTO_*", NO_COLOR]
      paths: ["~/.config/pacto", "${XDG_CONFIG_HOME}/pacto"]
  # The payments story (examples/story), embedded by the demo and read by the
  # acceptance fixture. Its manifests name images as text; nothing pulls them.
  story:
    scope:
      source: ["examples/story/**"]
      allowMutable:
        - files: ["examples/story/contracts/*/*/deploy/*.yaml"]
          ref: ghcr.io/stefanprodan/podinfo:6.7.1
          reason: fixture text the tests parse; nothing pulls it
        - file: examples/story/plain/fraud/Dockerfile
          ref: python:3.13-alpine
          reason: fixture text the tests parse; nothing builds it
        - file: examples/story/plain/fraud/k8s/deployment.yaml
          ref: registry.example/story/images/fraud:1.0.0
          reason: fixture text the tests parse; nothing pulls it
  node:
    scope:
      dependencies: [pkg/dashboard/frontend/package.json, pkg/dashboard/frontend/package-lock.json]
    environment:
      toolchain: {node: "22"}
      probe: {node: [node, --version]}
      env: [NODE_OPTIONS]
  # Tests whose command is a make target read the recipe. Aval scans the
  # whole Makefile; the references below sit in targets these tests do not
  # run, except test-browser's, whose npx runs the @playwright/test the
  # lockfile pins, right after npm ci.
  make:
    scope:
      dependencies: [Makefile, ci.mk]
      allowMutable:
        - {file: Makefile, ref: playwright, reason: "npx after npm ci runs the lockfile's version; the other lines are targets no test here runs"}
        - {file: Makefile, ref: "ghcr.io/trianalab/pacto/dashboard:$", reason: docker-run target; no test here runs it}
        - {file: Makefile, ref: clang, reason: bpf-generate target; no test here runs it}
        - {file: Makefile, ref: llvm, reason: bpf-generate target; no test here runs it}
        - {file: Makefile, ref: libbpf-dev, reason: bpf-generate target; no test here runs it}
    # make reads its flags (-i, -k, -n turn a failure into a pass) and extra
    # makefiles from these.
    environment:
      env: [MAKEFLAGS, GNUMAKEFLAGS, MAKEFILES]
  # The WASM demo host and the bundles it embeds.
  demo:
    scope:
      source: ["examples/demo/*", "examples/demo/bundles/**", "examples/demo/partners/**"]
      allowMutable:
        - {file: examples/demo/Makefile, ref: vite, reason: "npx after npm ci runs the lockfile's vite"}
tests:
  # The examples' Go tests and the offline demo validation, the part of make
  # ci-test outside the 100% gate. The gated packages run one test each from
  # aval.go.yaml.
  - metadata: {name: examples}
    use: [go, engine, story, demo, make]
    runner: {command: [sh, -c, "go test -race ./examples/... && make -C examples/demo validate"]}
    scope:
      source: ["examples/demo/pacto-dashboard/**", "examples/demo/generated/**", "examples/demo/publishbundles/**", "examples/demo/validatebundles/**"]
      dependencies: [pkg/dashboard/frontend/package.json, pkg/dashboard/frontend/package-lock.json]
      exclude: ["pkg/dashboard/frontend/**", "examples/demo/demo"]
      allowMutable:
        - {file: internal/pactify/testdata/fraud/Dockerfile, ref: python:3.13-alpine, reason: fixture text; nothing builds it}
        - {file: internal/pactify/testdata/fraud/k8s/deployment.yaml, ref: registry.example/story/images/fraud:1.0.0, reason: fixture text; nothing pulls it}
        - {file: internal/pactify/testdata/invoices/Dockerfile, ref: node:22-alpine, reason: fixture text; nothing builds it}
        - {file: internal/pactify/testdata/invoices/k8s/deployment.yaml, ref: ghcr.io/acme/invoices:1.3.0, reason: fixture text; nothing pulls it}

  # make test-integration: the CLI in process against an in-process registry
  # and a real plugin binary, then the acceptance layer's own Go code.
  - metadata: {name: integration}
    use: [go, engine, story, make]
    runner: {command: [make, test-integration]}
    scope:
      source:
        - "tests/integration/**"
        - "tests/acceptance/**/*.go"
        - "tests/acceptance/scenario/seed.sh"
        - "examples/demo/bundles/**"
        - "examples/demo/fleet-targets.yaml"
        - "examples/demo/traces.json"
      exclude:
        - "pkg/dashboard/frontend/**"
        - "cmd/pacto/**/*_test.go"
        - "internal/**/*_test.go"
        - "pkg/**/*_test.go"
        - "internal/**/testdata/**"
        - "pkg/**/testdata/**"
        - "examples/story/**/*_test.go"

  # make ci-ui: svelte-check and vitest from the lockfile.
  - metadata: {name: ui}
    use: [node, make]
    runner: {command: [make, ci-ui]}
    environment:
      # vitest allows .only unless CI is set.
      env: [CI]
    scope:
      source:
        - "pkg/dashboard/frontend/src/**"
        - "pkg/dashboard/frontend/index.html"
        - "pkg/dashboard/frontend/svelte.config.js"
        - "pkg/dashboard/frontend/tsconfig.json"
        - "pkg/dashboard/frontend/vite.config.js"
        # Read by demoEntry.test.ts and impactFigure.test.ts.
        - "README.md"
        - "docs/examples/dashboard-demo.md"
        - "pkg/impact/testdata/highlight-rank.json"

  # make test-browser, one Playwright shard per test: the WASM demo built
  # from this tree, the doc export, the engine smoke (shard 1) and Chromium
  # at the version the lockfile pins. CI is an input: it sets forbidOnly,
  # retries and reuseExistingServer in playwright.config.ts.
  - metadata: {name: "browser-{shard}"}
    use: [go, engine, story, demo, node, make]
    runner: {command: [make, test-browser, "PW_SHARD={shard}/{shard_count}"]}
    matrix: {shard: {count: 3}}
    scope:
      exclude:
        - "**/*_test.go"
        - "internal/**/testdata/**"
        - "pkg/**/testdata/**"
        - "examples/demo/demo"
        - "pkg/dashboard/frontend/e2e-live/**"
        - "pkg/dashboard/frontend/e2e-docs-site/**"
        - "pkg/dashboard/frontend/e2e-screenshots/**"
    environment:
      env: [CI, PW_PORT, PW_DOC_PORT, BASE, DIST, DOC_DIST, DOC_BUNDLE, VERSION]
    cacheability: controlled-environment
