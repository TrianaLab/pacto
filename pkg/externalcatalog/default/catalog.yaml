# The default external catalog. Pacto embeds these bytes and the release
# pipeline publishes the same bytes to ghcr.io/trianalab/pacto/external-catalog,
# so the embedded copy and the published artifact have one digest.
#
# Keep it small and correct: every host and SDK module below is taken from the
# vendor's own documentation or registry page, cited in the "# source:" comment
# beside it. A bare SDK module is a Go module path without its /vN major
# suffix; "npm:<package>", "pypi:<normalized name>" and
# "maven:<groupId>:<artifactId>" name the other ecosystems. Managed-cloud
# entries list the Terraform resource types ("<type>:<id attribute>"), the
# Crossplane, ACK, Config Connector and ASO kinds ("<api group>/<Kind>") that
# provision them and their cloud inventory types. Hosts that put the
# region in the middle of the name (sqs.<region>.amazonaws.com) cannot be written
# as a pattern, so those entries rely on their SDK modules and OTel values.
apiVersion: catalog.pacto.trianalab.io/v1
entries:
  # --- vendor APIs ---
  - identity: stripe
    class: vendor-api
    label: Stripe
    aliases: [stripe, stripe-api]
    hosts: [api.stripe.com] # source: https://docs.stripe.com/api
    sdkModules:
      - github.com/stripe/stripe-go # source: https://github.com/stripe/stripe-go
      - pypi:stripe # source: https://pypi.org/project/stripe/
      - npm:stripe # source: https://www.npmjs.com/package/stripe
      - maven:com.stripe:stripe-java # source: https://github.com/stripe/stripe-java
    keyPatterns: ["STRIPE_*"]
  - identity: twilio
    class: vendor-api
    label: Twilio
    aliases: [twilio, twilio-api]
    hosts: [api.twilio.com] # source: https://github.com/twilio/twilio-go
    sdkModules:
      - github.com/twilio/twilio-go # source: https://github.com/twilio/twilio-go
      - pypi:twilio # source: https://pypi.org/project/twilio/
      - npm:twilio # source: https://www.npmjs.com/package/twilio
      - maven:com.twilio.sdk:twilio # source: https://github.com/twilio/twilio-java
    keyPatterns: ["TWILIO_*"]
  - identity: sendgrid
    class: vendor-api
    label: SendGrid
    aliases: [sendgrid, sendgrid-api]
    hosts: [api.sendgrid.com] # source: https://github.com/sendgrid/sendgrid-go
    sdkModules:
      - github.com/sendgrid/sendgrid-go # source: https://github.com/sendgrid/sendgrid-go
      - pypi:sendgrid # source: https://pypi.org/project/sendgrid/
      - npm:@sendgrid/mail # source: https://www.npmjs.com/package/@sendgrid/mail
    keyPatterns: ["SENDGRID_*"]
  - identity: anthropic
    class: vendor-api
    label: Anthropic
    aliases: [anthropic, anthropic-api, claude-api]
    hosts: [api.anthropic.com] # source: https://platform.claude.com/docs/en/api/overview
    sdkModules:
      - github.com/anthropics/anthropic-sdk-go # source: https://github.com/anthropics/anthropic-sdk-go
      - pypi:anthropic # source: https://pypi.org/project/anthropic/
      - npm:@anthropic-ai/sdk # source: https://www.npmjs.com/package/@anthropic-ai/sdk
    keyPatterns: ["ANTHROPIC_*"]
  - identity: openai
    class: vendor-api
    label: OpenAI
    aliases: [openai, openai-api]
    hosts: [api.openai.com] # source: https://github.com/openai/openai-go/blob/main/option/requestoption.go
    sdkModules:
      - github.com/openai/openai-go # source: https://github.com/openai/openai-go
      - pypi:openai # source: https://pypi.org/project/openai/
      - npm:openai # source: https://www.npmjs.com/package/openai
    keyPatterns: ["OPENAI_*"]
  - identity: github
    class: vendor-api
    label: GitHub
    aliases: [github, github-api]
    hosts: [api.github.com] # source: https://docs.github.com/en/rest/using-the-rest-api/getting-started-with-the-rest-api
  - identity: slack
    class: vendor-api
    label: Slack
    aliases: [slack, slack-api]
    hosts: [slack.com] # source: https://docs.slack.dev/apis/web-api/
    sdkModules:
      - github.com/slack-go/slack # source: https://github.com/slack-go/slack
      - pypi:slack-sdk # source: https://pypi.org/project/slack-sdk/
      - npm:@slack/web-api # source: https://www.npmjs.com/package/@slack/web-api
    keyPatterns: ["SLACK_*"]
  - identity: pagerduty
    class: vendor-api
    label: PagerDuty
    aliases: [pagerduty, pagerduty-api]
    hosts:
      - api.pagerduty.com # source: https://docs.pagerduty.com/developer/rest-api-overview
      - events.pagerduty.com # source: https://docs.pagerduty.com/developer/send-alert-event
    sdkModules: [github.com/PagerDuty/go-pagerduty] # source: https://github.com/PagerDuty/go-pagerduty
    keyPatterns: ["PAGERDUTY_*"]
  - identity: datadog
    class: vendor-api
    label: Datadog
    aliases: [datadog, datadog-api]
    hosts: ["*.datadoghq.com", "*.datadoghq.eu"] # source: https://docs.datadoghq.com/getting_started/site/
    sdkModules: [github.com/DataDog/datadog-api-client-go] # source: https://github.com/DataDog/datadog-api-client-go
    keyPatterns: ["DD_*"] # source: https://docs.datadoghq.com/agent/guide/environment-variables/
  - identity: auth0
    class: vendor-api
    label: Auth0
    aliases: [auth0]
    hosts: ["*.auth0.com"] # source: https://github.com/auth0/go-auth0
    sdkModules: [github.com/auth0/go-auth0] # source: https://github.com/auth0/go-auth0
    keyPatterns: ["AUTH0_*"]
  - identity: algolia
    class: vendor-api
    label: Algolia
    aliases: [algolia]
    hosts: ["*.algolia.net", "*.algolianet.com"] # source: https://www.algolia.com/doc/guides/security/security-best-practices/
    sdkModules:
      - github.com/algolia/algoliasearch-client-go # source: https://github.com/algolia/algoliasearch-client-go
      - pypi:algoliasearch # source: https://pypi.org/project/algoliasearch/
      - npm:algoliasearch # source: https://www.npmjs.com/package/algoliasearch
    keyPatterns: ["ALGOLIA_*"]
  - identity: mailgun
    class: vendor-api
    label: Mailgun
    aliases: [mailgun, mailgun-api]
    hosts: [api.mailgun.net, api.eu.mailgun.net] # source: https://documentation.mailgun.com/docs/mailgun/api-reference/api-overview
    sdkModules: [github.com/mailgun/mailgun-go] # source: https://github.com/mailgun/mailgun-go
    keyPatterns: ["MAILGUN_*"]

  # --- managed cloud services (517-S2 adds the account, region and id) ---
  - identity: aws/rds
    class: managed-cloud
    label: Amazon RDS
    aliases: [aws-rds, amazon-rds]
    hosts: ["*.rds.amazonaws.com"] # source: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_CommonTasks.Connect.html
    sdkModules:
      - github.com/aws/aws-sdk-go-v2/service/rds # source: https://pkg.go.dev/github.com/aws/aws-sdk-go-v2/service/rds
      - npm:@aws-sdk/client-rds # source: https://www.npmjs.com/package/@aws-sdk/client-rds
    terraform:
      - aws_db_instance:identifier # source: https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/db_instance
      - aws_rds_cluster:cluster_identifier # source: https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/rds_cluster
    crossplane:
      - rds.aws.upbound.io/Instance # source: https://marketplace.upbound.io/providers/upbound/provider-aws-rds/latest/resources/rds.aws.upbound.io/Instance/v1beta1
      - rds.aws.upbound.io/Cluster # source: https://marketplace.upbound.io/providers/upbound/provider-aws-rds/latest/resources/rds.aws.upbound.io/Cluster/v1beta1
      - rds.services.k8s.aws/DBInstance # source: https://aws-controllers-k8s.github.io/community/reference/rds/v1alpha1/dbinstance/
      - rds.services.k8s.aws/DBCluster # source: https://aws-controllers-k8s.github.io/community/reference/rds/v1alpha1/dbcluster/
    inventory:
      - "rds:db" # source: https://docs.aws.amazon.com/resource-explorer/latest/userguide/supported-resource-types.html
      - "rds:cluster" # source: https://docs.aws.amazon.com/resource-explorer/latest/userguide/supported-resource-types.html
  - identity: aws/sqs
    class: managed-cloud
    label: Amazon SQS
    aliases: [aws-sqs, amazon-sqs]
    sdkModules:
      - github.com/aws/aws-sdk-go-v2/service/sqs # source: https://pkg.go.dev/github.com/aws/aws-sdk-go-v2/service/sqs
      - npm:@aws-sdk/client-sqs # source: https://www.npmjs.com/package/@aws-sdk/client-sqs
    otel: { messagingSystem: [aws_sqs, aws.sqs] } # source: https://opentelemetry.io/docs/specs/semconv/registry/attributes/messaging/
    terraform:
      - aws_sqs_queue:name # source: https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/sqs_queue
    crossplane:
      - sqs.aws.upbound.io/Queue # source: https://marketplace.upbound.io/providers/upbound/provider-aws-sqs/latest/resources/sqs.aws.upbound.io/Queue/v1beta1
      - sqs.services.k8s.aws/Queue # source: https://aws-controllers-k8s.github.io/community/reference/sqs/v1alpha1/queue/
    inventory:
      - "sqs:queue" # source: https://docs.aws.amazon.com/resource-explorer/latest/userguide/supported-resource-types.html
  - identity: aws/sns
    class: managed-cloud
    label: Amazon SNS
    aliases: [aws-sns, amazon-sns]
    sdkModules:
      - github.com/aws/aws-sdk-go-v2/service/sns # source: https://pkg.go.dev/github.com/aws/aws-sdk-go-v2/service/sns
      - npm:@aws-sdk/client-sns # source: https://www.npmjs.com/package/@aws-sdk/client-sns
    otel: { messagingSystem: [aws.sns] } # source: https://opentelemetry.io/docs/specs/semconv/registry/attributes/messaging/
    terraform:
      - aws_sns_topic:name # source: https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/sns_topic
    crossplane:
      - sns.aws.upbound.io/Topic # source: https://marketplace.upbound.io/providers/upbound/provider-aws-sns/latest/resources/sns.aws.upbound.io/Topic/v1beta1
      - sns.services.k8s.aws/Topic # source: https://aws-controllers-k8s.github.io/community/reference/sns/v1alpha1/topic/
    inventory:
      - "sns:topic" # source: https://docs.aws.amazon.com/resource-explorer/latest/userguide/supported-resource-types.html
  - identity: aws/s3
    class: managed-cloud
    label: Amazon S3
    aliases: [aws-s3, amazon-s3]
    hosts: [s3.amazonaws.com, "*.s3.amazonaws.com"] # source: https://docs.aws.amazon.com/AmazonS3/latest/userguide/VirtualHosting.html
    sdkModules:
      - github.com/aws/aws-sdk-go-v2/service/s3 # source: https://pkg.go.dev/github.com/aws/aws-sdk-go-v2/service/s3
      - npm:@aws-sdk/client-s3 # source: https://www.npmjs.com/package/@aws-sdk/client-s3
    terraform:
      - aws_s3_bucket:bucket # source: https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/s3_bucket
    crossplane:
      - s3.aws.upbound.io/Bucket # source: https://marketplace.upbound.io/providers/upbound/provider-aws-s3/latest/resources/s3.aws.upbound.io/Bucket/v1beta1
      - s3.services.k8s.aws/Bucket # source: https://aws-controllers-k8s.github.io/community/reference/s3/v1alpha1/bucket/
    inventory:
      - "s3:bucket" # source: https://docs.aws.amazon.com/resource-explorer/latest/userguide/supported-resource-types.html
  - identity: aws/dynamodb
    class: managed-cloud
    label: Amazon DynamoDB
    aliases: [aws-dynamodb, amazon-dynamodb, dynamodb]
    sdkModules:
      - github.com/aws/aws-sdk-go-v2/service/dynamodb # source: https://pkg.go.dev/github.com/aws/aws-sdk-go-v2/service/dynamodb
      - npm:@aws-sdk/client-dynamodb # source: https://www.npmjs.com/package/@aws-sdk/client-dynamodb
    otel: { dbSystem: [dynamodb, aws.dynamodb] } # source: https://opentelemetry.io/docs/specs/semconv/registry/attributes/db/
    terraform:
      - aws_dynamodb_table:name # source: https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/dynamodb_table
    crossplane:
      - dynamodb.aws.upbound.io/Table # source: https://marketplace.upbound.io/providers/upbound/provider-aws-dynamodb/latest/resources/dynamodb.aws.upbound.io/Table/v1beta1
      - dynamodb.services.k8s.aws/Table # source: https://aws-controllers-k8s.github.io/community/reference/dynamodb/v1alpha1/table/
    inventory:
      - "dynamodb:table" # source: https://docs.aws.amazon.com/resource-explorer/latest/userguide/supported-resource-types.html
  - identity: aws/elasticache
    class: managed-cloud
    label: Amazon ElastiCache
    aliases: [aws-elasticache, amazon-elasticache, elasticache]
    hosts: ["*.cache.amazonaws.com"] # source: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Endpoints.html
    sdkModules:
      - github.com/aws/aws-sdk-go-v2/service/elasticache # source: https://pkg.go.dev/github.com/aws/aws-sdk-go-v2/service/elasticache
      - npm:@aws-sdk/client-elasticache # source: https://www.npmjs.com/package/@aws-sdk/client-elasticache
    terraform:
      - aws_elasticache_cluster:cluster_id # source: https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/elasticache_cluster
      - aws_elasticache_replication_group:replication_group_id # source: https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/elasticache_replication_group
    crossplane:
      - elasticache.aws.upbound.io/Cluster # source: https://marketplace.upbound.io/providers/upbound/provider-aws-elasticache/latest/resources/elasticache.aws.upbound.io/Cluster/v1beta1
      - elasticache.aws.upbound.io/ReplicationGroup # source: https://marketplace.upbound.io/providers/upbound/provider-aws-elasticache/latest/resources/elasticache.aws.upbound.io/ReplicationGroup/v1beta1
      - elasticache.services.k8s.aws/CacheCluster # source: https://aws-controllers-k8s.github.io/community/reference/elasticache/v1alpha1/cachecluster/
      - elasticache.services.k8s.aws/ReplicationGroup # source: https://aws-controllers-k8s.github.io/community/reference/elasticache/v1alpha1/replicationgroup/
    inventory:
      - "elasticache:cluster" # source: https://docs.aws.amazon.com/resource-explorer/latest/userguide/supported-resource-types.html
  - identity: gcp/cloudsql
    class: managed-cloud
    label: Google Cloud SQL
    aliases: [gcp-cloudsql, cloud-sql, cloudsql]
    hosts: [sqladmin.googleapis.com] # source: https://github.com/GoogleCloudPlatform/cloud-sql-go-connector
    sdkModules: [cloud.google.com/go/cloudsqlconn] # source: https://github.com/GoogleCloudPlatform/cloud-sql-go-connector
    terraform:
      - google_sql_database_instance:name # source: https://registry.terraform.io/providers/hashicorp/google/latest/docs/resources/sql_database_instance
    crossplane:
      - sql.gcp.upbound.io/DatabaseInstance # source: https://marketplace.upbound.io/providers/upbound/provider-gcp-sql/latest/resources/sql.gcp.upbound.io/DatabaseInstance/v1beta1
      - sql.cnrm.cloud.google.com/SQLInstance # source: https://cloud.google.com/config-connector/docs/reference/resource-docs/sql/sqlinstance
    inventory:
      - sqladmin.googleapis.com/Instance # source: https://cloud.google.com/asset-inventory/docs/asset-types
  - identity: gcp/pubsub
    class: managed-cloud
    label: Google Cloud Pub/Sub
    aliases: [gcp-pubsub, pubsub]
    hosts: [pubsub.googleapis.com] # source: https://docs.cloud.google.com/pubsub/docs/reference/service_apis_overview
    sdkModules:
      - cloud.google.com/go/pubsub # source: https://pkg.go.dev/cloud.google.com/go/pubsub
      - pypi:google-cloud-pubsub # source: https://pypi.org/project/google-cloud-pubsub/
      - npm:@google-cloud/pubsub # source: https://www.npmjs.com/package/@google-cloud/pubsub
    otel: { messagingSystem: [gcp_pubsub, gcp.pubsub] } # source: https://opentelemetry.io/docs/specs/semconv/registry/attributes/messaging/
    terraform:
      - google_pubsub_topic:name # source: https://registry.terraform.io/providers/hashicorp/google/latest/docs/resources/pubsub_topic
    crossplane:
      - pubsub.gcp.upbound.io/Topic # source: https://marketplace.upbound.io/providers/upbound/provider-gcp-pubsub/latest/resources/pubsub.gcp.upbound.io/Topic/v1beta1
      - pubsub.cnrm.cloud.google.com/PubSubTopic # source: https://cloud.google.com/config-connector/docs/reference/resource-docs/pubsub/pubsubtopic
    inventory:
      - pubsub.googleapis.com/Topic # source: https://cloud.google.com/asset-inventory/docs/asset-types
  - identity: gcp/gcs
    class: managed-cloud
    label: Google Cloud Storage
    aliases: [gcp-gcs, gcs, google-cloud-storage]
    hosts: [storage.googleapis.com] # source: https://docs.cloud.google.com/storage/docs/request-endpoints
    sdkModules:
      - cloud.google.com/go/storage # source: https://pkg.go.dev/cloud.google.com/go/storage
      - pypi:google-cloud-storage # source: https://pypi.org/project/google-cloud-storage/
      - npm:@google-cloud/storage # source: https://www.npmjs.com/package/@google-cloud/storage
    terraform:
      - google_storage_bucket:name # source: https://registry.terraform.io/providers/hashicorp/google/latest/docs/resources/storage_bucket
    crossplane:
      - storage.gcp.upbound.io/Bucket # source: https://marketplace.upbound.io/providers/upbound/provider-gcp-storage/latest/resources/storage.gcp.upbound.io/Bucket/v1beta1
      - storage.cnrm.cloud.google.com/StorageBucket # source: https://cloud.google.com/config-connector/docs/reference/resource-docs/storage/storagebucket
    inventory:
      - storage.googleapis.com/Bucket # source: https://cloud.google.com/asset-inventory/docs/asset-types
  - identity: azure/sql
    class: managed-cloud
    label: Azure SQL Database
    aliases: [azure-sql]
    hosts: ["*.database.windows.net"] # source: https://learn.microsoft.com/en-us/azure/azure-sql/database/connect-query-go
    terraform:
      - azurerm_mssql_server:name # source: https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/mssql_server
    crossplane:
      - sql.azure.upbound.io/MSSQLServer # source: https://marketplace.upbound.io/providers/upbound/provider-azure-sql/latest/resources/sql.azure.upbound.io/MSSQLServer/v1beta1
      - sql.azure.com/Server # source: https://azure.github.io/azure-service-operator/reference/sql/
    inventory:
      - microsoft.sql/servers/databases # source: https://learn.microsoft.com/en-us/azure/governance/resource-graph/reference/supported-tables-resources
  - identity: azure/servicebus
    class: managed-cloud
    label: Azure Service Bus
    aliases: [azure-servicebus, servicebus]
    hosts: ["*.servicebus.windows.net"] # source: https://pkg.go.dev/github.com/Azure/azure-sdk-for-go/sdk/messaging/azservicebus
    sdkModules:
      - github.com/Azure/azure-sdk-for-go/sdk/messaging/azservicebus # source: https://pkg.go.dev/github.com/Azure/azure-sdk-for-go/sdk/messaging/azservicebus
      - pypi:azure-servicebus # source: https://pypi.org/project/azure-servicebus/
      - npm:@azure/service-bus # source: https://www.npmjs.com/package/@azure/service-bus
    otel: { messagingSystem: [servicebus, azure.servicebus] } # source: https://opentelemetry.io/docs/specs/semconv/registry/attributes/messaging/
    terraform:
      - azurerm_servicebus_namespace:name # source: https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/servicebus_namespace
    crossplane:
      - servicebus.azure.upbound.io/ServiceBusNamespace # source: https://marketplace.upbound.io/providers/upbound/provider-azure-servicebus/latest/resources/servicebus.azure.upbound.io/ServiceBusNamespace/v1beta1
      - servicebus.azure.com/Namespace # source: https://azure.github.io/azure-service-operator/reference/servicebus/
    inventory:
      - microsoft.servicebus/namespaces # source: https://learn.microsoft.com/en-us/azure/governance/resource-graph/reference/supported-tables-resources
  - identity: azure/storage
    class: managed-cloud
    label: Azure Storage
    aliases: [azure-storage, azure-blob]
    hosts: # source: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview
      - "*.blob.core.windows.net"
      - "*.dfs.core.windows.net"
      - "*.file.core.windows.net"
      - "*.queue.core.windows.net"
      - "*.table.core.windows.net"
    sdkModules:
      - github.com/Azure/azure-sdk-for-go/sdk/storage/azblob # source: https://pkg.go.dev/github.com/Azure/azure-sdk-for-go/sdk/storage/azblob
      - pypi:azure-storage-blob # source: https://pypi.org/project/azure-storage-blob/
      - npm:@azure/storage-blob # source: https://www.npmjs.com/package/@azure/storage-blob
    terraform:
      - azurerm_storage_account:name # source: https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/storage_account
    crossplane:
      - storage.azure.upbound.io/Account # source: https://marketplace.upbound.io/providers/upbound/provider-azure-storage/latest/resources/storage.azure.upbound.io/Account/v1beta1
      - storage.azure.com/StorageAccount # source: https://azure.github.io/azure-service-operator/reference/storage/
    inventory:
      - microsoft.storage/storageaccounts # source: https://learn.microsoft.com/en-us/azure/governance/resource-graph/reference/supported-tables-resources
