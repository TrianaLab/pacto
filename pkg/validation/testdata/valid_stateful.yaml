pactoVersion: "2.0"

service:
  name: data-service
  version: 2.1.0
  owner:
    team: backend

interfaces:
  - name: api
    type: openapi
    ref: interfaces/openapi.yaml
    visibility: public

workload: service

state:
  type: stateful
  persistence:
    scope: shared
    durability: persistent
  dataCriticality: high

capabilities:
  - type: health
  - type: metrics

configurations:
  - name: app
    schema: configuration/app.schema.json
    values:
      replicas: 3
      timeout: 30

dependencies:
  - name: cache
    ref: oci://ghcr.io/acme/redis@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    compatibility: ^1.0.0
    required: true

readiness:
  minScore: 75
  expires: "2027-12-31"
  claims:
    - id: deploy-automation
      type: other
      category: deployment
      status: done
      evidence: Uses ArgoCD for continuous deployment
      weight: 10
