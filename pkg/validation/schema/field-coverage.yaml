  dependencies[]:
    meaning: One dependency; required ones are runtime assertions.
    runtime: verified
    evidence: DependencyReachable from the provider Pacto's Service endpoints and, with the node agent, the latest TCP connect
      success and failure timestamps from the target pods to the provider, per peer address
    rule: 'a peer is positive when its latest success is within the staleness bound and not older than its latest failure,
      negative when its latest failure is within the bound and newer than its latest success; timestamps from before the
      pod started are ignored; any positive peer makes the dependency reachable, otherwise any negative peer is a windowed
      contradiction; zero ready provider endpoints beyond the window contradict; a kernel positive never overrides a
      Kubernetes negative (Insufficient); kernel silence never contradicts'
    outcomes: Compliant; DEPENDENCY_UNREACHABLE (error, warning when optional); OBSERVATION_UNSUPPORTED when the provider
      is not a Pacto target; DEPENDENCY_UNDECLARED (warning) for reachable peers no entry names
    limitations: the provider must be a sibling Pacto target in the cluster; external services are Unsupported
    tests:
      unit:
      - pkg/validation/evaluate_test.go:TestEvaluate_ContradictionPerDimension
      - pkg/validation/evaluate_test.go:TestEvaluate_UndeclaredDependency
      - pkg/validation/crossfield_test.go:TestValidateDependencyNamesUnique_Duplicate
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/dependencies[]/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/dependencies[]/invalid
      e2e:
      - tests/acceptance/kind/runtime-conformance.sh:dependency-reachable-kernel
      - tests/acceptance/kind/runtime-conformance.sh:dependency-refused
      - tests/acceptance/kind/runtime-conformance.sh:dependency-undeclared
    platforms:
      kubernetes:
        evidence: verified
        reason: 'provider endpoints and, with the node agent, the latest connection success and failure'
      agent:
        evidence: verified
        reason: 'the kernel''s latest connection success and failure to the bound host:port, ignoring timestamps from before
          the workload started; a reachable checked workload no entry names is DEPENDENCY_UNDECLARED, by the same
          suppression rule'
        tests:
        - internal/runtimewatch/evalsink/sink_test.go:TestEvaluate_UndeclaredPeers
        - internal/runtimewatch/evalsink/sink_test.go:TestEvaluate_BindingStart
        - tests/acceptance/local/runtime-docker.sh:docker-dependency-reachable
        - tests/acceptance/local/runtime-docker.sh:docker-dependency-refused
        - tests/acceptance/local/runtime-docker.sh:docker-dependency-undeclared
      run:
        evidence: partial
        reason: 'eBPF mode sees successes and failures; unprivileged mode never sees a failure, so it never confirms unreachable'
        tests:
        - tests/acceptance/local/runtime-run.sh:run-ebpf-dependency-reachable
        - tests/acceptance/local/runtime-run.sh:run-ebpf-dependency-refused
        - tests/acceptance/local/runtime-run.sh:run-unprivileged-dependency-reachable
        - tests/acceptance/local/runtime-run.sh:run-unprivileged-dependency-refused
