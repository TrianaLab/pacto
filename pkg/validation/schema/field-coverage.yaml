    evidence: 'none: the field has no runtime counterpart'
    rule: 'schema: array'
    outcomes: PARSE_ERROR when not a list
    limitations: the list is not claimed to be exhaustive; undeclared peers are drift warnings, not reported while any entry
      resolves to no Pacto target by ref or name (a local or non-OCI ref, or an unresolved OCI ref)
    tests:
