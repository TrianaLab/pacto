      e2e: []
  readiness.history[].author:
    meaning: Who wrote the revision.
    runtime: static-only
    evidence: 'none: the field has no runtime counterpart'
    rule: 'schema: required; cross-field: non-blank'
    outcomes: INVALID_READINESS_REVISION
