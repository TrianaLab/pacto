      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/state.dataCriticality/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/state.dataCriticality/invalid
      e2e: []
    values:
      low:
        meaning: loss is an inconvenience
        runtime: static-only
        evidence: 'none: the field has no runtime counterpart'
        rule: schema enum
        outcomes: no runtime outcome; only the static result below
        limitations: not observed at runtime
        tests:
          unit:
          - pkg/validation/structural_test.go:TestStructural_V20RejectsBadEnumsAndRanges
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/state.dataCriticality=low
          e2e: []
      medium:
        meaning: loss hurts but is recoverable
        runtime: static-only
        evidence: 'none: the field has no runtime counterpart'
        rule: schema enum
        outcomes: no runtime outcome; only the static result below
        limitations: not observed at runtime
        tests:
          unit:
          - pkg/validation/structural_test.go:TestStructural_V20RejectsBadEnumsAndRanges
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/state.dataCriticality=medium
          e2e: []
      high:
        meaning: loss is a serious incident
        runtime: static-only
        evidence: 'none: the field has no runtime counterpart'
        rule: schema enum
        outcomes: no runtime outcome; only the static result below
        limitations: not observed at runtime
        tests:
          unit:
          - pkg/validation/structural_test.go:TestStructural_V20RejectsBadEnumsAndRanges
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/state.dataCriticality=high
          e2e: []
  workload:
    meaning: Execution pattern of the workload.
    runtime: verified
    evidence: WorkloadObserved.Type mapped from the target workload kind (Deployment, StatefulSet, ReplicaSet to service;
      Job to job; CronJob to scheduled)
    rule: a different mapped type contradicts
    outcomes: Compliant; WORKLOAD_MISMATCH (error); Unknown codes when no workload target; SCHEMA_VIOLATION statically
    limitations: requires a workload reference on the Pacto CR
    tests:
      unit:
      - pkg/validation/evaluate_test.go:TestEvaluate_ContradictionPerDimension
      - pkg/contract/contract_test.go:TestWorkloadConstants
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/workload/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/workload/invalid
      e2e:
      - tests/acceptance/kind/runtime-conformance.sh:conforming-workload
      - tests/acceptance/kind/runtime-conformance.sh:workload-mismatch
      - tests/acceptance/kind/runtime-conformance.sh:workload-job
      - tests/acceptance/kind/runtime-conformance.sh:workload-scheduled
    platforms:
      kubernetes:
        evidence: verified
        reason: 'the target workload kind'
      agent:
        evidence: unverified
        reason: 'no source off Kubernetes; a declared workload reads EVIDENCE_MISSING (Unknown)'
      run:
        evidence: unverified
        reason: 'no source off Kubernetes; a declared workload reads EVIDENCE_MISSING (Unknown)'
    values:
      service:
        meaning: Long-running server.
        runtime: verified
        evidence: WorkloadObservation.Type
        rule: Deployment, StatefulSet or ReplicaSet satisfies
        outcomes: Compliant or WORKLOAD_MISMATCH
        limitations: none
        tests:
          unit:
          - pkg/validation/evaluate_test.go:TestEvaluate_ContradictionPerDimension
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/workload=service
          e2e:
          - tests/acceptance/kind/runtime-conformance.sh:conforming-workload
          - tests/acceptance/kind/runtime-conformance.sh:workload-mismatch
      job:
        meaning: Run-to-completion task.
        runtime: verified
        evidence: WorkloadObservation.Type
        rule: Job satisfies
        outcomes: Compliant or WORKLOAD_MISMATCH
        limitations: none
        tests:
          unit:
          - pkg/validation/evaluate_test.go:TestEvaluate_ContradictionPerDimension
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/workload=job
          e2e:
          - tests/acceptance/kind/runtime-conformance.sh:workload-job
      scheduled:
        meaning: Task run on a schedule.
        runtime: verified
        evidence: WorkloadObservation.Type
        rule: CronJob satisfies
        outcomes: Compliant or WORKLOAD_MISMATCH
        limitations: none
        tests:
          unit:
          - pkg/validation/evaluate_test.go:TestEvaluate_ContradictionPerDimension
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/workload=scheduled
          e2e:
          - tests/acceptance/kind/runtime-conformance.sh:workload-scheduled
  capabilities:
    meaning: Operational capabilities the service offers.
    runtime: not-applicable
    evidence: 'none: the field has no runtime counterpart'
    rule: 'schema: array'
    outcomes: PARSE_ERROR when not a list
    limitations: container
    tests:
      unit:
      - pkg/contract/parse_test.go:TestParse_ValidFull_Capabilities
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/capabilities/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/capabilities/invalid
      e2e: []
  capabilities[]:
    meaning: One capability; each is a required runtime assertion.
    runtime: partial
    evidence: CapabilityObserved from a health probe or a metrics scrape on the bound endpoint
    rule: an absent endpoint contradicts
    outcomes: Compliant; CAPABILITY_ABSENT (error); OBSERVATION_UNSUPPORTED when unbound; extensions listed under
      coverage.unverified; DUPLICATE_CAPABILITY statically
    limitations: extension capabilities have no evaluator
    tests:
      unit:
      - pkg/validation/evaluate_test.go:TestEvaluate_ContradictionPerDimension
      - pkg/validation/crossfield_test.go:TestValidateCapabilities_DuplicateStandard
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/capabilities[]/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/capabilities[]/invalid
      e2e:
      - tests/acceptance/kind/runtime-conformance.sh:health-capability
      - tests/acceptance/kind/runtime-conformance.sh:metrics-capability
    platforms:
      kubernetes:
        evidence: partial
        reason: 'health probe or metrics scrape on the bound endpoint'
      agent:
        evidence: partial
        reason: 'health probe or metrics scrape at the target''s host and bound port; metrics has no reliable negative'
        tests:
        - internal/runtimewatch/evalsink/sink_test.go:TestEvaluate_Compliant
        - internal/runtimewatch/evalsink/sink_test.go:TestEvaluate_NegativesAfterTheWindow
      run:
        evidence: partial
        reason: 'health probe or metrics scrape on --host at the bound port; metrics has no reliable negative'
        tests:
        - internal/runtimewatch/evalsink/sink_test.go:TestEvaluate_Compliant
        - internal/cli/run_internal_test.go:TestRunCommand_Unprivileged
  capabilities[].type:
    meaning: Kind of capability.
    runtime: partial
    evidence: CapabilityObservation.Present
    rule: health and metrics are observed; extension is never observed
    outcomes: Compliant, CAPABILITY_ABSENT or Unknown codes; SCHEMA_VIOLATION statically
    limitations: metrics needs --enable-metrics-observation
    tests:
      unit:
      - pkg/validation/structural_test.go:TestStructural_V20CapabilityTypes
      - pkg/contract/contract_test.go:TestCapability_StandardTypes
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/capabilities[].type/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/capabilities[].type/invalid
      e2e:
      - tests/acceptance/kind/runtime-conformance.sh:health-capability
      - tests/acceptance/kind/runtime-conformance.sh:metrics-capability
    platforms:
      kubernetes:
        evidence: partial
        reason: 'health: absence confirmed by a 404; metrics: presence only'
      agent:
        evidence: partial
        reason: 'health: absence confirmed by a 404; metrics: presence only'
        tests:
        - internal/runtimewatch/evalsink/sink_test.go:TestEvaluate_NegativesAfterTheWindow
        - internal/runtimewatch/evalsink/sink_test.go:TestEvaluate_InconclusiveProbes
      run:
        evidence: partial
        reason: 'health: absence confirmed by a 404; metrics: presence only'
        tests:
        - internal/runtimewatch/evalsink/sink_test.go:TestEvaluate_NegativesAfterTheWindow
    values:
      health:
        meaning: A health endpoint.
        runtime: verified
        evidence: CapabilityObservation.Present
        rule: 'tier A: an active probe of binding.path answers; tier B (probing off): an httpGet readiness probe on the bound
          port whose path equals binding.path, with ready endpoints'
        outcomes: Compliant, CAPABILITY_ABSENT or EVIDENCE_INSUFFICIENT
        limitations: tier B infers health from the readiness probe instead of calling it
        tests:
          unit:
          - pkg/validation/evaluate_test.go:TestEvaluate_ContradictionPerDimension
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/capabilities[].type=health
          e2e:
          - tests/acceptance/kind/runtime-conformance.sh:health-capability
      metrics:
        meaning: A Prometheus metrics endpoint.
        runtime: partial
        evidence: CapabilityObservation.Present
        rule: a scrape of the discovered endpoint (ServiceMonitor, PodMonitor, annotations, named port, then binding.path)
          returns metrics
        outcomes: Compliant, CAPABILITY_ABSENT or Unknown codes
        limitations: only with --enable-metrics-observation; only the first metrics capability is observed
        tests:
          unit:
          - pkg/validation/evaluate_test.go:TestEvaluate_ContradictionPerDimension
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/capabilities[].type=metrics
          e2e:
          - tests/acceptance/kind/runtime-conformance.sh:metrics-capability
      extension:
        meaning: A namespaced, vendor-defined capability.
        runtime: static-only
        evidence: none
        rule: no evaluator is registered
        outcomes: listed under coverage.unverified as capabilities[ref=<ref>]; never a finding and never counted as
          required
        limitations: Pacto cannot verify an extension, so a Compliant verdict says nothing about it; read coverage.unverified
        tests:
          unit:
          - pkg/validation/evaluate_test.go:TestEvaluate_ExtensionCapability
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/capabilities[].type=extension
          e2e: []
  capabilities[].ref:
    meaning: Namespaced identifier of an extension capability.
    runtime: static-only
    evidence: 'none: the field has no runtime counterpart'
    rule: 'schema: required for extension and forbidden otherwise; cross-field: domain-qualified'
    outcomes: CAPABILITY_REF_INVALID, SCHEMA_VIOLATION
    limitations: identity only
    tests:
      unit:
      - pkg/validation/crossfield_test.go:TestValidateCapabilities_Extension_InvalidRef
      - pkg/validation/evaluate_test.go:TestEvaluate_ExtensionIdentityByRef
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/capabilities[].ref/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/capabilities[].ref/invalid
      e2e: []
  capabilities[].binding:
    meaning: Where the capability is served.
    runtime: partial
    evidence: decides whether the capability can be observed at all
    rule: health or metrics without a binding cannot be probed
    outcomes: OBSERVATION_UNSUPPORTED when missing; SCHEMA_VIOLATION on an extension
    limitations: none beyond the parent
    tests:
      unit:
      - pkg/validation/schema_binding_test.go:TestSchema_CapabilityBinding_UnboundHealthValid
      - pkg/validation/schema_binding_test.go:TestSchema_ExtensionWithBinding_Rejected
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/capabilities[].binding/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/capabilities[].binding/invalid
      e2e:
      - tests/acceptance/kind/runtime-conformance.sh:health-capability
    platforms:
      kubernetes:
        evidence: partial
        reason: 'decides whether the capability can be probed at all'
      agent:
        evidence: partial
        reason: 'an http binding on a bound interface is probed; anything else is unsupported'
        tests:
        - internal/runtimewatch/evalsink/sink_test.go:TestEvaluate_UnprobeableCapabilities
      run:
        evidence: partial
        reason: 'an http binding on a bound interface is probed; anything else is unsupported'
        tests:
        - internal/runtimewatch/evalsink/sink_test.go:TestEvaluate_UnprobeableCapabilities
  capabilities[].binding.type:
    meaning: Transport of the capability endpoint.
    runtime: partial
    evidence: selects the probe; only http exists
    rule: http is probed
    outcomes: SCHEMA_VIOLATION for anything else
    limitations: no other transport can be observed
    tests:
      unit:
      - pkg/validation/schema_binding_test.go:TestSchema_CapabilityBinding_UnknownTransportRejected
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/capabilities[].binding.type/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/capabilities[].binding.type/invalid
      e2e:
      - tests/acceptance/kind/runtime-conformance.sh:health-capability
    platforms:
      kubernetes:
        evidence: partial
        reason: 'selects the probe; only http exists'
      agent:
        evidence: partial
        reason: 'selects the probe; only http exists'
        tests:
        - internal/runtimewatch/evalsink/sink_test.go:TestEvaluate_UnprobeableCapabilities
      run:
        evidence: partial
        reason: 'selects the probe; only http exists'
        tests:
        - internal/runtimewatch/evalsink/sink_test.go:TestEvaluate_UnprobeableCapabilities
    values:
      http:
        meaning: Plain HTTP endpoint.
        runtime: partial
        evidence: the probe target
        rule: probed over HTTP
        outcomes: observed through capabilities[].type
        limitations: the only transport
        tests:
          unit:
          - pkg/validation/schema_binding_test.go:TestSchema_CapabilityBinding_Valid
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/capabilities[].binding.type=http
          e2e:
          - tests/acceptance/kind/runtime-conformance.sh:health-capability
  capabilities[].binding.interface:
    meaning: Declared interface that owns the endpoint.
    runtime: partial
    evidence: mapped through the interface binding to the Service port that is probed
    rule: an unbound interface cannot be probed
    outcomes: CAPABILITY_INTERFACE_UNKNOWN statically; OBSERVATION_UNSUPPORTED at runtime when the interface is unbound
    limitations: none beyond the interface binding
    tests:
      unit:
      - pkg/validation/crossfield_test.go:TestValidateCapabilities_BindingInterfaceUnknown
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/capabilities[].binding.interface/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/capabilities[].binding.interface/invalid
      e2e:
      - tests/acceptance/kind/runtime-conformance.sh:health-capability
    platforms:
      kubernetes:
        evidence: partial
        reason: 'mapped through the interface binding to the probed Service port'
      agent:
        evidence: partial
        reason: 'mapped to the interface''s bound port; an unbound interface leaves the capability unsupported'
        tests:
        - internal/runtimewatch/evalsink/sink_test.go:TestEvaluate_UnprobeableCapabilities
      run:
        evidence: partial
        reason: 'mapped to the interface''s --bind port; an unbound interface leaves the capability unsupported'
        tests:
        - internal/runtimewatch/evalsink/sink_test.go:TestEvaluate_UnprobeableCapabilities
  capabilities[].binding.path:
    meaning: Application path of the endpoint on its interface.
    runtime: partial
    evidence: tier A probes this path; tier B compares it with the readiness probe path; metrics falls back to it last
    rule: a tier B path that differs from the readiness probe path is insufficient, not a violation
    outcomes: CAPABILITY_PATH_INVALID statically (SSRF guard); EVIDENCE_INSUFFICIENT on a tier B path mismatch
    limitations: without probing, the path is only compared, never called
    tests:
      unit:
      - pkg/validation/crossfield_test.go:TestValidateCapabilities_BindingPathInvalid
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/capabilities[].binding.path/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/capabilities[].binding.path/invalid
      e2e:
      - tests/acceptance/kind/runtime-conformance.sh:health-capability
      - tests/acceptance/kind/runtime-conformance.sh:metrics-capability
    platforms:
      kubernetes:
        evidence: partial
        reason: 'probed directly, or compared with the readiness probe path'
      agent:
        evidence: partial
        reason: 'probed directly at the bound port; there is no readiness probe to fall back on'
        tests:
        - internal/runtimewatch/evalsink/sink_test.go:TestEvaluate_Compliant
      run:
        evidence: partial
        reason: 'probed directly at the bound port; there is no readiness probe to fall back on'
        tests:
        - internal/runtimewatch/evalsink/sink_test.go:TestEvaluate_Compliant
  readiness:
    meaning: Production-readiness self-assessment.
