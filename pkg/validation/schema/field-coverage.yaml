# Field coverage inventory for the Pacto v2.3 contract schema (2.2 plus the 2.3 additions).
#
# One entry per schema path (dotted, [] for array items) and, under values, one per
# enum value. pkg/validation/fieldcoverage_test.go walks the schema and fails when a
# path or enum value is missing here, when an entry here names no schema path, when a
# key is empty, or when a referenced test does not exist.
#
# runtime:
#   verified        a runtime fact can both satisfy and contradict the declaration
#   partial         a runtime fact exists but some values or environments stay unverified
#   static-only     checked by pacto validate only; nothing at runtime reads it
#   not-applicable  identity, container or open object with nothing to verify
#
# tests: unit (path/file_test.go:TestName), integration
# (tests/integration/field_coverage_test.go:TestFieldCoverage/<case>, the real CLI),
# e2e (tests/acceptance/kind/runtime-conformance.sh:<scenario id>).
#
# platforms: every field whose runtime is verified or partial says, per way of
# running runtime conformance, how far that way's evidence goes and why:
#   kubernetes  the operator with the node agent; its evidence equals runtime and
#               its tests are the entry's e2e scenarios
#   agent       pacto agent on a Docker host or server (labels, bindings file)
#   run         pacto run wrapping one command
# evidence is verified, partial or unverified. A verified or partial agent or run
# entry names its tests: Go tests, or tests/acceptance/local/runtime-docker.sh and
# runtime-run.sh scenario ids.
fields:
  pactoVersion:
    meaning: Contract format version; selects the JSON Schema the contract is validated against.
    runtime: not-applicable
    evidence: 'none: the field has no runtime counterpart'
    rule: parse rejects anything but "2.0", "2.1", "2.2" and "2.3" before any other layer runs; the version selects the schema
    outcomes: PARSE_ERROR when unsupported
    limitations: 2.0, 2.1 and 2.2 have their own schemas without the fields later versions add; this inventory walks 2.3, the superset
    tests:
      unit:
      - pkg/contract/parse_test.go:TestParse_UnsupportedVersion
      - pkg/validation/structural_test.go:TestValidateStructuralRaw_UnsupportedVersion_V10
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/pactoVersion/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/pactoVersion/invalid
      e2e: []
    values:
      '2.3':
        meaning: the newest Operational Contract format; 2.0, 2.1 and 2.2 contracts keep working unchanged
        runtime: static-only
        tests:
          unit: []
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/pactoVersion=2.3
          - tests/integration/field_coverage_test.go:TestFieldCoverage/pactoVersion=2.2
          - tests/integration/field_coverage_test.go:TestFieldCoverage/pactoVersion=2.1
          - tests/integration/field_coverage_test.go:TestFieldCoverage/pactoVersion=2.0
          e2e: []
  service:
    meaning: Identity block of the service the contract describes.
    runtime: not-applicable
    evidence: 'none: the field has no runtime counterpart'
    rule: 'schema: object with name and version'
    outcomes: PARSE_ERROR or SCHEMA_VIOLATION when malformed
    limitations: container only; its children carry the semantics
    tests:
      unit:
      - pkg/contract/parse_test.go:TestParse_ValidFull_Service
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/service/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/service/invalid
      e2e: []
  service.name:
    meaning: DNS-style service name; the identity of the contract everywhere.
    runtime: static-only
    evidence: used as the subject name of service-scoped evidence (workload, persistence), never checked against a runtime
      name
    rule: schema pattern
    outcomes: SCHEMA_VIOLATION
    limitations: the operator binds a runtime target by the Pacto CR, not by this name
    tests:
      unit:
      - pkg/contract/parse_test.go:TestParse_MissingServiceName
      - pkg/validation/evaluate_test.go:TestEvaluate_ServiceScopedMatchByServiceName
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/service.name/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/service.name/invalid
      e2e: []
  service.version:
    meaning: Semantic version of this contract revision.
    runtime: static-only
    evidence: consumers read it from the provider's Pacto status as DependencyObservation.Version for their compatibility
      check
    rule: 'cross-field: valid semver'
    outcomes: INVALID_SEMVER
    limitations: the running image version is never compared with it; it is the provider-side input of dependencies[].compatibility
    tests:
      unit:
      - pkg/validation/crossfield_test.go:TestValidateServiceVersion_InvalidSemver
      - pkg/validation/structural_test.go:TestValidateStructuralRaw_VersionMustBeOnePathComponent
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/service.version/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/service.version/invalid
      e2e:
      - tests/acceptance/kind/runtime-conformance.sh:dependency-version-mismatch
  service.owner:
    meaning: Who owns the service.
    runtime: static-only
    evidence: 'none: the field has no runtime counterpart'
    rule: 'schema: at least one of team or dri'
    outcomes: SCHEMA_VIOLATION when empty
    limitations: ownership is metadata for routing and dashboards
    tests:
      unit:
      - pkg/contract/owner_test.go:TestOwner_IsEmpty
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/service.owner/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/service.owner/invalid
      e2e: []
  service.owner.team:
    meaning: Owning team identifier.
    runtime: static-only
    evidence: 'none: the field has no runtime counterpart'
    rule: schema pattern
    outcomes: SCHEMA_VIOLATION
    limitations: not checked against any directory
    tests:
      unit:
      - pkg/contract/owner_test.go:TestOwnerKey_TeamAndDRINamespacesNeverCollide
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/service.owner.team/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/service.owner.team/invalid
      e2e: []
  service.owner.dri:
    meaning: Directly responsible individual.
    runtime: static-only
    evidence: 'none: the field has no runtime counterpart'
    rule: schema pattern
    outcomes: SCHEMA_VIOLATION
    limitations: not checked against any directory
    tests:
      unit:
      - pkg/contract/owner_test.go:TestOwner_DisplayString
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/service.owner.dri/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/service.owner.dri/invalid
      e2e: []
  service.owner.contacts:
    meaning: Ways to reach the owner.
    runtime: static-only
    evidence: 'none: the field has no runtime counterpart'
    rule: 'schema: array of contact objects'
    outcomes: PARSE_ERROR when not a list
    limitations: treated as a set; order is irrelevant
    tests:
      unit:
      - pkg/contract/owner_test.go:TestOwner_EqualComparesContactsAsASet
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/service.owner.contacts/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/service.owner.contacts/invalid
      e2e: []
  service.owner.contacts[]:
    meaning: One contact entry.
    runtime: static-only
    evidence: 'none: the field has no runtime counterpart'
    rule: 'schema: object with type and value'
    outcomes: PARSE_ERROR when not an object
    limitations: never contacted or verified
    tests:
      unit:
      - pkg/contract/owner_test.go:TestOwner_ContactSetOrdersByTypeThenValueThenPurpose
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/service.owner.contacts[]/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/service.owner.contacts[]/invalid
      e2e: []
  service.owner.contacts[].type:
    meaning: Channel of the contact.
    runtime: static-only
    evidence: 'none: the field has no runtime counterpart'
    rule: schema enum
    outcomes: SCHEMA_VIOLATION
    limitations: the value is not checked to match the channel (an email type may hold a URL)
    tests:
      unit:
      - pkg/contract/owner_test.go:TestOwner_YAMLRoundTrip
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/service.owner.contacts[].type/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/service.owner.contacts[].type/invalid
      e2e: []
    values:
      email:
        meaning: an email address
        runtime: static-only
        tests:
          unit: []
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/service.owner.contacts[].type=email
          e2e: []
      url:
        meaning: a web page or form
        runtime: static-only
        tests:
          unit: []
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/service.owner.contacts[].type=url
          e2e: []
      group:
        meaning: a mailing list or directory group
        runtime: static-only
        tests:
          unit: []
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/service.owner.contacts[].type=group
          e2e: []
      oncall:
        meaning: a paging rotation
        runtime: static-only
        tests:
          unit: []
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/service.owner.contacts[].type=oncall
          e2e: []
      chat:
        meaning: a chat channel
        runtime: static-only
        tests:
          unit: []
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/service.owner.contacts[].type=chat
          e2e: []
      other:
        meaning: any other channel
        runtime: static-only
        tests:
          unit: []
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/service.owner.contacts[].type=other
          e2e: []
  service.owner.contacts[].value:
    meaning: Address of the contact.
    runtime: static-only
    evidence: 'none: the field has no runtime counterpart'
    rule: 'schema: required, non-empty'
    outcomes: SCHEMA_VIOLATION
    limitations: never validated as reachable
    tests:
      unit:
      - pkg/contract/owner_test.go:TestOwner_YAMLRoundTrip
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/service.owner.contacts[].value/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/service.owner.contacts[].value/invalid
      e2e: []
  service.owner.contacts[].purpose:
    meaning: Why to use this contact.
    runtime: static-only
    evidence: 'none: the field has no runtime counterpart'
    rule: schema enum
    outcomes: SCHEMA_VIOLATION
    limitations: informational
    tests:
      unit:
      - pkg/contract/owner_test.go:TestOwner_YAMLRoundTrip
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/service.owner.contacts[].purpose/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/service.owner.contacts[].purpose/invalid
      e2e: []
    values:
      ownership:
        meaning: accountable owner
        runtime: static-only
        tests:
          unit: []
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/service.owner.contacts[].purpose=ownership
          e2e: []
      support:
        meaning: day-to-day questions
        runtime: static-only
        tests:
          unit: []
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/service.owner.contacts[].purpose=support
          e2e: []
      escalation:
        meaning: when support does not answer
        runtime: static-only
        tests:
          unit: []
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/service.owner.contacts[].purpose=escalation
          e2e: []
      oncall:
        meaning: operational incidents
        runtime: static-only
        tests:
          unit: []
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/service.owner.contacts[].purpose=oncall
          e2e: []
      notifications:
        meaning: announcements and change notices
        runtime: static-only
        tests:
          unit: []
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/service.owner.contacts[].purpose=notifications
          e2e: []
  interfaces:
    meaning: The interfaces the service exposes.
    runtime: not-applicable
    evidence: 'none: the field has no runtime counterpart'
    rule: 'schema: array'
    outcomes: PARSE_ERROR when not a list
    limitations: container; each item is a runtime assertion
    tests:
      unit:
      - pkg/contract/parse_test.go:TestParse_ValidFull_Interfaces
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/interfaces/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/interfaces/invalid
      e2e: []
  interfaces[]:
    meaning: One exposed interface. Its availability is always a required runtime assertion.
    runtime: verified
    evidence: InterfaceObserved.Present from ready EndpointSlice endpoints on the bound Service port, refined by the node
      agent's LISTEN sockets in the backing pods
    rule: Present=false beyond the stabilization window contradicts the declaration; endpoints ready but no pod listening
      on the target port (complete kernel coverage) is also Present=false
    outcomes: Compliant when present; INTERFACE_ABSENT (error) when absent; OBSERVATION_UNSUPPORTED when unbound; EVIDENCE_STALE
      or COLLECTION_FAILED when the node agent is stale or failed; DUPLICATE_INTERFACE_NAME statically
    limitations: needs a spec.target.interfaceBindings entry (or name-match discovery); hostNetwork pods are unattributable
      to the kernel and keep the Kubernetes result
    tests:
      unit:
      - pkg/validation/evaluate_test.go:TestEvaluate_ContradictionPerDimension
      - pkg/validation/evaluate_test.go:TestEvaluate_UnknownCodesAndMessages
      - pkg/validation/crossfield_test.go:TestValidateInterfaceNamesUnique_Duplicate
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/interfaces[]/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/interfaces[]/invalid
      e2e:
      - tests/acceptance/kind/runtime-conformance.sh:conforming-workload
      - tests/acceptance/kind/runtime-conformance.sh:listener-absent
      - tests/acceptance/kind/runtime-conformance.sh:unbound-interface
      - tests/acceptance/kind/runtime-conformance.sh:agent-stopped-stale
      - tests/acceptance/kind/runtime-conformance.sh:agent-failed
      - tests/acceptance/kind/runtime-conformance.sh:pod-restart
      - tests/acceptance/kind/runtime-conformance.sh:rollout-replacement
      - tests/acceptance/kind/runtime-conformance.sh:same-node-attribution
    platforms:
      kubernetes:
        evidence: verified
        reason: 'ready EndpointSlice endpoints, refined by the node agent''s listeners in the backing pods'
      agent:
        evidence: verified
        reason: 'the kernel''s listeners of the bound container, unit or process on the bound port'
        tests:
        - tests/acceptance/local/runtime-docker.sh:docker-served
        - tests/acceptance/local/runtime-docker.sh:docker-deaf
        - tests/acceptance/local/runtime-docker.sh:docker-hostnet-served
        - tests/acceptance/local/runtime-docker.sh:docker-hostnet-deaf
      run:
        evidence: verified
        reason: 'the command tree''s listeners, in full in both eBPF and unprivileged mode'
        tests:
        - tests/acceptance/local/runtime-run.sh:run-ebpf-served
        - tests/acceptance/local/runtime-run.sh:run-ebpf-deaf
        - tests/acceptance/local/runtime-run.sh:run-unprivileged-served
        - tests/acceptance/local/runtime-run.sh:run-unprivileged-deaf
  interfaces[].name:
    meaning: Interface identifier; the subject name of its evidence and the key of the CR binding.
    runtime: not-applicable
    evidence: 'identity only: it names the InterfaceObserved subject; the runtime check lives on interfaces[]'
    rule: 'schema: required; cross-field: unique'
    outcomes: SCHEMA_VIOLATION, DUPLICATE_INTERFACE_NAME
    limitations: a renamed interface without a renamed binding becomes unbound (Unsupported)
    tests:
      unit:
      - pkg/validation/crossfield_test.go:TestValidateInterfaceNamesUnique_Duplicate
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/interfaces[].name/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/interfaces[].name/invalid
      e2e: []
  interfaces[].type:
    meaning: Interface specification family.
    runtime: partial
    evidence: InterfaceObservation.Protocol from the active protocol probe (h2c preface; classifies http1, http2, tls, other)
    rule: OpenAPI is satisfied by http1 or http2 and contradicted by other; gRPC is satisfied by http2 and contradicted by
      http1 or other; tls, an empty protocol and AsyncAPI leave the facet unverified
    outcomes: Compliant; INTERFACE_PROTOCOL_MISMATCH (error); listed in evaluationCoverage.unverified otherwise; SCHEMA_VIOLATION
      statically
    limitations: requires --enable-probing; TLS hides the protocol; AsyncAPI names no wire protocol; judged only when the
      interface is Observed and present
    tests:
      unit:
      - pkg/validation/evaluate_test.go:TestEvaluate_InterfaceTypeFacet
      - pkg/validation/evaluate_test.go:TestEvaluate_InterfaceFacetsNeedPresentObservation
      - pkg/validation/structural_test.go:TestStructural_V20InterfaceTypes
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/interfaces[].type/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/interfaces[].type/invalid
      e2e:
      - tests/acceptance/kind/runtime-conformance.sh:conforming-workload
      - tests/acceptance/kind/runtime-conformance.sh:protocol-mismatch
    platforms:
      kubernetes:
        evidence: partial
        reason: 'protocol probe on the Service port with controller.enableProbing; tls and asyncapi stay unverified'
      agent:
        evidence: partial
        reason: 'protocol probe on the bound port with --enable-probing; tls and asyncapi stay unverified'
        tests:
        - internal/runtimewatch/evalsink/sink_test.go:TestEvaluate_Compliant
      run:
        evidence: partial
        reason: 'protocol probe on --host at the bound port with --enable-probing; tls and asyncapi stay unverified'
        tests:
        - internal/runtimewatch/evalsink/sink_test.go:TestEvaluate_Compliant
    values:
      openapi:
        meaning: HTTP API described by an OpenAPI document.
        runtime: verified
        evidence: Protocol
        rule: http1 or http2 satisfies; other contradicts
        outcomes: Compliant or INTERFACE_PROTOCOL_MISMATCH
        limitations: tls or no probe answer is unverified
        tests:
          unit:
          - pkg/validation/evaluate_test.go:TestEvaluate_InterfaceTypeFacet
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/interfaces[].type=openapi
          e2e:
          - tests/acceptance/kind/runtime-conformance.sh:conforming-workload
          - tests/acceptance/kind/runtime-conformance.sh:protocol-mismatch
      grpc:
        meaning: gRPC service; HTTP/2 on the wire.
        runtime: verified
        evidence: Protocol
        rule: http2 satisfies; http1 or other contradicts
        outcomes: Compliant or INTERFACE_PROTOCOL_MISMATCH
        limitations: tls or no probe answer is unverified
        tests:
          unit:
          - pkg/validation/evaluate_test.go:TestEvaluate_InterfaceTypeFacet
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/interfaces[].type=grpc
          e2e:
          - tests/acceptance/kind/runtime-conformance.sh:protocol-mismatch
      asyncapi:
        meaning: Message-driven API described by an AsyncAPI document.
        runtime: static-only
        evidence: Protocol is ignored
        rule: no wire protocol is implied, so nothing satisfies or contradicts it
        outcomes: always listed as unverified when the interface is present
        limitations: brokers and protocols vary (Kafka, AMQP, MQTT, WebSocket)
        tests:
          unit:
          - pkg/validation/evaluate_test.go:TestEvaluate_InterfaceTypeFacet
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/interfaces[].type=asyncapi
          e2e: []
      mcp:
        meaning: The tools a service exposes, as an MCP tools/list result (pactoVersion 2.1).
        runtime: static-only
        evidence: Protocol is ignored
        rule: 'cross-field: the file lists tools, each named once; diff compares tool by tool'
        outcomes: INVALID_MCP_TOOLS; always listed as unverified when the interface is present
        limitations: MCP runs over stdio or HTTP, so no wire protocol is implied; descriptions are not compared
        tests:
          unit:
          - pkg/validation/crossfield_test.go:TestValidateMCPInterfaces
          - pkg/diff/mcp_test.go:TestDiffMCP
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/interfaces[].type=mcp
          - tests/integration/field_coverage_test.go:TestFieldCoverage/interfaces[].type=mcp/no-tools
          e2e: []
  interfaces[].ref:
    meaning: Path of the interface specification inside the bundle.
    runtime: static-only
    evidence: 'none: request and response conformance against the spec is not observed (no payload capture)'
    rule: 'cross-field: file exists; YAML or JSON parses (.proto is not parsed)'
    outcomes: FILE_NOT_FOUND, INVALID_INTERFACE_SPEC, INVALID_MCP_TOOLS
    limitations: only the protocol family is checked at runtime, through interfaces[].type
    tests:
      unit:
      - pkg/validation/crossfield_test.go:TestValidateInterfaceFiles_FileNotFound
      - pkg/validation/crossfield_test.go:TestValidateInterfaceFileContent_InvalidYAML
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/interfaces[].ref/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/interfaces[].ref/invalid
      e2e: []
  interfaces[].guarantees:
    meaning: 'Behavior consumers may rely on from the interface, in a closed vocabulary.'
    runtime: static-only
    evidence: 'none: no runtime fact shows how an interface delivers, orders, deduplicates, retains or answers'
    rule: 'schema: object of the known guarantees; pactoVersion 2.2 only; pacto diff classifies removing or weakening one as breaking'
    outcomes: 'PARSE_ERROR for an unknown guarantee; NEEDS_PACTO_2_2 under 2.0 and 2.1'
    limitations: 'a declaration: Pacto never measures whether the interface keeps it'
    tests:
      unit:
      - pkg/validation/structural_test.go:TestValidateStructural_V22Guarantees
      - pkg/validation/structural_test.go:TestNeeds22
      - pkg/diff/guarantee_test.go:TestDiffGuarantees
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/interfaces[].guarantees/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/interfaces[].guarantees/invalid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/interfaces[].guarantees/invalid-2.1
      e2e: []
  interfaces[].guarantees.profile:
    meaning: 'Version of the guarantee vocabulary; omitted means 1.'
    runtime: static-only
    evidence: 'none: no runtime fact shows how an interface delivers, orders, deduplicates, retains or answers'
    rule: 'schema: enum; pacto diff compares it with the old value'
    outcomes: 'SCHEMA_VIOLATION when unknown'
    limitations: 'only 1 exists, so profiles are not compared yet; a declaration: Pacto never measures whether the interface keeps it'
    tests:
      unit:
      - pkg/validation/structural_test.go:TestValidateStructural_V22Guarantees
      - pkg/diff/guarantee_test.go:TestDiffGuarantees
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/interfaces[].guarantees.profile/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/interfaces[].guarantees.profile/invalid
      e2e: []
    values:
      '1':
        meaning: 'the first guarantee vocabulary'
        runtime: static-only
        tests:
          unit: []
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/interfaces[].guarantees.profile=1
          e2e: []
  interfaces[].guarantees.delivery:
    meaning: 'What happens to an event when a delivery fails partway.'
    runtime: static-only
    evidence: 'none: no runtime fact shows how an interface delivers, orders, deduplicates, retains or answers'
    rule: 'schema: enum; pacto diff compares it with the old value'
    outcomes: 'SCHEMA_VIOLATION when unknown'
    limitations: 'the two values trade loss for duplicates, so neither satisfies the other; a declaration: Pacto never measures whether the interface keeps it'
    tests:
      unit:
      - pkg/validation/structural_test.go:TestValidateStructural_V22Guarantees
      - pkg/diff/guarantee_test.go:TestDiffGuarantees
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/interfaces[].guarantees.delivery/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/interfaces[].guarantees.delivery/invalid
      e2e: []
    values:
      'at-most-once':
        meaning: 'an event is never delivered twice and may be lost'
        runtime: static-only
        tests:
          unit: []
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/interfaces[].guarantees.delivery=at-most-once
          e2e: []
      'at-least-once':
        meaning: 'an event is never lost and may be delivered more than once'
        runtime: static-only
        tests:
          unit: []
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/interfaces[].guarantees.delivery=at-least-once
          e2e: []
  interfaces[].guarantees.ordering:
    meaning: 'Scope in which events arrive in the order sent; global also orders every key.'
    runtime: static-only
    evidence: 'none: no runtime fact shows how an interface delivers, orders, deduplicates, retains or answers'
    rule: 'schema: enum; pacto diff compares it with the old value'
    outcomes: 'SCHEMA_VIOLATION when unknown'
