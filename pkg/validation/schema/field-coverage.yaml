          - tests/integration/field_coverage_test.go:TestFieldCoverage/state.persistence.scope=local
          e2e:
          - tests/acceptance/kind/runtime-conformance.sh:persistence-scope
      shared:
        meaning: Replicas share one state store.
        runtime: partial
        evidence: Shared
        rule: true satisfies; false is unverified, never a violation
        outcomes: Compliant or unverified
        limitations: the shared store may live outside the cluster
        tests:
          unit:
          - pkg/validation/evaluate_test.go:TestEvaluate_PersistenceScopeFacet
          - integrations/kubernetes/internal/observer/exposure_test.go:TestSharedClaim
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/state.persistence.scope=shared
          e2e:
          - tests/acceptance/kind/runtime-conformance.sh:persistence-scope
  state.persistence.durability:
    meaning: Whether state must survive a restart.
    runtime: partial
    evidence: PersistenceObservation.Durable from the workload's volumes (a PVC or a non-ephemeral volume)
    rule: persistent with no durable binding contradicts; ephemeral is never asserted
    outcomes: Compliant; PERSISTENCE_MISMATCH (error) at state.persistence.durability; Unknown codes when unobservable; SCHEMA_VIOLATION
      statically
    limitations: requires a workload target; a volume claim proves storage exists, not that the application writes to it
    tests:
      unit:
      - pkg/validation/evaluate_test.go:TestEvaluate_ContradictionPerDimension
      - pkg/validation/evaluate_test.go:TestEvaluate_EphemeralStateNeverAssertsDurability
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/state.persistence.durability/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/state.persistence.durability/invalid
      e2e:
      - tests/acceptance/kind/runtime-conformance.sh:persistence-durability
    platforms:
      kubernetes:
        evidence: partial
        reason: 'the workload''s volumes'
      agent:
        evidence: unverified
        reason: 'no source off Kubernetes; persistent durability reads EVIDENCE_MISSING (Unknown)'
      run:
        evidence: unverified
        reason: 'no source off Kubernetes; persistent durability reads EVIDENCE_MISSING (Unknown)'
    values:
      persistent:
        meaning: State must survive restarts and rescheduling.
        runtime: verified
        evidence: Durable
        rule: a durable volume binding satisfies; none contradicts
        outcomes: Compliant or PERSISTENCE_MISMATCH (required assertion)
        limitations: durability semantics of the storage class are not checked
        tests:
          unit:
          - pkg/validation/evaluate_test.go:TestEvaluate_ContradictionPerDimension
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/state.persistence.durability=persistent
          e2e:
          - tests/acceptance/kind/runtime-conformance.sh:persistence-durability
      ephemeral:
        meaning: State may be lost on restart.
        runtime: static-only
        evidence: Durable is ignored
        rule: 'never asserted: keeping a volume is not a contradiction'
        outcomes: no durability finding; scope is still judged
        limitations: nothing to observe
        tests:
          unit:
          - pkg/validation/evaluate_test.go:TestEvaluate_EphemeralStateNeverAssertsDurability
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/state.persistence.durability=ephemeral
          e2e: []
  state.dataCriticality:
    meaning: Business impact of losing the data.
    runtime: static-only
    evidence: 'none: the field has no runtime counterpart'
    rule: schema enum, required
    outcomes: SCHEMA_VIOLATION
