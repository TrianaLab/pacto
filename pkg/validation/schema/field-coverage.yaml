    limitations: needs identity and issuer, so Pacto can tell its own signature from anyone else's
    tests:
      unit:
      - pkg/validation/structural_test.go:TestValidateStructural_V21Publish
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/publish.sign.keyless/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/publish.sign.keyless/invalid
      e2e: []
  publish.sign.identity:
    meaning: The certificate identity keyless signing produces.
    runtime: static-only
    evidence: 'none: pacto publish reads it; nothing at runtime does'
    rule: 'schema: non-empty string, required with keyless'
    outcomes: SCHEMA_VIOLATION
    limitations: matched exactly when Pacto verifies; Flux needs its own matchOIDCIdentity
    tests:
      unit:
      - pkg/validation/structural_test.go:TestValidateStructural_V21Publish
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/publish.sign.identity/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/publish.sign.identity/invalid
      e2e: []
  publish.sign.issuer:
    meaning: The OIDC issuer of the keyless identity.
    runtime: static-only
    evidence: 'none: pacto publish reads it; nothing at runtime does'
    rule: 'schema: non-empty string, required with keyless'
    outcomes: SCHEMA_VIOLATION
    limitations: matched exactly when Pacto verifies
    tests:
      unit:
      - pkg/validation/structural_test.go:TestValidateStructural_V21Publish
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/publish.sign.issuer/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/publish.sign.issuer/invalid
      e2e: []
  publish.sign.key:
    meaning: A PEM private key file, such as a cosign key.
    runtime: static-only
    evidence: 'none: pacto publish reads it; nothing at runtime does'
    rule: 'schema: non-empty string'
    outcomes: SCHEMA_VIOLATION
    limitations: relative to the contract directory; the password comes from COSIGN_PASSWORD
    tests:
      unit:
      - pkg/validation/structural_test.go:TestValidateStructural_V21Publish
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/publish.sign.key/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/publish.sign.key/invalid
      e2e: []
  publish.sign.kms:
    meaning: A KMS key URI.
    runtime: static-only
    evidence: 'none: pacto publish reads it; nothing at runtime does'
    rule: 'schema: non-empty string'
    outcomes: SCHEMA_VIOLATION
    limitations: awskms://, gcpkms://, azurekms:// or hashivault://
    tests:
      unit:
      - pkg/validation/structural_test.go:TestValidateStructural_V21Publish
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/publish.sign.kms/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/publish.sign.kms/invalid
      e2e: []
  publish.sign.transparencyLog:
    meaning: Upload signatures to the transparency log.
    runtime: static-only
    evidence: 'none: pacto publish reads it; nothing at runtime does'
    rule: 'schema: boolean'
    outcomes: PARSE_ERROR when not a boolean
    limitations: false is for private registries; keyless signing needs the log
    tests:
      unit:
      - pkg/validation/structural_test.go:TestValidateStructural_V21Publish
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/publish.sign.transparencyLog/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/publish.sign.transparencyLog/invalid
      e2e: []
  checks:
    meaning: Test or eval suites shipped with the version; a delivery gate hands one to a runner.
    runtime: static-only
    evidence: 'none: a suite gate in delivery asks a runner to run a suite, bound to its sha256'
    rule: 'schema: non-empty list; pactoVersion 2.1 only'
    outcomes: PARSE_ERROR when not a list; NEEDS_PACTO_2_1 under 2.0
    limitations: Pacto never reads a suite; its format is the runner's
    tests:
      unit:
      - pkg/validation/crossfield_test.go:TestValidateChecks
      - pkg/diff/checks_test.go:TestDiffChecks
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/checks/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/checks/invalid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/checks/invalid-2.0
      e2e: []
  checks[]:
    meaning: One suite, by name and file.
    runtime: static-only
    evidence: 'none: a suite gate runs it by name'
    rule: 'schema: name and file, nothing else; cross-field: names are unique; diff: added is non-breaking, removed or
      changed is potentially breaking'
    outcomes: SCHEMA_VIOLATION, DUPLICATE_CHECK_NAME
    limitations: the diff cannot tell a stricter suite from a weaker one
    tests:
      unit:
      - pkg/validation/crossfield_test.go:TestValidateChecks
      - pkg/diff/checks_test.go:TestDiffChecksSuiteContent
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/checks[]/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/checks[]/invalid
      e2e: []
  checks[].name:
    meaning: The suite's name; a delivery gate names it to run it.
    runtime: static-only
    evidence: 'none: identity only'
    rule: 'schema: required non-empty string; cross-field: unique'
    outcomes: SCHEMA_VIOLATION, DUPLICATE_CHECK_NAME
    limitations: none
    tests:
      unit:
      - pkg/validation/crossfield_test.go:TestValidateChecks
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/checks[].name/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/checks[].name/invalid
      e2e: []
  checks[].file:
    meaning: The suite's file in the bundle; a runner reads it, Pacto only hashes it.
    runtime: static-only
    evidence: 'none: the suite gate sends its path and sha256 and accepts only a verdict about that digest'
    rule: 'cross-field: file exists in the bundle'
    outcomes: FILE_NOT_FOUND
    limitations: the file's format is the runner's
    tests:
      unit:
      - pkg/validation/crossfield_test.go:TestValidateChecks
      - pkg/delivery/eval_test.go:TestEvalSuiteBinding
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/checks[].file/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/checks[].file/invalid
      e2e: []
  metadata:
    meaning: Free-form key/value annotations.
    runtime: not-applicable
    evidence: 'none: the field has no runtime counterpart'
    rule: 'schema: object'
    outcomes: PARSE_ERROR when not a map
    limitations: open object; displayed, never checked
    tests:
      unit:
      - pkg/contract/parse_test.go:TestParse_OptionalFields
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/metadata/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/metadata/invalid
      e2e: []
  extensions:
    meaning: Free-form vendor extension data.
    runtime: not-applicable
    evidence: 'none: the field has no runtime counterpart'
    rule: 'schema: object'
    outcomes: PARSE_ERROR when not a map
    limitations: open object; no Pacto code reads it
    tests:
      unit:
      - pkg/contract/parse_test.go:TestParse_OptionalFields
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/extensions/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/extensions/invalid
      e2e: []
