  interfaces[].visibility:
    meaning: Intended audience of the interface; omitted means internal (the schema default, applied by the engine).
    runtime: partial
    evidence: 'InterfaceObservation.Exposure: external only on a public address (a public spec.externalIPs entry, a LoadBalancer
      without an internal-LB annotation whose status carries a public IP or a hostname not starting with internal-, or an
      Ingress routing to the port whose status carries one); internal only for a ClusterIP Service no Ingress or HTTPRoute
      routes to; unknown otherwise (NodePort, internal or address-less LoadBalancer or Ingress, any HTTPRoute, a read error)'
    rule: internal is satisfied by internal and contradicted by external; public is satisfied by external; public with internal
      exposure and an unknown exposure are unverified
    outcomes: Compliant; INTERFACE_VISIBILITY_MISMATCH (error); listed in evaluationCoverage.unverified otherwise; SCHEMA_VIOLATION
      statically
    limitations: node and gateway addresses are not read, so NodePort and HTTPRoute exposure is unknown; exposure through
      a gateway the operator cannot see (cloud load balancer outside the cluster, service mesh ingress) is invisible; judged
      only when the interface is Observed and present
    tests:
      unit:
      - pkg/validation/evaluate_test.go:TestEvaluate_InterfaceVisibilityFacet
      - integrations/kubernetes/internal/observer/exposure_test.go:TestInterfaceExposure
      integration:
      - tests/integration/field_coverage_test.go:TestFieldCoverage/interfaces[].visibility/valid
      - tests/integration/field_coverage_test.go:TestFieldCoverage/interfaces[].visibility/invalid
      e2e:
      - tests/acceptance/kind/runtime-conformance.sh:conforming-workload
      - tests/acceptance/kind/runtime-conformance.sh:visibility-mismatch
    platforms:
      kubernetes:
        evidence: partial
        reason: 'exposure from Service, Ingress and load balancer status; NodePort and HTTPRoute stay unknown'
      agent:
        evidence: unverified
        reason: 'no source off Kubernetes: a host does not know who can reach a port, so the facet is listed in coverage.unverified'
      run:
        evidence: unverified
        reason: 'no source off Kubernetes: a host does not know who can reach a port, so the facet is listed in coverage.unverified'
    values:
      internal:
        meaning: Only callers inside the cluster may reach it.
        runtime: verified
        evidence: Exposure
        rule: internal satisfies; external contradicts
        outcomes: Compliant or INTERFACE_VISIBILITY_MISMATCH
        limitations: unknown exposure is unverified
        tests:
          unit:
          - pkg/validation/evaluate_test.go:TestEvaluate_InterfaceVisibilityFacet
          integration:
          - tests/integration/field_coverage_test.go:TestFieldCoverage/interfaces[].visibility=internal
          e2e:
          - tests/acceptance/kind/runtime-conformance.sh:conforming-workload
          - tests/acceptance/kind/runtime-conformance.sh:visibility-mismatch
      public:
        meaning: Meant to be reachable from outside the cluster.
        runtime: partial
        evidence: Exposure
        rule: external satisfies; internal and unknown are unverified, never a violation
