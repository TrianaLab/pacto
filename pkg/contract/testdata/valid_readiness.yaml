pactoVersion: "1.2"

service:
  name: payment-api
  version: 1.4.0
  owner:
    team: payments-team

interfaces:
  - name: http
    type: http
    port: 8080

runtime:
  workload: service
  state:
    type: stateless
    persistence:
      scope: local
      durability: ephemeral
    dataCriticality: low
  health:
    interface: http
    path: /health

readiness:
  expires: 2099-12-31
  checks:
    - id: dashboard
      type: url
      category: observability
      status: done
      evidence: https://grafana.company.com/payment-api
      weight: 20
      description: Main production dashboard

    - id: runbook
      type: document
      status: partial
      evidence: docs/runbooks/payment-api.md
      weight: 15

    - id: security-review
      type: ticket
      status: done
      evidence: SEC-1842
      weight: 25
