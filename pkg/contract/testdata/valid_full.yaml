pactoVersion: "2.0"
service:
  name: payments-api
  version: 2.1.0
  owner:
    team: Platform
    dri: alice@example.com
interfaces:
  - name: api
    type: openapi
    ref: interfaces/openapi.json
    visibility: public
  - name: events
    type: asyncapi
    ref: interfaces/asyncapi.yaml
    visibility: internal
  - name: admin
    type: grpc
    ref: interfaces/admin.proto
    visibility: internal
configurations:
  - name: app
    schema: configuration/schema.json
    values:
      port: 8080
      logLevel: info
dependencies:
  - name: auth-svc
    ref: oci://ghcr.io/acme/auth:1.0.0
    compatibility: ^1.0.0
    required: true
  - name: cache
    ref: oci://ghcr.io/acme/cache:2.0.0
    compatibility: ^2.0.0
state:
  type: stateful
  persistence:
    scope: local
    durability: persistent
  dataCriticality: high
workload: service
capabilities:
  - type: health
  - type: metrics
policies:
  - name: security
    schema: policy/security.json
    target: contract
