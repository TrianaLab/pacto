site_name: Pacto
site_description: An open, OCI-distributed contract standard for cloud-native services.
site_url: https://trianalab.github.io/pacto/
repo_url: https://github.com/TrianaLab/pacto
repo_name: TrianaLab/pacto
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  logo: assets/images/logo.png
  favicon: favicon.ico
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: cyan
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/TrianaLab/pacto
  version:
    provider: mike

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Get started:
      - Installation: installation.md
      - Quickstart: quickstart.md
  - Patterns: patterns.md
  - Guides:
      - For developers: developers.md
      - For platform engineers: platform-engineers.md
  - Reference:
      - Contract reference: contract-reference.md
      - CLI reference: cli-reference.md
      - Lockfile: lockfile.md
      - Packaging ignore: pactoignore.md
  - Integrations:
      - Dashboard container: dashboard-docker.md
      - GitHub Actions: github-actions.md
      - MCP integration: mcp-integration.md
      - Plugin development: plugins.md
      - Kubernetes operator: operator.md
  - Examples:
      - Overview: examples/index.md
      - Live dashboard demo: examples/dashboard-demo.md
      - Cron worker: examples/cron-worker.md
      - Event processor: examples/event-processor.md
      - gRPC service: examples/grpc-service.md
      - Hybrid cache: examples/hybrid-cache.md
      - Nginx: examples/nginx.md
      - PostgreSQL: examples/postgresql.md
      - RabbitMQ: examples/rabbitmq.md
      - Redis: examples/redis.md
  - Architecture: architecture.md
