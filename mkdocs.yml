site_name: Pacto
site_description: An open, OCI-distributed contract standard for cloud-native services.
site_url: https://trianalab.github.io/pacto/
repo_url: https://github.com/TrianaLab/pacto
repo_name: TrianaLab/pacto
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  # Landing hero template lives in overrides/home.html; docs/index.md opts in via
  # `template: home.html` metadata. Every other page uses stock Material templates.
  custom_dir: overrides
  logo: assets/images/logo.svg
  favicon: favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      # Neutral header + indigo accent; exact indigo hexes set in stylesheets/extra.css.
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

# Internal specs/plans live under docs/superpowers/ (gitignored) — never part of
# the published site.
exclude_docs: |
  superpowers/

# Fail the build (under --strict) on orphan pages and broken cross-references,
# so no page lingers outside the nav and every link/anchor resolves.
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/TrianaLab/pacto
  version:
    provider: mike

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path:
        - .
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/logo-spin.js

nav:
  - Home: index.md
  - Manifesto: manifesto.md
  - Get started:
      - Installation: installation.md
      - Quickstart: quickstart.md
  - Patterns:
      - patterns/index.md
      - Root + component contracts: patterns/root-component.md
      - Infrastructure contracts: patterns/infrastructure-contracts.md
      - Composable configurations: patterns/composable-configs.md
      - Policy + schema contract: patterns/policy-schema.md
      - Progressive policy versioning: patterns/progressive-policy.md
      - Override files: patterns/override-files.md
  - Guides:
      - For developers: developers.md
      - For platform engineers: platform-engineers.md
  - Examples:
      - Overview: examples/index.md
      - Live dashboard demo: examples/dashboard-demo.md
      - Cron worker: examples/cron-worker.md
      - Event processor: examples/event-processor.md
      - gRPC service: examples/grpc-service.md
      - Hybrid cache: examples/hybrid-cache.md
      - Nginx: examples/nginx.md
      - PostgreSQL: examples/postgresql.md
      - RabbitMQ: examples/rabbitmq.md
      - Redis: examples/redis.md
  - Reference:
      - Contract reference:
          - contract-reference/index.md
          - Contract sections: contract-reference/sections.md
          - Validation layers: contract-reference/validation.md
          - Contract overrides: contract-reference/overrides.md
          - Change classification: contract-reference/diff.md
      - CLI reference: cli-reference.md
      - Lockfile: lockfile.md
      - Packaging ignore: pactoignore.md
  - Integrations:
      - GitHub Actions: github-actions.md
      - MCP integration: mcp-integration.md
      - Kubernetes operator: operator.md
      - Plugin development: plugins.md
      - Dashboard container: dashboard-docker.md
  - Architecture: architecture.md
