site_name: Pacto
# With no social-cards plugin and no og:image, this string is the whole of the
# shared-link preview. Not "standard": that promises governance, a conformance
# suite and a second implementation, none of which exist.
site_description: The operational contract system for services — declare what a service is, publish it to any OCI registry, and compare it against the last revision and against what is running.
site_url: https://pacto.run/
repo_url: https://github.com/TrianaLab/pacto
repo_name: TrianaLab/pacto
edit_uri: edit/main/docs/
# Rendered in every page footer, so the licence is answerable without leaving the
# site. Mirrors LICENSE at the repository root.
copyright: >-
  MIT licensed —
  <a href="https://github.com/TrianaLab/pacto/blob/main/LICENSE">Copyright &copy; 2026 TrianaLab</a>

docs_dir: docs

theme:
  name: material
  # Landing hero template lives in overrides/home.html; docs/index.md opts in via
  # `template: home.html` metadata. Every other page uses stock Material templates.
  custom_dir: overrides
  logo: assets/images/logo.svg
  favicon: favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      # Neutral header + indigo accent; exact indigo hexes set in stylesheets/extra.css.
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

# Internal specs/plans live under docs/superpowers/ (gitignored) — never part of
# the published site.
exclude_docs: |
  superpowers/

# Fail the build (under --strict) on orphan pages and broken cross-references,
# so no page lingers outside the nav and every link/anchor resolves.
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/TrianaLab/pacto
  version:
    provider: mike
    # Show the alias (e.g. "latest") next to the current version in the selector,
    # so the newest release is clearly marked as latest.
    alias: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path:
        - .
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search

# Assemble first-party integration docs into this one root site at build time.
# Manifest-driven discovery via integrations/*/integration.yaml; see the hook.
hooks:
  - release/scripts/mkdocs_integration_hook.py
  # Stage the pinned Mermaid runtime into the site, so no page fetches it from a
  # CDN at read time. See the hook; a missing runtime fails the build.
  - release/scripts/mkdocs_mermaid_hook.py

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/logo-spin.js
  - javascripts/version-selector.js
  - javascripts/skip-link.js
  - javascripts/aria-labels.js
  - javascripts/scrollable-focus.js
  # Staged by release/scripts/mkdocs_mermaid_hook.py. Deferred, so it evaluates
  # after the parser finishes but still before DOMContentLoaded -- which is when
  # Material mounts the diagrams and looks for a `mermaid` global. Finding one, it
  # never reaches for the unpinned unpkg fallback baked into the theme.
  - path: javascripts/mermaid.min.js
    defer: true

# Ordered as a reader's path, not as a table of contents: see it running, install
# it, follow your role's guide, then learn the model, then go deep, then look
# things up. Theory pages (Concepts, Manifesto) sit AFTER the hands-on ones
# deliberately -- a first-time visitor should be able to try Pacto before
# absorbing it. Every label is a word a reader would search for, and no two
# entries share a label.
nav:
  - Home: index.md
  - Try it:
      - Live dashboard demo: examples/dashboard-demo.md
      - Runnable demo (Docker Compose): examples/compose-demo.md
  - Get started:
      - Installation: installation.md
      - Quickstart: quickstart.md
  - Guides:
      - For developers: developers.md
      - For platform engineers: platform-engineers.md
  - Concepts:
      - The Pacto model: model.md
      - Core concepts: concepts.md
      - Manifesto: manifesto.md
  - Operational graph:
      - operational-graph.md
      - Impact analysis: impact.md
      - Collectors and the evidence boundary: collectors.md
      - Observation sources: observation-sources.md
      # Grouped rather than promoted to a tab: three pages on one subject that a
      # reader searches for by name ("evidence"), not by the graph that consumes it.
      - External evidence:
          - Evidence protocol: evidence-protocol.md
          - Evidence in the registry: evidence-oci-storage.md
          - Evidence security and tooling: evidence-security.md
  - Patterns:
      - patterns/index.md
      - Root + component contracts: patterns/root-component.md
      - Infrastructure contracts: patterns/infrastructure-contracts.md
      - Composable configurations: patterns/composable-configs.md
      - Policy + schema contract: patterns/policy-schema.md
      - Progressive policy versioning: patterns/progressive-policy.md
      - Override files: patterns/override-files.md
      # Last on purpose: the six above are numbered 1-6 on the index and the
      # stacking diagram cites those numbers, so the sidebar has to count the
      # same way. This one is organizational guidance, not a composition.
      - Configuration schema ownership: patterns/configuration-schema-ownership.md
  - Examples:
      - Example contracts: examples/index.md
      - Cron worker: examples/cron-worker.md
      - Event processor: examples/event-processor.md
      - gRPC service: examples/grpc-service.md
      - Hybrid cache: examples/hybrid-cache.md
      - Nginx: examples/nginx.md
      - PostgreSQL: examples/postgresql.md
      - RabbitMQ: examples/rabbitmq.md
      - Redis: examples/redis.md
  - Integrations:
      - GitHub Actions: github-actions.md
      - MCP integration: mcp-integration.md
      # Kubernetes pages are owned by integrations/kubernetes/docs and assembled
      # into this site by release/scripts/mkdocs_integration_hook.py. Reference
      # pages (crd/helm/rbac/operator-config/contract-bindings/runtime-observations/
      # artifact-hub) are GENERATED by release/scripts/gen_integration_docs.py.
      - Kubernetes:
          - Kubernetes overview: integrations/kubernetes/overview.md
          - Install the operator: integrations/kubernetes/installation.md
          - Upgrade the operator: integrations/kubernetes/upgrade.md
          - Contract bindings: integrations/kubernetes/contract-bindings.md
          - Runtime observations: integrations/kubernetes/runtime-observations.md
          - Operator configuration: integrations/kubernetes/operator-configuration.md
          - Troubleshooting: integrations/kubernetes/troubleshooting.md
          - Limitations and opt-in features: integrations/kubernetes/limitations.md
          - CRD reference: integrations/kubernetes/crd-reference.md
          - Helm reference: integrations/kubernetes/helm-reference.md
          - RBAC: integrations/kubernetes/rbac.md
          - Published artifacts: integrations/kubernetes/artifact-hub.md
      - Plugin development: plugins.md
      - Dashboard container: dashboard-docker.md
  - Reference:
      - Contract reference:
          - contract-reference/index.md
          - Contract sections: contract-reference/sections.md
          - Validation layers: contract-reference/validation.md
          - Contract overrides: contract-reference/overrides.md
          - Diff and change classification: contract-reference/diff.md
      - CLI reference: cli-reference.md
      - Lockfile: lockfile.md
      - Packaging ignore: pactoignore.md
  # Not "Maintainers" — readers clicked that expecting governance or a list of
  # people and got CI internals. Everything here is contributor-facing: the code
  # map, the test suite and the release pipeline.
  - Project internals:
      - Architecture: architecture.md
      - Dashboard architecture: dashboard-architecture.md
      - Testing architecture: maintainers/testing.md
      # Path stays under examples/ on purpose: there is no redirect plugin, so
      # moving the file would permanently break every existing inbound URL.
      - Compliance scenarios: examples/compliance-scenarios.md
      - Release architecture: maintainers/releases.md
  # changelog.md is assembled at build time from release/units/*/CHANGELOG.md
  # by release/scripts/mkdocs_integration_hook.py (Changesets-generated history).
  - Changelog: changelog.md
