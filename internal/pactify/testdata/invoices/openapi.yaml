openapi: 3.0.3
info:
  title: Invoices API
  version: 1.3.0
paths:
  /v1/invoices/{accountId}:
    get:
      operationId: getInvoice
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The open invoice for the account }
        "502": { description: The ledger could not be reached }
  /healthz:
    get:
      operationId: health
      responses: { "200": { description: OK } }
