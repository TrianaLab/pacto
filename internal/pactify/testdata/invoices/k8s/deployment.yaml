apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoices
  labels: { app: invoices, team: billing }
spec:
  replicas: 2
  selector: { matchLabels: { app: invoices } }
  template:
    metadata:
      labels: { app: invoices, team: billing }
    spec:
      containers:
        - name: invoices
          image: ghcr.io/acme/invoices:1.3.0
          ports: [{ containerPort: 8080, name: http }]
          envFrom: [{ configMapRef: { name: invoices-config } }]
          env:
            - { name: PORT, value: "8080" }
          readinessProbe: { httpGet: { path: /healthz, port: http } }
          livenessProbe: { httpGet: { path: /healthz, port: http } }
