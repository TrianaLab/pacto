apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "payments.fullname" . }}
spec:
  template:
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          ports:
            - containerPort: {{ .Values.containerPorts.http }}
            - containerPort: 9100
          env:
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db
                  key: password
            {{- range .Values.extraEnv }}
            - name: {{ .name }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
