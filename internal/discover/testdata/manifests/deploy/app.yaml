apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  template:
    spec:
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.30
          ports:
            - containerPort: 15000
        - name: app
          image: ghcr.io/acme/app:1.0.0
          ports:
            - containerPort: 8080
            - containerPort: 9090
              protocol: UDP
            - containerPort: http
          env:
            - name: DB_PASSWORD
              value: hunter2
            - name: QUEUE_URL
              valueFrom:
                configMapKeyRef:
                  name: app
                  key: queue
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: cleanup
              image: ghcr.io/acme/cleanup:1.0.0
              ports:
                - containerPort: 7070
