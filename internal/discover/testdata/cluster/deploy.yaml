apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoices
  labels:
    team: payments
spec:
  template:
    spec:
      containers:
        - name: app
          image: ghcr.io/acme/invoices:1.0.0
          env:
            - name: BILLING_URL
              value: http://billing:8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
