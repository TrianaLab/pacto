name: CI
description: Shared CI step — setup Go and run a make target

inputs:
  target:
    description: Make target to run
    required: true
  golangci-lint:
    description: Install golangci-lint (needed for ci-static)
    required: false
    default: 'false'
  node:
    description: Setup Node.js (needed for ci-test which runs ci-ui)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
      with:
        go-version-file: go.mod

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      if: inputs.node == 'true'
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: pkg/dashboard/frontend/package-lock.json

    - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: |
          ~/.cache/go-build
          ${{ env.GOPATH }}/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download
      shell: bash

    - name: Install golangci-lint
      if: inputs.golangci-lint == 'true'
      uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
      with:
        install-only: true

    - name: Run make ${{ inputs.target }}
      run: make ${{ inputs.target }}
      shell: bash
