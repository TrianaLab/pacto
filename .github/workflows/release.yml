name: Release

# Transaction-driven release for the go.work monorepo (release/DESIGN-release-safety.md).
#
# Publishing is gated on release/release-transaction.json — the release-ready plan
# emitted only by `release:version` — NOT on a manifest-file diff. A feature merge
# carries a not-ready transaction and publishes nothing; merging the Version
# Packages PR introduces a ready transaction and publishes ONLY its changedUnits,
# in dependency order, with the GitHub Release finalized LAST. workflow_dispatch is
# recovery-only: it requires an existing transactionId + sourceSha and republishes
# only incomplete units, fail-closed. Every publisher refuses to overwrite an
# existing immutable version.
#
# Triggered on push to main + manual dispatch, so secrets are never exposed to
# forked pull requests.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      transaction_id:
        description: 'Release transaction ID to recover (from release-transaction.json).'
        required: true
      source_sha:
        description: 'Source commit SHA the transaction was created for.'
        required: true
      units:
        description: 'Optional comma-separated subset of the transaction units to recover.'
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changesets:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Open or update the Version Packages PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: npm run release:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Decide from the release transaction (never from a file diff). Emits the
  # changedUnits set that every publisher gates on. Fail-closed for a bad dispatch.
  detect:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.d.outputs.release }}
      units_json: ${{ steps.d.outputs.units_json }}
      transaction_id: ${{ steps.d.outputs.transaction_id }}
      source_sha: ${{ steps.d.outputs.source_sha }}
      core_version: ${{ steps.v.outputs.core }}
      k8s_version: ${{ steps.v.outputs.k8s }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Decide release / recovery from the transaction
        id: d
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_TRANSACTION_ID: ${{ github.event.inputs.transaction_id }}
          INPUT_SOURCE_SHA: ${{ github.event.inputs.source_sha }}
          INPUT_UNITS: ${{ github.event.inputs.units }}
        run: node release/orchestrator/detect.mjs
      - name: Read + validate versions from the manifest
        id: v
        if: steps.d.outputs.release == 'true'
        run: |
          core=$(jq -r '.units.core.version' release/release-manifest.json)
          k8s=$(jq -r '.units["k8s-module"].version' release/release-manifest.json)
          for val in "$core" "$k8s"; do
            echo "$val" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?' \
              || { echo "invalid version '$val' in release-manifest.json" >&2; exit 1; }
          done
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "k8s=$k8s" >> "$GITHUB_OUTPUT"
      - name: Guard — dispatch source_sha must be this commit
        if: github.event_name == 'workflow_dispatch'
        run: |
          test "${{ github.event.inputs.source_sha }}" = "$GITHUB_SHA" \
            || { echo "::error::dispatch source_sha != the checked-out commit; check out the transaction's commit"; exit 1; }

  # pacto-publishes: core
  # The core Go module TAG (github.com/trianalab/pacto/v3 -> vX.Y.Z). Created FIRST
  # so the k8s module's require resolves. The GitHub Release + binaries are
  # finalized LAST by the `release` job. Fail-closed: an existing tag pointing at a
  # different commit is an immutable-version violation.
  core-tag:
    needs: detect
    if: needs.detect.outputs.release == 'true' && contains(fromJSON(needs.detect.outputs.units_json), 'core')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Tag the core module (immutable)
        env:
          TAG: v${{ needs.detect.outputs.core_version }}
        run: bash release/orchestrator/publish-go-tag.sh "$TAG" "$GITHUB_SHA"

  # Core-readiness barrier for the Kubernetes line. Always runs for a release so
  # the Kubernetes publishers have a stable dependency even when core is unchanged
  # (a Kubernetes-only release skips core-tag, which would otherwise skip its
  # dependents). If core changed, require core-tag to have succeeded; if not,
  # verify the pinned core tag the integration go.mod requires already exists.
  core-ready:
    needs: [detect, core-tag]
    if: always() && needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Verify core is ready for the Kubernetes line
        env:
          CORE_TAG: v${{ needs.detect.outputs.core_version }}
        run: |
          if ${{ contains(fromJSON(needs.detect.outputs.units_json), 'core') }}; then
            [ "${{ needs.core-tag.result }}" = "success" ] \
              || { echo "::error::core changed but core-tag did not succeed"; exit 1; }
            echo "core changed -> core-tag succeeded ($CORE_TAG)"
          else
            pin="$(jq -r '.groups.kubernetes.goModPin.version' release/release-plan.json)"
            git ls-remote --tags origin "refs/tags/${pin}" | grep -q . \
              || { echo "::error::core unchanged but the pinned core ${pin} is not published"; exit 1; }
            echo "core unchanged -> pinned core ${pin} already published + resolvable"
          fi

  # pacto-publishes: dashboard-image
  dashboard-image:
    needs: detect
    if: needs.detect.outputs.release == 'true' && contains(fromJSON(needs.detect.outputs.units_json), 'dashboard-image')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing immutable tag
        run: bash release/orchestrator/verify-oci-absent.sh "ghcr.io/trianalab/pacto-dashboard:${{ needs.detect.outputs.core_version }}"
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/trianalab/pacto-dashboard:${{ needs.detect.outputs.core_version }}
          build-args: |
            VERSION=v${{ needs.detect.outputs.core_version }}
            GIT_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=pacto-dashboard
            org.opencontainers.image.version=${{ needs.detect.outputs.core_version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign
        run: |
          digest=$(docker buildx imagetools inspect \
            "ghcr.io/trianalab/pacto-dashboard:${{ needs.detect.outputs.core_version }}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          cosign sign --yes "ghcr.io/trianalab/pacto-dashboard:${{ needs.detect.outputs.core_version }}@${digest}"

  # pacto-publishes: dashboard-contract-bundle
  # The OCI-distributed pacto CONTRACT for the dashboard service. Folded into the
  # release transaction (was a duplicate release/workflow_run trigger in pacto.yml):
  # exactly one invocation, exact version + source SHA from the plan, no
  # `gh release view` latest-tag guessing.
  dashboard-contract-bundle:
    needs: detect
    if: needs.detect.outputs.release == 'true' && contains(fromJSON(needs.detect.outputs.units_json), 'dashboard-contract-bundle')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: Build the dashboard contract bundle
        run: make gen-bundle
      - name: Validate the contract
        run: go run ./cmd/pacto validate ./pactos/pacto-dashboard --set service.version=${{ needs.detect.outputs.core_version }}
      - name: Refuse to overwrite an existing immutable tag
        run: bash release/orchestrator/verify-oci-absent.sh "ghcr.io/trianalab/pactos/pacto-dashboard:${{ needs.detect.outputs.core_version }}"
      - name: Push the contract bundle (exact version + source SHA)
        env:
          PACTO_REGISTRY_USERNAME: ${{ github.actor }}
          PACTO_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go run ./cmd/pacto push \
            oci://ghcr.io/trianalab/pactos/pacto-dashboard:${{ needs.detect.outputs.core_version }} \
            ./pactos/pacto-dashboard --set service.version=${{ needs.detect.outputs.core_version }}

  # pacto-publishes: demo-bundles
  demo-bundles:
    needs: detect
    if: needs.detect.outputs.release == 'true' && contains(fromJSON(needs.detect.outputs.units_json), 'demo-bundles')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Publish demo bundles to the production coordinate
        env:
          PACTO_DEMO_REGISTRY: ghcr.io/trianalab/pacto-demo
          PACTO_ALLOW_PROD: '1'
          PACTO_REGISTRY_USERNAME: ${{ github.actor }}
          PACTO_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: release/scripts/publish-demo-bundles.sh --push

  # pacto-publishes: k8s-module
  # The nested integration module tag. Needs core-tag: the integration go.mod pins
  # the published core, so core must be tagged first for the tag to resolve.
  k8s-module:
    needs: [detect, core-ready]
    if: needs.detect.outputs.release == 'true' && contains(fromJSON(needs.detect.outputs.units_json), 'k8s-module')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Tag the integration module (immutable)
        env:
          TAG: integrations/kubernetes/v${{ needs.detect.outputs.k8s_version }}
        run: bash release/orchestrator/publish-go-tag.sh "$TAG" "$GITHUB_SHA"

  # pacto-publishes: operator-image
  # Root build context (context: .) so the monorepo-aware Dockerfile can COPY
  # go.work + the root go.mod + pkg/ + integrations/kubernetes/. Needs core-tag so
  # the pinned core resolves during the standalone (GOWORK=off) module build.
  operator-image:
    needs: [detect, core-ready]
    if: needs.detect.outputs.release == 'true' && contains(fromJSON(needs.detect.outputs.units_json), 'operator-image')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing immutable tag
        run: bash release/orchestrator/verify-oci-absent.sh "ghcr.io/trianalab/pacto-operator/pacto-controller:${{ needs.detect.outputs.k8s_version }}"
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: integrations/kubernetes/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/trianalab/pacto-operator/pacto-controller:${{ needs.detect.outputs.k8s_version }}
          build-args: |
            VERSION=v${{ needs.detect.outputs.k8s_version }}
            GIT_COMMIT=${{ github.sha }}
            DASHBOARD_IMAGE=ghcr.io/trianalab/pacto-dashboard:${{ needs.detect.outputs.core_version }}
          labels: |
            org.opencontainers.image.title=pacto-controller
            org.opencontainers.image.version=${{ needs.detect.outputs.k8s_version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign
        run: |
          img=ghcr.io/trianalab/pacto-operator/pacto-controller:${{ needs.detect.outputs.k8s_version }}
          digest=$(docker buildx imagetools inspect "$img" --format '{{json .Manifest.Digest}}' | tr -d '"')
          cosign sign --yes --new-bundle-format=false --use-signing-config=false "${img}@${digest}"

  # pacto-publishes: operator-chart
  operator-chart:
    needs: [detect, operator-image]
    if: needs.detect.outputs.release == 'true' && contains(fromJSON(needs.detect.outputs.units_json), 'operator-chart')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    defaults:
      run:
        working-directory: integrations/kubernetes
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2
      - name: Log in to GHCR (Helm)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin
      - name: Log in to GHCR (Cosign/ORAS)
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing immutable chart
        working-directory: .
        run: bash release/orchestrator/verify-oci-absent.sh "ghcr.io/trianalab/pacto-operator/charts/pacto-operator:${{ needs.detect.outputs.k8s_version }}"
      - name: Package, push, sign chart + Artifact Hub metadata
        env:
          VERSION: ${{ needs.detect.outputs.k8s_version }}
        run: |
          helm package charts/pacto-operator
          out=$(helm push "pacto-operator-${VERSION}.tgz" oci://ghcr.io/trianalab/pacto-operator/charts 2>&1)
          echo "$out"
          digest=$(echo "$out" | grep -oE 'sha256:[a-f0-9]+')
          cosign sign --yes --new-bundle-format=false --use-signing-config=false \
            "ghcr.io/trianalab/pacto-operator/charts/pacto-operator:${VERSION}@${digest}"
          oras push ghcr.io/trianalab/pacto-operator/charts/pacto-operator:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

  # pacto-publishes: k8s-docs
  # The versioned docs site. A transaction unit (not an independent trigger): it
  # receives the exact core + k8s versions + source SHA from the plan and deploys
  # via mike. Docs deploy when either line publishes (core version selector or the
  # integration docs change). The "Deploy docs" workflow no longer self-triggers on
  # release/workflow_run; this is the single docs publisher.
  docs:
    needs: [detect, core-ready, k8s-module]
    if: >-
      always() && needs.detect.outputs.release == 'true' &&
      (contains(fromJSON(needs.detect.outputs.units_json), 'k8s-docs') || contains(fromJSON(needs.detect.outputs.units_json), 'core')) &&
      !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Build the WASM dashboard demo
        run: make -C examples/demo build
      - name: Deploy versioned docs with mike (exact release versions)
        env:
          PACTO_DOCS_CORE_VERSION: ${{ needs.detect.outputs.core_version }}
          PACTO_DOCS_K8S_VERSION: ${{ needs.detect.outputs.k8s_version }}
          PACTO_DOCS_SOURCE_SHA: ${{ needs.detect.outputs.source_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          make docs-deploy

  # pacto-publishes: cli
  # The CLI binaries + checksums + SBOM AND the GitHub Release — created LAST, after
  # every other unit for the transaction has published, so a finalized Release never
  # advertises missing assets. Binaries are reproducible: the build date is derived
  # from the source commit, so a re-run produces byte-identical artifacts.
  release:
    needs: [detect, core-tag, dashboard-image, dashboard-contract-bundle, demo-bundles, k8s-module, operator-image, operator-chart, docs]
    if: >-
      always() && needs.detect.outputs.release == 'true' &&
      contains(fromJSON(needs.detect.outputs.units_json), 'cli') &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: Build reproducible binaries + checksums + SBOM
        env:
          TAG: v${{ needs.detect.outputs.core_version }}
        run: bash release/orchestrator/build-cli.sh "$TAG" "$GITHUB_SHA"
      - name: Create the GitHub Release with verified assets (last)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.detect.outputs.core_version }}
        run: bash release/orchestrator/finalize-release.sh "$TAG" "$GITHUB_SHA"
