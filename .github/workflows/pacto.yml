name: Pacto Contract CI

# PR-time contract CI only. The dashboard CONTRACT BUNDLE is published by the
# release transaction (.github/workflows/release.yml, unit
# dashboard-contract-bundle) — one publisher, exact version + source SHA from the
# plan. This workflow no longer self-triggers on release/workflow_run (that was a
# duplicate publisher with latest-tag guessing).
on:
  push:
    branches: [main]
    paths:
      - 'pactos/**'
      - 'pkg/dashboard/**'
  pull_request:
    paths:
      - 'pactos/**'
      - 'pkg/dashboard/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # Build pacto from source so that bundle generation and validation
      # always use the contract model from this branch. On releases, fall
      # back to the published binary via pacto-actions.
      - name: Build pacto from source
        if: github.event_name != 'release'
        run: go install ./cmd/pacto

      - name: Install official plugins
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo TrianaLab/pacto-plugins --json tagName -q .tagName)
          GOBIN=$(go env GOPATH)/bin
          for plugin in pacto-plugin-schema-infer pacto-plugin-openapi-infer; do
            gh release download "$TAG" --repo TrianaLab/pacto-plugins \
              --pattern "${plugin}_linux_amd64" --output "${GOBIN}/${plugin}"
            chmod +x "${GOBIN}/${plugin}"
          done

      - uses: trianalab/pacto-actions@3ae26607b3d6f33caec1213e148ba3feab571ef4 # v1.8.2
        if: github.event_name == 'release'
        with:
          command: setup

      # Install syft and generate SBOM
      - name: Install syft
        uses: anchore/sbom-action/download-syft@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1

      - name: Generate bundle
        run: make gen-bundle

      # Validate the generated contract
      - name: Validate contract
        run: pacto validate ./pactos/pacto-dashboard --set service.version=0.1.0

      # Upload bundle as artifact for later use
      - name: Upload bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pacto-dashboard-bundle
          path: pactos/pacto-dashboard/

      # On PRs: diff against the published contract
      # On PRs: diff against the published contract
      - name: Contract diff
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          pacto diff \
            oci://ghcr.io/trianalab/pacto/dashboard-contract \
            ./pactos/pacto-dashboard \
            --new-set service.version=0.0.0-pr.${{ github.event.pull_request.number }} \
            -o markdown || true

      # On PRs: generate docs
      - name: Contract doc
        if: github.event_name == 'pull_request'
        run: |
          pacto doc ./pactos/pacto-dashboard \
            --set service.version=0.0.0-pr.${{ github.event.pull_request.number }}
