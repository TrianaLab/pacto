name: Pacto Contract CI

# PR-time contract CI only. The dashboard CONTRACT BUNDLE is published by the
# release transaction (.github/workflows/release.yml, unit
# dashboard-contract-bundle) — one publisher, exact version + source SHA from the
# plan. This workflow no longer self-triggers on release/workflow_run (that was a
# duplicate publisher with latest-tag guessing).
on:
  push:
    branches: [main]
    paths:
      - 'pactos/**'
      - 'pkg/dashboard/**'
  # No `paths:` here, deliberately. `pacto-required` below is a required status
  # check, and a required check filtered at the trigger never starts on an
  # unrelated pull request, so it never reports and the pull request waits
  # forever on a check that will never arrive. The filter lives in the `changes`
  # job instead -- the same shape docs-check.yml uses.
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      contract: ${{ steps.filter.outputs.contract }}
      ci-step: ${{ steps.filter.outputs.ci-step }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            contract:
              - 'pactos/**'
              - 'pkg/dashboard/**'
              - '.github/workflows/pacto.yml'
            ci-step:
              - 'examples/demo/monorepo/**'
              - 'examples/ci/**'
              - 'internal/ci/**'
              - 'internal/cli/ci*.go'
              - 'internal/app/ci*.go'
              - 'pkg/publish/**'
              - 'pkg/signing/**'
              - '.github/workflows/pacto.yml'

  bundle:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod

      # Build pacto from source so that bundle generation and validation
      # always use the contract model from this branch. On releases, fall
      # back to the published binary via pacto-actions.
      - name: Build pacto from source
        if: github.event_name != 'release'
        run: bash release/scripts/retry.sh go install ./cmd/pacto

      - uses: trianalab/pacto-actions@3ae26607b3d6f33caec1213e148ba3feab571ef4 # v1.8.2
        if: github.event_name == 'release'
        with:
          command: setup

      # Install syft and generate SBOM
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Generate bundle
        run: make gen-bundle

      # Validate the generated contract
      - name: Validate contract
        run: pacto validate ./pactos/pacto-dashboard --set service.version=0.1.0

      # Upload bundle as artifact for later use
      - name: Upload bundle artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pacto-dashboard-bundle
          path: pactos/pacto-dashboard/

      # On PRs: diff against the published contract
      # On PRs: diff against the published contract
      - name: Contract diff
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          pacto diff \
            oci://ghcr.io/trianalab/pacto/dashboard-contract \
            ./pactos/pacto-dashboard \
            --new-set service.version=0.0.0-pr.${{ github.event.pull_request.number }} \
            -o markdown || true

      # On PRs: generate docs
      - name: Contract doc
        if: github.event_name == 'pull_request'
        run: |
          pacto doc ./pactos/pacto-dashboard \
            --set service.version=0.0.0-pr.${{ github.event.pull_request.number }}

  # The pacto this pull request builds, as an artifact the reusable workflow
  # runs instead of downloading a release (its pacto-artifact input).
  pacto-bin:
    needs: changes
    if: needs.changes.outputs.ci-step == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: Build pacto
        env:
          CGO_ENABLED: "0"
          GOBIN: ${{ runner.temp }}/pacto-bin
        run: bash release/scripts/retry.sh go install ./cmd/pacto
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pacto-bin
          path: ${{ runner.temp }}/pacto-bin/pacto
          retention-days: 1

  # Dogfood: the caller pacto ci init writes, run over the demo monorepo with
  # this pull request's pacto. uses: and permissions: stay equal to
  # ci.Caller("github") (tests/release/ci_step_pin_test.go): the permissions
  # are the union of the reusable workflow's job maps, since GitHub refuses to
  # start it when any job, skipped or not, asks for more. publish: false keeps
  # the push-to-main trigger from publishing.
  ci-step:
    needs: [changes, pacto-bin]
    if: needs.changes.outputs.ci-step == 'true'
    permissions: {contents: read, packages: write, id-token: write, pull-requests: write}
    uses: TrianaLab/pacto-actions/.github/workflows/ci.yml@8b64cfe46f01f82a1b990afc5b64a01a73d0f4d0 # v2.0.0
    with:
      path: examples/demo/monorepo
      pacto-artifact: pacto-bin
      publish: false

  # Single required status for branch protection, mirroring ci.yml's `required`
  # and docs-check.yml's `docs-required`: green when the bundle validated AND
  # when it was correctly skipped, red only when it actually failed. Without it
  # the dashboard contract bundle was validated pre-merge by a check nothing
  # required, so the first hard failure would land mid-release-transaction --
  # after the Go module tags are already pushed, which is the expensive place to
  # discover it.
  pacto-required:
    if: always()
    needs:
      - changes
      - bundle
      - pacto-bin
      - ci-step
    runs-on: ubuntu-latest
    steps:
      - name: Verify no contract leg failed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "leg results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "a required contract leg did not pass"
              exit 1
            fi
          done
          echo "all required contract legs passed"
