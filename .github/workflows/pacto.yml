name: Pacto Contract CI

# PR-time contract CI only. The dashboard CONTRACT BUNDLE is published by the
# release transaction (.github/workflows/release.yml, unit
# dashboard-contract-bundle) — one publisher, exact version + source SHA from the
# plan. This workflow no longer self-triggers on release/workflow_run (that was a
# duplicate publisher with latest-tag guessing).
on:
  push:
    branches: [main]
    paths:
      - 'pactos/**'
      - 'pkg/dashboard/**'
  # No `paths:` here, deliberately. `pacto-required` below is a required status
  # check, and a required check filtered at the trigger never starts on an
  # unrelated pull request, so it never reports and the pull request waits
  # forever on a check that will never arrive. The filter lives in the `changes`
  # job instead -- the same shape docs-check.yml uses.
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      contract: ${{ steps.filter.outputs.contract }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            contract:
              - 'pactos/**'
              - 'pkg/dashboard/**'
              - '.github/workflows/pacto.yml'

  bundle:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # Build pacto from source so that bundle generation and validation
      # always use the contract model from this branch. On releases, fall
      # back to the published binary via pacto-actions.
      - name: Build pacto from source
        if: github.event_name != 'release'
        run: go install ./cmd/pacto

      - uses: trianalab/pacto-actions@3ae26607b3d6f33caec1213e148ba3feab571ef4 # v1.8.2
        if: github.event_name == 'release'
        with:
          command: setup

      # Install syft and generate SBOM
      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Generate bundle
        run: make gen-bundle

      # Validate the generated contract
      - name: Validate contract
        run: pacto validate ./pactos/pacto-dashboard --set service.version=0.1.0

      # Upload bundle as artifact for later use
      - name: Upload bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pacto-dashboard-bundle
          path: pactos/pacto-dashboard/

      # On PRs: diff against the published contract
      # On PRs: diff against the published contract
      - name: Contract diff
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          pacto diff \
            oci://ghcr.io/trianalab/pacto/dashboard-contract \
            ./pactos/pacto-dashboard \
            --new-set service.version=0.0.0-pr.${{ github.event.pull_request.number }} \
            -o markdown || true

      # On PRs: generate docs
      - name: Contract doc
        if: github.event_name == 'pull_request'
        run: |
          pacto doc ./pactos/pacto-dashboard \
            --set service.version=0.0.0-pr.${{ github.event.pull_request.number }}

  # Single required status for branch protection, mirroring ci.yml's `required`
  # and docs-check.yml's `docs-required`: green when the bundle validated AND
  # when it was correctly skipped, red only when it actually failed. Without it
  # the dashboard contract bundle was validated pre-merge by a check nothing
  # required, so the first hard failure would land mid-release-transaction --
  # after the Go module tags are already pushed, which is the expensive place to
  # discover it.
  pacto-required:
    if: always()
    needs:
      - changes
      - bundle
    runs-on: ubuntu-latest
    steps:
      - name: Verify no contract leg failed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "leg results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "a required contract leg did not pass"
              exit 1
            fi
          done
          echo "all required contract legs passed"
