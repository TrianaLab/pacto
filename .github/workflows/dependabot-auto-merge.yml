name: Auto-merge Dependabot PRs

on: pull_request

permissions:
  contents: write
  pull-requests: write

# Auto-merge is armed only for semver patch and minor updates. A major is a read
# of a changelog, not a merge button: it can need code changes (mermaid 12, jsdom
# 30, TypeScript 7) and a changeset.
#
# It is also never armed while the changesets Version PR (changeset-release/main)
# is open. A dependency landing on main between that PR being generated and being
# merged leaves the Version PR stale, and GITHUB_TOKEN merges never regenerate it,
# so the release tags content its lockfiles do not describe.
jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Read Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: |
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --head changeset-release/main --state open --json number --jq length)
          if [ "$open" != "0" ]; then
            echo "::notice::The changesets Version PR is open; not arming auto-merge until it merges."
            exit 0
          fi
          gh pr merge --auto --rebase "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
