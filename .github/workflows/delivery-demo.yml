name: Delivery demo

# The heavy Kubernetes delivery demo: every night, on demand, and on every pull
# request that changes delivery, where ci.yml calls it (job delivery-demo, which
# the required check aggregates). The demo script checks each story step itself
# and fails loudly on drift; a nightly failure opens (or comments on) one issue,
# so it is seen without anyone watching the Actions tab.
# It runs `make e2e-delivery-demo`: up, story, the dashboard journeys with B10
# and the agent beat, reach (a second cluster applied by Argo CD) and down
# (tests/acceptance/kind/delivery-demo.sh).

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Keyed on the event too: on main the nightly and ci.yml's required call share
# the ref, and neither may cancel the other.
concurrency:
  group: delivery-demo-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Install kind (checksum-verified via GOSUMDB)
        timeout-minutes: 5
        run: bash release/scripts/retry.sh go install sigs.k8s.io/kind@v0.30.0
      - name: Run the demo
        timeout-minutes: 75
        run: bash scripts/ci/kind-run.sh "$RUNNER_TEMP/diagnostics/run.log" make e2e-delivery-demo
      - name: Collect cluster diagnostics
        if: failure()
        timeout-minutes: 10
        run: bash scripts/ci/kind-diagnostics.sh "$RUNNER_TEMP/diagnostics"
      - name: Upload logs, diagnostics and browser traces
        if: failure()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: delivery-demo-diagnostics
          path: |
            ${{ runner.temp }}/diagnostics
            pkg/dashboard/frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

  # A scheduled failure nobody sees is no check at all: open one issue, then
  # comment on it for every further failure until someone closes it.
  report:
    needs: demo
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly failure issue
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly delivery demo is failing"
          body="The nightly Kubernetes delivery demo failed: $RUN_URL (logs and cluster diagnostics are in its artifacts)."
          n="$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
