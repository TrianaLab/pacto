name: Delivery demo

# The heavy Kubernetes delivery demo: every night, on demand, and on every pull
# request that changes delivery, where ci.yml calls it (job delivery-demo, which
# the required check aggregates). The demo script checks each story step itself
# and fails loudly on drift; a nightly failure opens (or comments on) one issue,
# so it is seen without anyone watching the Actions tab.
# It runs as parallel shards (tests/acceptance/kind/delivery-demo.sh, SHARDS):
# each shard is `make test-acceptance-kind-delivery-demo-<shard>`, on its own
# runner and clusters, seeded only as far as its beats need, over the three
# Pacto images built once and its third-party images pulled once (ci.yml's
# delivery-images artifact when ci.yml calls it, the images job below otherwise).

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      images-artifact:
        description: The caller's artifact holding delivery.sh's saved images; empty builds them here.
        type: string
        default: ''

permissions:
  contents: read

# Read by .github/aval/run.sh into every run record (see ci.yml).
env:
  AVAL_CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  AVAL_REPOSITORY: ${{ github.repository }}

# Keyed on the event too: on main the nightly and ci.yml's required call share
# the ref, and neither may cancel the other.
concurrency:
  group: delivery-demo-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same build as ci.yml's delivery-images, for the nightly and a manual run.
  images:
    if: inputs.images-artifact == ''
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # delivery.sh checks for these before it builds (see ci.yml's delivery-images).
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.1
      - name: Build the operator, dashboard and delivery images
        timeout-minutes: 25
        run: |
          mkdir -p "$RUNNER_TEMP/delivery-images"
          DELIVERY_SAVE_IMAGES="$RUNNER_TEMP/delivery-images/delivery-images.tar" bash tests/acceptance/kind/delivery.sh
      # The demo's third-party images (Argo CD, Dex, Keycloak, Flux, zot...), pulled
      # once here with retries so no demo shard pulls from a public registry.
      - name: Pull the delivery demo's third-party images
        timeout-minutes: 15
        run: bash scripts/ci/kind-run.sh "$RUNNER_TEMP/save-images.log" bash tests/acceptance/kind/delivery-demo.sh save-images "$RUNNER_TEMP/delivery-images/demo-third-party.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        timeout-minutes: 10
        with:
          name: delivery-demo-images
          path: ${{ runner.temp }}/delivery-images
          compression-level: 1
          retention-days: 1
          overwrite: true

  demo:
    needs: images
    # images is skipped when the caller built them.
    if: ${{ !cancelled() && (needs.images.result == 'success' || needs.images.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # A suite job: no registry write and no OIDC token, whatever the caller holds
    # (ci.yml's aval-publish signs the results it records).
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [story, browser, rollback, reach, freeze, agent]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.1
      # pacto publish builds fraud's image with the OCI exporter, which the
      # default docker driver lacks; this makes a docker-container builder.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install kind (checksum-verified via GOSUMDB)
        timeout-minutes: 5
        run: make kind-install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        timeout-minutes: 10
        with:
          name: ${{ inputs.images-artifact || 'delivery-demo-images' }}
          path: ${{ runner.temp }}/delivery-images
      # AVAL_POLICY and AVAL_REGISTRY from main's .github/aval/trust-from-base.sh,
      # never from this ref: a PR cannot widen what its own CI trusts.
      - name: Aval trust policy and registry, from main
        timeout-minutes: 5
        run: |
          fetched=
          for i in 1 2 3; do
            /usr/bin/git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main && fetched=1 && break
            [ "$i" = 3 ] || sleep $((i * 10))
          done
          if [ -z "$fetched" ]; then
            echo "::warning::cannot fetch main: no trust policy, nothing is reused"
          elif /usr/bin/git show origin/main:.github/aval/trust-from-base.sh > "$RUNNER_TEMP/trust-from-base.sh"; then
            /bin/bash "$RUNNER_TEMP/trust-from-base.sh"
          else
            echo "::warning::main has no .github/aval/trust-from-base.sh: no trust policy, nothing is reused"
          fi
      - name: Install the pinned aval release (sha256 and Sigstore verified)
        timeout-minutes: 5
        run: make aval-install
      # The shard is part of the contract (aval.delivery-demo-<shard>.yaml); the
      # archives only carry images built or pulled by digest in this run.
      - name: Run the ${{ matrix.shard }} shard
        timeout-minutes: 35
        run: |
          export DELIVERY_LOAD_IMAGES="$RUNNER_TEMP/delivery-images/delivery-images.tar"
          export DELIVERY_DEMO_IMAGES="$RUNNER_TEMP/delivery-images/demo-third-party.tar"
          bash scripts/ci/kind-run.sh "$RUNNER_TEMP/diagnostics/run.log" make test-acceptance-kind-delivery-demo-${{ matrix.shard }}
      - name: Aval summary
        if: always()
        timeout-minutes: 2
        run: bash .github/aval/summary.sh
      - name: Upload Aval results and run records
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aval-delivery-demo-${{ matrix.shard }}
          path: .aval/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Collect cluster diagnostics
        if: failure()
        timeout-minutes: 10
        run: bash scripts/ci/kind-diagnostics.sh "$RUNNER_TEMP/diagnostics"
      - name: Upload logs, diagnostics and browser traces
        if: failure()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: delivery-demo-${{ matrix.shard }}-diagnostics
          path: |
            ${{ runner.temp }}/diagnostics
            pkg/dashboard/frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

  # A scheduled failure nobody sees is no check at all: open one issue, then
  # comment on it for every further failure until someone closes it.
  report:
    needs: [images, demo]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly failure issue
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly delivery demo is failing"
          body="The nightly Kubernetes delivery demo failed: $RUN_URL (logs and cluster diagnostics are in its artifacts)."
          n="$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
