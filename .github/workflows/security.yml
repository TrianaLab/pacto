name: Security

# Vulnerability scanning: govulncheck (Go source + dependencies of both modules,
# reachability aware) and Trivy (every shipped container image, OS + language
# CVEs). The two scan jobs
# run in parallel (no `needs`); a follow-up `comment` job posts a summary on pull
# requests.
#
# Both scans are fail-closed, but until `security-required` existed neither one
# blocked anything: they reported status contexts branch protection does not
# require, so a pull request could go red here and merge anyway -- unattended,
# since Dependabot arms auto-merge the moment it opens. GitHub has no
# cross-workflow `needs:`, so a workflow that is not ci.yml earns its gate by
# publishing one aggregate context of its own for protection to require. That is
# `security-required` at the bottom of this file.
#
# Supply-chain note: aquasecurity/trivy-action and setup-trivy were compromised
# in March 2026 (tags force-pushed to an infostealer), so we install the Trivy
# binary directly from a pinned upstream release and use only first-party
# GitHub actions.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '27 6 * * 1' # weekly, Monday 06:27 UTC

permissions:
  contents: read

# The ONE accepted govulncheck advisory, read by the gate and the PR summary.
# GO-2026-5932: golang.org/x/crypto/openpgp is unmaintained and has no fixed
# version. It reaches Pacto only via sigstore-go/pkg/sign -> rekor/pkg/pki ->
# rekor/pkg/pki/pgp, and Pacto never parses PGP. The exception is scoped, not
# module-wide: the gate accepts a trace only when it ends in a package init or in
# a Read or Error method (an io.Reader or error interface call govulncheck cannot
# resolve), meaning a receiver type sits between the package and the name. A trace
# ending anywhere else, such as a direct openpgp call or the package-level
# packet.Read parser, fails.
# Removal is enforced, not remembered: the gate fails once govulncheck stops
# reporting the ID, so the stale exception has to be deleted in that same run.
# Every other reachable advisory still fails the job.
# tests/release/govulncheck_exception_test.go pins this to exactly one ID.
env:
  IGNORED_VULN: GO-2026-5932

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
      actions: read # required by upload-sarif in some configurations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: bash release/scripts/retry.sh go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      # With -format sarif, govulncheck always exits 0 (findings live in the
      # SARIF), so gating happens in the "Fail on ..." step below.
      # Both modules, with -tags kms: the signing package's cloud KMS providers
      # (pkg/signing/kms_*.go) only compile under that tag, and the pacto-delivery
      # image is built with GO_TAGS=kms, so a scan without it misses what ships.
      - name: Run govulncheck (SARIF)
        run: |
          govulncheck -format sarif -tags kms ./... > govulncheck.sarif
          (cd integrations/kubernetes && govulncheck -format sarif -tags kms ./...) > govulncheck-k8s.sarif
      - name: Upload SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck
      - name: Upload operator module SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: govulncheck-k8s.sarif
          category: govulncheck-k8s
      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: govulncheck-sarif
          path: govulncheck*.sarif
          if-no-files-found: ignore
      - name: Fail on reachable vulnerabilities
        run: |
          # Only error-level results are reachable vulnerabilities; warning/note
          # are imported-but-unused and must not fail the build. Every
          # govulncheck*.sarif (one per module) is read as one report.
          sarifs=(govulncheck*.sarif)
          ids=$(jq -rs '[.[].runs[].results[]? | select(.level == "error") | .ruleId] | unique | .[]' "${sarifs[@]}")
          if ! grep -qxF "$IGNORED_VULN" <<<"$ids"; then
            echo "::error::$IGNORED_VULN is no longer reported by govulncheck; delete the stale exception (IGNORED_VULN) from security.yml"
            exit 1
          fi
          # The exception covers only traces ending in an init or a Read/Error
          # interface call. Any other terminal frame is a real call into the
          # vulnerable package and fails like any other advisory.
          bad=$(jq -rs --arg ign "$IGNORED_VULN" '[.[].runs[].results[]? | select(.level == "error" and .ruleId == $ign) | (.codeFlows // []) as $cf | if ($cf | length) == 0 then "(no trace)" else ($cf[].threadFlows[].locations[-1].location.message.text | select(test("/[^/]+\\.(init|[^./]+\\.(Read|Error))$") | not)) end] | unique | .[]' "${sarifs[@]}")
          if [ -n "$bad" ]; then
            echo "::error::$IGNORED_VULN is reached outside the accepted init and interface traces:"
            echo "$bad"
            exit 1
          fi
          n=$(jq -s --arg ign "$IGNORED_VULN" '[.[].runs[].results[]? | select(.level == "error" and .ruleId != $ign)] | length' "${sarifs[@]}")
          echo "govulncheck reachable (error-level) vulnerabilities, excluding $IGNORED_VULN: $n"
          [ "$n" -eq 0 ]

  # One leg per shipped image: the CLI image (root Dockerfile) and both images
  # built from integrations/kubernetes/Dockerfile, the operator and the
  # pacto-delivery recorder. The delivery leg uses the release build arguments,
  # GO_TAGS=kms included (the Dockerfile default), so the cloud KMS SDKs it links
  # are scanned as shipped.
  trivy-image:
    name: Trivy (image, ${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cli
            build: .
          - image: operator
            build: --file integrations/kubernetes/Dockerfile .
          - image: delivery
            build: --file integrations/kubernetes/Dockerfile --target delivery --build-arg CMD=cmd/delivery .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t local/scan:${{ github.sha }} ${{ matrix.build }}
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.72.0/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.72.0
      # Rolling cache: the unique key always saves a fresh DB, restore-keys
      # restores the most recent one so Trivy skips the full DB download.
      - name: Cache Trivy vulnerability DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.trivy-cache
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      # Trivy writes --output before applying --exit-code, so the SARIF exists
      # for the always() upload even when the scan fails on findings.
      - name: Scan image (fail on HIGH/CRITICAL)
        run: |
          trivy image \
            --cache-dir "${{ github.workspace }}/.trivy-cache" \
            --format sarif --output trivy.sarif \
            --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 \
            "local/scan:${{ github.sha }}"
      - name: Upload SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: trivy.sarif
          category: ${{ matrix.image == 'cli' && 'trivy-image' || format('trivy-image-{0}', matrix.image) }}
      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trivy-sarif-${{ matrix.image }}
          path: trivy.sarif
          if-no-files-found: ignore

  comment:
    name: PR security summary
    needs: [govulncheck, trivy-image]
    # Runs after both scans (they stay parallel); only on same-repo PRs, since a
    # fork PR's GITHUB_TOKEN is read-only and cannot comment.
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download SARIF artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: sarif
      - name: Build summary
        run: |
          gvs=(sarif/govulncheck-sarif/govulncheck*.sarif)
          {
            echo "<!-- security-scan -->"
            echo "## 🔒 Security scan"
            echo
            if [ -f "${gvs[0]}" ]; then
              n=$(jq -s --arg ign "$IGNORED_VULN" '[.[].runs[].results[]? | select(.level == "error" and .ruleId != $ign)] | length' "${gvs[@]}")
              if [ "$n" -eq 0 ]; then
                echo "- **govulncheck (Go, both modules):** ✅ no reachable vulnerabilities (accepted exception: $IGNORED_VULN)"
              else
                ids=$(jq -rs --arg ign "$IGNORED_VULN" '[.[].runs[].results[]? | select(.level == "error" and .ruleId != $ign) | .ruleId] | unique | join(", ")' "${gvs[@]}")
                echo "- **govulncheck (Go, both modules):** ❌ $n reachable — $ids"
              fi
            else
              echo "- **govulncheck (Go):** ⚠️ no report produced (job error)"
            fi
            for img in cli operator delivery; do
              tv="sarif/trivy-sarif-$img/trivy.sarif"
              if [ -f "$tv" ]; then
                tn=$(jq '[.runs[].results[]?] | length' "$tv")
                if [ "$tn" -eq 0 ]; then
                  echo "- **Trivy ($img image):** ✅ no HIGH/CRITICAL vulnerabilities"
                else
                  tids=$(jq -r '[.runs[].results[]? | .ruleId] | unique | join(", ")' "$tv")
                  echo "- **Trivy ($img image):** ❌ $tn HIGH/CRITICAL — $tids"
                fi
              else
                echo "- **Trivy ($img image):** ⚠️ no report produced (job error)"
              fi
            done
            echo
            echo "_Details: [Security tab](${{ github.server_url }}/${{ github.repository }}/security/code-scanning) · [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})._"
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upsert PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const marker = '<!-- security-scan -->';
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # Single required status for branch protection, mirroring ci.yml's `required`
  # and docs-check.yml's `docs-required`: green when both scans passed AND when
  # they were correctly skipped, red only when one actually failed. Requiring
  # `govulncheck (Go)` and each `Trivy (image, ...)` leg individually would work today but
  # silently stops covering the next scan someone adds; this aggregate picks it
  # up as soon as it joins the `needs:` list.
  #
  # `comment` is deliberately absent: it posts the PR summary, so a flaky
  # comment API call must not stand between a clean scan and a merge.
  security-required:
    if: always()
    needs:
      - govulncheck
      - trivy-image
    runs-on: ubuntu-latest
    steps:
      - name: Verify no scan failed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "leg results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "a required security scan did not pass"
              exit 1
            fi
          done
          echo "all required security scans passed"
