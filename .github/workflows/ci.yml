name: CI

# Aggregate CI for the go.work monorepo. Every leg of the release-critical
# matrix (engine, dashboard, kubernetes integration, OCI publisher, docs) runs
# here through the root Makefile so local `make ci` and this pipeline stay in
# lockstep. Path filters below only OPTIMIZE the heavy legs — the `required`
# aggregate job always runs so branch protection has one stable required check.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  # Lets the heavy nightly legs (kind e2e, release dry-run) be invoked on demand so
  # they stay exercised between scheduled runs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      kubernetes: ${{ steps.filter.outputs.kubernetes }}
      release: ${{ steps.filter.outputs.release }}
      e2e: ${{ steps.filter.outputs.e2e }}
      delivery: ${{ steps.filter.outputs.delivery }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            engine:
              # Everything outside the integrations + pure-docs trees is engine code.
              # Excluding docs/overrides skips the heavy engine leg on docs-only PRs.
              - '!(integrations|docs|overrides)/**'
              - 'go.work'
            dashboard:
              - 'pkg/dashboard/**'
              # dashboard-e2e builds the WASM demo and now smokes its engine, so
              # the fixtures and the host that serve it are inputs to this leg. A
              # demo-only PR used to skip it entirely and land untested.
              - 'examples/demo/**'
              # The payments story the demos play (examples/story).
              - 'examples/story/**'
              # The leg also builds an offline `pacto doc --format html` export and
              # audits the retained non-Fleet views on it -- that export is their
              # only host. So the exporter and its CLI wiring are inputs too.
              - 'pkg/doc/**'
              - 'internal/cli/doc.go'
            kubernetes:
              - 'integrations/kubernetes/**'
              - 'go.work'
              # The core packages the operator module compiles in, as in the e2e
              # filter: a change there alone must still run the operator's unit
              # tests, coverage gate, chart checks and envtest.
              # TestPathFiltersCoverTheOperatorImports keeps both lists whole.
              - 'pkg/probe/**'
              - 'pkg/runtimefacts/**'
              - 'pkg/capability/**'
              - 'pkg/catalog/**'
              - 'pkg/contract/**'
              - 'pkg/delivery/**'
              - 'pkg/deliveryrecord/**'
              - 'pkg/diff/**'
              - 'pkg/evidence/**'
              - 'pkg/finding/**'
              - 'pkg/fleet/**'
              - 'pkg/graph/**'
              - 'pkg/impact/**'
              - 'pkg/lock/**'
              - 'pkg/logging/**'
              - 'pkg/oci/**'
              - 'pkg/ocireferrer/**'
              - 'pkg/openapi/**'
              - 'pkg/readiness/**'
              - 'pkg/sbom/**'
              - 'pkg/schemax/**'
              - 'pkg/semver/**'
              - 'pkg/signing/**'
              - 'pkg/skills/**'
              - 'pkg/strictjson/**'
              - 'pkg/validation/**'
            release:
              - 'release/**'
              - '.github/workflows/**'
              # A changeset file affects nothing EXCEPT the release, and adding
              # one is what opens a release transaction -- so skipping the
              # release legs for it had the filter exactly backwards. A malformed
              # changeset used to surface mid-transaction on main, after the tags
              # are pushed. (The Version PR still skips these legs on purpose;
              # see the head_ref guards on release-dry-run and
              # release-version-test.)
              - '.changeset/**'
              # The demo-ref gate (tests/release) guards the demo bundles, so run the
              # artifact-drift leg when they change too.
              - 'examples/demo/**'
            # The heavy release-formal-verification legs (kind e2e + real release
            # dry-run) run for anything that can affect release execution or the
            # operator, and are skipped only for truly unrelated changes (docs-only).
            e2e:
              - 'release/**'
              - '.github/workflows/**'
              - 'integrations/kubernetes/**'
              - 'go.work'
              - 'go.mod'
              - '**/Dockerfile'
              - 'examples/demo/**'
              # The payments story the demos play (examples/story).
              - 'examples/story/**'
              # The acceptance tree holds the canonical scenario every vertical
              # projects — the kind fixture AND the distributed Compose artifact —
              # plus the shared harness. A change there changes what they prove.
              - 'tests/acceptance/**'
              # Every kind step runs through these wrappers (exit handling,
              # failure classification, diagnostics).
              - 'scripts/ci/**'
              # The runtime collector, its evaluation and its two front-ends: the
              # runtime image the kind runtime-conformance shard and the local
              # runtime acceptances run is built from them.
              - 'internal/runtimewatch/**'
              - 'pkg/runtimefacts/**'
              - 'pkg/probe/**'
              - 'internal/cli/agent.go'
              - 'internal/cli/run.go'
              # The CLI the delivery phases run: `pacto delivery`, `record verify`
              # and `pacto publish`, plus the publish code behind the last one.
              - 'internal/cli/delivery*.go'
              - 'internal/cli/publish.go'
              - 'pkg/publish/**'
              # Every core package the operator and pacto-delivery images compile
              # in (the transitive import closure of integrations/kubernetes).
              # TestPathFiltersCoverTheOperatorImports derives this list from the
              # imports and fails when a package is missing.
              - 'pkg/capability/**'
              - 'pkg/catalog/**'
              - 'pkg/contract/**'
              - 'pkg/delivery/**'
              - 'pkg/deliveryrecord/**'
              - 'pkg/diff/**'
              - 'pkg/evidence/**'
              - 'pkg/finding/**'
              - 'pkg/fleet/**'
              - 'pkg/graph/**'
              - 'pkg/impact/**'
              - 'pkg/lock/**'
              - 'pkg/logging/**'
              - 'pkg/oci/**'
              - 'pkg/ocireferrer/**'
              - 'pkg/openapi/**'
              - 'pkg/readiness/**'
              - 'pkg/sbom/**'
              - 'pkg/schemax/**'
              - 'pkg/semver/**'
              - 'pkg/signing/**'
              - 'pkg/skills/**'
              - 'pkg/strictjson/**'
              - 'pkg/validation/**'
            # The delivery demo (delivery-demo below) proves what only a live run
            # can: Argo CD applying a digest, a second cluster following the first
            # through its signed records, and the dashboard's delivery journeys
            # signed in through the real guard. It is heavy, so it runs only for
            # changes to delivery itself, to the guard or to the demo.
            delivery:
              - 'integrations/kubernetes/api/delivery/**'
              - 'integrations/kubernetes/cmd/delivery/**'
              - 'integrations/kubernetes/internal/delivery/**'
              - 'integrations/kubernetes/charts/pacto-operator/templates/delivery/**'
              - 'integrations/kubernetes/charts/pacto-operator/files/delivery-crds/**'
              - 'pkg/delivery/**'
              - 'pkg/deliveryrecord/**'
              - 'pkg/ocireferrer/**'
              - 'pkg/signing/**'
              - 'internal/authn/**'
              - 'internal/app/delivery*.go'
              - 'internal/cli/delivery*.go'
              - 'pkg/dashboard/delivery*.go'
              # The journeys drive the delivery views and the served bundle,
              # and server.go wires the approval guard they run against.
              - 'pkg/dashboard/server.go'
              - 'pkg/dashboard/frontend/src/**/*[Dd]elivery*'
              - 'pkg/dashboard/ui/**'
              - 'pkg/dashboard/frontend/e2e-live/**'
              - 'examples/story/**'
              # delivery-demo.sh sources lib.sh and delivery-identity.sh, and
              # delivery-demo.yml runs it through kind-run.sh.
              - 'tests/acceptance/kind/lib.sh'
              - 'tests/acceptance/kind/delivery-demo.sh'
              - 'tests/acceptance/kind/delivery-identity.sh'
              - 'scripts/ci/kind-run.sh'
              - 'tests/acceptance/kind/fixtures/delivery-demo/**'
              - '.github/workflows/delivery-demo.yml'

  ci-static:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ci
        with:
          target: ci-static
          golangci-lint: 'true'

  ci-engine:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ci
        with:
          target: ci-engine
      - name: Upload results to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: true

  ci-dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pkg/dashboard/frontend/package-lock.json
      - run: make ci-dashboard

  # Browser-level acceptance for the redesigned Operational Graph + Impact UI:
  # build the WASM dashboard demo and drive it in a real (headless Chromium)
  # browser with Playwright. No cluster required.
  dashboard-e2e:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the demo build's `git describe` needs tags
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pkg/dashboard/frontend/package-lock.json
      - name: Deterministic browser acceptance over the built WASM demo
        timeout-minutes: 30
        run: make test-browser
      - name: Upload browser traces
        if: failure()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dashboard-e2e-traces
          path: |
            pkg/dashboard/frontend/test-results
            pkg/dashboard/frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  ci-integration-kubernetes:
    needs: changes
    if: needs.changes.outputs.kubernetes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Install helm-docs
        # go install verifies the module checksum via GOSUMDB — no unchecksummed
        # curl | tar of a release tarball. It is also ~20 module fetches with no
        # retry of its own, so it goes through release/scripts/retry.sh.
        run: bash release/scripts/retry.sh go install github.com/norwoodj/helm-docs/cmd/helm-docs@v1.14.2
      - run: make ci-integration-kubernetes

  ci-e2e-envtest:
    needs: changes
    if: needs.changes.outputs.kubernetes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: make ci-e2e-envtest

  ci-oci:
    needs: changes
    # The changesets Version PR commits a ready release-transaction.json (by design);
    # the "committed transaction releases nothing" invariant is a feature-PR check, so
    # skip it there. Skipped != failure, so the `required` aggregate stays green.
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5001:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Install ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2
      - run: make ci-oci
        env:
          PACTO_STAGING_REGISTRY: localhost:5001

  # Operator image build with the EXACT production build-push context + file
  # (context: repo root, file: integrations/kubernetes/Dockerfile) — a dedicated
  # check so a broken production context is caught without relying on the kind
  # script. push: false.
  operator-build:
    needs: changes
    if: needs.changes.outputs.e2e == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build operator image (production context, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: integrations/kubernetes/Dockerfile
          push: false
          build-args: VERSION=ci-context-test

  # Pacto's formal verification. These are the real heavy legs — REQUIRED, and run
  # on any change that can affect release execution or the operator (the `e2e` path
  # filter), plus the nightly schedule + manual dispatch. Skipped only for truly
  # unrelated (docs-only) PRs.
  ci-e2e-kind:
    needs: changes
    if: needs.changes.outputs.e2e == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Shard the self-provisioning kind scenarios across parallel runners (each
    # spins up its own cluster) instead of running them serially in one job. The
    # `required` aggregate waits for all matrix legs, so coverage is unchanged.
    strategy:
      fail-fast: false
      matrix:
        # delivery runs in its own sharded job below (ci-e2e-kind-delivery).
        scenario: [reconcile, dashboard, upgrade, evidence, operational-graph, observation, gitops-flux, gitops-argocd, runtime-conformance]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # The operational-graph scenario drives the LIVE dashboard in Chromium via
      # Playwright, so it needs Node (the other scenarios do not).
      - if: matrix.scenario == 'operational-graph'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      # The evidence scenario's store is the OCI registry itself, so it needs an
      # INDEPENDENT OCI client: ORAS is the observer that proves a third party
      # discovers what Pacto published, and publishes evidence Pacto reads back.
      # The gitops scenarios need the same client for a different reason: they
      # publish the manifest artifact the delivery tool pulls the promotion from —
      # Flux's OCIRepository in one, Argo's OCI application source in the other.
      - if: matrix.scenario == 'evidence' || startsWith(matrix.scenario, 'gitops-')
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2
      - name: Install kind (checksum-verified via GOSUMDB)
        timeout-minutes: 5
        run: bash release/scripts/retry.sh go install sigs.k8s.io/kind@v0.30.0
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Run the scenario
        timeout-minutes: 35
        run: bash scripts/ci/kind-run.sh "$RUNNER_TEMP/diagnostics/run.log" make test-acceptance-kind-${{ matrix.scenario }}
      - name: Collect cluster diagnostics
        if: failure()
        timeout-minutes: 10
        run: bash scripts/ci/kind-diagnostics.sh "$RUNNER_TEMP/diagnostics"
      - name: Upload logs, diagnostics and browser traces
        if: failure()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kind-${{ matrix.scenario }}-diagnostics
          path: |
            ${{ runner.temp }}/diagnostics
            pkg/dashboard/frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Pacto delivery, sharded by phase. The three Pacto images are built once here
  # and every shard loads the same archive; each shard then runs its phase (plus
  # the phases it needs: identity needs core, records needs core and publish) on
  # its own small cluster, created while the shard pulls and preloads the rest.
  delivery-images:
    needs: changes
    if: needs.changes.outputs.e2e == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Only the build runs here, but delivery.sh is the one place the image names
      # live, and the tooling gate (tests/release) cannot see that this mode stops
      # before oras, cosign and helm: installing them costs seconds.
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Build the operator, dashboard and delivery images
        timeout-minutes: 25
        run: DELIVERY_SAVE_IMAGES="$RUNNER_TEMP/delivery-images.tar" bash tests/acceptance/kind/delivery.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        timeout-minutes: 10
        with:
          name: delivery-images
          path: ${{ runner.temp }}/delivery-images.tar
          compression-level: 1
          retention-days: 1
          overwrite: true

  ci-e2e-kind-delivery:
    needs: [changes, delivery-images]
    if: needs.changes.outputs.e2e == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        phase: [core, health, publish, ordering, identity, records, ladder]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # Every version a Stage promotes is published as a signed Flux artifact.
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install kind (checksum-verified via GOSUMDB)
        timeout-minutes: 5
        run: bash release/scripts/retry.sh go install sigs.k8s.io/kind@v0.30.0
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        timeout-minutes: 10
        with:
          name: delivery-images
          path: ${{ runner.temp }}/delivery-images
      - name: Run the ${{ matrix.phase }} phase
        timeout-minutes: 45
        env:
          DELIVERY_PHASES: ${{ matrix.phase }}
        run: |
          export DELIVERY_LOAD_IMAGES="$RUNNER_TEMP/delivery-images/delivery-images.tar"
          bash scripts/ci/kind-run.sh "$RUNNER_TEMP/diagnostics/run.log" make test-acceptance-kind-delivery
      - name: Collect cluster diagnostics
        if: failure()
        timeout-minutes: 10
        run: bash scripts/ci/kind-diagnostics.sh "$RUNNER_TEMP/diagnostics"
      - name: Upload logs and diagnostics
        if: failure()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kind-delivery-${{ matrix.phase }}-diagnostics
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: ignore
          retention-days: 7

  # The whole delivery demo on a pull request that changes delivery: the reach
  # phase (Argo CD applying by digest, a second cluster following the first
  # through its signed records) and the browser journeys against the real
  # sign-in guard run only here and in the nightly schedule of the same
  # workflow. The called workflow's report job needs issues: write, which only
  # its own schedule uses.
  delivery-demo:
    needs: changes
    if: needs.changes.outputs.delivery == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/delivery-demo.yml

  # The same product vertical on the OTHER surface, proved the way a stranger meets
  # it: the demo application is published to a local registry with `docker compose
  # publish` and then executed straight out of it BY DIGEST. Nothing on the
  # execution path reads the repository — not even a compose file — which is the
  # claim, so it is the test. Same `e2e` filter as the kind shards: the heavy
  # verticals run for anything that can change what they prove, plus the nightly
  # schedule + manual dispatch.
  ci-e2e-compose:
    needs: changes
    if: needs.changes.outputs.e2e == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # The demo's browser leg drives the LIVE dashboard in Chromium via Playwright.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      # A Compose that owns this artifact type. The runner's own version is not a
      # thing this repository controls, and the floor the demo declares
      # (scenario.ComposeMinVersion) is what the harness enforces against it.
      - uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.5.0
      - run: make ci-e2e-compose
      # Portable runtime evidence on this runner's kernel: the host agent over
      # labelled containers and `pacto run` in both modes (see ci.mk).
      - run: make test-acceptance-local-runtime-docker
      - run: make test-acceptance-local-runtime-run

  release-dry-run:
    needs: changes
    # Gated on `release` as well as `e2e`, because the dry run READS the pending
    # changesets: verify-standalone.sh computes the next core version from them and
    # build-release-plan.mjs turns them into the plan it rehearses. The `e2e` filter
    # has no '.changeset/**' entry on purpose — a changeset cannot affect the kind or
    # Compose legs — so gating this job on `e2e` alone made the one PR class that
    # OPENS a release transaction the one class the dry run never rehearsed (#370).
    # Skip on the changesets Version PR: its changesets are already consumed, so the
    # dry-run's "pending bump" scenarios do not apply (feature-PR / main gate only).
    if: (needs.changes.outputs.e2e == 'true' || needs.changes.outputs.release == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history + tags: verify-standalone.sh stages a local tag and resolves
        # the published core from this repo (GOWORK=off, no replace, no network).
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Install crane
        uses: ./.github/actions/setup-crane
      - name: Install ORAS
        # The dry-run drives the real durable OCI-backed ledger (ledger.sh), which
        # stores + reads the ledger as an OCI artifact via oras — exactly as the
        # production publishers do.
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2
      # The dry run rehearses the demo-compose unit, which Docker Compose publishes.
      - uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.5.0
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Install syft
        # build-cli.sh SKIPS the SBOM when syft is absent, so without this the
        # dry run rehearses a release the real one does not perform.
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - run: make release-dry-run

  # The demo bundles are published to IMMUTABLE tags. Editing a fixture under a
  # version that is already published makes that tag unpublishable, and until now
  # the only thing that noticed was the release itself — mid-flight, after
  # irreversible units had shipped (run 32560058692). This runs the identical
  # byte-exact gate at PR time, READ-ONLY: it computes each bundle's deterministic
  # OCI digest locally and compares it to the published one. It never pushes, and
  # it names no coordinate — the script owns that.
  demo-bundle-immutability:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install crane (the byte-exact comparison IS crane)
        uses: ./.github/actions/setup-crane
      - name: Log in to GHCR (read-only, for the published-digest lookup)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check demo bundles against their published digests
        run: |
          # 75 is EX_TEMPFAIL: the registry could not be read, so the check proved
          # nothing. That is not a conflict and must not block a PR on someone
          # else's outage — but it must not read as a pass either, hence the warning.
          rc=0
          release/scripts/publish-demo-bundles.sh --check || rc=$?
          case "$rc" in
            0) ;;
            75) echo "::warning::the demo-bundle immutability check could not read the registry — it compared nothing this run, which is not evidence that there is no conflict" ;;
            *) exit "$rc" ;;
          esac

  # Cross-cutting architecture + release gates (tests/architecture + tests/release).
  # These live under /tests/ which the ci-engine coverage run EXCLUDES, so without
  # this leg the import-boundary, one-publisher and demo-ref gates never run in CI.
  # No path filter: it ALWAYS runs so a gate can never be silently skipped-green.
  ci-gates:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: make ci-gates

  artifact-drift:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: make artifact-drift
      # On a Version PR, the core checksum in the operator's go.sum has to describe
      # the tree the squash merge will tag. This checkout is the merge ref, so a
      # main that moved under the PR fails here instead of at release time.
      - name: Operator go.sum matches the core tree to be tagged
        run: bash release/orchestrator/verify-core-gosum.sh

  # Integration test for the version command: real `npm run release:version` in a
  # throwaway clone with pending changesets -> ready transaction detect.mjs acts on.
  release-version-test:
    needs: changes
    # Skip on the changesets Version PR (committed txn is ready there, by design); the
    # feature-PR "committed txn not ready" invariant this asserts does not apply.
    if: needs.changes.outputs.release == 'true' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: make ci-release-version

  # Single required status for branch protection: green only when every leg that
  # ran succeeded. Skipped (path-filtered) legs do not count as failures.
  required:
    if: always()
    needs:
      - changes
      - ci-static
      - ci-gates
      - ci-engine
      - ci-dashboard
      - ci-integration-kubernetes
      - ci-e2e-envtest
      - ci-oci
      - artifact-drift
      - operator-build
      - ci-e2e-kind
      - delivery-images
      - ci-e2e-kind-delivery
      - delivery-demo
      - ci-e2e-compose
      - release-dry-run
      - release-version-test
      - demo-bundle-immutability
      # dashboard-e2e was the one leg nothing aggregated, so it could go red on a
      # PR and still report mergeable. It carries the browser acceptance suite and
      # now the demo engine smoke, which is the check whose absence let a fixture
      # rename turn main red.
      - dashboard-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify no required leg failed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "leg results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "a required CI leg did not pass"
              exit 1
            fi
          done
          echo "all required CI legs passed"
