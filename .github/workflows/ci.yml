name: CI

# Aggregate CI for the go.work monorepo. Every leg of the release-critical
# matrix (engine, dashboard, kubernetes integration, OCI publisher, docs) runs
# here through the root Makefile so local `make ci` and this pipeline stay in
# lockstep. Path filters below only OPTIMIZE the heavy legs — the `required`
# aggregate job always runs so branch protection has one stable required check.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  # Lets the heavy nightly legs (kind e2e, release dry-run) be invoked on demand so
  # they stay exercised between scheduled runs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      kubernetes: ${{ steps.filter.outputs.kubernetes }}
      release: ${{ steps.filter.outputs.release }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            engine:
              # Everything outside the integrations + pure-docs trees is engine code.
              # Excluding docs/overrides skips the heavy engine leg on docs-only PRs.
              - '!(integrations|docs|overrides)/**'
              - 'go.work'
            dashboard:
              - 'pkg/dashboard/**'
            kubernetes:
              - 'integrations/kubernetes/**'
              - 'go.work'
            release:
              - 'release/**'
              - '.github/workflows/**'
              # The demo-ref gate (tests/release) guards the demo bundles, so run the
              # artifact-drift leg when they change too.
              - 'examples/demo/**'
            # The heavy release-formal-verification legs (kind e2e + real release
            # dry-run) run for anything that can affect release execution or the
            # operator, and are skipped only for truly unrelated changes (docs-only).
            e2e:
              - 'release/**'
              - '.github/workflows/**'
              - 'integrations/kubernetes/**'
              - 'go.work'
              - 'go.mod'
              - '**/Dockerfile'
              - 'examples/demo/**'
              # The acceptance tree holds the canonical scenario every vertical
              # projects — the kind fixture AND the distributed Compose artifact —
              # plus the shared harness. A change there changes what they prove.
              - 'tests/acceptance/**'

  ci-static:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ci
        with:
          target: ci-static
          golangci-lint: 'true'

  ci-engine:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ci
        with:
          target: ci-engine
      - name: Upload results to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: true

  ci-dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pkg/dashboard/frontend/package-lock.json
      - run: make ci-dashboard

  # Browser-level acceptance for the redesigned Operational Graph + Impact UI:
  # build the WASM dashboard demo and drive it in a real (headless Chromium)
  # browser with Playwright. No cluster required.
  dashboard-e2e:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the demo build's `git describe` needs tags
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pkg/dashboard/frontend/package-lock.json
      - name: Deterministic browser acceptance over the built WASM demo
        run: make test-browser

  ci-integration-kubernetes:
    needs: changes
    if: needs.changes.outputs.kubernetes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Install helm-docs
        # go install verifies the module checksum via GOSUMDB — no unchecksummed
        # curl | tar of a release tarball.
        run: go install github.com/norwoodj/helm-docs/cmd/helm-docs@v1.14.2
      - run: make ci-integration-kubernetes

  ci-e2e-envtest:
    needs: changes
    if: needs.changes.outputs.kubernetes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: make ci-e2e-envtest

  ci-oci:
    needs: changes
    # The changesets Version PR commits a ready release-transaction.json (by design);
    # the "committed transaction releases nothing" invariant is a feature-PR check, so
    # skip it there. Skipped != failure, so the `required` aggregate stays green.
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5001:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2
      - run: make ci-oci
        env:
          PACTO_STAGING_REGISTRY: localhost:5001

  # Operator image build with the EXACT production build-push context + file
  # (context: repo root, file: integrations/kubernetes/Dockerfile) — a dedicated
  # check so a broken production context is caught without relying on the kind
  # script. push: false.
  operator-build:
    needs: changes
    if: needs.changes.outputs.e2e == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build operator image (production context, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: integrations/kubernetes/Dockerfile
          push: false
          build-args: VERSION=ci-context-test

  # Pacto's formal verification. These are the real heavy legs — REQUIRED, and run
  # on any change that can affect release execution or the operator (the `e2e` path
  # filter), plus the nightly schedule + manual dispatch. Skipped only for truly
  # unrelated (docs-only) PRs.
  ci-e2e-kind:
    needs: changes
    if: needs.changes.outputs.e2e == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Shard the three self-provisioning kind scenarios across parallel runners (each
    # spins up its own cluster) instead of running them serially in one job. The
    # `required` aggregate waits for all matrix legs, so coverage is unchanged.
    strategy:
      fail-fast: false
      matrix:
        scenario: [reconcile, dashboard, upgrade, evidence, operational-graph, observation]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # The operational-graph scenario drives the LIVE dashboard in Chromium via
      # Playwright, so it needs Node (the other scenarios do not).
      - if: matrix.scenario == 'operational-graph'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      # The evidence scenario's store is the OCI registry itself, so it needs an
      # INDEPENDENT OCI client: ORAS is the observer that proves a third party
      # discovers what Pacto published, and publishes evidence Pacto reads back.
      - if: matrix.scenario == 'evidence'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2
      - name: Install kind (checksum-verified via GOSUMDB)
        run: go install sigs.k8s.io/kind@v0.30.0
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - run: make test-acceptance-kind-${{ matrix.scenario }}

  # The same product vertical on the OTHER surface, proved the way a stranger meets
  # it: the demo application is published to a local registry with `docker compose
  # publish` and then executed straight out of it BY DIGEST. Nothing on the
  # execution path reads the repository — not even a compose file — which is the
  # claim, so it is the test. Same `e2e` filter as the kind shards: the heavy
  # verticals run for anything that can change what they prove, plus the nightly
  # schedule + manual dispatch.
  ci-e2e-compose:
    needs: changes
    if: needs.changes.outputs.e2e == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # The demo's browser leg drives the LIVE dashboard in Chromium via Playwright.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      # A Compose that owns this artifact type. The runner's own version is not a
      # thing this repository controls, and the floor the demo declares
      # (scenario.ComposeMinVersion) is what the harness enforces against it.
      - uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2.3.0
        with:
          version: v5.5.0
      - run: make ci-e2e-compose

  release-dry-run:
    needs: changes
    # Skip on the changesets Version PR: its changesets are already consumed, so the
    # dry-run's "pending bump" scenarios do not apply (feature-PR / main gate only).
    if: (needs.changes.outputs.e2e == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history + tags: verify-standalone.sh stages a local tag and resolves
        # the published core from this repo (GOWORK=off, no replace, no network).
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Install crane (checksum-verified via GOSUMDB)
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.20.2
      - name: Install ORAS
        # The dry-run drives the real durable OCI-backed ledger (ledger.sh), which
        # stores + reads the ledger as an OCI artifact via oras — exactly as the
        # production publishers do.
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2
      # The dry run rehearses the demo-compose unit, which Docker Compose publishes.
      - uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2.3.0
        with:
          version: v5.5.0
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - run: make release-dry-run

  # Cross-cutting architecture + release gates (tests/architecture + tests/release).
  # These live under /tests/ which the ci-engine coverage run EXCLUDES, so without
  # this leg the import-boundary, one-publisher and demo-ref gates never run in CI.
  # No path filter: it ALWAYS runs so a gate can never be silently skipped-green.
  ci-gates:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: make ci-gates

  artifact-drift:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: make artifact-drift

  # Integration test for the version command: real `npm run release:version` in a
  # throwaway clone with pending changesets -> ready transaction detect.mjs acts on.
  release-version-test:
    needs: changes
    # Skip on the changesets Version PR (committed txn is ready there, by design); the
    # feature-PR "committed txn not ready" invariant this asserts does not apply.
    if: needs.changes.outputs.release == 'true' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: make ci-release-version

  # Single required status for branch protection: green only when every leg that
  # ran succeeded. Skipped (path-filtered) legs do not count as failures.
  required:
    if: always()
    needs:
      - changes
      - ci-static
      - ci-gates
      - ci-engine
      - ci-dashboard
      - ci-integration-kubernetes
      - ci-e2e-envtest
      - ci-oci
      - artifact-drift
      - operator-build
      - ci-e2e-kind
      - ci-e2e-compose
      - release-dry-run
      - release-version-test
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required leg failed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "leg results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "a required CI leg did not pass"
              exit 1
            fi
          done
          echo "all required CI legs passed"
