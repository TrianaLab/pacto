name: Docs (validate)

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      # Integration docs are assembled into this site by the mkdocs hook, so a
      # change to an integration's docs (authored or generated) must redeploy.
      - 'integrations/**/docs/**'
      - 'integrations/**/integration.yaml'
      - 'release/scripts/mkdocs_integration_hook.py'
      # `make docs-deploy` regenerates the integration + CLI docs from these
      # cross-module sources before mike publishes, so a change to any of them must
      # redeploy the site (same inputs docs-check guards on PRs).
      - 'release/scripts/gen_integration_docs.py'
      # The site stages its own Mermaid runtime from the frontend's locked
      # dependency, and the hook fails the build when it is missing. The hook, the
      # lockfile that pins the bytes and the Make wiring that installs them are all
      # inputs to whether this validation can build the site at all.
      - 'release/scripts/mkdocs_mermaid_hook.py'
      - 'pkg/dashboard/frontend/package.json'
      - 'pkg/dashboard/frontend/package-lock.json'
      - 'Makefile'
      - 'ci.mk'
      - 'integrations/**/api/**'
      - 'integrations/**/config/crd/**'
      - 'integrations/**/config/rbac/**'
      - 'integrations/**/charts/**'
      - 'integrations/**/cmd/**'
      - 'integrations/**/internal/observer/**'
      - 'pkg/evidence/**'
      - 'pkg/finding/**'
      - 'examples/demo/**'
      # The demo embeds the dashboard UI + engine, so redeploy when they change.
      - 'pkg/dashboard/**'
      - '.github/workflows/docs.yml'
  # The versioned public site is deployed ONLY by the release transaction
  # (release.yml, unit k8s-docs), which owns the exact core + k8s versions and the
  # `latest` alias. This workflow does NOT deploy: on a doc-only change to main it
  # just runs a strict build to validate the docs (a post-merge safety net on top
  # of the PR docs-check). It no longer publishes an unreleased `next` snapshot.
  workflow_dispatch:

# Validation only — no deploy — so read access is enough.
permissions:
  contents: read

jobs:
  # Non-release doc refresh. The release UNIT k8s-docs (the versioned site deploy
  # with the exact release versions) is published by the release transaction
  # (.github/workflows/release.yml, the docs job) — this is NOT that publisher. This
  # job only redeploys the current version's docs on a doc-only change to main, or a
  # manual run. mike publishes to gh-pages; GitHub Pages must serve from that branch.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history + tags so the demo build's `git describe` resolves the real
        # Pacto version to bake into the dashboard navbar, and so mike has the
        # gh-pages history it appends each versioned deploy to.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pkg/dashboard/frontend/package-lock.json
      - name: Build the WASM dashboard demo
        run: make -C examples/demo build
      - name: Smoke test the wasm engine
        run: make -C examples/demo smoke
      # Fold the demo into the docs tree so mike's internal `mkdocs build` copies it
      # into every versioned deploy at /demo/.
      - name: Fold the demo into the docs site
        run: |
          mkdir -p docs/demo
          cp -r examples/demo/dist/. docs/demo/
      # Strict gate: mike's internal build is not --strict, so run the same strict
      # build the PR "Docs check" enforces, against a throwaway dir. This is a
      # main-push validation net; it does NOT deploy.
      #
      # Through `make`, never `mkdocs` directly: the site stages its own pinned
      # Mermaid runtime and the hook fails closed without it, so on a clean runner a
      # bare `mkdocs build --strict` aborts before building. docs-build-strict owns
      # that prerequisite, which keeps the install expressed once in Make rather
      # than duplicated into this job.
      #
      # The versioned public site is deployed only by the release transaction
      # (release.yml, unit k8s-docs). We intentionally do NOT publish an
      # unreleased `next` snapshot: it cluttered the public version selector (and
      # was the fallback the selector landed on). Preview unreleased docs locally
      # with `make docs` / `mkdocs serve`.
      - name: Strict docs build gate
        run: make docs-build-strict
