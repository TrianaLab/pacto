name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'examples/demo/**'
      # The demo embeds the dashboard UI + engine, so redeploy when they change.
      - 'pkg/dashboard/**'
      - '.github/workflows/docs.yml'
  # Redeploy on every published release. The demo bakes in the Pacto version via
  # `git describe` at build time; the release tag is created moments AFTER the
  # merge-to-main push that triggered the path-filtered build above, so that
  # build still saw the previous tag. This re-runs once the new tag exists.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        # Full history + tags so the demo build's `git describe` resolves the
        # real Pacto version to bake into the dashboard (shown in the navbar).
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build
      # Build the in-browser (WebAssembly) dashboard demo and fold it into the
      # same Pages artifact at /pacto/demo/ (two Pages deploys in one repo
      # conflict; one upload below publishes both docs and demo).
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build the WASM dashboard demo
        run: make -C examples/demo build BASE=/pacto/demo/
      - name: Smoke test the wasm engine
        run: make -C examples/demo smoke
      - name: Fold the demo into the docs site
        run: |
          mkdir -p site/demo
          cp -r examples/demo/dist/. site/demo/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
