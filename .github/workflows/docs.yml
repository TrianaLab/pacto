name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      # Integration docs are assembled into this site by the mkdocs hook, so a
      # change to an integration's docs (authored or generated) must redeploy.
      - 'integrations/**/docs/**'
      - 'integrations/**/integration.yaml'
      - 'release/scripts/mkdocs_integration_hook.py'
      # `make docs-deploy` regenerates the integration + CLI docs from these
      # cross-module sources before mike publishes, so a change to any of them must
      # redeploy the site (same inputs docs-check guards on PRs).
      - 'release/scripts/gen_integration_docs.py'
      - 'integrations/**/api/**'
      - 'integrations/**/config/crd/**'
      - 'integrations/**/config/rbac/**'
      - 'integrations/**/charts/**'
      - 'integrations/**/cmd/**'
      - 'integrations/**/internal/observer/**'
      - 'pkg/evidence/**'
      - 'pkg/finding/**'
      - 'release/release-manifest.json'
      - 'examples/demo/**'
      # The demo embeds the dashboard UI + engine, so redeploy when they change.
      - 'pkg/dashboard/**'
      - '.github/workflows/docs.yml'
  # Release-time docs are deployed by the release transaction (release.yml, unit
  # k8s-docs), which owns the versioned site deploy with the exact core + k8s
  # versions. This workflow only redeploys the CURRENT version's docs on a
  # doc-only change to main (no release), plus manual runs. It no longer
  # self-triggers on release/workflow_run (that was a duplicate deploy that read
  # the "latest release" and raced the release job).
  workflow_dispatch:

# mike commits the built site to the gh-pages branch and pushes it, so the deploy
# needs write access to repository contents (not the Pages upload API).
permissions:
  contents: write

# Serialize deploys: two concurrent `mike deploy --push` runs would race on the
# gh-pages branch.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  # Non-release doc refresh. The release UNIT k8s-docs (the versioned site deploy
  # with the exact release versions) is published by the release transaction
  # (.github/workflows/release.yml, the docs job) — this is NOT that publisher. This
  # job only redeploys the current version's docs on a doc-only change to main, or a
  # manual run. mike publishes to gh-pages; GitHub Pages must serve from that branch.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        # Full history + tags so the demo build's `git describe` resolves the real
        # Pacto version to bake into the dashboard navbar, and so mike has the
        # gh-pages history it appends each versioned deploy to.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build the WASM dashboard demo
        run: make -C examples/demo build
      - name: Smoke test the wasm engine
        run: make -C examples/demo smoke
      # Fold the demo into the docs tree so mike's internal `mkdocs build` copies it
      # into every versioned deploy at /demo/.
      - name: Fold the demo into the docs site
        run: |
          mkdir -p docs/demo
          cp -r examples/demo/dist/. docs/demo/
      # Strict gate before publishing: mike's internal build is not --strict, so run
      # the same strict build the PR "Docs check" enforces against a throwaway dir.
      - name: Strict docs build gate
        run: mkdocs build --strict --site-dir "$(mktemp -d)"
      # Publish the versioned site to gh-pages: mike deploy --push the core version
      # + the `latest` alias, so the Material version selector has data.
      - name: Deploy versioned docs with mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          make docs-deploy
