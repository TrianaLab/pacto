name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      # Integration docs are assembled into this site by the mkdocs hook, so a
      # change to an integration's docs (authored or generated) must redeploy.
      - 'integrations/**/docs/**'
      - 'integrations/**/integration.yaml'
      - 'release/scripts/mkdocs_integration_hook.py'
      - 'examples/demo/**'
      # The demo embeds the dashboard UI + engine, so redeploy when they change.
      - 'pkg/dashboard/**'
      - '.github/workflows/docs.yml'
  # The demo bakes in the Pacto version via `git describe` at build time. The
  # merge-to-main push above runs ~seconds BEFORE the Release workflow creates the
  # tag, so it bakes the PREVIOUS version. We must redeploy once the new tag exists.
  #
  # The Release workflow creates the GitHub release with the default GITHUB_TOKEN,
  # and GitHub does NOT fire the `release` event for token-created releases (anti-
  # recursion) — so an `on: release` trigger never runs for our automated tags.
  # Instead, redeploy when the "Release" workflow itself COMPLETES: by then the tag
  # exists and `git describe` resolves it. `workflow_run` is not subject to the
  # token restriction.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  # Still covers releases published manually by a human (those DO fire `release`).
  release:
    types: [published]
  workflow_dispatch:

# mike commits the built site to the gh-pages branch and pushes it, so the deploy
# needs write access to repository contents (not the Pages upload API).
permissions:
  contents: write

# Serialize deploys: two concurrent `mike deploy --push` runs would race on the
# gh-pages branch.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  # pacto-publishes: k8s-docs
  # Canonical publisher for the k8s-docs release unit. The Kubernetes integration
  # docs are assembled into this one site by mkdocs_integration_hook.py, so the
  # site deploy IS where they are published — there is no separate k8s docs site.
  # The versioned site is published to the gh-pages branch by mike; GitHub Pages
  # must serve from that branch (Settings > Pages > "Deploy from a branch:
  # gh-pages / (root)"). mike creates gh-pages on its first run.
  deploy:
    runs-on: ubuntu-latest
    # On the workflow_run trigger, only deploy when the Release workflow actually
    # succeeded (skip cancelled/failed release runs). All other triggers proceed.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v7.0.0
        # Full history + tags so the demo build's `git describe` resolves the real
        # Pacto version to bake into the dashboard navbar, and so mike has the
        # gh-pages history it appends each versioned deploy to.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build the WASM dashboard demo
        run: make -C examples/demo build
      - name: Smoke test the wasm engine
        run: make -C examples/demo smoke
      # Guardrail: on a release-driven deploy the baked navbar version MUST match
      # the latest published release. If it doesn't (e.g. `git describe` resolved
      # a stale tag), fail loudly instead of silently shipping the wrong version.
      # Skipped on plain `push`/`workflow_dispatch`, where the build may
      # intentionally predate the tag.
      - name: Guardrail — baked demo version matches the latest release
        if: ${{ github.event_name == 'workflow_run' || github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          baked="$(jq -r .version examples/demo/dist/version.json)"
          latest="$(gh release view --json tagName -q .tagName)"
          echo "baked navbar version: '$baked' · latest release: '$latest'"
          if [ "${baked#v}" != "${latest#v}" ]; then
            echo "::error::Demo navbar version '$baked' != latest release '$latest' — stale demo deploy."
            exit 1
          fi
      # Fold the demo into the docs tree so mike's internal `mkdocs build` copies it
      # into every versioned deploy at /demo/.
      - name: Fold the demo into the docs site
        run: |
          mkdir -p docs/demo
          cp -r examples/demo/dist/. docs/demo/
      # Strict gate before publishing: mike's internal build is not --strict, so run
      # the same strict build the PR "Docs check" enforces against a throwaway dir.
      - name: Strict docs build gate
        run: mkdocs build --strict --site-dir "$(mktemp -d)"
      # Publish the versioned site to gh-pages: mike deploy --push the core version
      # + the `latest` alias, so the Material version selector has data.
      - name: Deploy versioned docs with mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          make docs-deploy
