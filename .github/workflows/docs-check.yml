name: Docs check

# Fail a PR when the documentation site has problems: Markdown/mkdocs build
# errors, broken internal links or anchors, or pages missing from the nav.
# `--strict` turns the validation configured in mkdocs.yml (nav.omitted_files,
# links.anchors, links.not_found) into hard errors.
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'overrides/**'
      - 'MANIFEST.md'
      - '.github/workflows/docs-check.yml'

permissions:
  contents: read

jobs:
  strict-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - name: Build docs (strict — fails on broken links, anchors, or orphan pages)
        run: mkdocs build --strict
