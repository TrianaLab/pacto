# One test per Go package of the root module, written by `aval gen go
# --go-cover -f aval.go.yaml` (CI checks it with --check). Each test is the
# package's go test plus a 100% coverage gate of that package, scoped to the
# package and the packages it imports. Hand-written below: what every
# package test shares, and the files some tests read outside their package.
apiVersion: aval.trianalab.io/v1
kind: TestSet
defaults:
  scope:
    # The Go workspace: minimum version selection spans both modules.
    dependencies: [go.work, go.work.sum, go.mod, go.sum, integrations/kubernetes/go.mod, integrations/kubernetes/go.sum]
    # Files tests read outside their package, which no import names.
    source:
      # pkg/contract: every pacto.yaml and testdata .yaml of the repository,
      # the schema and the contract reference.
      - "**/pacto.yaml"
      - "**/*testdata*/**/*.yaml"
      - "pkg/validation/schema/**"
      - "docs/contract-reference/**"
      # internal/cli, internal/runtimewatch: the CRDs.
      - "integrations/kubernetes/config/crd/bases/**"
      # pkg/dashboard, pkg/diff, pkg/fleet: demo bundles and the dashboard demo.
      - "examples/demo/bundles/**"
      - "examples/demo/pacto-dashboard/**"
      # pkg/validation: the files field-coverage.yaml names.
      - "integrations/kubernetes/**/*_test.go"
      - "internal/app/validate*_test.go"
      - "internal/cli/run_internal_test.go"
      - "internal/runtimewatch/evalsink/sink_test.go"
      - "pkg/contract/*_test.go"
      - "pkg/delivery/eval_test.go"
      - "pkg/diff/*_test.go"
      - "pkg/graph/resolver_test.go"
      - "pkg/readiness/readiness_test.go"
      - "tests/integration/field_coverage_test.go"
      - "tests/acceptance/kind/runtime-conformance.sh"
      - "tests/acceptance/local/runtime-*.sh"
    allowMutable:
      - {file: internal/pactify/testdata/fraud/Dockerfile, ref: python:3.13-alpine, reason: fixture text; nothing builds it}
      - {file: internal/pactify/testdata/invoices/Dockerfile, ref: node:22-alpine, reason: fixture text; nothing builds it}
      - {file: internal/pactify/testdata/fraud/k8s/deployment.yaml, ref: registry.example/story/images/fraud:1.0.0, reason: fixture text; nothing pulls it}
      - {file: internal/pactify/testdata/invoices/k8s/deployment.yaml, ref: ghcr.io/acme/invoices:1.3.0, reason: fixture text; nothing pulls it}
      - {file: tests/acceptance/kind/runtime-conformance.sh, ref: "$", reason: read as text by a field-coverage test; not run here}
      - {file: tests/acceptance/local/runtime-docker.sh, ref: "${args[@]+${args[@]}}", reason: read as text by a field-coverage test; not run here}
      - {file: tests/acceptance/local/runtime-run.sh, ref: "${mode[@]}", reason: read as text by a field-coverage test; not run here}
    # Symlinks are never inputs: npm ci's node_modules and two kind fixture links.
    exclude:
      - "**/node_modules/**"
      - "tests/acceptance/kind/fixtures/delivery-demo/audit-policy.yaml"
      - "tests/acceptance/kind/fixtures/delivery-demo/pacto-realm.json"
  environment:
    toolchain: {platform: "Linux x86_64", go: "1.27.4"}
    probe: {platform: [uname, -sm], go: [go, env, GOVERSION]}
    # GOFLAGS carries -race in CI. viper reads PACTO_<key> for every key; the
    # CLI reads its config dir outside the tree.
    env: [GOFLAGS, GOEXPERIMENT, CGO_ENABLED, GOOS, GOARCH, GOWORK, GODEBUG, "PACTO_*", NO_COLOR]
    paths: ["~/.config/pacto", "${XDG_CONFIG_HOME}/pacto"]
  cacheability: hermetic
