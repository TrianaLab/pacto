environment:
  toolchain:
    platform: "Linux x86_64"
    go: "1.27.3"
    node: "22.23.4"
  probe:
    platform: ["uname", "-sm"]
    go: ["go", "env", "GOVERSION"]
    node: ["node", "--version"]
  env: [GOFLAGS, GOEXPERIMENT, CGO_ENABLED, GOOS, GOARCH, GOTOOLCHAIN, GOWORK, GODEBUG, PW_PORT, PW_DOC_PORT, BASE, DIST, DOC_DIST, DOC_BUNDLE, VERSION]
cacheability: controlled-environment
