# Level 3: the rules about the repository itself (tests/architecture) and the
# release-verification gates (tests/release). They read every tracked file (git
# ls-files scans, workflow parsing, make -n, the dead-code walk), so the scope is
# the whole tree, listed by top-level directory: a glob over the frontend's
# node_modules or the operator's bin/ would reach symlinks aval refuses. The one
# test that asks sum.golang.org runs in aval.gates-sumdb.yaml. They also run
# git, make, python3 with PyYAML and jq from the runner image. .git is excluded
# by name: in a linked worktree it is a file aval would otherwise hash.
apiVersion: aval.trianalab.io/v1
kind: Test
metadata:
  name: pacto-gates
runner:
  command: ["go", "test", "./tests/architecture/...", "./tests/release/...", "-skip", "^TestOperatorGoSumMatchesThePublishedCoreModule$"]
