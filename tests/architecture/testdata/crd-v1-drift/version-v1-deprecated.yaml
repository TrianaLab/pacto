# A CRD whose v1 storage version is marked deprecated: compareVersions must name it.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.pacto.trianalab.io
spec:
  group: pacto.trianalab.io
  versions:
  - name: v1
    served: true
    storage: true
    deprecated: true
    schema:
      openAPIV3Schema:
        type: object
  - name: v1alpha1
    served: true
    storage: false
    deprecated: true
    deprecationWarning: pacto.trianalab.io/v1alpha1 is deprecated; use v1 (removed in chart 8.0)
    schema:
      openAPIV3Schema:
        type: object
