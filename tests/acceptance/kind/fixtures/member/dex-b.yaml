# Dex for the member-review kind e2e: issuer B, an identity provider the
# member's apiserver does not trust, so its people are read there only under a
# group mapping. Tokens live at most 1h: a hub forwards nothing longer-lived.
issuer: https://pacto-e2e-dex-b:5557/dex
storage: {type: memory}
web:
  https: 0.0.0.0:5557
  tlsCert: /etc/dex/tls.crt
  tlsKey: /etc/dex/tls.key
oauth2:
  skipApprovalScreen: true
  # The scenario takes tokens with the password grant: no browser.
  passwordConnector: local
expiry:
  idTokens: 1h
enablePasswordDB: true
# Every password is "password".
staticPasswords:
- {email: bob@example.com, username: bob, userID: u-bob, groups: [ops-b],
   hash: "$2y$10$DAEyVa6nk/7.uhSBPKKcXeA7F2VBczegxEUeWj71vOQuwNmXD/61G"}
- {email: carol@example.com, username: carol, userID: u-carol, groups: [ops-b],
   hash: "$2y$10$DAEyVa6nk/7.uhSBPKKcXeA7F2VBczegxEUeWj71vOQuwNmXD/61G"}
staticClients:
- id: pacto-dashboard
  secret: dashboard-secret
  name: Pacto hub dashboard
  redirectURIs: [https://hub.pacto-member.test/auth/callback]
