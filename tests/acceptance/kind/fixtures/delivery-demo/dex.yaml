# Dex for the Kubernetes delivery demo: the story's people sign in to the
# dashboard here. alice is on team payments and is never asked; carol is on team
# orders and is the one asked; pay-agent signs in like a person, but its group
# makes it an agent. Keycloak (pacto-realm.json, shared with the delivery run)
# serves agents over remote MCP.
issuer: https://127.0.0.1:5556/dex
storage: {type: memory}
web:
  https: 0.0.0.0:5556
  tlsCert: /etc/dex/tls.crt
  tlsKey: /etc/dex/tls.key
oauth2:
  skipApprovalScreen: true
  responseTypes: [code]
expiry:
  idTokens: 12h
sessions:
  absoluteLifetime: 24h
  validIfNotUsedFor: 12h
enablePasswordDB: true
# Every password is "password".
staticPasswords:
- {email: alice@example.com, username: alice, userID: u-alice, groups: [team-payments],
   hash: "$2y$10$DAEyVa6nk/7.uhSBPKKcXeA7F2VBczegxEUeWj71vOQuwNmXD/61G"}
- {email: carol@example.com, username: carol, userID: u-carol, groups: [team-orders],
   hash: "$2y$10$DAEyVa6nk/7.uhSBPKKcXeA7F2VBczegxEUeWj71vOQuwNmXD/61G"}
- {email: pay-agent@example.com, username: pay-agent, userID: u-pay-agent, groups: [team-payments, "pacto:agents"],
   hash: "$2y$10$DAEyVa6nk/7.uhSBPKKcXeA7F2VBczegxEUeWj71vOQuwNmXD/61G"}
staticClients:
- id: pacto-dashboard
  secret: dashboard-secret
  name: Pacto dashboard
  redirectURIs: [http://127.0.0.1:3300/auth/callback]
# The CLI client trusts the dashboard, so the dashboard can ask for a token
# naming both: Dex sets azp only on a token with more than one audience.
- id: pacto-cli
  name: Pacto CLI
  public: true
  trustedPeers: [pacto-dashboard]
  redirectURIs: [http://127.0.0.1:8000]
