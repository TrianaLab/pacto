# checkout ships a Kustomize tree through Flux: the deployer account, the
# OCIRepository Pacto moves and a Kustomization with no spec.patches,
# spec.postBuild or spec.components, so the manifest inspector reads exactly
# what the artifact's own kustomization lists. Copied once from
# `pacto init --delivery` (2026-11-22), never generated at run time.
# The account Flux applies each version of checkout as, in checkout. Widen the Role in
# git if your manifests need more; never give it cluster-wide rights or
# the delivery, Flux or RBAC groups.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkout-deployer
  namespace: checkout
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: checkout-deployer
  namespace: checkout
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets, services, serviceaccounts, persistentvolumeclaims]
    verbs: ["*"]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: ["*"]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: ["*"]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: ["*"]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: ["*"]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: ["*"]
  - apiGroups: [pacto.trianalab.io]
    resources: [pactos]
    verbs: ["*"]
  # Flux checks a rollout's health as this account, reading its ReplicaSets and Pods.
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: checkout-deployer
  namespace: checkout
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: checkout-deployer
subjects:
  - kind: ServiceAccount
    name: checkout-deployer
---
# The version that runs. Nothing runs yet, so the tag names no version and
# Flux applies nothing until the first promote writes a digest here.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: checkout
  namespace: checkout
  labels:
    delivery.pacto.trianalab.io/apply-ref: checkout
spec:
  interval: 1m
  url: oci://pacto-registry.pacto-system.svc.cluster.local:5000/apps/checkout
  insecure: true
  ref:
    tag: unreleased
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: checkout
  namespace: checkout
spec:
  interval: 10m
  sourceRef:
    kind: OCIRepository
    name: checkout
  path: ./
  prune: true
  targetNamespace: checkout
  # Flux applies each version as this account, never as itself: a version
  # can then change only what the deployer Role above allows, in this
  # namespace. An auto level judges the contract, not the manifests.
  serviceAccountName: checkout-deployer
  # Ready only once what it applied is rolled out, so the Stage judges the new pods.
  wait: true
  timeout: 2m
