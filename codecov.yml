coverage:
  status:
    project:
      default:
        target: 100%
        threshold: 0%
    patch:
      default:
        target: 100%
        threshold: 0%

ignore:
  - "tests/**"
  - "cmd/gendocs/**"
  - "internal/testutil/**"
  # Kernel-touching (loads the eBPF program): covered by `make test-ebpf` and the
  # kind e2e shards, mirroring the operator's cmd/ exclusion.
  - "internal/runtimewatch/ebpf/**"

# Go coverage emits "0 0" for empty select/case branches (no executable
# statements). go tool cover treats these as 100% but Codecov misreads
# them as uncovered. This flag fixes the discrepancy.
parsers:
  go:
    partials_as_hits: true
