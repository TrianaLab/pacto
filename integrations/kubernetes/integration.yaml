# Pacto first-party integration manifest.
# Canonical, machine-readable descriptor consumed by docs discovery, CI discovery,
# release-unit validation, the artifact inventory and compatibility tables.
# Schema: release/schemas/integration.schema.json
id: kubernetes
displayName: Kubernetes
maintainers:
  - team: platform-eng
    contact: pacto-maintainers@trianalab.example
sourceModules:
  - path: integrations/kubernetes
    module: github.com/trianalab/pacto/integrations/kubernetes/v5
documentation:
  source: integrations/kubernetes/docs
  generateCommand: make -C integrations/kubernetes docs-generate
role:
  producesEvidence: true      # the collector translates Kubernetes runtime -> Evidence
  consumesFindings: true      # the operator writes Findings + coverage into CR status
releaseUnits:
  - id: k8s-module
    kind: go-module
    coordinate: github.com/trianalab/pacto/integrations/kubernetes/v5
    tagPrefix: integrations/kubernetes/
  - id: operator-image
    kind: oci-image
    coordinate: ghcr.io/trianalab/pacto/operator
  - id: operator-chart
    kind: helm-chart
    coordinate: ghcr.io/trianalab/pacto/charts/pacto-operator
    chartName: pacto-operator
  - id: k8s-docs
    kind: docs
    versionedWith: operator-chart
group: kubernetes            # fixed release group (module + image + chart + docs bump together)
compatibility:
  pactoCore: ">=3.0.0"       # engine module versions this integration supports
