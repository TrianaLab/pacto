# Scenario 02: E-commerce microservices with inline contracts.
#
# Covers: OpenAPI/gRPC/AsyncAPI interfaces, dependencies, configuration with
# values and secrets, health and metrics capabilities, interface bindings,
# public vs internal visibility.
#
# Ports are a deployment concern in pactoVersion 2.0: each Pacto maps its
# interfaces to Service ports with spec.target.interfaceBindings. Event
# interfaces have no Service port, so they stay unbound.
#
# Inline contracts carry no bundle files, so interface refs and config schemas
# are not resolved; publish a bundle to OCI for the full checks.
#
# Topology:
#   frontend (public :3000) ──req──→ order-service (:8080) ──req──→ payment-service (:8080)
#                            └──req──→ user-service (:9090 gRPC)
#   order-service ──opt──→ notification-worker (:8080, event consumer)
#   payment-service ──req──→ payment-gateway (definition)
#   user-service ──req──→ postgresql (scenario 03)
---
# order-service — internal HTTP API + event producer, depends on payments and notifications
apiVersion: pacto.trianalab.io/v1alpha1
kind: Pacto
metadata:
  name: order-service
  namespace: default
spec:
  target:
    serviceName: order-service
    interfaceBindings:
      - interface: http-api
        servicePort: 8080
  checkIntervalSeconds: 60
  contractRef:
    inline: |
      pactoVersion: "2.0"
      service:
        name: order-service
        version: "1.4.0"
        owner:
          team: orders
      interfaces:
        - name: http-api
          type: openapi
          ref: interfaces/openapi.yaml
          visibility: internal
        - name: order-events
          type: asyncapi
          ref: interfaces/events.yaml
          visibility: internal
      configurations:
        - name: default
          schema: configuration/schema.json
          required: true
          values:
            DB_HOST: orders-db.internal
            DB_PORT: 5432
            DB_PASSWORD: secret://vault/order-service/db-password
            BROKER_URL: amqp://rabbitmq:5672
            MAX_ORDER_ITEMS: 50
      dependencies:
        - name: payment-service
          ref: oci://ghcr.io/acme/payment-service-pacto
          required: true
          compatibility: "^2.0.0"
        - name: notification-worker
          ref: oci://ghcr.io/acme/notification-worker-pacto
          required: false
          compatibility: ">=1.0.0"
      workload: service
      state:
        type: stateless
        persistence:
          scope: local
          durability: ephemeral
        dataCriticality: high
      capabilities:
        - type: health
          binding: {type: http, interface: http-api, path: /health}
        - type: metrics
          binding: {type: http, interface: http-api, path: /metrics}
      metadata:
        team: orders
        tier: standard
---
# payment-service — high-criticality internal API, depends on external payment gateway
apiVersion: pacto.trianalab.io/v1alpha1
kind: Pacto
metadata:
  name: payment-service
  namespace: default
spec:
  target:
    serviceName: payment-service
    interfaceBindings:
      - interface: http-api
        servicePort: 8080
  checkIntervalSeconds: 60
  contractRef:
    inline: |
      pactoVersion: "2.0"
      service:
        name: payment-service
        version: "2.1.0"
        owner:
          team: payments
      interfaces:
        - name: http-api
          type: openapi
          ref: interfaces/openapi.yaml
          visibility: internal
        - name: payment-events
          type: asyncapi
          ref: interfaces/events.yaml
          visibility: internal
      configurations:
        - name: default
          schema: configuration/schema.json
          required: true
          values:
            STRIPE_API_KEY: secret://vault/payment-service/stripe-api-key
            WEBHOOK_SECRET: secret://vault/payment-service/webhook-secret
            IDEMPOTENCY_TTL_HOURS: 48
      dependencies:
        - name: payment-gateway
          ref: oci://ghcr.io/acme/payment-gateway-pacto
          required: true
          compatibility: "^4.0.0"
      workload: service
      state:
        type: stateless
        persistence:
          scope: local
          durability: ephemeral
        dataCriticality: high
      capabilities:
        - type: health
          binding: {type: http, interface: http-api, path: /health}
        - type: metrics
          binding: {type: http, interface: http-api, path: /metrics}
      metadata:
        team: payments
        tier: critical
        pci-scope: "true"
---
# user-service — gRPC API with a separate HTTP port for metrics
apiVersion: pacto.trianalab.io/v1alpha1
kind: Pacto
metadata:
  name: user-service
  namespace: default
spec:
  target:
    serviceName: user-service
    interfaceBindings:
      - interface: grpc-api
        servicePort: 9090
      - interface: admin
        servicePort: 8080
  checkIntervalSeconds: 60
  contractRef:
    inline: |
      pactoVersion: "2.0"
      service:
        name: user-service
        version: "3.2.0"
        owner:
          team: identity
      interfaces:
        - name: grpc-api
          type: grpc
          ref: interfaces/user.proto
          visibility: internal
        - name: admin
          type: openapi
          ref: interfaces/admin.yaml
          visibility: internal
      configurations:
        - name: default
          schema: configuration/schema.json
          required: true
          values:
            DB_HOST: user-db.internal
            DB_PORT: 5432
            DB_PASSWORD: secret://vault/user-service/db-password
            CACHE_TTL_SECONDS: 300
      dependencies:
        - name: postgresql
          ref: oci://ghcr.io/acme/postgresql-pacto
          required: true
          compatibility: "^16.0.0"
      workload: service
      state:
        type: stateless
        persistence:
          scope: local
          durability: ephemeral
        dataCriticality: low
      capabilities:
        - type: health
          binding: {type: http, interface: admin, path: /health}
        - type: metrics
          binding: {type: http, interface: admin, path: /metrics}
      metadata:
        team: identity
        tier: critical
---
# frontend — public-facing web app, depends on order-service and user-service
apiVersion: pacto.trianalab.io/v1alpha1
kind: Pacto
metadata:
  name: frontend
  namespace: default
spec:
  target:
    serviceName: frontend
    interfaceBindings:
      - interface: http-ui
        servicePort: 3000
  checkIntervalSeconds: 60
  contractRef:
    inline: |
      pactoVersion: "2.0"
      service:
        name: frontend
        version: "3.0.0"
        owner:
          team: frontend
      interfaces:
        - name: http-ui
          type: openapi
          ref: interfaces/openapi.yaml
          visibility: public
      configurations:
        - name: default
          schema: configuration/schema.json
          required: true
          values:
            API_URL: http://order-service:8080
            USER_API_URL: grpc://user-service:9090
            SESSION_SECRET: secret://vault/frontend/session-secret
      dependencies:
        - name: order-service
          ref: oci://ghcr.io/acme/order-service-pacto
          required: true
          compatibility: "^1.0.0"
        - name: user-service
          ref: oci://ghcr.io/acme/user-service-pacto
          required: true
          compatibility: "^3.0.0"
      workload: service
      state:
        type: stateless
        persistence:
          scope: local
          durability: ephemeral
        dataCriticality: low
      capabilities:
        - type: health
          binding: {type: http, interface: http-ui, path: /}
      metadata:
        team: frontend
        tier: standard
        edge: "true"
