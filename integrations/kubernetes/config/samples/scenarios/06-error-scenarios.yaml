# Scenario 06: Error scenarios — an invalid contract and unobservable targets.
#
# These produce Invalid and Unknown contract statuses to verify the operator
# handles failures correctly and the dashboard displays useful error information.
# Only bad-contract is invalid; the other two are valid contracts whose runtime
# evidence cannot be collected.
---
# ghost-service — target does not exist in the cluster.
# No Service or Deployment can be observed, so the operator reports
# EVIDENCE_MISSING and contractStatus=Unknown (a missing target is not proof of
# a violation).
apiVersion: pacto.trianalab.io/v1alpha1
kind: Pacto
metadata:
  name: ghost-service
  namespace: default
spec:
  target:
    serviceName: ghost-service
    interfaceBindings:
      - interface: http-api
        servicePort: 8080
  checkIntervalSeconds: 60
  contractRef:
    inline: |
      pactoVersion: "2.0"
      service:
        name: ghost-service
        version: "1.0.0"
        owner:
          team: devops
      interfaces:
        - name: http-api
          type: openapi
          ref: interfaces/openapi.yaml
          visibility: public
      workload: service
      state:
        type: stateless
        persistence:
          scope: local
          durability: ephemeral
        dataCriticality: low
---
# bad-contract — malformed version string; everything else is valid.
# Validation fails with INVALID_SEMVER, so the operator sets
# contractStatus=Invalid with ContractValid=False.
apiVersion: pacto.trianalab.io/v1alpha1
kind: Pacto
metadata:
  name: bad-contract
  namespace: default
spec:
  target:
    serviceName: redis
  checkIntervalSeconds: 60
  contractRef:
    inline: |
      pactoVersion: "2.0"
      service:
        name: bad-contract
        version: "not-semver"
---
# port-mismatch — the binding points the interface at Service port 9999, but the
# frontend Service only exposes 3000. The port cannot be mapped, so the operator
# reports EVIDENCE_INSUFFICIENT on http-api and contractStatus=Unknown.
apiVersion: pacto.trianalab.io/v1alpha1
kind: Pacto
metadata:
  name: port-mismatch
  namespace: default
spec:
  target:
    serviceName: frontend
    interfaceBindings:
      - interface: http-api
        servicePort: 9999
  checkIntervalSeconds: 60
  contractRef:
    inline: |
      pactoVersion: "2.0"
      service:
        name: port-mismatch
        version: "1.0.0"
        owner:
          team: frontend
      interfaces:
        - name: http-api
          type: openapi
          ref: interfaces/openapi.yaml
          visibility: public
      workload: service
      state:
        type: stateless
        persistence:
          scope: local
          durability: ephemeral
        dataCriticality: low
