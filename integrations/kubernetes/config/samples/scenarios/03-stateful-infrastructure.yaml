# Scenario 03: Stateful infrastructure services.
#
# Covers: stateful workloads, persistent storage, high data criticality,
# AsyncAPI interfaces, multiple interfaces per service, health and metrics
# capabilities bound to a dedicated HTTP interface.
#
# pactoVersion 2.0 interfaces name a spec kind (openapi, asyncapi, grpc). Raw
# wire protocols with no such spec (the PostgreSQL and Redis protocols) are not
# contract interfaces, so postgresql and redis declare only their HTTP metrics
# exporter. AMQP is described by AsyncAPI, so rabbitmq keeps its broker port.
#
# Services:
#   postgresql — stateful database, high criticality
#   redis — stateful cache, medium criticality
#   rabbitmq — stateful message broker, high criticality
---
# postgresql — relational database with persistent local storage
apiVersion: pacto.trianalab.io/v1alpha1
kind: Pacto
metadata:
  name: postgresql
  namespace: default
spec:
  target:
    serviceName: postgresql
    workloadRef:
      name: postgresql
      kind: Deployment
    interfaceBindings:
      - interface: metrics
        servicePort: 9187
  checkIntervalSeconds: 120
  contractRef:
    inline: |
      pactoVersion: "2.0"
      service:
        name: postgresql
        version: "16.4.0"
        owner:
          team: infra-databases
      interfaces:
        - name: metrics
          type: openapi
          ref: interfaces/metrics.yaml
          visibility: internal
      workload: service
      state:
        type: stateful
        persistence:
          scope: local
          durability: persistent
        dataCriticality: high
      capabilities:
        - type: health
          binding: {type: http, interface: metrics, path: /health}
        - type: metrics
          binding: {type: http, interface: metrics, path: /metrics}
      metadata:
        tier: critical
        backup: required
        storage-class: ssd
---
# redis — in-memory cache with optional persistence
apiVersion: pacto.trianalab.io/v1alpha1
kind: Pacto
metadata:
  name: redis
  namespace: default
spec:
  target:
    serviceName: redis
    workloadRef:
      name: redis
      kind: Deployment
    interfaceBindings:
      - interface: metrics
        servicePort: 9121
  checkIntervalSeconds: 120
  contractRef:
    inline: |
      pactoVersion: "2.0"
      service:
        name: redis
        version: "7.4.0"
        owner:
          team: infra-caching
      interfaces:
        - name: metrics
          type: openapi
          ref: interfaces/metrics.yaml
          visibility: internal
      workload: service
      state:
        type: stateful
        persistence:
          scope: local
          durability: persistent
        dataCriticality: medium
      capabilities:
        - type: health
          binding: {type: http, interface: metrics, path: /health}
        - type: metrics
          binding: {type: http, interface: metrics, path: /metrics}
      metadata:
        tier: high
        eviction-policy: allkeys-lru
---
# rabbitmq — message broker with management UI and clustering
apiVersion: pacto.trianalab.io/v1alpha1
kind: Pacto
metadata:
  name: rabbitmq
  namespace: default
spec:
  target:
    serviceName: rabbitmq
    workloadRef:
      name: rabbitmq
      kind: Deployment
    interfaceBindings:
      - interface: amqp
        servicePort: 5672
      - interface: management
        servicePort: 15672
      - interface: metrics
        servicePort: 15692
  checkIntervalSeconds: 120
  contractRef:
    inline: |
      pactoVersion: "2.0"
      service:
        name: rabbitmq
        version: "3.13.7"
        owner:
          team: infra-messaging
      interfaces:
        - name: amqp
          type: asyncapi
          ref: interfaces/amqp.yaml
          visibility: internal
        - name: management
          type: openapi
          ref: interfaces/management.yaml
          visibility: internal
        - name: metrics
          type: openapi
          ref: interfaces/metrics.yaml
          visibility: internal
      workload: service
      state:
        type: stateful
        persistence:
          scope: local
          durability: persistent
        dataCriticality: high
      capabilities:
        - type: health
          binding: {type: http, interface: management, path: /api/health/checks/alarms}
        - type: metrics
          binding: {type: http, interface: metrics, path: /metrics}
      metadata:
        tier: critical
        cluster: required
        quorum-queues: enabled
