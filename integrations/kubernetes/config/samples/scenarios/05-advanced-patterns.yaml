# Scenario 05: Advanced workload and state patterns.
#
# Covers: hybrid state (API with cache), scheduled jobs, event-driven
# consumers, metadata fields.
#
# Services:
#   product-catalog — hybrid state service with local cache (warm-up on start)
#   notification-worker — event consumer processing messages from RabbitMQ
#   report-generator — scheduled job (cron) that runs daily
---
# product-catalog — hybrid state: serves requests statelessly but maintains
# a local cache for performance. Cache loss degrades speed but doesn't break.
apiVersion: pacto.trianalab.io/v1alpha1
kind: Pacto
metadata:
  name: product-catalog
  namespace: default
spec:
  target:
    serviceName: product-catalog
    interfaceBindings:
      - interface: rest-api
        servicePort: 8080
      - interface: metrics
        servicePort: 9090
  checkIntervalSeconds: 60
  contractRef:
    inline: |
      pactoVersion: "2.0"
      service:
        name: product-catalog
        version: "2.0.1"
        owner:
          team: catalog
      interfaces:
        - name: rest-api
          type: openapi
          ref: interfaces/openapi.yaml
          visibility: public
        - name: metrics
          type: openapi
          ref: interfaces/metrics.yaml
          visibility: internal
      configurations:
        - name: default
          schema: configuration/schema.json
          required: true
          values:
            UPSTREAM_API: https://inventory.internal/api
            CACHE_MAX_SIZE_MB: 512
            CACHE_TTL_SECONDS: 3600
            WARMUP_ON_START: true
            API_KEY: secret://vault/product-catalog/upstream-api-key
      workload: service
      state:
        type: hybrid
        persistence:
          scope: local
          durability: ephemeral
        dataCriticality: low
      capabilities:
        - type: health
          binding: {type: http, interface: rest-api, path: /health}
        - type: metrics
          binding: {type: http, interface: metrics, path: /metrics}
      metadata:
        team: catalog
        tier: standard
        cache-strategy: write-through
---
# notification-worker — event consumer that processes messages from RabbitMQ.
# Has an event interface (consumed topics) and an HTTP admin interface for
# health and metrics.
apiVersion: pacto.trianalab.io/v1alpha1
kind: Pacto
metadata:
  name: notification-worker
  namespace: default
spec:
  target:
    serviceName: notification-worker
    interfaceBindings:
      - interface: admin
        servicePort: 8080
  checkIntervalSeconds: 60
  contractRef:
    inline: |
      pactoVersion: "2.0"
      service:
        name: notification-worker
        version: "1.3.0"
        owner:
          team: notifications
          dri: alice.johnson
          contacts:
            - type: email
              value: notifications@acme.com
              purpose: escalation
            - type: chat
              value: "#notifications"
              purpose: support
      interfaces:
        - name: notification-events
          type: asyncapi
          ref: interfaces/events.yaml
          visibility: internal
        - name: admin
          type: openapi
          ref: interfaces/admin.yaml
          visibility: internal
      configurations:
        - name: default
          schema: configuration/schema.json
          required: true
          values:
            BROKER_URL: amqp://rabbitmq:5672
            BROKER_CREDENTIALS: secret://vault/notification-worker/broker-credentials
            SMTP_HOST: smtp.example.com
            SMTP_PORT: 587
            SMTP_PASSWORD: secret://vault/notification-worker/smtp-password
            FROM_EMAIL: noreply@example.com
            MAX_RETRIES: 3
            DEAD_LETTER_QUEUE: notifications.dlq
      dependencies:
        - name: rabbitmq
          ref: oci://ghcr.io/acme/rabbitmq-pacto
          required: true
          compatibility: "^3.13.0"
      workload: service
      state:
        type: stateless
        persistence:
          scope: local
          durability: ephemeral
        dataCriticality: medium
      capabilities:
        - type: health
          binding: {type: http, interface: admin, path: /health}
        - type: metrics
          binding: {type: http, interface: admin, path: /metrics}
      metadata:
        team: notifications
        tier: standard
        consumer-group: notification-processing
---
# report-generator — scheduled job that runs daily at 2 AM.
# Workload type "scheduled" means it runs on a cron schedule and exits.
apiVersion: pacto.trianalab.io/v1alpha1
kind: Pacto
metadata:
  name: report-generator
  namespace: default
spec:
  checkIntervalSeconds: 600
  contractRef:
    inline: |
      pactoVersion: "2.0"
      service:
        name: report-generator
        version: "1.2.0"
        owner:
          team: analytics
      interfaces:
        - name: admin
          type: openapi
          ref: interfaces/admin.yaml
          visibility: internal
      workload: scheduled
      state:
        type: stateless
        persistence:
          scope: local
          durability: ephemeral
        dataCriticality: low
      capabilities:
        - type: health
          binding: {type: http, interface: admin, path: /ready}
      metadata:
        schedule: "0 2 * * *"
        timeout: 3600
        team: analytics
