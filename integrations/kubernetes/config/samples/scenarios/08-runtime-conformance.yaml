# Scenario 08: runtime conformance — a ready workload that serves nothing.
#
# deaf-api is Ready (its readiness probe always passes) and its Service has an
# endpoint, so Kubernetes alone believes port 8080 is served. Nothing in the pod
# listens there. Only the node agent, which watches every pod's TCP sockets with
# eBPF, can see that: the operator reports INTERFACE_ABSENT on api, cited to
# collector k8s-observer+ebpf ("seen by: Kubernetes + kernel" in the dashboard),
# and contractStatus=NonCompliant.
#
# Needs the operator installed with the node agent and probing on:
#   helm upgrade --install pacto-operator <chart> -n pacto-system \
#     --set nodeAgent.enabled=true --set controller.enableProbing=true
# Without the node agent the same Pacto reconciles Compliant: nothing else can
# tell a socket that is open from one that is not.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deaf-api
  namespace: default
  labels:
    app.kubernetes.io/name: deaf-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: deaf-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deaf-api
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: server
          # agnhost pause: runs forever and opens no socket.
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: [pause]
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            exec:
              command: ["true"]
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: deaf-api
  namespace: default
  labels:
    app.kubernetes.io/name: deaf-api
spec:
  selector:
    app.kubernetes.io/name: deaf-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: pacto.trianalab.io/v1alpha1
kind: Pacto
metadata:
  name: deaf-api
  namespace: default
spec:
  target:
    serviceName: deaf-api
    workloadRef:
      name: deaf-api
      kind: Deployment
    interfaceBindings:
      - interface: api
        servicePort: 8080
  checkIntervalSeconds: 30
  contractRef:
    # Inline contracts carry no bundle files, so the interface's ref is not
    # resolved; publish a bundle to OCI for the full checks.
    inline: |
      pactoVersion: "2.0"
      service:
        name: deaf-api
        version: "1.0.0"
        owner:
          team: platform
          dri: d
          contacts: [{type: email, value: platform@example.com, purpose: escalation}]
      interfaces:
        - {name: api, type: openapi, ref: openapi.yaml, visibility: internal}
      workload: service
      state:
        type: stateless
        persistence: {scope: local, durability: ephemeral}
        dataCriticality: low
