{{- if .Values.recorder.enabled }}
{{- $r := .Values.recorder }}
{{- if not $r.streamsRepository }}
{{- fail "recorder.streamsRepository is required when the recorder is enabled" }}
{{- end }}
{{- $signers := 0 }}
{{- if $r.signing.ed25519.secretName }}{{ $signers = add1 $signers }}{{ end }}
{{- if $r.signing.kms }}{{ $signers = add1 $signers }}{{ end }}
{{- if $r.signing.keyless.enabled }}{{ $signers = add1 $signers }}{{ end }}
{{- if ne (int $signers) 1 }}
{{- fail "configure exactly one of recorder.signing.ed25519.secretName, recorder.signing.kms or recorder.signing.keyless" }}
{{- end }}
{{- $k := $r.signing.keyless }}
{{- if and $k.enabled (or (not $k.identity) (not $k.issuer) (not $k.fulcioURL) (not $k.timestampURL) (not $k.trustedRoot)) }}
{{- fail "recorder.signing.keyless needs identity, issuer, fulcioURL, timestampURL and trustedRoot" }}
{{- end }}
{{- $name := printf "%s-recorder" (include "pacto-delivery.fullname" .) }}
{{- if $r.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pacto-delivery.recorderServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: recorder
    {{- include "pacto-delivery.labels" . | nindent 4 }}
  {{- with $r.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
# The recorder: it reads concluded operations, their Stages and approvals,
# and writes only status.record, status.stream.{recordedSeq,head}, its own
# RecordStoreReady condition and the record finalizer. It is the only holder
# of the signing key and the registry push credentials; it never changes
# what runs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/component: recorder
    {{- include "pacto-delivery.labels" . | nindent 4 }}
rules:
  - apiGroups: [delivery.pacto.trianalab.io]
    resources: [stages, approvals]
    verbs: [get, list, watch]
  - apiGroups: [delivery.pacto.trianalab.io]
    resources: [operations]
    verbs: [get, list, watch, update]
  - apiGroups: [delivery.pacto.trianalab.io]
    resources: [stages/status, operations/status]
    verbs: [get, update]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [ocirepositories]
    verbs: [get]
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [kube-system]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/component: recorder
    {{- include "pacto-delivery.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pacto-delivery.recorderServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: recorder
    {{- include "pacto-delivery.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "pacto-delivery.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "pacto-delivery.recorderServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
{{- if $r.trust }}
# Other keys whose records the recorder accepts, per stream glob: the old key
# while a rotation runs. Public keys only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-trust
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: recorder
    {{- include "pacto-delivery.labels" . | nindent 4 }}
data:
  trust.yaml: {{ $r.trust | quote }}
---
{{- end }}
{{- if $r.signing.keyless.enabled }}
# The Sigstore trusted root a keyless record must verify under. Without it a
# self-signed certificate could name the recorder's identity.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-keyless
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: recorder
    {{- include "pacto-delivery.labels" . | nindent 4 }}
data:
  trusted_root.json: {{ $r.signing.keyless.trustedRoot | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: recorder
    {{- include "pacto-delivery.labels" . | nindent 4 }}
spec:
  # One writer per stream: the leader writes, a second replica only waits.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: recorder
      {{- include "pacto-delivery.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: recorder
        {{- include "pacto-delivery.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pacto-delivery.recorderServiceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 10
      containers:
        - name: recorder
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - recorder
            - --leader-elect={{ $r.leaderElect }}
            - --poll={{ $r.poll }}
            - {{ printf "--streams-repository=%s" $r.streamsRepository | quote }}
            {{- if $r.signing.ed25519.secretName }}
            - --signing-key-file=/etc/pacto/signing/{{ $r.signing.ed25519.key }}
            {{- else if $r.signing.kms }}
            - {{ printf "--kms-key=%s" $r.signing.kms | quote }}
            {{- else }}
            - --keyless
            - {{ printf "--keyless-identity=%s" $r.signing.keyless.identity | quote }}
            - {{ printf "--keyless-issuer=%s" $r.signing.keyless.issuer | quote }}
            - {{ printf "--keyless-fulcio-url=%s" $r.signing.keyless.fulcioURL | quote }}
            - {{ printf "--keyless-timestamp-url=%s" $r.signing.keyless.timestampURL | quote }}
            - --keyless-token-file=/var/run/sigstore/token/token
            - --keyless-trusted-root=/etc/pacto/keyless/trusted_root.json
            {{- end }}
            {{- if $r.trust }}
            - --trust-config=/etc/pacto/trust/trust.yaml
            {{- end }}
            {{- with $r.cdeventsSink }}
            - {{ printf "--cdevents-sink=%s" . | quote }}
            {{- end }}
          env:
            - name: HOME
              value: /tmp
            {{- if $r.registryCredentials.secretName }}
            - name: DOCKER_CONFIG
              value: /etc/pacto/registry
            {{- end }}
            {{- with .Values.insecureRegistries }}
            - name: PACTO_INSECURE_REGISTRIES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with $r.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 15
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml $r.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $r.signing.ed25519.secretName }}
            - name: signing-key
              mountPath: /etc/pacto/signing
              readOnly: true
            {{- end }}
            {{- if $r.registryCredentials.secretName }}
            - name: registry
              mountPath: /etc/pacto/registry
              readOnly: true
            {{- end }}
            {{- if $r.trust }}
            - name: trust
              mountPath: /etc/pacto/trust
              readOnly: true
            {{- end }}
            {{- if $r.signing.keyless.enabled }}
            - name: keyless
              mountPath: /etc/pacto/keyless
              readOnly: true
            - name: sigstore-token
              mountPath: /var/run/sigstore/token
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $r.signing.ed25519.secretName }}
        - name: signing-key
          secret:
            secretName: {{ $r.signing.ed25519.secretName }}
            items:
              - key: {{ $r.signing.ed25519.key }}
                path: {{ $r.signing.ed25519.key }}
        {{- end }}
        {{- if $r.trust }}
        - name: trust
          configMap:
            name: {{ $name }}-trust
        {{- end }}
        {{- if $r.signing.keyless.enabled }}
        - name: keyless
          configMap:
            name: {{ $name }}-keyless
        # The OIDC token Fulcio checks: short-lived, for the sigstore audience.
        - name: sigstore-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sigstore
                  expirationSeconds: 600
                  path: token
        {{- end }}
        {{- if $r.registryCredentials.secretName }}
        - name: registry
          secret:
            secretName: {{ $r.registryCredentials.secretName }}
            items:
              - key: .dockerconfigjson
                path: config.json
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
