{{- if not (or .Values.admissionPolicies.enabled .Values.admissionPolicies.allowUnguarded) }}
{{- fail "admissionPolicies.enabled=false leaves every actor, approver and the pointer unguarded: anyone who may create an Operation or an Approval can claim to be anyone. Set admissionPolicies.allowUnguarded=true only if you accept that." }}
{{- end }}
{{- if .Values.admissionPolicies.enabled }}
{{- $fullname := include "pacto-delivery.fullname" . }}
{{- $controller := include "pacto-delivery.controllerUser" . }}
{{- $agents := include "pacto-delivery.celList" .Values.identities.agentGroups }}
{{- $breakGlass := include "pacto-delivery.celList" .Values.identities.breakGlassGroups }}
# An operation states who asked, and admission holds it to that: the actor is
# the requesting user, only the promoter may set witnessed, override, unfreeze
# and freeze are limited to their raisers, and the record finalizer is required.
# The promoter trusts the actor in a spec only because this policy checked it:
# it admits no operation and counts no approval while this policy or the
# approval policy is missing.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-operation
  labels:
    {{- include "pacto-delivery.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [delivery.pacto.trianalab.io]
        apiVersions: ["*"]
        operations: [CREATE]
        resources: [operations]
  variables:
    - name: groups
      expression: "has(object.spec.actor.groups) ? object.spec.actor.groups : []"
    - name: witnessed
      expression: "has(object.spec.witnessed) && object.spec.witnessed"
    - name: breakGlass
      expression: "request.userInfo.groups.exists(g, g in {{ $breakGlass }})"
    - name: agent
      expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:') ||
        request.userInfo.groups.exists(g, g in {{ $agents }})
  validations:
    - expression: "object.spec.actor.user == request.userInfo.username"
      message: "spec.actor.user must be the user creating the operation"
      reason: Forbidden
    - expression: >-
        request.userInfo.username == '{{ $controller }}' ||
        (variables.groups.all(g, g in request.userInfo.groups) &&
        request.userInfo.groups.all(g, g in variables.groups))
      message: "spec.actor.groups must be the groups of the user creating the operation"
      reason: Forbidden
    - expression: >-
        has(object.metadata.finalizers) &&
        'delivery.pacto.trianalab.io/record' in object.metadata.finalizers
      message: "an operation must carry the delivery.pacto.trianalab.io/record finalizer"
    - expression: "!variables.witnessed || request.userInfo.username == '{{ $controller }}'"
      message: "only the Pacto delivery promoter may raise a witnessed operation"
      reason: Forbidden
    - expression: >-
        object.spec.type != 'pacto.dev/override' || variables.breakGlass ||
        (variables.witnessed && request.userInfo.username == '{{ $controller }}')
      message: "only break-glass may raise an override"
      reason: Forbidden
    - expression: >-
        object.spec.type != 'pacto.dev/unfreeze' || variables.breakGlass ||
        (!variables.agent && request.userInfo.username != '{{ $controller }}')
      message: "only a person or break-glass may unfreeze a Stage; agents and the promoter may not"
      reason: Forbidden
    - expression: >-
        object.spec.type != 'pacto.dev/freeze' || variables.breakGlass ||
        !variables.agent || request.userInfo.username == '{{ $controller }}'
      message: "only a person, break-glass or the promoter may freeze a Stage; agents may not"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $fullname }}-operation
  labels:
    {{- include "pacto-delivery.labels" . | nindent 4 }}
spec:
  policyName: {{ $fullname }}-operation
  validationActions: [Deny]
---
# Cancelling is deleting, and it is refused once the pointer has moved: an
# applied operation runs to its end, which may be a rollback.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-cancel
  labels:
    {{- include "pacto-delivery.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [delivery.pacto.trianalab.io]
        apiVersions: ["*"]
        operations: [DELETE]
        resources: [operations]
  validations:
    - expression: >-
        !has(oldObject.status) || !has(oldObject.status.applied) || !oldObject.status.applied ||
        (has(oldObject.status.phase) && oldObject.status.phase == 'Concluded')
      message: "the pointer already moved for this operation, so it can no longer be cancelled; roll it back instead"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $fullname }}-cancel
  labels:
    {{- include "pacto-delivery.labels" . | nindent 4 }}
spec:
  policyName: {{ $fullname }}-cancel
  validationActions: [Deny]
---
# Approvals come from people: not a service account, not an agent group, with
# by and groups equal to the requesting user's and authTime equal to the login time the
# apiserver reports (structured authentication maps the OIDC auth_time claim to
# userInfo.extra["pacto.dev/auth-time"]). The promoter refuses a login older
# than 15 minutes, which forces a fresh interactive login to approve. An agent
# holding a person's credentials still cannot be told apart from that person.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-approval
  labels:
    {{- include "pacto-delivery.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [delivery.pacto.trianalab.io]
        apiVersions: ["*"]
        operations: [CREATE]
        resources: [approvals]
  variables:
    - name: groups
      expression: "has(object.spec.groups) ? object.spec.groups : []"
  validations:
    - expression: "object.spec.by == request.userInfo.username"
      message: "spec.by must be the user creating the approval"
      reason: Forbidden
    - expression: >-
        !request.userInfo.username.startsWith('system:serviceaccount:') &&
        !request.userInfo.groups.exists(g, g in {{ $agents }})
      message: "agents and service accounts may not approve"
      reason: Forbidden
    - expression: >-
        'pacto.dev/auth-time' in request.userInfo.extra &&
        has(object.spec.authTime) && object.spec.authTime == request.userInfo.extra['pacto.dev/auth-time'][0]
      message: "approving needs a fresh interactive login: spec.authTime must be the login time in userInfo.extra[pacto.dev/auth-time]"
      reason: Forbidden
    - expression: >-
        variables.groups.all(g, g in request.userInfo.groups) &&
        request.userInfo.groups.all(g, g in variables.groups)
      message: "spec.groups must be the groups of the user creating the approval"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $fullname }}-approval
  labels:
    {{- include "pacto-delivery.labels" . | nindent 4 }}
spec:
  policyName: {{ $fullname }}-approval
  validationActions: [Deny]
---
# The pointer: on an OCIRepository a Stage applies through (label it
# delivery.pacto.trianalab.io/apply-ref), spec.ref.digest changes only by the
# promoter or break-glass. Every other field, and Flux's own writes, pass.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-pointer
  labels:
    {{- include "pacto-delivery.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    objectSelector:
      matchExpressions:
        - key: delivery.pacto.trianalab.io/apply-ref
          operator: Exists
    resourceRules:
      - apiGroups: [source.toolkit.fluxcd.io]
        apiVersions: ["*"]
        operations: [UPDATE]
        resources: [ocirepositories]
  variables:
    - name: digest
      expression: "has(object.spec.ref) && has(object.spec.ref.digest) ? object.spec.ref.digest : ''"
    - name: oldDigest
      expression: "has(oldObject.spec.ref) && has(oldObject.spec.ref.digest) ? oldObject.spec.ref.digest : ''"
  validations:
    - expression: >-
        variables.digest == variables.oldDigest ||
        request.userInfo.username == '{{ $controller }}' ||
        request.userInfo.groups.exists(g, g in {{ $breakGlass }})
      message: "spec.ref.digest is the Pacto delivery pointer: propose a promote, or use break-glass"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $fullname }}-pointer
  labels:
    {{- include "pacto-delivery.labels" . | nindent 4 }}
spec:
  policyName: {{ $fullname }}-pointer
  validationActions: [Deny]
{{- if .Values.argocd.enabled }}
---
# The pointer on Argo CD: on an Application a Stage applies through (label it
# delivery.pacto.trianalab.io/apply-ref), spec.source.targetRevision changes
# only by the promoter or break-glass. Every other field, and Argo CD's own
# writes, pass.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-pointer-argocd
  labels:
    {{- include "pacto-delivery.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    objectSelector:
      matchExpressions:
        - key: delivery.pacto.trianalab.io/apply-ref
          operator: Exists
    resourceRules:
      - apiGroups: [argoproj.io]
        apiVersions: ["*"]
        operations: [UPDATE]
        resources: [applications]
  variables:
    - name: revision
      expression: "has(object.spec.source) && has(object.spec.source.targetRevision) ? object.spec.source.targetRevision : ''"
    - name: oldRevision
      expression: "has(oldObject.spec.source) && has(oldObject.spec.source.targetRevision) ? oldObject.spec.source.targetRevision : ''"
  validations:
    - expression: >-
        variables.revision == variables.oldRevision ||
        request.userInfo.username == '{{ $controller }}' ||
        request.userInfo.groups.exists(g, g in {{ $breakGlass }})
      message: "spec.source.targetRevision is the Pacto delivery pointer: propose a promote, or use break-glass"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $fullname }}-pointer-argocd
  labels:
    {{- include "pacto-delivery.labels" . | nindent 4 }}
spec:
  policyName: {{ $fullname }}-pointer-argocd
  validationActions: [Deny]
{{- end }}
{{- if .Values.recorder.enabled }}
{{- $recorder := printf "system:serviceaccount:%s:%s" .Release.Namespace (include "pacto-delivery.recorderServiceAccountName" .) }}
---
# The record fields belong to the recorder: status.record on an Operation and
# status.stream.{recordedSeq,head,anchor} on a Stage change only when the
# recorder writes them, and the recorder changes nothing that decides what
# runs: not the locks, seqs or conclusions a Stage keeps, nor the verdicts,
# approvals, policy, plan or actor class of an operation. RBAC cannot scope a status write to
# fields; this policy does.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-records
  labels:
    {{- include "pacto-delivery.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [delivery.pacto.trianalab.io]
        apiVersions: ["*"]
        operations: [UPDATE]
        resources: [stages/status, operations/status]
  variables:
    - name: recorder
      expression: "request.userInfo.username == '{{ $recorder }}'"
  validations:
    - expression: >-
        variables.recorder || (
        {{ include "pacto-delivery.celSame" (list "status.record.digest" "''") }} &&
        {{ include "pacto-delivery.celSame" (list "status.record.refused" "''") }} &&
        {{ include "pacto-delivery.celSame" (list "status.stream.head" "''") }} &&
        {{ include "pacto-delivery.celSame" (list "status.stream.recordedSeq" "0") }} &&
        {{ include "pacto-delivery.celSame" (list "status.stream.anchor" "''") }})
      message: "status.record and status.stream.{recordedSeq,head,anchor} are written only by the Pacto delivery recorder"
      reason: Forbidden
    - expression: >-
        !variables.recorder || (
        {{ include "pacto-delivery.celSame" (list "status.pointer" "''") }} &&
        {{ include "pacto-delivery.celSame" (list "status.frozen" "false") }} &&
        {{ include "pacto-delivery.celSame" (list "status.lastOp" "''") }} &&
        {{ include "pacto-delivery.celSame" (list "status.stream.seq" "0") }} &&
        {{ include "pacto-delivery.celSame" (list "status.phase" "''") }} &&
        {{ include "pacto-delivery.celSame" (list "status.outcome" "''") }} &&
        {{ include "pacto-delivery.celSame" (list "status.seq" "0") }} &&
        {{ include "pacto-delivery.celSame" (list "status.locks" "{}") }} &&
        {{ include "pacto-delivery.celSame" (list "status.verified" "[]") }} &&
        {{ include "pacto-delivery.celSame" (list "status.failedDigests" "[]") }} &&
        {{ include "pacto-delivery.celSame" (list "status.frozenReason" "''") }} &&
        {{ include "pacto-delivery.celSame" (list "status.autoHold" "false") }} &&
        {{ include "pacto-delivery.celSame" (list "status.autoRollbacks" "{}") }} &&
        {{ include "pacto-delivery.celSame" (list "status.stream.id" "''") }} &&
        {{ include "pacto-delivery.celSame" (list "status.stream.concluded" "[]") }} &&
        {{ include "pacto-delivery.celSame" (list "status.published" "[]") }} &&
        {{ include "pacto-delivery.celSame" (list "status.offered" "[]") }} &&
        {{ include "pacto-delivery.celSame" (list "status.candidate" "''") }} &&
        {{ include "pacto-delivery.celSame" (list "status.lastCheck" "{}") }} &&
        {{ include "pacto-delivery.celSame" (list "status.verdicts" "[]") }} &&
        {{ include "pacto-delivery.celSame" (list "status.approvals" "[]") }} &&
        {{ include "pacto-delivery.celSame" (list "status.policy" "{}") }} &&
        {{ include "pacto-delivery.celSame" (list "status.verification" "''") }} &&
        {{ include "pacto-delivery.celSame" (list "status.reason" "''") }} &&
        {{ include "pacto-delivery.celSame" (list "status.times" "{}") }} &&
        {{ include "pacto-delivery.celSame" (list "status.applied" "false") }} &&
        {{ include "pacto-delivery.celSame" (list "status.stageUID" "''") }} &&
        {{ include "pacto-delivery.celSame" (list "status.plan" "{}") }} &&
        {{ include "pacto-delivery.celSame" (list "status.actorClass" "''") }} &&
        {{ include "pacto-delivery.celSame" (list "status.question" "''") }} &&
        {{ include "pacto-delivery.celSame" (list "status.message" "''") }})
      message: "the Pacto delivery recorder writes records, never what runs or how an operation ended"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $fullname }}-records
  labels:
    {{- include "pacto-delivery.labels" . | nindent 4 }}
spec:
  policyName: {{ $fullname }}-records
  validationActions: [Deny]
{{- end }}
---
# The promoter itself: its RBAC may patch any OCIRepository, so admission holds
# it to the one write it needs. It may only touch an OCIRepository a Stage
# applies through, and only spec.ref.digest in its spec.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-promoter-writes
  labels:
    {{- include "pacto-delivery.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [source.toolkit.fluxcd.io]
        apiVersions: ["*"]
        operations: [UPDATE]
        resources: [ocirepositories]
  matchConditions:
    - name: promoter
      expression: "request.userInfo.username == '{{ $controller }}'"
  variables:
    - name: ref
      expression: "has(object.spec.ref) ? object.spec.ref : {}"
    - name: oldRef
      expression: "has(oldObject.spec.ref) ? oldObject.spec.ref : {}"
  validations:
    - expression: >-
        has(oldObject.metadata.labels) && 'delivery.pacto.trianalab.io/apply-ref' in oldObject.metadata.labels &&
        has(object.metadata.labels) && 'delivery.pacto.trianalab.io/apply-ref' in object.metadata.labels
      message: "the promoter writes only to an OCIRepository labelled delivery.pacto.trianalab.io/apply-ref"
      reason: Forbidden
    - expression: >-
        object.spec.all(k, k == 'ref' || (k in oldObject.spec && object.spec[k] == oldObject.spec[k])) &&
        oldObject.spec.all(k, k in object.spec) &&
        variables.ref.all(k, k == 'digest' || (k in variables.oldRef && variables.ref[k] == variables.oldRef[k])) &&
        variables.oldRef.all(k, k == 'digest' || k in variables.ref)
      message: "the promoter may change only spec.ref.digest"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $fullname }}-promoter-writes
  labels:
    {{- include "pacto-delivery.labels" . | nindent 4 }}
spec:
  policyName: {{ $fullname }}-promoter-writes
  validationActions: [Deny]
{{- if .Values.argocd.enabled }}
---
# The promoter on Argo CD: only an Application a Stage applies through, and
# only spec.source.targetRevision in its spec.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-promoter-writes-argocd
  labels:
    {{- include "pacto-delivery.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [argoproj.io]
        apiVersions: ["*"]
        operations: [UPDATE]
        resources: [applications]
  matchConditions:
    - name: promoter
      expression: "request.userInfo.username == '{{ $controller }}'"
  variables:
    - name: source
      expression: "has(object.spec.source) ? object.spec.source : {}"
    - name: oldSource
      expression: "has(oldObject.spec.source) ? oldObject.spec.source : {}"
  validations:
    - expression: >-
        has(oldObject.metadata.labels) && 'delivery.pacto.trianalab.io/apply-ref' in oldObject.metadata.labels &&
        has(object.metadata.labels) && 'delivery.pacto.trianalab.io/apply-ref' in object.metadata.labels
      message: "the promoter writes only to an Application labelled delivery.pacto.trianalab.io/apply-ref"
      reason: Forbidden
    - expression: >-
        object.spec.all(k, k == 'source' || (k in oldObject.spec && object.spec[k] == oldObject.spec[k])) &&
        oldObject.spec.all(k, k in object.spec) &&
        variables.source.all(k, k == 'targetRevision' || (k in variables.oldSource && variables.source[k] == variables.oldSource[k])) &&
        variables.oldSource.all(k, k == 'targetRevision' || k in variables.source)
      message: "the promoter may change only spec.source.targetRevision"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $fullname }}-promoter-writes-argocd
  labels:
    {{- include "pacto-delivery.labels" . | nindent 4 }}
spec:
  policyName: {{ $fullname }}-promoter-writes-argocd
  validationActions: [Deny]
{{- end }}
{{- end }}
