{{- if .Values.metrics.enabled }}
# The promoter's metrics, plain HTTP on port 8080 (docs/delivery-setup.md lists
# them). The recorder's have their own Service under recorder.monitoring, so
# this one leaves the recorder out rather than have it scraped twice.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pacto-delivery.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: metrics
    {{- include "pacto-delivery.labels" . | nindent 4 }}
spec:
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/component: promoter
    {{- include "pacto-delivery.selectorLabels" . | nindent 4 }}
{{- if .Values.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "pacto-delivery.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pacto-delivery.labels" . | nindent 4 }}
spec:
  endpoints:
    - port: metrics
      scheme: http
      {{- with .Values.metrics.serviceMonitor.interval }}
      interval: {{ . }}
      {{- end }}
      {{- with .Values.metrics.serviceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: metrics
      {{- include "pacto-delivery.selectorLabels" . | nindent 6 }}
{{- end }}
{{- end }}
