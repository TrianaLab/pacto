suite: promoter tests
templates:
  - templates/deployment.yaml
  - templates/rbac.yaml
tests:
  - it: runs the promoter subcommand with the derived controller identity
    template: templates/deployment.yaml
    release:
      name: d
      namespace: pacto-delivery
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - promoter
            - --leader-elect=true
            - --poll=3s
            - --auth-freshness=15m
            - --controller-user=system:serviceaccount:pacto-delivery:d-pacto-delivery
            - --agent-groups=pacto:agents
            - --break-glass-groups=pacto:break-glass
            - --admission-policies=d-pacto-delivery-operation,d-pacto-delivery-approval

  - it: names no admission policies when they are off on purpose
    template: templates/deployment.yaml
    set:
      admissionPolicies.enabled: false
      admissionPolicies.allowUnguarded: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --admission-policies=RELEASE-NAME-pacto-delivery-operation,RELEASE-NAME-pacto-delivery-approval

  - it: passes the team group prefix only when set
    template: templates/deployment.yaml
    set:
      identities.teamGroupPrefix: "acme:"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--team-group-prefix=acme:"

  - it: passes the gate providers as one JSON flag
    template: templates/deployment.yaml
    set:
      gates.providers:
        - {name: mira, type: mira, url: "http://mira.observability:4318"}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: '--gate-providers=[{"name":"mira","type":"mira","url":"http://mira.observability:4318"}]'

  - it: refuses a provider that takes a built-in gate's name
    template: templates/deployment.yaml
    set:
      gates.providers:
        - {name: pacto.runtime, type: mira, url: "http://m"}
    asserts:
      - failedTemplate: {}

  - it: passes insecure registries through
    template: templates/deployment.yaml
    set:
      insecureRegistries: [reg:5000, other:5000]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PACTO_INSECURE_REGISTRIES
            value: reg:5000,other:5000

  - it: grants the promoter only the digest write on Flux sources, nothing on workloads
    template: templates/rbac.yaml
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [source.toolkit.fluxcd.io]
            resources: [ocirepositories]
            verbs: [get, list, watch, patch]
        documentIndex: 1
      - contains:
          path: rules
          content:
            apiGroups: [apps]
            resources: [deployments, statefulsets, replicasets, daemonsets]
            verbs: [get]
        documentIndex: 1

  - it: mounts the upstream trust config and passes it only when set
    template: templates/deployment.yaml
    set:
      promoter.upstreamTrust: "keys: []"
    asserts:
      - equal:
          path: data["trust.yaml"]
          value: "keys: []"
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].args
          content: --upstream-trust-config=/etc/pacto/upstream-trust/trust.yaml
        documentIndex: 1
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: RELEASE-NAME-pacto-delivery-upstream-trust
        documentIndex: 1

  - it: mounts the registry credentials only when set, beside the upstream trust config
    template: templates/deployment.yaml
    set:
      promoter.upstreamTrust: "keys: []"
      promoter.registryCredentials.secretName: promoter-pull
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: DOCKER_CONFIG, value: /etc/pacto/registry}
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - {name: upstream-trust, mountPath: /etc/pacto/upstream-trust, readOnly: true}
            - {name: registry, mountPath: /etc/pacto/registry, readOnly: true}
        documentIndex: 1
      - equal:
          path: spec.template.spec.volumes[1]
          value:
            name: registry
            secret:
              secretName: promoter-pull
              items: [{key: .dockerconfigjson, path: config.json}]
        documentIndex: 1

  - it: mounts the registry credentials alone
    template: templates/deployment.yaml
    set:
      promoter.registryCredentials.secretName: promoter-pull
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: promoter-pull
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 1

  - it: passes no upstream trust config by default
    template: templates/deployment.yaml
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: spec.template.spec.volumes
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: DOCKER_CONFIG, value: /etc/pacto/registry}

  - it: grants nothing on Argo CD unless it is enabled
    template: templates/rbac.yaml
    documentIndex: 1
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [argoproj.io]
            resources: [applications]
            verbs: [get, list, watch, patch]

  - it: grants the targetRevision write on Argo CD Applications, and reads to agents, when enabled
    template: templates/rbac.yaml
    set:
      argocd.enabled: true
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [argoproj.io]
            resources: [applications]
            verbs: [get, list, watch, patch]
        documentIndex: 1
      - contains:
          path: rules
          content:
            apiGroups: [argoproj.io]
            resources: [applications]
            verbs: [get]
        documentIndex: 5

  - it: never lets an agent create approvals
    template: templates/rbac.yaml
    documentIndex: 5
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-pacto-delivery-agent
      - notContains:
          path: rules
          content:
            apiGroups: [delivery.pacto.trianalab.io]
            resources: [approvals]
            verbs: [get, list, watch, create]
      - contains:
          path: rules
          content:
            apiGroups: [delivery.pacto.trianalab.io]
            resources: [operations]
            verbs: [get, list, watch, create, delete]

  - it: skips the ServiceAccount when told to
    template: templates/rbac.yaml
    set:
      serviceAccount.create: false
      serviceAccount.name: existing
    asserts:
      - notContains:
          path: subjects
          content:
            kind: ServiceAccount
            name: RELEASE-NAME-pacto-delivery
            namespace: NAMESPACE
        documentIndex: 1

  - it: lets the promoter delete operations only when the recorder keeps their records
    template: templates/rbac.yaml
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [delivery.pacto.trianalab.io]
            resources: [operations]
            verbs: [get, list, watch, create, update, patch]

  - it: grants the delete with the recorder on
    template: templates/rbac.yaml
    documentIndex: 1
    set:
      recorder.enabled: true
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [delivery.pacto.trianalab.io]
            resources: [operations]
            verbs: [get, list, watch, create, update, patch, delete]
