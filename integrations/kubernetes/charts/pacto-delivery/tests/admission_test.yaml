suite: admission policy tests
templates:
  - templates/admission.yaml
release:
  name: d
  namespace: pacto-delivery
tests:
  - it: installs six policies, each bound with Deny
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    asserts:
      - hasDocuments:
          count: 12
      - equal:
          path: spec.validationActions
          value: [Deny]
        documentIndex: 1

  - it: holds the operation actor to the requesting user
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    documentIndex: 0
    asserts:
      - equal:
          path: spec.validations[0].expression
          value: object.spec.actor.user == request.userInfo.username

  - it: lets only the promoter set witnessed
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    documentIndex: 0
    asserts:
      - equal:
          path: spec.validations[3].expression
          value: "!variables.witnessed || request.userInfo.username == 'system:serviceaccount:pacto-delivery:d-pacto-delivery'"

  - it: lets a person, break-glass or the promoter freeze, never an agent
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    documentIndex: 0
    asserts:
      - equal:
          path: spec.validations[6].expression
          value: "object.spec.type != 'pacto.dev/freeze' || variables.breakGlass || !variables.agent || request.userInfo.username == 'system:serviceaccount:pacto-delivery:d-pacto-delivery'"

  - it: lets an agent cancel only its own operations
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    documentIndex: 2
    asserts:
      - equal:
          path: spec.validations[0].expression
          value: "oldObject.spec.actor.user == request.userInfo.username || request.userInfo.username == 'system:serviceaccount:pacto-delivery:d-pacto-delivery' || request.userInfo.username == 'system:serviceaccount:kube-system:namespace-controller' || request.userInfo.groups.exists(g, g in ['pacto:break-glass']) || !(request.userInfo.username.startsWith('system:serviceaccount:') || request.userInfo.groups.exists(g, g in ['pacto:agents']))"
      - matchRegex:
          path: spec.validations[1].message
          pattern: can no longer be cancelled

  - it: refuses approvals from agents and service accounts
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    documentIndex: 4
    asserts:
      - matchRegex:
          path: spec.validations[2].expression
          pattern: "g in \\['pacto:agents'\\]"

  - it: binds an approval's groups to the approving user's groups
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    documentIndex: 4
    asserts:
      - equal:
          path: spec.validations[4].message
          value: "spec.groups must be the groups of the user creating the approval"
      # Both directions: no group the user lacks, and none of theirs left out.
      - matchRegex:
          path: spec.validations[4].expression
          pattern: "variables\\.groups\\.all\\(g, g in request\\.userInfo\\.groups\\) &&"
      - matchRegex:
          path: spec.validations[4].expression
          pattern: "request\\.userInfo\\.groups\\.all\\(g, g in variables\\.groups\\)"

  - it: keeps an Approval's spec as it was given
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    documentIndex: 4
    asserts:
      - equal:
          path: spec.matchConstraints.resourceRules[0].operations
          value: [CREATE, UPDATE]
      - equal:
          path: spec.validations[0].expression
          value: "variables.create || object.spec == oldObject.spec"

  - it: protects only labelled OCIRepositories
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    documentIndex: 6
    asserts:
      - equal:
          path: spec.matchConstraints.objectSelector.matchExpressions[0].key
          value: delivery.pacto.trianalab.io/apply-ref

  - it: holds an Argo CD Application's targetRevision to the promoter and break-glass when enabled
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    set:
      argocd.enabled: true
    asserts:
      - hasDocuments:
          count: 16
      - equal:
          path: spec.matchConstraints.resourceRules[0].resources
          value: [applications]
        documentIndex: 8
      - equal:
          path: spec.matchConstraints.objectSelector.matchExpressions[0].key
          value: delivery.pacto.trianalab.io/apply-ref
        documentIndex: 8
      - matchRegex:
          path: spec.validations[0].expression
          pattern: "request\\.userInfo\\.username == 'system:serviceaccount:pacto-delivery:d-pacto-delivery'"
        documentIndex: 8

  - it: keeps the label, the url and the layer selector of a labelled OCIRepository to break-glass
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    documentIndex: 6
    asserts:
      - equal:
          path: spec.validations[1].expression
          value: "variables.breakGlass || has(object.metadata.labels) && 'delivery.pacto.trianalab.io/apply-ref' in object.metadata.labels"
      - matchRegex:
          path: spec.validations[2].expression
          pattern: "object\\.spec\\.url.*object\\.spec\\.layerSelector"

  - it: keeps the rest of an Argo CD Application's source and its label to break-glass
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    set:
      argocd.enabled: true
    documentIndex: 8
    asserts:
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "'delivery\\.pacto\\.trianalab\\.io/apply-ref' in object\\.metadata\\.labels"
      - matchRegex:
          path: spec.validations[2].expression
          pattern: "k == 'targetRevision' \\|\\| \\(k in variables\\.oldSource.*object\\.spec\\.sources"

  - it: keeps what a labelled Kustomization applies, and its label, to break-glass
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    documentIndex: 8
    asserts:
      - equal:
          path: metadata.name
          value: d-pacto-delivery-applier
      - equal:
          path: spec.matchConstraints.resourceRules[0].resources
          value: [kustomizations]
      - equal:
          path: spec.matchConstraints.objectSelector.matchExpressions[0].key
          value: delivery.pacto.trianalab.io/apply-ref
      - equal:
          path: spec.variables[1].expression
          value: "['sourceRef', 'path', 'images', 'patches', 'components', 'postBuild', 'namePrefix', 'nameSuffix', 'targetNamespace']"
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "variables\\.guarded\\.all\\(f,"

  - it: renders nothing when disabled on purpose
    set:
      admissionPolicies.enabled: false
      admissionPolicies.allowUnguarded: true
    asserts:
      - hasDocuments:
          count: 0

  - it: refuses to render unguarded by accident
    set:
      admissionPolicies.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "leaves every actor, approver and the pointer unguarded"

  - it: renders the policies without cluster capabilities, so an offline render keeps them
    asserts:
      - containsDocument:
          kind: ValidatingAdmissionPolicy
          apiVersion: admissionregistration.k8s.io/v1
          name: d-pacto-delivery-operation
          any: true

  - it: holds the promoter to labelled objects and the pointer field alone
    set:
      argocd.enabled: true
    asserts:
      - equal:
          path: spec.matchConditions[0].expression
          value: "request.userInfo.username == 'system:serviceaccount:pacto-delivery:d-pacto-delivery'"
        documentIndex: 12
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "k == 'digest'"
        documentIndex: 12
      - equal:
          path: spec.matchConstraints.resourceRules[0].resources
          value: [applications]
        documentIndex: 14
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "k == 'targetRevision'"
        documentIndex: 14

  - it: keeps the record fields to the recorder, and the recorder away from what runs
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    set:
      recorder.enabled: true
    asserts:
      - hasDocuments:
          count: 14
      - equal:
          path: spec.variables[0].expression
          value: "request.userInfo.username == 'system:serviceaccount:pacto-delivery:d-pacto-delivery-recorder'"
        documentIndex: 10
      - matchRegex:
          path: spec.validations[0].expression
          pattern: "has\\(object.status.stream.head\\) \\? object.status.stream.head : ''\\) == \\(has\\(oldObject.status\\)"
        documentIndex: 10
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "^!variables.recorder \\|\\|"
        documentIndex: 10
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "variables\\.status\\.all\\(k, k in \\['record', 'stream', 'conditions'\\] \\|\\|"
        documentIndex: 10
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "variables\\.stream\\.all\\(k, k in \\['recordedSeq', 'head', 'anchor'\\] \\|\\|"
        documentIndex: 10
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "variables\\.conditions == variables\\.oldConditions\\)$"
        documentIndex: 10
      - matchRegex:
          path: spec.variables[5].expression
          pattern: "filter\\(c, c\\.type != 'RecordStoreReady'\\)"
        documentIndex: 10
