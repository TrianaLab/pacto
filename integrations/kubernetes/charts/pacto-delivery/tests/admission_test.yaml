suite: admission policy tests
templates:
  - templates/admission.yaml
release:
  name: d
  namespace: pacto-delivery
tests:
  - it: installs four policies, each bound with Deny
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    asserts:
      - hasDocuments:
          count: 8
      - equal:
          path: spec.validationActions
          value: [Deny]
        documentIndex: 1

  - it: holds the operation actor to the requesting user
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    documentIndex: 0
    asserts:
      - equal:
          path: spec.validations[0].expression
          value: object.spec.actor.user == request.userInfo.username

  - it: lets only the promoter set witnessed
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    documentIndex: 0
    asserts:
      - equal:
          path: spec.validations[3].expression
          value: "!variables.witnessed || request.userInfo.username == 'system:serviceaccount:pacto-delivery:d-pacto-delivery'"

  - it: refuses approvals from agents and service accounts
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    documentIndex: 4
    asserts:
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "g in \\['pacto:agents'\\]"

  - it: binds an approval's groups to the approving user's groups
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    documentIndex: 4
    asserts:
      - equal:
          path: spec.validations[3].message
          value: "spec.groups must be the groups of the user creating the approval"
      # Both directions: no group the user lacks, and none of theirs left out.
      - matchRegex:
          path: spec.validations[3].expression
          pattern: "variables\\.groups\\.all\\(g, g in request\\.userInfo\\.groups\\) &&"
      - matchRegex:
          path: spec.validations[3].expression
          pattern: "request\\.userInfo\\.groups\\.all\\(g, g in variables\\.groups\\)"

  - it: protects only labelled OCIRepositories
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    documentIndex: 6
    asserts:
      - equal:
          path: spec.matchConstraints.objectSelector.matchExpressions[0].key
          value: delivery.pacto.trianalab.io/apply-ref

  - it: renders nothing when disabled
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    set:
      admissionPolicies.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing on a cluster without ValidatingAdmissionPolicy
    asserts:
      - hasDocuments:
          count: 0

  - it: keeps the record fields to the recorder, and the recorder away from what runs
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    set:
      recorder.enabled: true
    asserts:
      - hasDocuments:
          count: 10
      - equal:
          path: spec.variables[0].expression
          value: "request.userInfo.username == 'system:serviceaccount:pacto-delivery:d-pacto-delivery-recorder'"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[0].expression
          pattern: "has\\(object.status.stream.head\\) \\? object.status.stream.head : ''\\) == \\(has\\(oldObject.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "^!variables.recorder \\|\\|"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.pointer\\) \\? object\\.status\\.pointer : ''\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.frozen\\) \\? object\\.status\\.frozen : false\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.lastOp\\) \\? object\\.status\\.lastOp : ''\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.stream\\.seq\\) \\? object\\.status\\.stream\\.seq : 0\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.phase\\) \\? object\\.status\\.phase : ''\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.outcome\\) \\? object\\.status\\.outcome : ''\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.seq\\) \\? object\\.status\\.seq : 0\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.locks\\) \\? object\\.status\\.locks : \\{\\}\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
