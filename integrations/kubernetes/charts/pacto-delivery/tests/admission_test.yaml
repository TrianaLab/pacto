suite: admission policy tests
templates:
  - templates/admission.yaml
release:
  name: d
  namespace: pacto-delivery
tests:
  - it: installs five policies, each bound with Deny
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    asserts:
      - hasDocuments:
          count: 10
      - equal:
          path: spec.validationActions
          value: [Deny]
        documentIndex: 1

  - it: holds the operation actor to the requesting user
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    documentIndex: 0
    asserts:
      - equal:
          path: spec.validations[0].expression
          value: object.spec.actor.user == request.userInfo.username

  - it: lets only the promoter set witnessed
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    documentIndex: 0
    asserts:
      - equal:
          path: spec.validations[3].expression
          value: "!variables.witnessed || request.userInfo.username == 'system:serviceaccount:pacto-delivery:d-pacto-delivery'"

  - it: lets a person, break-glass or the promoter freeze, never an agent
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    documentIndex: 0
    asserts:
      - equal:
          path: spec.validations[6].expression
          value: "object.spec.type != 'pacto.dev/freeze' || variables.breakGlass || !variables.agent || request.userInfo.username == 'system:serviceaccount:pacto-delivery:d-pacto-delivery'"

  - it: lets an agent cancel only its own operations
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    documentIndex: 2
    asserts:
      - equal:
          path: spec.validations[0].expression
          value: "oldObject.spec.actor.user == request.userInfo.username || request.userInfo.username == 'system:serviceaccount:pacto-delivery:d-pacto-delivery' || request.userInfo.username == 'system:serviceaccount:kube-system:namespace-controller' || request.userInfo.groups.exists(g, g in ['pacto:break-glass']) || !(request.userInfo.username.startsWith('system:serviceaccount:') || request.userInfo.groups.exists(g, g in ['pacto:agents']))"
      - matchRegex:
          path: spec.validations[1].message
          pattern: can no longer be cancelled

  - it: refuses approvals from agents and service accounts
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    documentIndex: 4
    asserts:
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "g in \\['pacto:agents'\\]"

  - it: binds an approval's groups to the approving user's groups
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    documentIndex: 4
    asserts:
      - equal:
          path: spec.validations[3].message
          value: "spec.groups must be the groups of the user creating the approval"
      # Both directions: no group the user lacks, and none of theirs left out.
      - matchRegex:
          path: spec.validations[3].expression
          pattern: "variables\\.groups\\.all\\(g, g in request\\.userInfo\\.groups\\) &&"
      - matchRegex:
          path: spec.validations[3].expression
          pattern: "request\\.userInfo\\.groups\\.all\\(g, g in variables\\.groups\\)"

  - it: protects only labelled OCIRepositories
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    documentIndex: 6
    asserts:
      - equal:
          path: spec.matchConstraints.objectSelector.matchExpressions[0].key
          value: delivery.pacto.trianalab.io/apply-ref

  - it: holds an Argo CD Application's targetRevision to the promoter and break-glass when enabled
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    set:
      argocd.enabled: true
    asserts:
      - hasDocuments:
          count: 14
      - equal:
          path: spec.matchConstraints.resourceRules[0].resources
          value: [applications]
        documentIndex: 8
      - equal:
          path: spec.matchConstraints.objectSelector.matchExpressions[0].key
          value: delivery.pacto.trianalab.io/apply-ref
        documentIndex: 8
      - matchRegex:
          path: spec.validations[0].expression
          pattern: "request\\.userInfo\\.username == 'system:serviceaccount:pacto-delivery:d-pacto-delivery'"
        documentIndex: 8

  - it: renders nothing when disabled on purpose
    set:
      admissionPolicies.enabled: false
      admissionPolicies.allowUnguarded: true
    asserts:
      - hasDocuments:
          count: 0

  - it: refuses to render unguarded by accident
    set:
      admissionPolicies.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "leaves every actor, approver and the pointer unguarded"

  - it: renders the policies without cluster capabilities, so an offline render keeps them
    asserts:
      - containsDocument:
          kind: ValidatingAdmissionPolicy
          apiVersion: admissionregistration.k8s.io/v1
          name: d-pacto-delivery-operation
          any: true

  - it: holds the promoter to labelled objects and the pointer field alone
    set:
      argocd.enabled: true
    asserts:
      - equal:
          path: spec.matchConditions[0].expression
          value: "request.userInfo.username == 'system:serviceaccount:pacto-delivery:d-pacto-delivery'"
        documentIndex: 10
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "k == 'digest'"
        documentIndex: 10
      - equal:
          path: spec.matchConstraints.resourceRules[0].resources
          value: [applications]
        documentIndex: 12
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "k == 'targetRevision'"
        documentIndex: 12

  - it: keeps the record fields to the recorder, and the recorder away from what runs
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    set:
      recorder.enabled: true
    asserts:
      - hasDocuments:
          count: 12
      - equal:
          path: spec.variables[0].expression
          value: "request.userInfo.username == 'system:serviceaccount:pacto-delivery:d-pacto-delivery-recorder'"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[0].expression
          pattern: "has\\(object.status.stream.head\\) \\? object.status.stream.head : ''\\) == \\(has\\(oldObject.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "^!variables.recorder \\|\\|"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.pointer\\) \\? object\\.status\\.pointer : ''\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.frozen\\) \\? object\\.status\\.frozen : false\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.lastOp\\) \\? object\\.status\\.lastOp : ''\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.stream\\.seq\\) \\? object\\.status\\.stream\\.seq : 0\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.phase\\) \\? object\\.status\\.phase : ''\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.outcome\\) \\? object\\.status\\.outcome : ''\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.seq\\) \\? object\\.status\\.seq : 0\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.locks\\) \\? object\\.status\\.locks : \\{\\}\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.verified\\) \\? object\\.status\\.verified : \\[\\]\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.failedDigests\\) \\? object\\.status\\.failedDigests : \\[\\]\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.frozenReason\\) \\? object\\.status\\.frozenReason : ''\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.autoHold\\) \\? object\\.status\\.autoHold : false\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.autoRollbacks\\) \\? object\\.status\\.autoRollbacks : \\{\\}\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.stream\\.id\\) \\? object\\.status\\.stream\\.id : ''\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.stream\\.concluded\\) \\? object\\.status\\.stream\\.concluded : \\[\\]\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.published\\) \\? object\\.status\\.published : \\[\\]\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.offered\\) \\? object\\.status\\.offered : \\[\\]\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.candidate\\) \\? object\\.status\\.candidate : ''\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.lastCheck\\) \\? object\\.status\\.lastCheck : \\{\\}\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.verdicts\\) \\? object\\.status\\.verdicts : \\[\\]\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.approvals\\) \\? object\\.status\\.approvals : \\[\\]\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.policy\\) \\? object\\.status\\.policy : \\{\\}\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.verification\\) \\? object\\.status\\.verification : ''\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.reason\\) \\? object\\.status\\.reason : ''\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.times\\) \\? object\\.status\\.times : \\{\\}\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.applied\\) \\? object\\.status\\.applied : false\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.stageUID\\) \\? object\\.status\\.stageUID : ''\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.plan\\) \\? object\\.status\\.plan : \\{\\}\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.actorClass\\) \\? object\\.status\\.actorClass : ''\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.question\\) \\? object\\.status\\.question : ''\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "has\\(object\\.status\\.message\\) \\? object\\.status\\.message : ''\\) == \\(has\\(oldObject\\.status\\)"
        documentIndex: 8
