suite: recorder tests
templates:
  - templates/recorder.yaml
  - templates/deployment.yaml
  - templates/monitoring.yaml
release:
  name: d
  namespace: pacto-delivery
tests:
  - it: is off by default and leaves the promoter alone
    asserts:
      - hasDocuments:
          count: 0
        template: templates/recorder.yaml
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --records
        template: templates/deployment.yaml

  - it: runs the recorder with an Ed25519 key and hands the finalizer over
    set:
      recorder.enabled: true
      recorder.streamsRepository: registry.example/pacto/streams
      recorder.signing.ed25519.secretName: recorder-key
      recorder.registryCredentials.secretName: recorder-push
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --records
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - recorder
            - --leader-elect=true
            - --poll=30s
            - --streams-repository=registry.example/pacto/streams
            - --signing-key-file=/etc/pacto/signing/key.pem
        template: templates/recorder.yaml
        documentSelector: {path: kind, value: Deployment}
      - equal:
          path: spec.strategy.type
          value: Recreate
        template: templates/recorder.yaml
        documentSelector: {path: kind, value: Deployment}
      - equal:
          path: spec.template.spec.serviceAccountName
          value: d-pacto-delivery-recorder
        template: templates/recorder.yaml
        documentSelector: {path: kind, value: Deployment}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: DOCKER_CONFIG, value: /etc/pacto/registry}
        template: templates/recorder.yaml
        documentSelector: {path: kind, value: Deployment}
      - contains:
          path: spec.template.spec.volumes
          content:
            name: registry
            secret:
              secretName: recorder-push
              items: [{key: .dockerconfigjson, path: config.json}]
        template: templates/recorder.yaml
        documentSelector: {path: kind, value: Deployment}

  - it: never gives the promoter the key or the push credentials
    set:
      recorder.enabled: true
      recorder.streamsRepository: r/s
      recorder.signing.ed25519.secretName: recorder-key
      recorder.registryCredentials.secretName: recorder-push
    template: templates/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.volumes
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: DOCKER_CONFIG, value: /etc/pacto/registry}

  - it: grants the recorder no write on what runs
    set:
      recorder.enabled: true
      recorder.streamsRepository: r/s
      recorder.signing.kms: awskms:///alias/pacto
    template: templates/recorder.yaml
    documentSelector: {path: kind, value: ClusterRole}
    asserts:
      - contains:
          path: rules
          content: {apiGroups: [source.toolkit.fluxcd.io], resources: [ocirepositories], verbs: [get]}
      - contains:
          path: rules
          content: {apiGroups: [delivery.pacto.trianalab.io], resources: [stages/status, operations/status], verbs: [get, update]}

  - it: signs with a KMS key or keyless
    set:
      recorder.enabled: true
      recorder.streamsRepository: r/s
      recorder.signing.keyless.enabled: true
      recorder.signing.keyless.identity: https://kubernetes.io/namespaces/pacto-delivery/serviceaccounts/d-pacto-delivery-recorder
      recorder.signing.keyless.issuer: https://issuer.example
      recorder.signing.keyless.fulcioURL: https://fulcio.example
      recorder.signing.keyless.timestampURL: https://tsa.example/api/v1/timestamp
      recorder.signing.keyless.trustedRoot: "{}"
    template: templates/recorder.yaml
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --keyless
      - contains:
          path: spec.template.spec.containers[0].args
          content: --keyless-issuer=https://issuer.example
      - contains:
          path: spec.template.spec.containers[0].args
          content: --keyless-fulcio-url=https://fulcio.example
      - contains:
          path: spec.template.spec.containers[0].args
          content: --keyless-timestamp-url=https://tsa.example/api/v1/timestamp
      - contains:
          path: spec.template.spec.containers[0].args
          content: --keyless-token-file=/var/run/sigstore/token/token
      - contains:
          path: spec.template.spec.containers[0].args
          content: --keyless-trusted-root=/etc/pacto/keyless/trusted_root.json
      - contains:
          path: spec.template.spec.volumes
          content: {name: keyless, configMap: {name: d-pacto-delivery-recorder-keyless}}
      - contains:
          path: spec.template.spec.volumes
          content: {name: sigstore-token, projected: {sources: [{serviceAccountToken: {audience: sigstore, expirationSeconds: 600, path: token}}]}}

  - it: hands the keyless trusted root over in a ConfigMap
    set:
      recorder.enabled: true
      recorder.streamsRepository: r/s
      recorder.signing.keyless.enabled: true
      recorder.signing.keyless.identity: id
      recorder.signing.keyless.issuer: iss
      recorder.signing.keyless.fulcioURL: https://fulcio.example
      recorder.signing.keyless.timestampURL: https://tsa.example
      recorder.signing.keyless.trustedRoot: '{"mediaType":"x"}'
    template: templates/recorder.yaml
    documentSelector: {path: metadata.name, value: d-pacto-delivery-recorder-keyless}
    asserts:
      - equal:
          path: data["trusted_root.json"]
          value: '{"mediaType":"x"}'

  - it: refuses keyless without a timestamp authority
    set:
      recorder.enabled: true
      recorder.streamsRepository: r/s
      recorder.signing.keyless.enabled: true
      recorder.signing.keyless.identity: id
      recorder.signing.keyless.issuer: iss
      recorder.signing.keyless.fulcioURL: https://fulcio.example
      recorder.signing.keyless.trustedRoot: "{}"
    template: templates/recorder.yaml
    asserts:
      - failedTemplate:
          errorMessage: recorder.signing.keyless needs identity, issuer, fulcioURL, timestampURL and trustedRoot

  - it: passes the KMS key
    set:
      recorder.enabled: true
      recorder.streamsRepository: r/s
      recorder.signing.kms: awskms:///alias/pacto
      insecureRegistries: [reg:5000]
    template: templates/recorder.yaml
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --kms-key=awskms:///alias/pacto
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: PACTO_INSECURE_REGISTRIES, value: "reg:5000"}

  - it: refuses no streams repository
    set:
      recorder.enabled: true
      recorder.signing.kms: k
    template: templates/recorder.yaml
    asserts:
      - failedTemplate:
          errorPattern: streamsRepository is required

  - it: refuses no signer or two
    set:
      recorder.enabled: true
      recorder.streamsRepository: r/s
      recorder.signing.kms: k
      recorder.signing.ed25519.secretName: s
    template: templates/recorder.yaml
    asserts:
      - failedTemplate:
          errorPattern: exactly one

  - it: refuses keyless without identity and issuer
    set:
      recorder.enabled: true
      recorder.streamsRepository: r/s
      recorder.signing.keyless.enabled: true
    template: templates/recorder.yaml
    asserts:
      - failedTemplate:
          errorPattern: identity, issuer, fulcioURL, timestampURL and trustedRoot

  - it: refuses keyless without a trusted root
    set:
      recorder.enabled: true
      recorder.streamsRepository: r/s
      recorder.signing.keyless.enabled: true
      recorder.signing.keyless.identity: id
      recorder.signing.keyless.issuer: iss
      recorder.signing.keyless.fulcioURL: https://fulcio.example
      recorder.signing.keyless.timestampURL: https://tsa.example
    template: templates/recorder.yaml
    asserts:
      - failedTemplate:
          errorPattern: identity, issuer, fulcioURL, timestampURL and trustedRoot

  - it: hands the promoter the operation TTL and the delete it needs
    set:
      recorder.enabled: true
      recorder.streamsRepository: r/s
      recorder.signing.kms: awskms:///alias/pacto
      recorder.operationTTL: 24h
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --recorded-ttl=24h
        template: templates/deployment.yaml

  - it: mounts the trust config and passes the CDEvents sink
    set:
      recorder.enabled: true
      recorder.streamsRepository: r/s
      recorder.signing.kms: awskms:///alias/pacto
      recorder.trust: "keys: []"
      recorder.cdeventsSink: http://events.example/cdevents
    template: templates/recorder.yaml
    asserts:
      - equal:
          path: data["trust.yaml"]
          value: "keys: []"
        documentSelector: {path: kind, value: ConfigMap}
      - contains:
          path: spec.template.spec.containers[0].args
          content: --trust-config=/etc/pacto/trust/trust.yaml
        documentSelector: {path: kind, value: Deployment}
      - contains:
          path: spec.template.spec.containers[0].args
          content: --cdevents-sink=http://events.example/cdevents
        documentSelector: {path: kind, value: Deployment}
      - contains:
          path: spec.template.spec.volumes
          content: {name: trust, configMap: {name: d-pacto-delivery-recorder-trust}}
        documentSelector: {path: kind, value: Deployment}

  - it: ships no monitoring unless asked
    template: templates/monitoring.yaml
    set:
      recorder.enabled: true
      recorder.streamsRepository: registry.example/pacto/streams
      recorder.signing.ed25519.secretName: recorder-key
    asserts:
      - hasDocuments:
          count: 0

  - it: scrapes the recorder and alerts when records fall behind
    template: templates/monitoring.yaml
    set:
      recorder.enabled: true
      recorder.streamsRepository: registry.example/pacto/streams
      recorder.signing.ed25519.secretName: recorder-key
      recorder.monitoring.enabled: true
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: spec.ports[0].targetPort
          value: metrics
        documentSelector: {path: kind, value: Service}
      - equal:
          path: spec.endpoints[0].port
          value: metrics
        documentSelector: {path: kind, value: ServiceMonitor}
      - equal:
          path: spec.groups[0].rules[0].expr
          value: max by (stream) (pacto_delivery_records_pending) > 0
        documentSelector: {path: kind, value: PrometheusRule}
      - equal:
          path: spec.groups[0].rules[1].expr
          value: absent(up{job="d-pacto-delivery-recorder-metrics"} == 1)
        documentSelector: {path: kind, value: PrometheusRule}
