# -- Number of promoter replicas. Only the elected leader acts.
replicaCount: 1

image:
  # -- Promoter image repository (the pacto-delivery image)
  repository: ghcr.io/trianalab/pacto/delivery
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag (default is the chart appVersion)
  tag: ""

# -- Image pull secrets for private registries
imagePullSecrets: []
# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

serviceAccount:
  # -- Create a ServiceAccount for the promoter
  create: true
  # -- Annotations to add to the ServiceAccount
  annotations: {}
  # -- Name override (defaults to fullname)
  name: ""

promoter:
  # -- How often an operation waiting on Flux, Pacto or a person is looked at (a Go duration)
  poll: 3s
  # -- How old a person's login may be when their approval is given; an older one is ignored (a Go duration)
  authFreshness: 15m
  # -- Elect one active promoter
  leaderElect: true
  # -- The recorder keys of other clusters, as a trust config in YAML (keys per stream glob). A Stage
  # with `candidates.upstreamRecords` promotes only on records one of these keys signed for that
  # stream; without it such a Stage is not Ready. Public keys only.
  upstreamTrust: ""
  registryCredentials:
    # -- A `kubernetes.io/dockerconfigjson` Secret with read access to the contract and deploy
    # repositories, for a private registry. Without it the promoter reads only public ones.
    secretName: ""

gates:
  # -- Health gate providers a Stage may name in `spec.gates.verify.checks[].provider`, each
  # `{name, type, url}` with type `mira` (Mira's query API), `http` (any tool behind the
  # plug-in format) or `eval` (an eval runner for an AI agent's eval suite). The URL is operator configuration: a Stage only names a provider and an
  # agent names nothing. `pacto.contract` and `pacto.runtime` are built in.
  providers: []

identities:
  # -- Groups whose members are agents. Agents may propose, never approve or unfreeze.
  # Service accounts other than the promoter are always agents.
  agentGroups:
    - pacto:agents
  # -- Groups that may raise an override and edit an OCIRepository's spec.ref.digest directly
  breakGlassGroups:
    - pacto:break-glass
  # -- Only members of the teams a held question names may answer it. A contract owner team `T`
  # is the identity-provider group `T`, or once this prefix is set only this prefix followed by `T`
  # (for example `acme:`). A `system:` group is never a team.
  teamGroupPrefix: ""

recorder:
  # -- Run the recorder, which writes a signed record of every concluded operation to the registry
  # as OCI referrers. Off by default. When on, the promoter leaves the record finalizer to it. The
  # registry must support the OCI Referrers API natively (GHCR and released `distribution` do not).
  enabled: false
  # -- Repository (`host/path`) that holds one anchor per Stage stream. Required when enabled.
  streamsRepository: ""
  # -- How long a registry or signer failure backs off (a Go duration)
  poll: 30s
  # -- Elect one active recorder
  leaderElect: true
  serviceAccount:
    # -- Create a ServiceAccount for the recorder
    create: true
    # -- Annotations to add to the recorder's ServiceAccount (workload identity for KMS or keyless)
    annotations: {}
    # -- Name override (defaults to fullname-recorder)
    name: ""
  registryCredentials:
    # -- A `kubernetes.io/dockerconfigjson` Secret with push access to the streams, apply and contract
    # repositories. Only the recorder mounts it.
    secretName: ""
  signing:
    ed25519:
      # -- A Secret holding a PKCS#8 PEM Ed25519 private key (for kind and tests)
      secretName: ""
      # -- The key in that Secret
      key: key.pem
    # -- A KMS key URI (`awskms://`, `gcpkms://`, `azurekms://`, `hashivault://`). The default image
    # includes every provider; an image built with `--build-arg GO_TAGS=` has none, and one built with
    # `GO_TAGS=kms_aws` (or `kms_gcp`, `kms_azure`, `kms_hashivault`) has only that one
    kms: ""
    keyless:
      # -- Sign keyless with a Fulcio certificate for the recorder's workload identity, presented as a
      # projected service account token for the `sigstore` audience. Rekor upload is off; a timestamp
      # authority dates each signature.
      enabled: false
      # -- The certificate identity keyless signing produces
      identity: ""
      # -- The OIDC issuer keyless signing uses
      issuer: ""
      # -- The Fulcio that issues the certificate
      fulcioURL: ""
      # -- The timestamp authority whose signed time a short-lived certificate verifies at
      timestampURL: ""
      # -- The Sigstore trusted root (`trusted_root.json`) naming that Fulcio and timestamp authority.
      # Required with keyless: without it a self-signed certificate could name the recorder's identity.
      trustedRoot: ""
  # -- Keep a recorded operation this long after it concluded, then delete it: its record holds what
  # happened. The operation a Stage runs is never deleted. `0s` keeps them all (a Go duration).
  operationTTL: 168h
  # -- Other keys whose records the recorder accepts, as a trust config in YAML
  # (`keys: [{publicKey: <PEM>, streams: ["*/prod/*"]}]`): list the old key here while you rotate to a
  # new one, and set `untilSeq` and `untilRecord` on a leaked key to revoke it after the last record it
  # signed. The recorder's own key is always trusted. A record no listed key signed is skipped as
  # untrusted.
  trust: ""
  # -- A URL the recorder POSTs a CDEvent (CloudEvents, structured mode) to for every record, best
  # effort. Empty sends none.
  cdeventsSink: ""
  monitoring:
    # -- Scrape the recorder's metrics and alert when records fall behind: a metrics Service, a
    # ServiceMonitor and a PrometheusRule. Needs the Prometheus Operator CRDs.
    enabled: false
  # -- Extra environment for the recorder (for example the credentials a KMS client reads)
  extraEnv: []
  resources:
    limits:
      # -- CPU limit
      cpu: 500m
      # -- Memory limit
      memory: 256Mi
    requests:
      # -- CPU request
      cpu: 10m
      # -- Memory request
      memory: 64Mi

argocd:
  # -- Let Stages name an Argo CD Application as their applier (`spec.applyRef.kind: Application`).
  # Grants the promoter patch on `argoproj.io` Applications (it only sets `spec.source.targetRevision`,
  # and the pointer admission policy holds it to that) and read access to the agent, approver and
  # recorder roles. Off by default.
  enabled: false

# -- Registry hosts (`host:port`) the promoter and the recorder reach over plain HTTP. An
# OCIRepository with `spec.insecure: true` is read over HTTP anyway.
insecureRegistries: []

# -- Install the ValidatingAdmissionPolicies (Kubernetes 1.30 or later): an operation's
# actor is the requesting user, only the promoter may set witnessed, override and
# unfreeze are limited to their raisers, cancel is refused once the pointer moved,
# approvals come from people and spec.ref.digest is edited only by the promoter or
# break-glass. The promoter admits no operation and counts no approval while
# its operation and approval policies are missing.
admissionPolicies:
  enabled: true
  # -- Render without the policies (enabled=false) anyway. Without them anyone who
  # may create an Operation or an Approval can claim to be anyone, so the chart
  # refuses enabled=false unless this is set.
  allowUnguarded: false

podSecurityContext:
  # -- Run pod as non-root
  runAsNonRoot: true
  seccompProfile:
    # -- Seccomp profile type
    type: RuntimeDefault

securityContext:
  # -- Disallow privilege escalation
  allowPrivilegeEscalation: false
  capabilities:
    # -- Drop all capabilities
    drop:
      - ALL
  # -- Read-only root filesystem
  readOnlyRootFilesystem: true
  # -- Run as non-root
  runAsNonRoot: true
  # -- Run as UID 65532 (nonroot in distroless)
  runAsUser: 65532

resources:
  limits:
    # -- CPU limit
    cpu: 500m
    # -- Memory limit
    memory: 256Mi
  requests:
    # -- CPU request
    cpu: 10m
    # -- Memory request
    memory: 64Mi

# -- Node selector for the promoter pod
nodeSelector: {}
# -- Tolerations for the promoter pod
tolerations: []
# -- Affinity for the promoter pod
affinity: {}
