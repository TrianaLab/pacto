{{- $inventory := .Values.clusterInventory | default dict }}
{{- if dig "enabled" false $inventory }}
{{- $fullname := include "pacto-operator.fullname" . }}
{{- $labels := include "pacto-operator.labels" . }}
{{- range dig "secretNamespaces" list $inventory | uniq | sortAlpha }}
# clusterInventory.secretNamespaces names {{ . }}: the operator lists Secret
# metadata here for Argo CD cluster Secrets and Flux kubeconfig Secrets.
# list only, never get: no Secret data is requested.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-cluster-inventory
  namespace: {{ . }}
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [list]
---
{{ include "pacto-operator.binding" (dict "kind" "RoleBinding" "name" (printf "%s-cluster-inventory" $fullname) "namespace" . "labels" $labels "serviceAccount" (include "pacto-operator.serviceAccountName" $) "serviceAccountNamespace" $.Release.Namespace) }}
---
{{- end }}
{{- end }}
