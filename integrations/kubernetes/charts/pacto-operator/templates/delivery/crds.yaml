{{- if .Values.delivery.enabled }}
{{- include "pacto-operator.delivery.gate" . }}
{{- /*
The delivery CRDs (Stage, Operation, Approval) are templates, not crds/: Helm
installs crds/ unconditionally and never upgrades them, while a template
follows delivery.enabled and helm upgrade updates it. resource-policy keep
leaves them, and the delivery history they hold, in place on helm uninstall.
*/}}
{{- range $path, $_ := .Files.Glob "files/delivery-crds/*.yaml" }}
{{- $crd := $.Files.Get $path | fromYaml }}
{{- $_ := set $crd.metadata "annotations" (merge (dict "helm.sh/resource-policy" "keep") ($crd.metadata.annotations | default dict)) }}
---
{{ toYaml $crd }}
{{- end }}
{{- end }}
