{{- if .Values.delivery.enabled }}
{{- with .Values.delivery.promoter.upstreamTrust }}
# The recorder keys of other clusters whose records an upstreamRecords Stage
# promotes on, per stream glob. Public keys only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pacto-operator.delivery.fullname" $ }}-upstream-trust
  namespace: {{ include "pacto-operator.delivery.namespace" $ }}
  labels:
    app.kubernetes.io/component: delivery-promoter
    {{- include "pacto-operator.delivery.labels" $ | nindent 4 }}
data:
  trust.yaml: {{ . | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pacto-operator.delivery.fullname" . }}
  namespace: {{ include "pacto-operator.delivery.namespace" . }}
  labels:
    app.kubernetes.io/component: delivery-promoter
    {{- include "pacto-operator.delivery.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.delivery.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: delivery-promoter
      {{- include "pacto-operator.delivery.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: delivery-promoter
        {{- include "pacto-operator.delivery.labels" . | nindent 8 }}
      annotations:
        # The promoter reads its identity policy once: a change restarts it.
        checksum/identities: {{ include "pacto-operator.delivery.identitiesJSON" . | sha256sum }}
    spec:
      {{- with .Values.delivery.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pacto-operator.delivery.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.delivery.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 10
      containers:
        - name: promoter
          image: {{ include "pacto-operator.delivery.image" . | quote }}
          imagePullPolicy: {{ .Values.delivery.image.pullPolicy }}
          args:
            - promoter
            - --leader-elect={{ .Values.delivery.promoter.leaderElect }}
            - --poll={{ .Values.delivery.promoter.poll }}
            - --workers={{ .Values.delivery.promoter.workers }}
            - --auth-freshness={{ .Values.delivery.promoter.authFreshness }}
            - --controller-user={{ include "pacto-operator.delivery.controllerUser" . }}
            - --identities=/etc/pacto/identities/policy.json
            {{- if .Values.delivery.admissionPolicies.enabled }}
            {{- $fullname := include "pacto-operator.delivery.fullname" . }}
            {{- $policies := list "operation" "cancel" "approval" "pointer" "applier" "promoter-writes" }}
            {{- if .Values.delivery.argocd.enabled }}{{ $policies = concat $policies (list "pointer-argocd" "promoter-writes-argocd") }}{{ end }}
            {{- if .Values.delivery.recorder.enabled }}{{ $policies = append $policies "records" }}{{ end }}
            - --admission-policies={{ range $i, $p := $policies }}{{ if $i }},{{ end }}{{ $fullname }}-{{ $p }}{{ end }}
            {{- end }}
            {{- if .Values.delivery.recorder.enabled }}
            - --records
            - --recorded-ttl={{ .Values.delivery.recorder.operationTTL }}
            {{- end }}
            {{- with .Values.delivery.gates.providers }}
            - {{ printf "--gate-providers=%s" (toJson .) | quote }}
            {{- end }}
            {{- if .Values.delivery.promoter.upstreamTrust }}
            - --upstream-trust-config=/etc/pacto/upstream-trust/trust.yaml
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.delivery.promoter.registryCredentials.secretName }}
            - name: DOCKER_CONFIG
              value: /etc/pacto/registry
            {{- end }}
            {{- with .Values.delivery.insecureRegistries }}
            - name: PACTO_INSECURE_REGISTRIES
              value: {{ join "," . | quote }}
            {{- end }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.delivery.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.delivery.resources | nindent 12 }}
          {{- $creds := .Values.delivery.promoter.registryCredentials.secretName }}
          volumeMounts:
            {{- if .Values.delivery.promoter.upstreamTrust }}
            - name: upstream-trust
              mountPath: /etc/pacto/upstream-trust
              readOnly: true
            {{- end }}
            {{- if $creds }}
            - name: registry
              mountPath: /etc/pacto/registry
              readOnly: true
            {{- end }}
            - name: identities
              mountPath: /etc/pacto/identities
              readOnly: true
      volumes:
        {{- if .Values.delivery.promoter.upstreamTrust }}
        - name: upstream-trust
          configMap:
            name: {{ include "pacto-operator.delivery.fullname" . }}-upstream-trust
        {{- end }}
        {{- if $creds }}
        - name: registry
          secret:
            secretName: {{ $creds }}
            items:
              - key: .dockerconfigjson
                path: config.json
        {{- end }}
        - name: identities
          configMap:
            name: pacto-delivery-identities
      {{- with .Values.delivery.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.delivery.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.delivery.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
