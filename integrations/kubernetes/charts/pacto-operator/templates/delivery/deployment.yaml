{{- if include "pacto-operator.deliveryEnabled" . }}
{{- include "pacto-operator.delivery.gate" . }}
{{- $stats := .Values.delivery.stats }}
{{- if and $stats.registryCredentials.secretName (not $stats.repository) }}
{{- fail "delivery.stats.registryCredentials.secretName needs delivery.stats.repository: set the repository the promoter records to, or remove the Secret" }}
{{- end }}
{{- $pubs := .Values.delivery.publishers | default dict }}
{{- if and (dig "policy" "" $pubs) (not (dig "policySigners" "" $pubs)) }}
{{- fail "delivery.publishers.policy needs delivery.publishers.policySigners: the trust config whose role: policy keys sign it" }}
{{- end }}
{{- $pubData := include "pacto-operator.delivery.publishersData" . }}
{{- /* Pins and the recorder's trust config only with a publishers block, so reused 6.x values render the args they had. */}}
{{- $pins := and (include "pacto-operator.recorderEnabled" .) (kindIs "map" .Values.delivery.publishers) }}
{{- with .Values.delivery.promoter.upstreamTrust }}
# The recorder keys of other clusters whose records an upstreamRecords Stage
# promotes on, per stream glob. Public keys only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pacto-operator.delivery.fullname" $ }}-upstream-trust
  namespace: {{ include "pacto-operator.delivery.namespace" $ }}
  labels:
    {{- include "pacto-operator.delivery.labels" (dict "ctx" $ "component" "delivery-promoter") | nindent 4 }}
data:
  trust.yaml: {{ . | quote }}
---
{{- end }}
{{- $fingerprints := include "pacto-operator.fingerprints" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pacto-operator.delivery.fullname" . }}
  namespace: {{ include "pacto-operator.delivery.namespace" . }}
  labels:
    {{- include "pacto-operator.delivery.labels" (dict "ctx" . "component" "delivery-promoter") | nindent 4 }}
spec:
  replicas: {{ .Values.delivery.replicaCount }}
  selector:
    matchLabels:
      {{- include "pacto-operator.delivery.selectorLabels" (dict "ctx" . "component" "delivery-promoter") | nindent 6 }}
  template:
    metadata:
      {{- /* The promoter reads its identity policy and fingerprints once: a change restarts it. */}}
      {{- $checksum := dict "checksum/identities" (include "pacto-operator.delivery.identitiesJSON" . | sha256sum) }}
      {{- if $fingerprints }}{{ $_ := set $checksum "checksum/fingerprints" ($fingerprints | sha256sum) }}{{ end }}
      {{- with $pubData }}{{ $_ := set $checksum "checksum/publishers" (sha256sum .) }}{{ end }}
      {{- include "pacto-operator.podMetadata" (dict "ctx" . "values" .Values.delivery "labels" (include "pacto-operator.delivery.labels" (dict "ctx" . "component" "delivery-promoter")) "annotations" $checksum) | trim | nindent 6 }}
    spec:
      {{- include "pacto-operator.podSpec" (dict "ctx" . "values" .Values.delivery "serviceAccountName" (include "pacto-operator.delivery.serviceAccountName" .)) | trim | nindent 6 }}
      containers:
        - name: promoter
          {{- include "pacto-operator.image" (dict "ctx" . "image" .Values.delivery.image) | nindent 10 }}
          args:
            - promoter
            - --leader-elect={{ .Values.delivery.promoter.leaderElect }}
            - --poll={{ .Values.delivery.promoter.poll }}
            - --resync={{ .Values.delivery.promoter.resync }}
            - --workers={{ .Values.delivery.promoter.workers }}
            - --auth-freshness={{ .Values.delivery.promoter.authFreshness | default "0" }}
            - --controller-user={{ include "pacto-operator.delivery.controllerUser" . }}
            - --identities=/etc/pacto/identities/policy.json
            {{- $argocd := include "pacto-operator.delivery.argocd" . }}
            {{- $fluxHelm := include "pacto-operator.delivery.fluxHelm" . }}
            {{- if $argocd }}
            - --argocd
            {{- end }}
            {{- if not (include "pacto-operator.delivery.flux" .) }}
            - --flux=false
            {{- end }}
            {{- if $fluxHelm }}
            - --flux-helm
            {{- end }}
            {{- with dig "environments" dict .Values.delivery }}
            - --environments={{ dig "enabled" false . }}
            {{- end }}
            {{- if include "pacto-operator.delivery.environments" . }}
            - --environment-ladder={{ join "," .Values.delivery.environments.ladder }}
            {{- if or .Values.delivery.recorder.approvalsRepository (include "pacto-operator.delivery.streamsRepository" .) }}
            - --ladder-repository={{ include "pacto-operator.delivery.approvalsRepository" . }}
            {{- end }}
            {{- if include "pacto-operator.delivery.createAppliers" . }}
            - --environment-create-appliers
            - --environment-deployer-role={{ include "pacto-operator.delivery.fullname" . }}-deployer
            {{- end }}
            {{- if include "pacto-operator.delivery.createNamespaces" . }}
            - --environment-create-namespaces
            {{- end }}
            {{- with dig "environments" "retireAfter" "" .Values.delivery }}
            - --environment-retire-after={{ . }}
            {{- end }}
            {{- with .Values.delivery.recorder.cdeventsSink }}
            - {{ printf "--cdevents-sink=%s" . | quote }}
            {{- end }}
            {{- end }}
            {{- $fullname := include "pacto-operator.delivery.fullname" . }}
            {{- $policies := list "operation" "cancel" "approval" "pointer" "applier" "promoter-writes" "status" }}
            {{- if $argocd }}{{ $policies = concat $policies (list "pointer-argocd" "promoter-writes-argocd") }}{{ end }}
            {{- if $fluxHelm }}{{ $policies = append $policies "applier-helmrelease" }}{{ end }}
            {{- if include "pacto-operator.recorderEnabled" . }}{{ $policies = append $policies "records" }}{{ end }}
            - --admission-policies={{ range $i, $p := $policies }}{{ if $i }},{{ end }}{{ $fullname }}-{{ $p }}{{ end }}
            {{- if include "pacto-operator.recorderEnabled" . }}
            - --records
            - --recorded-ttl={{ .Values.delivery.recorder.operationTTL }}
            {{- end }}
            {{- with .Values.delivery.gates.providers }}
            - {{ printf "--gate-providers=%s" (toJson .) | quote }}
            {{- end }}
            {{- if .Values.delivery.promoter.upstreamTrust }}
            - --upstream-trust-config=/etc/pacto/upstream-trust/trust.yaml
            {{- end }}
            {{- with dig "registry" "" $pubs }}
            - --publishers-registry={{ . }}
            - --publishers-default-branch={{ dig "defaultBranch" "" $pubs | default "main" }}
            {{- end }}
            {{- if dig "trustedRoot" "" $pubs }}
            - --publishers-trusted-root=/etc/pacto/publishers/trusted_root.json
            {{- end }}
            {{- with dig "policy" "" $pubs }}
            - --publishers-policy={{ . }}
            - --publishers-policy-signers=/etc/pacto/publishers/policy-signers.yaml
            {{- end }}
            {{- if $pins }}
            - --records-repository={{ include "pacto-operator.delivery.streamsRepository" . }}
            {{- if include "pacto-operator.delivery.pinSigner" . }}
            - --pin-signer-config=/etc/pacto/publishers/pin-signer.yaml
            {{- end }}
            {{- if .Values.delivery.recorder.trust }}
            - --record-trust-config=/etc/pacto/record-trust/trust.yaml
            {{- end }}
            {{- end }}
            {{- with .Values.registry }}
            - --registry={{ . }}
            {{- end }}
            {{- with $stats.repository }}
            - --stats-repository={{ . }}
            {{- end }}
            {{- if $fingerprints }}
            - --fingerprints=/etc/pacto/fingerprints/fingerprints.yaml
            {{- end }}
            {{- if $stats.registryCredentials.secretName }}
            - --stats-docker-config=/etc/pacto/stats-registry
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.delivery.promoter.registryCredentials.secretName }}
            - name: DOCKER_CONFIG
              value: /etc/pacto/registry
            {{- end }}
            {{- if .Values.delivery.gates.caBundle.configMap }}
            # Read on top of the image's roots in /etc/ssl/certs.
            - name: SSL_CERT_FILE
              value: /etc/pacto/ca/{{ .Values.delivery.gates.caBundle.key }}
            {{- end }}
            {{- with .Values.delivery.insecureRegistries }}
            - name: PACTO_INSECURE_REGISTRIES
              value: {{ join "," . | quote }}
            {{- end }}
          {{- include "pacto-operator.ports" (dict "metrics" 8080) | nindent 10 }}
          {{- include "pacto-operator.probes" dict | nindent 10 }}
          {{- include "pacto-operator.securityContext" (dict "ctx" . "values" .Values.delivery) | nindent 10 }}
          resources:
            {{- toYaml .Values.delivery.resources | nindent 12 }}
          {{- $creds := .Values.delivery.promoter.registryCredentials.secretName }}
          volumeMounts:
            {{- if .Values.delivery.promoter.upstreamTrust }}
            - name: upstream-trust
              mountPath: /etc/pacto/upstream-trust
              readOnly: true
            {{- end }}
            {{- if $pubData }}
            - name: publishers
              mountPath: /etc/pacto/publishers
              readOnly: true
            {{- end }}
            {{- if and $pins .Values.delivery.recorder.trust }}
            - name: record-trust
              mountPath: /etc/pacto/record-trust
              readOnly: true
            {{- end }}
            {{- if $creds }}
            - name: registry
              mountPath: /etc/pacto/registry
              readOnly: true
            {{- end }}
            {{- if $stats.registryCredentials.secretName }}
            - name: stats-registry
              mountPath: /etc/pacto/stats-registry
              readOnly: true
            {{- end }}
            - name: identities
              mountPath: /etc/pacto/identities
              readOnly: true
            {{- if $fingerprints }}
            - name: fingerprints
              mountPath: /etc/pacto/fingerprints
              readOnly: true
            {{- end }}
            {{- if .Values.delivery.gates.caBundle.configMap }}
            - name: gate-ca
              mountPath: /etc/pacto/ca
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.delivery.promoter.upstreamTrust }}
        - name: upstream-trust
          configMap:
            name: {{ include "pacto-operator.delivery.fullname" . }}-upstream-trust
        {{- end }}
        {{- if $pubData }}
        - name: publishers
          configMap:
            name: {{ include "pacto-operator.delivery.fullname" . }}-publishers
        {{- end }}
        {{- if and $pins .Values.delivery.recorder.trust }}
        - name: record-trust
          configMap:
            name: {{ include "pacto-operator.delivery.recorderName" . }}-trust
        {{- end }}
        {{- if $creds }}
        - name: registry
          secret:
            secretName: {{ $creds }}
            items:
              - key: .dockerconfigjson
                path: config.json
        {{- end }}
        {{- with $stats.registryCredentials.secretName }}
        - name: stats-registry
          secret:
            secretName: {{ . }}
            items:
              - key: .dockerconfigjson
                path: config.json
        {{- end }}
        - name: identities
          configMap:
            name: pacto-delivery-identities
        {{- if $fingerprints }}
        - name: fingerprints
          configMap:
            name: {{ include "pacto-operator.delivery.fullname" . }}-fingerprints
        {{- end }}
        {{- with .Values.delivery.gates.caBundle }}
        {{- if .configMap }}
        - name: gate-ca
          configMap:
            name: {{ .configMap }}
            items:
              - key: {{ .key }}
                path: {{ .key }}
        {{- end }}
        {{- end }}
      {{- with include "pacto-operator.scheduling" .Values.delivery | trim }}
      {{- . | nindent 6 }}
      {{- end }}
{{- end }}
