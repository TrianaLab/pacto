{{- if include "pacto-operator.deliveryEnabled" . }}
# The promoter's identity policy, published for clients. The promoter mounts
# this ConfigMap and runs with it; `pacto delivery`, `pacto mcp --delivery` and
# the dashboard read it, so what they offer matches what the promoter and
# admission decide. Every authenticated user may read it: it names groups, no
# secret. The name is fixed so clients find it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pacto-delivery-identities
  namespace: {{ include "pacto-operator.delivery.namespace" . }}
  labels:
    {{- include "pacto-operator.delivery.labels" (dict "ctx" . "component" "delivery-promoter") | nindent 4 }}
data:
  policy.json: {{ include "pacto-operator.delivery.identitiesJSON" . | quote }}
  {{- /* The publisher trust config, so every client derives the rule the promoter judges with. */}}
  {{- with .Values.delivery.publishers }}
  {{- $json := dict "registry" (dig "registry" "" .) "defaultBranch" (dig "defaultBranch" "" . | default "main") "policy" (dig "policy" "" .) "policySigners" (dig "policySigners" "" .) "streamsRepository" (ternary (include "pacto-operator.delivery.streamsRepository" $) "" (not (empty (include "pacto-operator.recorderEnabled" $)))) "pinSigner" (include "pacto-operator.delivery.pinSigner" $) "trustedRoot" (not (empty (dig "trustedRoot" "" .))) }}
  publishers.json: {{ toJson $json | quote }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pacto-operator.delivery.fullname" . }}-identities-reader
  namespace: {{ include "pacto-operator.delivery.namespace" . }}
  labels:
    {{- include "pacto-operator.delivery.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [pacto-delivery-identities]
    verbs: [get]
---
{{ include "pacto-operator.binding" (dict "kind" "RoleBinding" "name" (printf "%s-identities-reader" (include "pacto-operator.delivery.fullname" .)) "namespace" (include "pacto-operator.delivery.namespace" .) "labels" (include "pacto-operator.delivery.labels" .) "group" "system:authenticated") }}
{{- end }}
