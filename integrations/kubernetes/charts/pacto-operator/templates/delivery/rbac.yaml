{{- if include "pacto-operator.deliveryEnabled" . }}
{{- if .Values.delivery.serviceAccount.create }}
{{- include "pacto-operator.serviceAccount" (dict "name" (include "pacto-operator.delivery.serviceAccountName" .) "namespace" (include "pacto-operator.delivery.namespace" .) "labels" (include "pacto-operator.delivery.labels" (dict "ctx" . "component" "delivery-promoter")) "sa" .Values.delivery.serviceAccount) }}
---
{{- end }}
# The promoter: it writes delivery status, raises its own operations, reads
# Flux, Pacto and the workloads Pacto checked, and sets spec.ref.digest on the
# OCIRepositories Stages point at. Its RBAC reaches every OCIRepository (and
# Application); the promoter-writes admission policies narrow that to labelled
# objects and the one pointer field. It holds no signing key and no registry
# push right.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pacto-operator.delivery.fullname" . }}-promoter
  labels:
    {{- include "pacto-operator.delivery.labels" (dict "ctx" . "component" "delivery-promoter") | nindent 4 }}
rules:
  - apiGroups: [delivery.pacto.trianalab.io]
    resources: [stages]
    verbs: [get, list, watch]
  - apiGroups: [delivery.pacto.trianalab.io]
    resources: [approvals]
    # patch: it makes each Approval's operation its owner, so they are
    # garbage collected together; the CRD keeps the spec as it was given.
    verbs: [get, list, watch, patch]
  - apiGroups: [delivery.pacto.trianalab.io]
    resources: [operations]
    # delete: with the recorder, a recorded operation is deleted after recorder.operationTTL.
    verbs: [get, list, watch, create, update, patch{{ if include "pacto-operator.recorderEnabled" . }}, delete{{ end }}]
  - apiGroups: [delivery.pacto.trianalab.io]
    resources: [stages/status, operations/status]
    verbs: [get, update, patch]
  # It checks its own admission policies are installed before trusting a spec.
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingadmissionpolicies, validatingadmissionpolicybindings]
    verbs: [get, list, watch]
  {{- if include "pacto-operator.delivery.flux" . }}
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [ocirepositories]
    verbs: [get, list, watch, patch]
  {{- end }}
  # It emits Events on the operations and Stages it holds, concludes, rolls
  # back and freezes.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  # It asks whether the author of an approval, unfreeze or acknowledge may
  # update the Stage's workload: only someone who may decides.
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
  {{- if include "pacto-operator.delivery.argocd" . }}
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, watch, patch]
  {{- end }}
  {{- if include "pacto-operator.delivery.flux" . }}
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list, watch]
  {{- end }}
  {{- if include "pacto-operator.delivery.fluxHelm" . }}
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list, watch]
  {{- end }}
  - apiGroups: [pacto.trianalab.io]
    resources: [pactos]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets, daemonsets]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get]
  {{- include "pacto-operator.rbac.clusterIdentityRule" . | nindent 2 }}
  {{- if include "pacto-operator.delivery.environments" . }}
  # It creates and updates the Stages of the installation ladder, and retires
  # them. The promoter-managed admission policy holds it to Stages labelled
  # delivery.pacto.trianalab.io/managed-by=pacto, and it acts only on the ones
  # its private state records it created.
  - apiGroups: [delivery.pacto.trianalab.io]
    resources: [stages]
    verbs: [create, patch, delete]
  # It proposes installation ladder rungs from the namespaces' names.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  # It refuses to place a service in a namespace holding workloads of another
  # or an unknown owner: it lists their metadata there.
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [list]
  {{- if include "pacto-operator.delivery.flux" . }}
  # It places a service where a Flux Kustomization deploys its verified source
  # repository, read from the Kustomization's GitRepository.
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories]
    verbs: [get, list, watch]
  {{- end }}
  {{- if include "pacto-operator.delivery.createNamespaces" . }}
  # It creates the namespace a service is placed in, labelled
  # managed-by=pacto (the promoter-managed policy holds it to that). It never
  # deletes one.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [create]
  {{- end }}
  {{- if include "pacto-operator.delivery.createAppliers" . }}
  # Under profile idp it creates, for a service no applier runs, the suspended
  # Flux objects of each environment and the service's deployer account,
  # bound to the -deployer ClusterRole alone: bind on that one role, never
  # escalate. promoter-managed holds every write to labelled objects.
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [ocirepositories]
    verbs: [get, create, patch, delete]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, create, patch, delete]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, create, patch, delete]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get, create, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, create, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [{{ include "pacto-operator.delivery.fullname" . }}-deployer]
    verbs: [bind]
  {{- end }}
  {{- end }}
---
{{ include "pacto-operator.binding" (dict "kind" "ClusterRoleBinding" "name" (printf "%s-promoter" (include "pacto-operator.delivery.fullname" .)) "labels" (include "pacto-operator.delivery.labels" (dict "ctx" . "component" "delivery-promoter")) "serviceAccount" (include "pacto-operator.delivery.serviceAccountName" .) "serviceAccountNamespace" (include "pacto-operator.delivery.namespace" .)) }}
{{- if include "pacto-operator.delivery.createAppliers" . }}
---
# What a service's deployer account may touch in its own namespace: the
# promoter binds it there with a RoleBinding when it creates the Flux objects
# of a service no applier runs (profile idp), and Flux applies each version as
# that account. Namespaced workload kinds only: nothing cluster-wide and
# nothing of Pacto delivery, Flux or RBAC. No ClusterRole names Secrets: a
# version that ships one applies once a person grants it with a Role there. Without it Flux applies as the
# namespace's default account, or as the controller, so anyone who can
# publish a version could have a ClusterRoleBinding applied with no person
# asked.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pacto-operator.delivery.fullname" . }}-deployer
  labels:
    {{- include "pacto-operator.delivery.labels" (dict "ctx" . "component" "delivery-promoter") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps, services, serviceaccounts, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [pacto.trianalab.io]
    resources: [pactos]
    verbs: [get, list, watch, create, update, patch, delete]
  # Flux checks a rollout's health as this account, reading its ReplicaSets,
  # Pods and Endpoints.
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, endpoints]
    verbs: [get, list, watch]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pacto-operator.delivery.fullname" . }}-leader-election
  namespace: {{ include "pacto-operator.delivery.namespace" . }}
  labels:
    {{- include "pacto-operator.delivery.labels" . | nindent 4 }}
rules:
  {{- include "pacto-operator.rbac.leaderElectionRules" . | nindent 2 }}
---
{{ include "pacto-operator.binding" (dict "kind" "RoleBinding" "name" (printf "%s-leader-election" (include "pacto-operator.delivery.fullname" .)) "namespace" (include "pacto-operator.delivery.namespace" .) "labels" (include "pacto-operator.delivery.labels" .) "serviceAccount" (include "pacto-operator.delivery.serviceAccountName" .) "serviceAccountNamespace" (include "pacto-operator.delivery.namespace" .)) }}
---
# Bind this to agents (their own service accounts, or the agent group): they
# may propose and read operations, cancel the ones they proposed (admission
# refuses the rest) and read Stages. It lets no one decide: the promoter's
# SubjectAccessReview on the Stage's workload does. Planning reads the
# Pactos and the Kustomizations, which place each consumer. No approvals, no
# status, no pointer.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pacto-operator.delivery.fullname" . }}-agent
  labels:
    {{- include "pacto-operator.delivery.labels" . | nindent 4 }}
rules:
  {{- include "pacto-operator.delivery.rbac.agentRules" (dict "ctx" .) | nindent 2 }}
---
# Everything an agent may do, plus creating Approvals. People with the built-in
# edit or admin role in a namespace already hold this there (the -edit role
# below aggregates into them); bind it only to grant Approval creation to
# someone without either. The promoter still counts an approval only from a
# person who may update the Stage's workload, and admission refuses one from a
# service account, a system user or an agent group, so binding it to an agent
# does not make it one.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pacto-operator.delivery.fullname" . }}-approver
  labels:
    {{- include "pacto-operator.delivery.labels" . | nindent 4 }}
rules:
  {{- include "pacto-operator.delivery.rbac.agentRules" (dict "ctx" . "approver" true) | nindent 2 }}
---
# Whoever may view a namespace (the built-in view, edit and admin roles) may
# read its delivery objects there. Delivery group only; no binding.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pacto-operator.delivery.fullname" . }}-view
  labels:
    {{- include "pacto-operator.delivery.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-view: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups: [delivery.pacto.trianalab.io]
    resources: [stages, operations, approvals]
    verbs: [get, list, watch]
---
# Whoever may edit a namespace (the built-in edit and admin roles, which also
# update its workloads) may approve and propose there. The promoter counts an
# approval only when a SubjectAccessReview says its author may update the
# Stage's workload, so the two agree for the common case.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pacto-operator.delivery.fullname" . }}-edit
  labels:
    {{- include "pacto-operator.delivery.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups: [delivery.pacto.trianalab.io]
    resources: [approvals]
    verbs: [create]
  - apiGroups: [delivery.pacto.trianalab.io]
    resources: [operations]
    verbs: [create, delete]
{{- end }}
