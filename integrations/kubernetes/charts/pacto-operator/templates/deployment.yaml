apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pacto-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pacto-operator.controller.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pacto-operator.controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "pacto-operator.podMetadata" (dict "ctx" . "values" .Values "labels" (include "pacto-operator.controller.labels" .)) | trim | nindent 6 }}
    spec:
      {{- include "pacto-operator.podSpec" (dict "ctx" . "values" .Values "serviceAccountName" (include "pacto-operator.serviceAccountName" .)) | trim | nindent 6 }}
      containers:
        - name: manager
          {{- include "pacto-operator.image" (dict "ctx" . "image" .Values.image) | nindent 10 }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPERATOR_DEPLOYMENT_NAME
              value: {{ include "pacto-operator.fullname" . }}
            {{- with .Values.insecureRegistries }}
            {{- /* Inherited by the managed dashboard and Evidence Server, which
                   resolve contract refs themselves. Per-host, so https registries
                   are unaffected. */}}
            - name: PACTO_INSECURE_REGISTRIES
              value: {{ join "," . | quote }}
            {{- end }}
          args:
            {{- include "pacto-operator.controllerArgs" . | nindent 12 }}
          {{- include "pacto-operator.ports" (dict "metrics" (and .Values.metrics.enabled .Values.metrics.service.port)) | nindent 10 }}
          {{- include "pacto-operator.probes" dict | nindent 10 }}
          {{- include "pacto-operator.securityContext" (dict "ctx" . "values" .Values) | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with include "pacto-operator.scheduling" .Values | trim }}
      {{- . | nindent 6 }}
      {{- end }}
