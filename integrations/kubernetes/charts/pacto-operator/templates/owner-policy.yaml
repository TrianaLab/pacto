{{- with include "pacto-operator.ownerPolicy.json" . }}
# Who may set a service owner (the declare block). Immutable and named after
# its content: only a chart upgrade changes the policy the operator mounts and
# publishes, and no Role in this chart writes it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pacto-operator.ownerPolicy.name" $ }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "pacto-operator.labels" $ | nindent 4 }}
immutable: true
data:
  policy.json: {{ . | quote }}
{{- end }}
