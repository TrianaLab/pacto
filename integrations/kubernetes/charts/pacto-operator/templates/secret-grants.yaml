{{- $byNamespace := dict }}
{{- range include "pacto-operator.secretGrants" . | fromYamlArray }}
{{- $_ := set $byNamespace .namespace (append (get $byNamespace .namespace | default list) .name) }}
{{- end }}
{{- $fullname := include "pacto-operator.fullname" . }}
{{- $labels := include "pacto-operator.labels" . }}
{{- range $ns, $names := $byNamespace }}
# The Secrets controller.secretGrants and registryPullSecret name in {{ $ns }}:
# pull secrets and Secrets that back a contract configuration. get by name only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-secret-grant
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
    resourceNames: {{ $names | sortAlpha | toJson }}
---
{{ include "pacto-operator.binding" (dict "kind" "RoleBinding" "name" (printf "%s-secret-grant" $fullname) "namespace" $ns "labels" $labels "serviceAccount" (include "pacto-operator.serviceAccountName" $) "serviceAccountNamespace" $.Release.Namespace) }}
---
{{- end }}
