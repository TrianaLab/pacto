{{- $namespaces := include "pacto-operator.watchNamespaces" . | fromYamlArray }}
{{- $fullname := include "pacto-operator.fullname" . }}
{{- $labels := include "pacto-operator.labels" . }}
{{- $sa := include "pacto-operator.serviceAccountName" . }}
{{- range $ns := $namespaces }}
# The operator's reads in a watched namespace (controller.watchNamespaces): the
# namespaced rules the cluster-wide install holds in its ClusterRole. Secrets
# get only, read through the uncached API reader: no Secret is listed or watched.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-watch
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [configmaps, pods, services]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch]
  - apiGroups: [pacto.trianalab.io]
    resources: [pactos]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [pacto.trianalab.io]
    resources: [pactos/status]
    verbs: [get, patch, update]
  - apiGroups: [pacto.trianalab.io]
    resources: [pactos/finalizers]
    verbs: [update]
  - apiGroups: [pacto.trianalab.io]
    resources: [pactorevisions]
    verbs: [create, get, list, watch]
  - apiGroups: [pacto.trianalab.io]
    resources: [pactorevisions/status]
    verbs: [get, patch, update]
  {{- if $.Values.controller.enableMetricsObservation }}
  - apiGroups: [monitoring.coreos.com]
    resources: [servicemonitors, podmonitors]
    verbs: [get, list, watch]
  {{- end }}
---
{{ include "pacto-operator.binding" (dict "kind" "RoleBinding" "name" (printf "%s-watch" $fullname) "namespace" $ns "labels" $labels "serviceAccount" $sa "serviceAccountNamespace" $.Release.Namespace) }}
---
{{- if $.Values.dashboard.enabled }}
# The managed dashboard's reads in a watched namespace. The chart creates this
# Role, so the operator needs no Role verbs here. It reviews people with
# LocalSubjectAccessReviews in the watched namespaces only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pacto-dashboard-watch
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [pacto.trianalab.io]
    resources: [pactos, pactorevisions]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch]
  - apiGroups: [authorization.k8s.io]
    resources: [localsubjectaccessreviews]
    verbs: [create]
---
{{ include "pacto-operator.binding" (dict "kind" "RoleBinding" "name" "pacto-dashboard-watch" "namespace" $ns "labels" $labels "serviceAccount" "pacto-dashboard" "serviceAccountNamespace" $.Release.Namespace) }}
---
{{- end }}
{{- end }}
{{- if and $namespaces (include "pacto-operator.kernelEvidence" .) }}
{{- $kernelNS := .Values.controller.kernelEvidence.namespace | default (include "pacto-operator.nodeAgentNamespace" .) }}
# The node agent's kernel observations and heartbeats, read through the cache
# in the kernel evidence namespace only. The prunes find the observations by
# label (list) and remove them (delete).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-kernel-reader
  namespace: {{ $kernelNS }}
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [pacto.trianalab.io]
    resources: [noderuntimeobservations]
    verbs: [delete, get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch]
---
{{ include "pacto-operator.binding" (dict "kind" "RoleBinding" "name" (printf "%s-kernel-reader" $fullname) "namespace" $kernelNS "labels" $labels "serviceAccount" $sa "serviceAccountNamespace" .Release.Namespace) }}
{{- end }}
