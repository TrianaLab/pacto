apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pacto-operator.fullname" . }}-manager
  labels:
    {{- include "pacto-operator.labels" . | nindent 4 }}
rules:
  # Core controller permissions
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  # ConfigMap-backed configuration collection (required-configurations dimension).
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get]
  # EndpointSlice readiness for interface availability + dependency reachability.
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch]
  # Pacto CRDs
  - apiGroups: [pacto.trianalab.io]
    resources: [pactos]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [pacto.trianalab.io]
    resources: [pactos/status]
    verbs: [get, patch, update]
  - apiGroups: [pacto.trianalab.io]
    resources: [pactos/finalizers]
    verbs: [update]
  - apiGroups: [pacto.trianalab.io]
    resources: [pactorevisions]
    verbs: [create, get, list, watch]
  - apiGroups: [pacto.trianalab.io]
    resources: [pactorevisions/status]
    verbs: [get, patch, update]
  # Dashboard teardown — ALWAYS granted, even when dashboard.enabled=false, so an
  # operator upgraded from enabled -> disabled can still remove the resources it
  # created. Scoped to the fixed dashboard resource names, get + delete only: the
  # operator reads these by name via its uncached API reader, so no list/watch is
  # needed. Keeping list/watch out of the always-on set is what lets the manager
  # start when disabled — a cluster-scoped clusterrolebindings informer would
  # otherwise fail to sync (forbidden) and crashloop the operator.
  - apiGroups: [""]
    resources: [serviceaccounts, services]
    verbs: [get, delete]
    resourceNames: [pacto-dashboard]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, delete]
    resourceNames: [pacto-dashboard-oci-creds]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, delete]
    resourceNames: [pacto-dashboard]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings]
    verbs: [get, delete]
    resourceNames: [pacto-dashboard]
  {{- if .Values.dashboard.enabled }}
  # Dashboard lifecycle management
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [create, get, list, watch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, update, patch, delete]
  - apiGroups: [""]
    resources: [serviceaccounts, services]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create, delete, patch, update]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings]
    verbs: [create, delete, get, list, patch, update, watch]
  {{- end }}
