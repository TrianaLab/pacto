{{- if include "pacto-operator.clusterScoped" . }}
{{- $scoped := not (empty (include "pacto-operator.watchNamespaces" . | fromYamlArray)) }}
{{- $dashboard := and (include "pacto-operator.dashboardEnabled" .) (or (not $scoped) (include "pacto-operator.dashboardDeliveryNamespace" .)) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pacto-operator.fullname" . }}-manager
  labels:
    {{- include "pacto-operator.labels" . | nindent 4 }}
# With controller.watchNamespaces every namespaced read moves to the Roles in
# watch-namespaces.yaml: only the node agent half and the dashboard's delivery
# half stay here, and neither renders without its feature.
rules:
  {{- if not $scoped }}
  # Core controller permissions. No Secret is read cluster-wide: pull secrets
  # and Secret-backed configurations are read where role.yaml,
  # watch-namespaces.yaml and secret-grants.yaml grant them.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch]
  # ConfigMap-backed configuration collection (required-configurations dimension).
  # Read through the manager's cache, whose informer needs list and watch to sync.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
  # Target pods, mapped onto the node agent's kernel observations (kernel evidence).
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  # Kernel evidence published by the node agent, one object per node, read
  # through the cache in the kernel evidence namespace only. The objects are
  # named after nodes, so they cannot be scoped by resourceNames: the prunes
  # find them by label (list) and remove them (delete). The resource is the
  # operator's own CRD and carries no secrets.
  - apiGroups: [pacto.trianalab.io]
    resources: [noderuntimeobservations]
    verbs: [delete, get, list, watch]
  # Interface exposure: an Ingress or Gateway API HTTPRoute that routes to the port.
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch]
  # EndpointSlice readiness for interface availability + dependency reachability.
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  {{- if include "pacto-operator.apiServed" (list $ "networking.istio.io/v1") }}
  # Istio ServiceEntries that list a host the target workload names (externals).
  - apiGroups: [networking.istio.io]
    resources: [serviceentries]
    verbs: [get, list, watch]
  {{- end }}
  {{- if include "pacto-operator.apiServed" (list $ "cilium.io/v2") }}
  # Cilium toFQDNs egress rules that select the target's pods (externals, inferred).
  # list only: the reader lists them uncached and never watches.
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies, ciliumclusterwidenetworkpolicies]
    verbs: [list]
  {{- end }}
  # daemonsets: the dashboard ClusterRole the operator applies lists them, and Kubernetes lets it grant only what it holds.
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch]
  # Service grouping and repository provenance: the dashboard ClusterRole the
  # operator applies lists them, and Kubernetes lets it grant only what it holds.
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [list]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [list]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [list]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories]
    verbs: [list]
  # Pacto CRDs
  - apiGroups: [pacto.trianalab.io]
    resources: [pactos]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [pacto.trianalab.io]
    resources: [pactos/status]
    verbs: [get, patch, update]
  - apiGroups: [pacto.trianalab.io]
    resources: [pactos/finalizers]
    verbs: [update]
  - apiGroups: [pacto.trianalab.io]
    resources: [pactorevisions]
    verbs: [create, get, list, watch]
  - apiGroups: [pacto.trianalab.io]
    resources: [pactorevisions/status]
    verbs: [get, patch, update]
  # Dashboard teardown, cluster-scoped half: ALWAYS granted, so an operator
  # upgraded from enabled -> disabled can still remove the ClusterRole and
  # binding it created. get + delete by name only, read through the uncached API
  # reader: list/watch here would start a cluster-scoped informer that cannot
  # sync while the dashboard is disabled and crashloop the operator. Everything
  # namespaced the components manage is granted by the Roles in role.yaml and
  # nodeagent-namespace.yaml, in the namespaces they live in.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings]
    verbs: [get, delete]
    resourceNames: [pacto-dashboard]
  {{- end }}
  {{- if or (not $scoped) $dashboard }}
  # The operator reads the cluster id, the kube-system namespace UID, at start:
  # it names the cluster in Evidence Server reports, and the managed dashboard
  # ClusterRole grants the same read. A namespace list without the dashboard's
  # delivery half leaves the cluster id unknown.
  {{- include "pacto-operator.rbac.clusterIdentityRule" . | nindent 2 }}
  {{- end }}
  {{- if not $scoped }}
  # Detection reads each node's providerID, labels and kernel to propose the
  # cloud and the node kernels in <fullname>-detected; kernel egress reads each
  # node's pod CIDRs to tell a gone pod's address from an external one. It
  # writes nothing on nodes, and with controller.watchNamespaces this rule is
  # not rendered.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list]
  {{- if include "pacto-operator.kernelEvidence" . }}
  # The node agent's heartbeat: one Lease per node, read through the cache in
  # the kernel evidence namespace only (the cache never starts a cluster-wide
  # Lease informer). Leases carry a holder name and timestamps, nothing secret.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch]
  {{- end }}
  {{- $observe := include "pacto-operator.observeRBAC" . | fromYaml }}
  {{- if $observe.metricsMonitors }}
  # Metrics capability discovery through Prometheus Operator monitors.
  - apiGroups: [monitoring.coreos.com]
    resources: [servicemonitors, podmonitors]
    verbs: [get, list, watch]
  {{- end }}
  {{- if $observe.namespaceGet }}
  # auto reads the target namespace's pacto.trianalab.io/observe label, by
  # name, uncached; names and labels only.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
  {{- end }}
  {{- end }}
  {{- if $dashboard }}
  # Dashboard lifecycle management, cluster-scoped half: the ClusterRole and
  # binding that let the dashboard read Pactos across namespaces.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings]
    verbs: [create, delete, get, list, patch, update, watch]
  # The dashboard asks the apiserver which namespaces a signed-in person may
  # read (SubjectAccessReview), and Kubernetes lets the operator grant that
  # right in the dashboard's ClusterRole only if it holds it too. It reveals
  # nothing but yes or no about the permissions of the person asked about.
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
  # The dashboard keeps one read-only copy of the delivery objects people
  # read, filtered per person by the reviews above; it is granted in the
  # dashboard's ClusterRole, so the operator holds it too.
  - apiGroups: [delivery.pacto.trianalab.io]
    resources: [stages, operations]
    verbs: [get, list, watch]
  # The dashboard lists the namespaces to ask in which ones a signed-in person
  # may list Stages, so a namespace with Stages and no Pacto yet is shown. It
  # learns only their names; the person's own RBAC decides what they read.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list]
  {{- end }}
  {{- if .Values.nodeAgent.enabled }}
  # Node agent, cluster-scoped half. Nodes get is the orphan prune: the objects
  # of a node that is gone are deleted. The agent namespace is read and
  # relabelled (privileged Pod Security) by name only; the chart creates it,
  # so the operator needs no namespace create at all.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, patch]
    resourceNames:
      - {{ include "pacto-operator.nodeAgentNamespace" . }}
  {{- end }}
{{- end }}
