apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pacto-operator.fullname" . }}-manager
  labels:
    {{- include "pacto-operator.labels" . | nindent 4 }}
rules:
  # Core controller permissions
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  # ConfigMap-backed configuration collection (required-configurations dimension).
  # Read through the manager's cache, whose informer needs list and watch to sync.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
  # Target pods, mapped onto the node agent's kernel observations (kernel evidence).
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  # Kernel evidence published by the node agent, one object per node, read
  # through the cache in the kernel evidence namespace only. The objects are
  # named after nodes, so they cannot be scoped by resourceNames: the prunes
  # find them by label (list) and remove them (delete). The resource is the
  # operator's own CRD and carries no secrets.
  - apiGroups: [pacto.trianalab.io]
    resources: [noderuntimeobservations]
    verbs: [delete, get, list, watch]
  # Interface exposure: an Ingress or Gateway API HTTPRoute that routes to the port.
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch]
  # EndpointSlice readiness for interface availability + dependency reachability.
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch]
  # Pacto CRDs
  - apiGroups: [pacto.trianalab.io]
    resources: [pactos]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [pacto.trianalab.io]
    resources: [pactos/status]
    verbs: [get, patch, update]
  - apiGroups: [pacto.trianalab.io]
    resources: [pactos/finalizers]
    verbs: [update]
  - apiGroups: [pacto.trianalab.io]
    resources: [pactorevisions]
    verbs: [create, get, list, watch]
  - apiGroups: [pacto.trianalab.io]
    resources: [pactorevisions/status]
    verbs: [get, patch, update]
  # Dashboard teardown, cluster-scoped half: ALWAYS granted, so an operator
  # upgraded from enabled -> disabled can still remove the ClusterRole and
  # binding it created. get + delete by name only, read through the uncached API
  # reader: list/watch here would start a cluster-scoped informer that cannot
  # sync while the dashboard is disabled and crashloop the operator. Everything
  # namespaced the components manage is granted by the Roles in role.yaml and
  # nodeagent-namespace.yaml, in the namespaces they live in.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings]
    verbs: [get, delete]
    resourceNames: [pacto-dashboard]
  {{- if include "pacto-operator.kernelEvidence" . }}
  # The node agent's heartbeat: one Lease per node, read through the cache in
  # the kernel evidence namespace only (the cache never starts a cluster-wide
  # Lease informer). Leases carry a holder name and timestamps, nothing secret.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch]
  {{- end }}
  {{- if .Values.controller.enableMetricsObservation }}
  # Metrics capability discovery through Prometheus Operator monitors.
  - apiGroups: [monitoring.coreos.com]
    resources: [servicemonitors, podmonitors]
    verbs: [get, list, watch]
  {{- end }}
  {{- if .Values.dashboard.enabled }}
  # Dashboard lifecycle management, cluster-scoped half: the ClusterRole and
  # binding that let the dashboard read Pactos across namespaces.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings]
    verbs: [create, delete, get, list, patch, update, watch]
  # The dashboard asks the apiserver which namespaces a signed-in person may
  # read (SubjectAccessReview), and Kubernetes lets the operator grant that
  # right in the dashboard's ClusterRole only if it holds it too. It reveals
  # nothing but yes or no about the permissions of the person asked about.
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
  # The dashboard lists the namespaces to ask in which ones a signed-in person
  # may list Stages, so a namespace with Stages and no Pacto yet is shown. It
  # learns only their names; the person's own RBAC decides what they read.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list]
  {{- end }}
  {{- if .Values.nodeAgent.enabled }}
  # Node agent, cluster-scoped half. Nodes get is the orphan prune: the objects
  # of a node that is gone are deleted. The agent namespace is read and
  # relabelled (privileged Pod Security) by name only; the chart creates it,
  # so the operator needs no namespace create at all.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, patch]
    resourceNames:
      - {{ include "pacto-operator.nodeAgentNamespace" . }}
  {{- end }}
