{{- /*
With the bundled Dex, the dashboard's client secret and the first sign-in
password are generated at install and read back on every upgrade, so they
never change and never sit in a values file. Dex reads them from this Secret
as environment variables (values-quickstart.yaml: dex.envVars); the dashboard
reads the client secret through dashboard.auth.oidc.clientSecretRef.
*/ -}}
{{- if .Values.dex.enabled }}
{{- $ref := .Values.dashboard.auth.oidc.clientSecretRef }}
{{- $name := required "dex.enabled needs dashboard.auth.oidc.clientSecretRef.name: the chart generates the dashboard's client secret into that Secret" $ref.name }}
{{- $key := $ref.key | default "client-secret" }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $password := get $old "admin-password" | b64dec | default (randAlphaNum 24) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pacto-operator.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $key }}: {{ get $old $key | default (randAlphaNum 32 | b64enc) }}
  admin-password: {{ $password | b64enc }}
  admin-password-hash: {{ get $old "admin-password-hash" | default (bcrypt $password | b64enc) }}
{{- end }}
