{{- if .Values.leaderElection.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pacto-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pacto-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  {{- include "pacto-operator.rbac.leaderElectionRules" . | nindent 2 }}
---
{{ include "pacto-operator.binding" (dict "kind" "RoleBinding" "name" (printf "%s-leader-election" (include "pacto-operator.fullname" .)) "namespace" .Release.Namespace "labels" (include "pacto-operator.labels" .) "serviceAccount" (include "pacto-operator.serviceAccountName" .) "serviceAccountNamespace" .Release.Namespace) }}
{{- end }}
