                        keys.
                      items:
                        type: string
                      type: array
                  required:
                  - hasSchema
                  - name
                  type: object
                type: array
              contract:
                description: Contract exposes parsed contract metadata.
                properties:
                  owner:
                    description: |-
                      Owner contains the structured ownership metadata from the contract
                      (team, DRI, and contacts).
                    minProperties: 1
                    properties:
                      contacts:
                        description: Contacts lists provider-neutral contact points.
                        items:
                          description: OwnerContact is a provider-neutral contact
                            point for service ownership.
                          properties:
                            purpose:
                              description: Purpose describes what this contact is
                                used for (e.g. escalation, support, oncall).
                              type: string
                            type:
                              description: Type is the contact channel type (e.g.
                                email, chat, oncall).
                              type: string
                            value:
                              description: Value is the contact address or identifier.
                              type: string
                          required:
                          - type
                          - value
                          type: object
                        type: array
                      dri:
                        description: DRI is the directly responsible individual.
                        type: string
                      team:
                        description: Team is the owning team name.
                        type: string
                    type: object
                  ownerDisplay:
                    description: |-
                      OwnerDisplay is the canonical display string derived from owner metadata.
                      Precedence: team > DRI.
                      Useful for printer columns, dashboards, and backward-compatible consumers.
                    type: string
                  resolvedRef:
                    description: |-
                      ResolvedRef is the fully-resolved OCI reference (with tag/digest).
                      Empty for inline contracts.
                    type: string
                  serviceName:
                    description: ServiceName is the service name declared in the contract.
                    type: string
                  version:
                    description: Version is the semver version from the contract.
                    type: string
                required:
                - serviceName
                - version
                type: object
              contractStatus:
                description: |-
                  ContractStatus is the high-level contract compliance state.
                  This reflects contract validation/compliance and is NOT runtime health.
                enum:
                - Compliant
                - Warning
                - NonCompliant
                - Reference
                - Unknown
                - Invalid
                - NotEvaluated
                type: string
              contractVersion:
                description: |-
                  ContractVersion is the version from the parsed contract.
                  Kept for backward compatibility and simple access via JSONPath.
                type: string
              currentRevision:
                description: CurrentRevision is the name of the active PactoRevision.
                type: string
              dependencies:
                description: Dependencies lists the declared dependencies from the
                  contract.
                items:
                  description: DependencyInfo describes a declared dependency.
                  properties:
                    compatibility:
                      description: Compatibility is the semver constraint for the
                        dependency.
                      type: string
                    external:
                      description: |-
                        External marks a dependency this Pacto system does not run, such as a
                        managed database or a hosted model.
                      type: boolean
                    name:
                      description: Name is the dependency name (required, unique within
                        contract).
                      type: string
                    ref:
                      description: |-
                        Ref is the dependency reference (OCI URI). Empty for an external
                        dependency that has no contract.
                      type: string
                    required:
                      description: Required indicates whether this dependency is mandatory.
                      type: boolean
                    version:
                      description: |-
                        Version is the free-text version an external dependency without a ref
                        declares.
                      type: string
                  required:
                  - name
                  - required
                  type: object
                type: array
              evaluatedRevision:
                description: |-
                  EvaluatedRevision ties this status to the exact contract and workload
                  generation it was computed from, so a result for an old version is never
                  read as the answer for a new one. A consumer acting on contractStatus
                  (the opt-in Pacto delivery promoter) must check it first.
                properties:
                  contractDigest:
                    description: |-
                      ContractDigest is the OCI manifest digest of the evaluated contract
                      bundle. Empty for inline contracts.
                    type: string
                  kernelCoverage:
                    description: |-
                      KernelCoverage is how far the node agent's view of the workload's pods
                      could be trusted in this evaluation, the worst pod first: Complete,
                      Partial, Failed or Stale. Empty when kernel evidence is off. Complete
                      is what lets a reader tell "observed and clean" from "not observed".
                    enum:
                    - Complete
                    - Partial
                    - Failed
                    - Stale
                    type: string
                  workload:
                    description: |-
                      Workload is the workload object and generation the evaluation read.
                      Absent for a reference-only contract or a workload that does not exist.
                    properties:
                      generation:
                        format: int64
                        type: integer
                      kind:
                        type: string
                      name:
                        type: string
                      uid:
                        type: string
                    required:
                    - generation
                    - kind
                    - name
                    - uid
                    type: object
                type: object
              evaluationCoverage:
                description: |-
                  EvaluationCoverage reports how many required assertions were evaluated (metadata; never affects
                  ContractStatus).
                properties:
                  evaluated:
                    description: Evaluated is the number of required assertions with
                      a conclusive (Observed) observation.
                    format: int32
                    type: integer
                  required:
                    description: Required is the total number of required assertions
                      the contract declares.
                    format: int32
                    type: integer
                  unverified:
                    description: |-
                      Unverified lists, sorted, the contract paths of declared facets that have a
                      runtime check but no usable fact this time (for example
                      interfaces[name=api].type with probing off). Metadata only: it never changes
                      the contract status.
                    items:
                      type: string
                    maxItems: 256
                    type: array
                    x-kubernetes-list-type: atomic
                required:
                - evaluated
                - required
                type: object
              findings:
                description: |-
                  Findings is the list of typed conclusions from the Pacto engine.
                  Includes both contract-only findings (structural/semantic) and
                  evidence-based findings (runtime drift).
                items:
                  description: FindingStatus is a typed conclusion emitted by the
                    Pacto engine.
                  properties:
                    category:
                      description: Category groups related codes (e.g. RuntimeDrift,
                        PolicyViolation).
                      type: string
                    code:
                      description: Code is the stable finding identifier (e.g. WORKLOAD_MISMATCH).
                      type: string
                    contractPath:
                      description: ContractPath is the YAML path to the relevant contract
                        field.
                      type: string
                    evidenceRefs:
                      description: EvidenceRefs links the finding to supporting evidence.
                      items:
                        description: EvidenceRefStatus links a finding to the evidence
                          that supports it.
                        properties:
                          collector:
                            description: |-
                              Collector names the producer of the matched observation: k8s-observer for
                              the Kubernetes API alone, k8s-observer+ebpf when kernel evidence was merged
                              in, ebpf when only the kernel saw it.
                            type: string
                          detectedAt:
                            description: DetectedAt is the RFC 3339 time the matched
                              observation was made.
                            type: string
                          observedAt:
                            description: ObservedAt is the ISO8601 timestamp when
                              the evidence was collected.
                            type: string
                          source:
                            description: Source is the evidence source (e.g. "k8s").
                            type: string
                        required:
                        - observedAt
                        - source
                        type: object
                      type: array
                    message:
                      description: Message is a human-readable description.
                      type: string
                    severity:
                      description: Severity is error, warning, info, or unknown.
                      enum:
                      - error
                      - warning
                      - info
                      - unknown
                      type: string
                    subject:
                      description: Subject identifies what the finding is about.
                      type: string
                  required:
                  - category
                  - code
                  - message
                  - severity
                  type: object
                type: array
              interfaces:
                description: Interfaces lists the parsed interfaces from the contract.
                items:
                  description: InterfaceInfo describes a single interface declared
                    in the contract.
                  properties:
                    name:
                      description: Name is the interface name.
                      type: string
                    ref:
                      description: Ref is the bundle-relative path to the interface
                        specification file.
                      type: string
                    type:
                      description: 'Type is the interface type: openapi, asyncapi,
                        grpc or mcp.'
                      enum:
                      - openapi
                      - asyncapi
                      - grpc
                      - mcp
                      type: string
                    visibility:
                      description: 'Visibility is the declared visibility: public
                        or internal.'
                      type: string
                  required:
                  - name
                  - type
                  type: object
                type: array
              lastReconciledAt:
                description: LastReconciledAt is when the last reconciliation completed.
                format: date-time
                type: string
              metadata:
                additionalProperties:
                  type: string
                description: Metadata contains arbitrary key-value pairs from the
                  contract's metadata section.
                type: object
              observationWindows:
                description: |-
                  ObservationWindows tracks per-assertion negative-observation streaks for time-based stabilization
                  (B5). Operator-owned temporal state; the pure engine never sees it.
                items:
                  description: |-
                    ObservationWindow tracks the first sustained NEGATIVE observation for one assertion, so a transient
                    negative reads Unknown (stabilizing) and only a sustained one converts to a confirmed violation (B5).
                  properties:
                    firstObservedNegativeAt:
                      description: FirstObservedNegativeAt is when the current negative
                        streak began.
                      format: date-time
                      type: string
                    kind:
                      description: 'Kind is the assertion dimension: interface | dependency
                        | configuration | capability.'
                      type: string
                    subject:
                      description: Subject is the assertion identity (interface/dependency/configuration
                        name, or capability key).
                      type: string
                  required:
                  - firstObservedNegativeAt
                  - kind
                  - subject
                  type: object
                type: array
              observedCallers:
                description: |-
                  ObservedCallers are workloads the node agent saw calling this target's
                  Service, inside the dependency observation window, that no Pacto
                  describes. Capped at 32, sorted by namespace, kind and name.
                items:
                  description: |-
                    ObservedCaller is a workload seen calling a target's Service at runtime that
                    no Pacto describes, named by the controller that owns its pods.
                  properties:
                    firstSeen:
                      description: |-
                        FirstSeen is set once, when the caller first appears, so the status does
                        not change on every reconcile.
                      format: date-time
                      type: string
                    kind:
                      description: |-
                        Kind is the owning controller: Deployment, StatefulSet, DaemonSet, Job,
                        CronJob, another controller kind, or Pod for a pod no controller owns.
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                    source:
                      description: Source is the collector that saw the calls.
                      enum:
                      - ebpf
                      type: string
                  required:
                  - firstSeen
                  - kind
                  - name
                  - namespace
                  - source
                  type: object
                maxItems: 32
                type: array
              observedCallersCoverage:
                description: |-
                  ObservedCallersCoverage says whether observedCallers can be trusted as
                  complete. Absent when runtime observation is not configured for this Pacto.
                properties:
                  reason:
                    type: string
                  refreshSeconds:
                    description: |-
                      RefreshSeconds is how often the operator rewrites this status. A reader
                      treats a status not reconciled within twice that as stale, so an operator
                      that stopped never leaves a complete coverage in place.
                    format: int32
                    type: integer
                  state:
                    enum:
                    - complete
                    - partial
                    - unavailable
                    type: string
                required:
                - state
                type: object
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              observedRuntime:
                description: |-
                  ObservedRuntime describes the actual runtime state observed from the cluster.
                  Only populated when a target workload exists. This is a lean evidence view.
                properties:
                  containerImages:
                    description: ContainerImages lists the container images from the
                      pod spec.
                    items:
                      type: string
                    type: array
                  deploymentStrategy:
                    description: DeploymentStrategy is the observed strategy (RollingUpdate,
                      Recreate). Empty for non-Deployments.
                    type: string
                  hasEmptyDir:
                    description: HasEmptyDir indicates whether the workload uses emptyDir
                      volumes.
                    type: boolean
                  hasPVC:
                    description: HasPVC indicates whether the workload uses PersistentVolumeClaims.
                    type: boolean
                  healthProbeInitialDelaySeconds:
                    description: HealthProbeInitialDelaySeconds is the observed initialDelaySeconds
                      from the first container's probe.
                    format: int32
                    type: integer
                  podManagementPolicy:
                    description: PodManagementPolicy is the observed pod management
                      policy (OrderedReady, Parallel). Empty for non-StatefulSets.
                    type: string
                  terminationGracePeriodSeconds:
                    description: TerminationGracePeriodSeconds is the observed terminationGracePeriodSeconds
                      from the pod spec.
                    format: int64
                    type: integer
                  workloadKind:
                    description: WorkloadKind is the actual Kubernetes resource kind
                      (Deployment, StatefulSet, ReplicaSet, Job, CronJob).
                    type: string
                required:
                - hasEmptyDir
                - hasPVC
                type: object
              policies:
                description: |-
                  Policies lists the contract's declared policy sources (metadata only).
                  Each entry describes a local schema or external ref; the operator does not
                  resolve or enforce ref-based policies at runtime.
                items:
                  description: |-
                    PolicyInfo describes a single named policy source from the contract.
                    Each policy provides either a local JSON Schema file or a reference to an
                    external contract whose bundle contains the policy schema.
                  properties:
                    description:
                      description: Description is the policy schema's declared description,
                        if any.
                      type: string
                    hasSchema:
                      description: HasSchema indicates whether a policy schema file
                        is bundled.
                      type: boolean
                    name:
                      description: Name is the policy name (required, unique within
                        contract).
                      type: string
                    properties:
                      description: |-
                        Properties lists the policy schema's keys with their type and default, so
                        consumers can render policy content without re-reading the bundle.
                      items:
                        description: |-
                          SchemaProperty is a flattened key from a configuration or policy schema
                          (or a configuration values map), suitable for display by consumers.
                        properties:
                          key:
                            description: Key is the property name (dot-notation for
                              nested objects).
                            type: string
                          type:
                            description: Type is the JSON Schema type of the property.
                            type: string
                          value:
                            description: Value is the default (for schema properties)
                              or the literal value.
                            type: string
                        required:
                        - key
                        type: object
                      type: array
                    ref:
                      description: Ref is the external OCI reference for the policy
                        schema, if used.
                      type: string
                    schema:
                      description: Schema is the bundle-relative path to the policy
                        schema file, if local.
                      type: string
                    title:
                      description: Title is the policy schema's declared title, if
                        any.
                      type: string
                  required:
                  - hasSchema
                  - name
                  type: object
                type: array
              readiness:
                description: |-
                  Readiness is the derived operational readiness assessment of the contract.
                  It is computed from the contract's declared readiness claims and the current
                  time. It is a separate dimension from contract compliance and does NOT affect
                  ContractStatus. Absent when the contract declares no readiness.
                properties:
                  claims:
                    description: Claims is the derived per-claim readiness status.
                    items:
                      description: ClaimStatus is the derived state of a single readiness
                        claim.
                      properties:
                        category:
                          description: Category is the software-domain category (security,
                            documentation, observability, etc.).
                          type: string
                        description:
                          description: Description is the optional human-readable
                            explanation.
                          type: string
                        earnedWeight:
                          description: EarnedWeight is the weight this check contributed
                            toward the score.
                          format: int32
                          type: integer
                        evidence:
                          description: Evidence is the declared pointer to the evidence.
                          type: string
                        excluded:
                          description: Excluded reports whether the check is excluded
                            from scoring (deferred).
                          type: boolean
                        id:
                          description: ID is the readiness requirement identifier
                            (e.g. dashboard, runbook).
                          type: string
                        status:
                          description: Status is the declared completion status.
                          enum:
                          - done
                          - partial
                          - not-done
                          - deferred
                          type: string
                        type:
                          description: Type classifies the evidence pointer (url,
                            document, ticket, report, artifact, identifier, other).
                          type: string
                        weight:
                          description: Weight is the declared contribution to the
                            readiness score (0-100).
                          format: int32
                          type: integer
                      required:
                      - id
                      - status
                      - type
                      - weight
                      type: object
                    type: array
                  daysRemaining:
                    description: DaysRemaining is the number of whole days until expiry
                      (nil when expired).
                    format: int32
                    type: integer
                  deferredCount:
                    description: DeferredCount is the number of checks declared deferred
                      (excluded from scoring).
                    format: int32
                    type: integer
                  doneCount:
                    description: DoneCount is the number of checks declared done.
                    format: int32
                    type: integer
                  earnedWeight:
                    description: EarnedWeight is the weight earned toward the score.
                    format: int32
                    type: integer
                  expired:
                    description: Expired reports whether the assessment has expired;
                      when true every in-scope check earns 0.
                    type: boolean
                  expires:
                    description: Expires is the assessment-level expiry boundary (YYYY-MM-DD).
                    type: string
                  minScore:
                    description: MinScore is the gate threshold (the declared readiness.minScore,
                      or 100 when omitted).
                    format: int32
                    type: integer
                  notDoneCount:
                    description: NotDoneCount is the number of checks declared not-done.
                    format: int32
                    type: integer
                  partialCount:
                    description: PartialCount is the number of checks declared partial.
                    format: int32
                    type: integer
                  passing:
                    description: Passing reports whether the gate is met (not expired
                      and Score >= MinScore).
                    type: boolean
                  revisions:
                    description: Revisions is the declared readiness revision history.
                    items:
                      description: ReadinessRevisionStatus is one declared readiness
                        revision-history entry.
                      properties:
                        author:
                          description: Author is who performed the assessment.
                          type: string
                        date:
                          description: Date is the date the revision was assessed
                            (YYYY-MM-DD).
                          type: string
                        description:
                          description: Description summarizes what changed or was
                            observed.
                          type: string
                        version:
                          description: Version is the service version assessed in
                            this revision.
                          type: string
                      required:
                      - author
                      - date
                      - description
                      - version
                      type: object
                    type: array
                  score:
                    description: Score is the percentage of in-scope weight earned
                      (0-100).
                    format: int32
                    type: integer
                  totalWeight:
                    description: TotalWeight is the sum of in-scope (non-deferred)
                      check weights.
                    format: int32
                    type: integer
                type: object
              resolutionPolicy:
                description: |-
                  ResolutionPolicy describes how the OCI reference was resolved.
                  Latest: unversioned ref, operator tracks the highest semver tag.
                  PinnedTag: ref includes an explicit tag, used as-is.
                  PinnedDigest: ref includes a digest, used as-is (immutable).
                  Empty for inline contracts.
                enum:
                - Latest
                - PinnedTag
                - PinnedDigest
                type: string
              resources:
                description: Resources describes the existence of target Kubernetes
                  resources.
                properties:
                  service:
                    description: Service describes the target Service.
                    properties:
                      exists:
                        description: Exists indicates whether the resource was found
                          in the cluster.
                        type: boolean
                      kind:
                        description: Kind of the resource (only set for workloads).
                        type: string
                      name:
                        description: Name of the resource.
                        type: string
                    required:
                    - exists
                    - name
                    type: object
                  workload:
                    description: Workload describes the target workload (Deployment/StatefulSet/ReplicaSet).
                    properties:
                      exists:
                        description: Exists indicates whether the resource was found
                          in the cluster.
                        type: boolean
                      kind:
                        description: Kind of the resource (only set for workloads).
                        type: string
                      name:
                        description: Name of the resource.
                        type: string
                    required:
                    - exists
                    - name
                    type: object
                type: object
              summary:
                description: Summary provides severity-based finding counts.
                properties:
                  errorCount:
                    description: ErrorCount is the number of error-severity findings.
                    format: int32
                    type: integer
                  infoCount:
                    description: InfoCount is the number of info-severity findings.
                    format: int32
                    type: integer
                  unknownCount:
                    description: UnknownCount is the number of unknown-severity findings
                      (a required assertion could not be evaluated).
                    format: int32
                    type: integer
                  warningCount:
                    description: WarningCount is the number of warning-severity findings.
                    format: int32
                    type: integer
                required:
                - errorCount
                - infoCount
                - unknownCount
                - warningCount
                type: object
              validation:
                description: Validation describes the structural validation outcome
                  of the contract.
                properties:
                  errors:
                    description: Errors lists structural validation errors.
                    items:
                      description: ValidationIssue describes a single validation error
                        or warning.
                      properties:
                        code:
                          description: Code is a machine-readable error code.
                          type: string
                        message:
                          description: Message is a human-readable description of
                            the issue.
                          type: string
                        path:
                          description: Path is the JSON path to the invalid field.
                          type: string
                      required:
                      - message
                      type: object
                    type: array
                  valid:
                    description: Valid indicates whether the contract passed structural
                      validation.
                    type: boolean
                  warnings:
                    description: Warnings lists structural validation warnings.
                    items:
                      description: ValidationIssue describes a single validation error
                        or warning.
                      properties:
                        code:
                          description: Code is a machine-readable error code.
                          type: string
                        message:
                          description: Message is a human-readable description of
                            the issue.
                          type: string
                        path:
                          description: Path is the JSON path to the invalid field.
                          type: string
                      required:
                      - message
                      type: object
                    type: array
                required:
                - valid
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
# Source: pacto-operator/templates/clusterrole.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pacto-operator-manager
  labels:
    helm.sh/chart: pacto-operator-VERSION
    app.kubernetes.io/name: pacto-operator
    app.kubernetes.io/instance: pacto-operator
    app.kubernetes.io/version: "VERSION"
    app.kubernetes.io/managed-by: Helm
rules:
  # Core controller permissions
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  # ConfigMap-backed configuration collection (required-configurations dimension).
  # Read through the manager's cache, whose informer needs list and watch to sync.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
  # Target pods, mapped onto the node agent's kernel observations (kernel evidence).
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  # Kernel evidence published by the node agent, one object per node, read
  # through the cache in the kernel evidence namespace only. The objects are
  # named after nodes, so they cannot be scoped by resourceNames: the prunes
  # find them by label (list) and remove them (delete). The resource is the
  # operator's own CRD and carries no secrets.
  - apiGroups: [pacto.trianalab.io]
    resources: [noderuntimeobservations]
    verbs: [delete, get, list, watch]
  # Interface exposure: an Ingress or Gateway API HTTPRoute that routes to the port.
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch]
  # EndpointSlice readiness for interface availability + dependency reachability.
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch]
  # Pacto CRDs
  - apiGroups: [pacto.trianalab.io]
    resources: [pactos]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [pacto.trianalab.io]
    resources: [pactos/status]
    verbs: [get, patch, update]
  - apiGroups: [pacto.trianalab.io]
    resources: [pactos/finalizers]
    verbs: [update]
  - apiGroups: [pacto.trianalab.io]
    resources: [pactorevisions]
    verbs: [create, get, list, watch]
  - apiGroups: [pacto.trianalab.io]
    resources: [pactorevisions/status]
    verbs: [get, patch, update]
  # Dashboard teardown, cluster-scoped half: ALWAYS granted, so an operator
  # upgraded from enabled -> disabled can still remove the ClusterRole and
  # binding it created. get + delete by name only, read through the uncached API
  # reader: list/watch here would start a cluster-scoped informer that cannot
  # sync while the dashboard is disabled and crashloop the operator. Everything
  # namespaced the components manage is granted by the Roles in role.yaml and
  # nodeagent-namespace.yaml, in the namespaces they live in.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings]
    verbs: [get, delete]
    resourceNames: [pacto-dashboard]
  # Dashboard lifecycle management, cluster-scoped half: the ClusterRole and
  # binding that let the dashboard read Pactos across namespaces.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings]
    verbs: [create, delete, get, list, patch, update, watch]
  # The dashboard asks the apiserver which namespaces a signed-in person may
  # read (SubjectAccessReview), and Kubernetes lets the operator grant that
  # right in the dashboard's ClusterRole only if it holds it too. It reveals
  # nothing but yes or no about the permissions of the person asked about.
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
  # The dashboard keeps one read-only copy of the delivery objects people
  # read, filtered per person by the reviews above; it is granted in the
  # dashboard's ClusterRole, so the operator holds it too.
  - apiGroups: [delivery.pacto.trianalab.io]
    resources: [stages, operations]
    verbs: [get, list, watch]
  # The dashboard lists the namespaces to ask in which ones a signed-in person
  # may list Stages, so a namespace with Stages and no Pacto yet is shown. It
  # learns only their names; the person's own RBAC decides what they read.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list]
