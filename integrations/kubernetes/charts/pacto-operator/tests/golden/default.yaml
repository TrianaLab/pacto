# Source: pacto-operator/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pacto-operator
  namespace: default
  labels:
    control-plane: controller-manager
    helm.sh/chart: pacto-operator-VERSION
    app.kubernetes.io/name: pacto-operator
    app.kubernetes.io/instance: pacto-operator
    app.kubernetes.io/version: "VERSION"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: pacto-operator
      app.kubernetes.io/instance: pacto-operator
  template:
    metadata:
      labels:
        control-plane: controller-manager
        helm.sh/chart: pacto-operator-VERSION
        app.kubernetes.io/name: pacto-operator
        app.kubernetes.io/instance: pacto-operator
        app.kubernetes.io/version: "VERSION"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: pacto-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          image: "ghcr.io/trianalab/pacto/operator:VERSION"
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPERATOR_DEPLOYMENT_NAME
              value: pacto-operator
          args:
            - --leader-elect=true
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8443
            - --metrics-secure=true
            - --node-agent-namespace=pacto-node-agent
            - --enable-dashboard
            - --dashboard-cpu-request=50m
            - --dashboard-memory-request=128Mi
            - --dashboard-memory-limit=512Mi
          ports:
            - name: metrics
              containerPort: 8443
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
