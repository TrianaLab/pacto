      - template: templates/clusterrole.yaml
        equal:
          path: rules
          value: [{"apiGroups":[""],"resources":["events"],"verbs":["create","patch"]},{"apiGroups":[""],"resources":["services"],"verbs":["get","list","watch"]},{"apiGroups":[""],"resources":["configmaps"],"verbs":["get","list","watch"]},{"apiGroups":[""],"resources":["pods"],"verbs":["get","list","watch"]},{"apiGroups":["pacto.trianalab.io"],"resources":["noderuntimeobservations"],"verbs":["delete","get","list","watch"]},{"apiGroups":["networking.k8s.io"],"resources":["ingresses"],"verbs":["get","list","watch"]},{"apiGroups":["gateway.networking.k8s.io"],"resources":["httproutes"],"verbs":["get","list","watch"]},{"apiGroups":["discovery.k8s.io"],"resources":["endpointslices"],"verbs":["get","list","watch"]},{"apiGroups":["apps"],"resources":["deployments","replicasets","statefulsets","daemonsets"],"verbs":["get","list","watch"]},{"apiGroups":["batch"],"resources":["cronjobs","jobs"],"verbs":["get","list","watch"]},{"apiGroups":["pacto.trianalab.io"],"resources":["pactos"],"verbs":["create","delete","get","list","patch","update","watch"]},{"apiGroups":["pacto.trianalab.io"],"resources":["pactos/status"],"verbs":["get","patch","update"]},{"apiGroups":["pacto.trianalab.io"],"resources":["pactos/finalizers"],"verbs":["update"]},{"apiGroups":["pacto.trianalab.io"],"resources":["pactorevisions"],"verbs":["create","get","list","watch"]},{"apiGroups":["pacto.trianalab.io"],"resources":["pactorevisions/status"],"verbs":["get","patch","update"]},{"apiGroups":["rbac.authorization.k8s.io"],"resources":["clusterroles","clusterrolebindings"],"verbs":["get","delete"],"resourceNames":["pacto-dashboard"]},{"apiGroups":[""],"resources":["namespaces"],"resourceNames":["kube-system"],"verbs":["get"]},{"apiGroups":[""],"resources":["nodes"],"verbs":["list"]},{"apiGroups":[""],"resources":["namespaces"],"verbs":["get"]},{"apiGroups":["rbac.authorization.k8s.io"],"resources":["clusterroles","clusterrolebindings"],"verbs":["create","delete","get","list","patch","update","watch"]},{"apiGroups":["authorization.k8s.io"],"resources":["subjectaccessreviews"],"verbs":["create"]},{"apiGroups":["delivery.pacto.trianalab.io"],"resources":["stages","operations"],"verbs":["get","list","watch"]},{"apiGroups":[""],"resources":["namespaces"],"verbs":["list"]}]
      - template: templates/role.yaml
        documentIndex: 0
