suite: rbac tests
templates:
  - templates/clusterrole.yaml
tests:
  - it: should not include dashboard RBAC when dashboard is disabled
    set:
      dashboard.enabled: false
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [rbac.authorization.k8s.io]
            resources: [clusterroles, clusterrolebindings]
            verbs: [create, delete, get, list, patch, update, watch]
        any: true

  - it: should not read Stages and Operations when the dashboard is disabled
    set:
      dashboard.enabled: false
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [delivery.pacto.trianalab.io]
            resources: [stages, operations]
            verbs: [get, list, watch]

  - it: should not list namespaces when the dashboard is disabled
    set:
      dashboard.enabled: false
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [namespaces]
            verbs: [list]

  - it: should not hold SubjectAccessReview when the dashboard is disabled
    set:
      dashboard.enabled: false
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [authorization.k8s.io]
            resources: [subjectaccessreviews]
            verbs: [create]

  - it: should always include narrow dashboard teardown RBAC when disabled
    set:
      dashboard.enabled: false
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [rbac.authorization.k8s.io]
            resources: [clusterroles, clusterrolebindings]
            verbs: [get, delete]
            resourceNames: [pacto-dashboard]
        any: true

  - it: the operator ClusterRole reads the kube-system namespace by name with delivery off
    set:
      delivery.enabled: false
      dashboard.enabled: false
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [namespaces]
            resourceNames: [kube-system]
            verbs: [get]

  - it: should not grant monitor reads under auto
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [monitoring.coreos.com]
            resources: [servicemonitors, podmonitors]
            verbs: [get, list, watch]

  - it: should grant monitor reads with metricsObservation on
    set:
      controller.metricsObservation: "on"
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [monitoring.coreos.com]
            resources: [servicemonitors, podmonitors]
            verbs: [get, list, watch]

  - it: should drop monitor reads when metricsObservation is explicitly auto
    set:
      controller.metricsObservation: auto
      controller.enableMetricsObservation: true
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [monitoring.coreos.com]
            resources: [servicemonitors, podmonitors]
            verbs: [get, list, watch]

  - it: should grant namespace get only while a mode is auto (default)
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [namespaces]
            verbs: [get]

  - it: should grant namespace get only while a mode is auto (both on)
    set:
      controller.probing: "on"
      controller.metricsObservation: "on"
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [namespaces]
            verbs: [get]

  - it: should grant namespace get only while a mode is auto (both off)
    set:
      controller.probing: "off"
      controller.metricsObservation: "off"
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [namespaces]
            verbs: [get]
