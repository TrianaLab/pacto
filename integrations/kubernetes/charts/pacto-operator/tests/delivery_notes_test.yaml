suite: install notes
templates:
  - templates/NOTES.txt
release:
  name: d
  namespace: pacto-system
set:
  delivery.enabled: true
capabilities:
  apiVersions:
    - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
tests:
  - it: asks nobody to bind an approver role
    asserts:
      - notMatchRegexRaw:
          pattern: -approver to the people
      - matchRegexRaw:
          pattern: People who may update a workload \(the built-in edit or admin role in its namespace\)\sapprove its changes

  - it: names the Stage kind in full so Kargo's Stage cannot answer
    set:
      delivery.recorder.enabled: true
      delivery.recorder.streamsRepository: registry.example/pacto/streams
    asserts:
      - matchRegexRaw:
          pattern: kubectl get stages\.delivery\.pacto\.trianalab\.io -A
      - notMatchRegexRaw:
          pattern: kubectl get stages -A

  - it: names the target snapshot repository and asks for its own read ACL
    set:
      registry: ghcr.io/acme
      delivery.recorder.enabled: true
      delivery.recorder.streamsRepository: registry.example/pacto/streams
    asserts:
      - matchRegexRaw:
          pattern: ghcr\.io/acme/pacto-targets:cluster-<uid>
      - matchRegexRaw:
          pattern: give it its own read ACL

  - it: says the delivery namespace is for cluster admins only
    asserts:
      - matchRegexRaw:
          pattern: Keep that namespace writable by cluster admins only

  - it: warns that a dashboard without sign-in serves everyone
    set:
      dashboard.enabled: true
      dashboard.auth.tokenSignIn.enabled: false
      dashboard.auth.allowAnonymous: true
    asserts:
      - matchRegexRaw:
          pattern: the dashboard serves without sign-in

  - it: does not warn when the dashboard signs people in
    set:
      dashboard.enabled: true
    asserts:
      - notMatchRegexRaw:
          pattern: the dashboard serves without sign-in

  - it: does not warn when anonymous access is turned off
    set:
      dashboard.enabled: true
      dashboard.auth.allowAnonymous: false
    asserts:
      - notMatchRegexRaw:
          pattern: the dashboard serves without sign-in

  - it: says auto granted Argo CD access and names the off switch
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
        - argoproj.io/v1alpha1/Application
    asserts:
      - matchRegexRaw:
          pattern: An upgrade that takes the new chart's\sdefaults, such as --reset-then-reuse-values, on a cluster with Argo CD grants it\stoo\. Set delivery\.argocd\.enabled=false to keep it off\.

  - it: says nothing about Argo CD when it decides explicitly or the API is absent
    asserts:
      - notMatchRegexRaw:
          pattern: delivery\.argocd\.enabled=auto grants

  - it: says a new signer is confirmed in the inbox when no publisher rule is set
    asserts:
      - matchRegexRaw:
          pattern: "No publisher rule: the first signer of each service is confirmed in the delivery inbox"

  - it: says nothing about a missing publisher rule when the registry is set
    set:
      delivery.publishers.registry: ghcr.io/acme
    asserts:
      - notMatchRegexRaw:
          pattern: No publisher rule

  # The proposal is detect.FluxInstallHint, verbatim.
  - it: NOTES offers Flux under idp only when no engine API is served and idp.flux.install is false
    set:
      profile: idp
    asserts:
      - matchRegexRaw:
          pattern: 'No GitOps engine found\. To deliver through upstream Flux packaged with Pacto:\nSet idp\.flux\.install=true on this Pacto release: helm upgrade <release> oci://ghcr\.io/trianalab/pacto/charts/pacto-operator -n <namespace> --reset-then-reuse-values --set idp\.flux\.install=true\n'

  - it: NOTES offers no Flux under idp when Flux is served
    set:
      profile: idp
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
        - kustomize.toolkit.fluxcd.io/v1
    asserts:
      - notMatchRegexRaw:
          pattern: No GitOps engine found

  - it: NOTES offers no Flux under idp when Argo CD is served
    set:
      profile: idp
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
        - argoproj.io/v1alpha1
    asserts:
      - notMatchRegexRaw:
          pattern: No GitOps engine found

  - it: NOTES offers no Flux outside idp
    asserts:
      - notMatchRegexRaw:
          pattern: No GitOps engine found

  - it: NOTES offers no Flux under idp with hardened
    set:
      profile: [idp, hardened]
      controller.watchNamespaces: [payments]
    asserts:
      - notMatchRegexRaw:
          pattern: No GitOps engine found
