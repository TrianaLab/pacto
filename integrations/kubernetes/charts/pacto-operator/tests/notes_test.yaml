suite: notes
templates:
  - templates/NOTES.txt
release:
  name: pacto-operator
  namespace: pacto-operator-system
  upgrade: true
tests:
  - it: names the stale pacto-dashboard ClusterRole on an upgrade to a namespace list
    set:
      controller.watchNamespaces: [payments]
    kubernetesProvider:
      scheme:
        "rbac.authorization.k8s.io/v1/ClusterRole":
          gvr: {group: rbac.authorization.k8s.io, version: v1, resource: clusterroles}
          namespaced: false
      objects:
        - kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
          metadata: {name: pacto-dashboard}
    asserts:
      - matchRegexRaw:
          pattern: "kubectl delete clusterrole,clusterrolebinding pacto-dashboard"

  - it: says nothing when no pacto-dashboard ClusterRole is left
    set:
      controller.watchNamespaces: [payments]
    asserts:
      - notMatchRegexRaw:
          pattern: "kubectl delete clusterrole"

  - it: says nothing in cluster-wide mode
    kubernetesProvider:
      scheme:
        "rbac.authorization.k8s.io/v1/ClusterRole":
          gvr: {group: rbac.authorization.k8s.io, version: v1, resource: clusterroles}
          namespaced: false
      objects:
        - kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
          metadata: {name: pacto-dashboard}
    asserts:
      - notMatchRegexRaw:
          pattern: "kubectl delete clusterrole"

  - it: prints a port-forward and a sign-in link with the token in the fragment
    asserts:
      - matchRegexRaw:
          pattern: 'kubectl -n pacto-operator-system port-forward svc/pacto-dashboard 3000:3000'
      - matchRegexRaw:
          pattern: 'TOKEN=\$\(kubectl -n pacto-operator-system create token pacto-viewer --audience pacto-dashboard --duration 10m\) && echo "http://127\.0\.0\.1:3000/#token=\$TOKEN"'
      - matchRegexRaw:
          pattern: 'shows the fleet views of every namespace where pacto-viewer may read Pactos,\s+with no Delivery and no actions'
      - notMatchRegexRaw:
          pattern: reads Pactos and nothing else
      - notMatchRegexRaw:
          pattern: '\?token='
      - notMatchRegexRaw:
          pattern: the dashboard serves without sign-in

  - it: explains the sign-in change on an upgrade from an anonymous release
    kubernetesProvider:
      scheme:
        "apps/v1/Deployment":
          gvr: {group: apps, version: v1, resource: deployments}
          namespaced: true
      objects:
        - kind: Deployment
          apiVersion: apps/v1
          metadata: {name: pacto-dashboard, namespace: pacto-operator-system}
          spec:
            template:
              spec:
                containers:
                  - name: dashboard
                    env:
                      - {name: PACTO_DASHBOARD_ALLOW_ANONYMOUS, value: "true"}
    asserts:
      - matchRegexRaw:
          pattern: The previous release served it without sign-in
      - matchRegexRaw:
          pattern: 'dashboard\.auth\.tokenSignIn\.enabled=false and\s+dashboard\.auth\.allowAnonymous=true'

  - it: says nothing about the change on an upgrade from a release that signed people in
    kubernetesProvider:
      scheme:
        "apps/v1/Deployment":
          gvr: {group: apps, version: v1, resource: deployments}
          namespaced: true
      objects:
        - kind: Deployment
          apiVersion: apps/v1
          metadata: {name: pacto-dashboard, namespace: pacto-operator-system}
          spec:
            template:
              spec:
                containers:
                  - name: dashboard
                    env:
                      - {name: PACTO_DASHBOARD_TOKEN_LOGIN, value: "true"}
    asserts:
      - notMatchRegexRaw:
          pattern: The previous release served it without sign-in

  - it: says nothing about the change on an install
    release: {upgrade: false}
    asserts:
      - notMatchRegexRaw:
          pattern: The previous release served it without sign-in
      - matchRegexRaw:
          pattern: create token pacto-viewer

  - it: prints no link with tokenSignIn false, and says a dashboard with no sign-in at all will not start
    set:
      dashboard.auth.tokenSignIn.enabled: false
    asserts:
      - notMatchRegexRaw:
          pattern: create token pacto-viewer
      - matchRegexRaw:
          pattern: 'WARNING: the dashboard will not start'
      - notMatchRegexRaw:
          pattern: Dashboard is enabled

  - it: prints the port-forward with tokenSignIn false and an identity provider
    set:
      dashboard.auth.tokenSignIn.enabled: false
      dashboard.auth.oidc.issuerURL: https://idp.example
    asserts:
      - matchRegexRaw:
          pattern: Dashboard is enabled
      - notMatchRegexRaw:
          pattern: will not start

  - it: the anonymous warning names tokenSignIn
    set:
      dashboard.auth.tokenSignIn.enabled: false
      dashboard.auth.allowAnonymous: true
    asserts:
      - matchRegexRaw:
          pattern: the dashboard serves without sign-in
      - matchRegexRaw:
          pattern: dashboard\.auth\.tokenSignIn\.enabled=true
      - notMatchRegexRaw:
          pattern: tokenLogin

  - it: hardened with registry says delivery is off by profile
    set:
      profile: hardened
      controller.watchNamespaces: [payments]
      registry: ghcr.io/acme
    asserts:
      - matchRegexRaw:
          pattern: "Delivery is off: profile hardened renders no Pacto delivery"
      - notMatchRegexRaw:
          pattern: "delivery.enabled=true"
      - matchRegexRaw:
          pattern: "Profile hardened: no ClusterRole, no managed dashboard, no node agent, no Pacto\ndelivery and no namespace created by the chart"
      - matchRegexRaw:
          pattern: "Pacto reads the cluster id through Role pacto-operator-pacto-operator-system-cluster-identity in kube-system"
      - notMatchRegexRaw:
          pattern: "Open the dashboard"

  - it: names the kept delivery namespace once delivery no longer renders
    set:
      profile: hardened
      controller.watchNamespaces: [payments]
    kubernetesProvider:
      scheme:
        "v1/Namespace":
          gvr: {version: v1, resource: namespaces}
          namespaced: false
      objects:
        - kind: Namespace
          apiVersion: v1
          metadata:
            name: pacto-delivery
            annotations:
              meta.helm.sh/release-name: pacto-operator
              helm.sh/resource-policy: keep
    asserts:
      - matchRegexRaw:
          pattern: "Pacto delivery is off. Namespace pacto-delivery was kept with its trust config;\ndelete it with kubectl delete namespace pacto-delivery when you no longer need it."

  - it: says nothing about a delivery namespace another release owns
    kubernetesProvider:
      scheme:
        "v1/Namespace":
          gvr: {version: v1, resource: namespaces}
          namespaced: false
      objects:
        - kind: Namespace
          apiVersion: v1
          metadata:
            name: pacto-delivery
            annotations:
              meta.helm.sh/release-name: other
    asserts:
      - notMatchRegexRaw:
          pattern: "was kept with its trust config"

  - it: idp names what it adds
    set: {profile: idp}
    asserts:
      - matchRegexRaw:
          pattern: "Profile idp: probing and metrics observation are on and Pacto delivery is on.\nIt adds the cluster-wide read of ServiceMonitors and PodMonitors and Pacto\ndelivery's cluster roles."
  - it: idp with watchNamespaces names the per-namespace monitor read
    set: {profile: idp, controller.watchNamespaces: [payments]}
    asserts:
      - matchRegexRaw:
          pattern: "It adds the read of ServiceMonitors and PodMonitors in each watched namespace\nand Pacto delivery's cluster roles."
  - it: hardened and idp says delivery stays off
    set: {profile: [hardened, idp], controller.watchNamespaces: [payments]}
    asserts:
      - matchRegexRaw:
          pattern: "Profile idp with hardened: probing and metrics observation are on and Pacto\ndelivery stays off."
      - notMatchRegexRaw:
          pattern: "Profile idp:"
  - it: idp names only the observation modes that render on
    set: {profile: idp, controller.probing: "off", controller.metricsObservation: "off"}
    asserts:
      - matchRegexRaw:
          pattern: "Profile idp: probing and metrics observation are off and Pacto delivery is on.\nIt adds Pacto delivery's cluster roles."
      - notMatchRegexRaw:
          pattern: "ServiceMonitors"
  - it: idp with metrics observation off names probing only
    set: {profile: idp, controller.metricsObservation: "off"}
    asserts:
      - matchRegexRaw:
          pattern: "Profile idp: probing is on and Pacto delivery is on.\nIt adds Pacto delivery's cluster roles."
  - it: hardened and idp with metrics observation off names no monitor read
    set: {profile: [hardened, idp], controller.watchNamespaces: [payments], controller.metricsObservation: "off"}
    asserts:
      - matchRegexRaw:
          pattern: "Profile idp with hardened: probing is on and Pacto\ndelivery stays off."
      - notMatchRegexRaw:
          pattern: "ServiceMonitors"
  - it: the default profile names no profile
    asserts:
      - notMatchRegexRaw:
          pattern: "Profile (idp|hardened)"

  - it: prints the MCP client snippet and the viewer token export by default
    asserts:
      - matchRegexRaw:
          pattern: 'The dashboard also serves MCP at http://127\.0\.0\.1:3000/mcp:'
      - matchRegexRaw:
          pattern: 'export PACTO_TOKEN=\$\(kubectl -n pacto-operator-system create token pacto-viewer --audience pacto-dashboard --duration 1h\)'
      - matchRegexRaw:
          pattern: '\{ "mcpServers": \{ "pacto": \{ "type": "http", "url": "http://127\.0\.0\.1:3000/mcp",\s+"headers": \{ "Authorization": "Bearer \$\{PACTO_TOKEN\}" \} \} \} \}'
      - matchRegexRaw:
          pattern: 'An agent that proposes changes uses its own\s+ServiceAccount; see https://pacto\.run/latest/mcp-integration/#connect-to-an-installed-pacto'
      - notMatchRegexRaw:
          pattern: now also serves MCP

  - it: prints the derived URL in the snippet
    set:
      dashboard.httpRoute.enabled: true
      dashboard.httpRoute.hostnames: [dash.example]
    asserts:
      - matchRegexRaw:
          pattern: '"url": "https://dash\.example/mcp"'

  - it: prints no MCP item with dashboard.mcp.enabled false
    set:
      dashboard.mcp.enabled: false
    asserts:
      - notMatchRegexRaw:
          pattern: 'MCP|PACTO_TOKEN'

  - it: prints the URL and the issuer with an exchange audience and token sign-in off
    set:
      dashboard.auth.tokenSignIn.enabled: false
      dashboard.auth.oidc: {issuerURL: https://idp.example, clientID: c, redirectURL: https://dash.example/auth/callback}
      dashboard.mcp.url: https://dash.example/mcp
      dashboard.mcp.exchangeAudience: kubernetes
    asserts:
      - matchRegexRaw:
          pattern: 'serves MCP at https://dash\.example/mcp\.\s+Your MCP client signs in with https://idp\.example'
      - notMatchRegexRaw:
          pattern: PACTO_TOKEN

  - it: says the dashboard now serves MCP on an upgrade from a dashboard without it
    kubernetesProvider:
      scheme:
        "apps/v1/Deployment":
          gvr: {group: apps, version: v1, resource: deployments}
          namespaced: true
      objects:
        - kind: Deployment
          apiVersion: apps/v1
          metadata: {name: pacto-dashboard, namespace: pacto-operator-system}
          spec:
            template:
              spec:
                containers:
                  - name: dashboard
                    env:
                      - {name: PACTO_DASHBOARD_TOKEN_LOGIN, value: "true"}
    asserts:
      - matchRegexRaw:
          pattern: 'The dashboard now also serves MCP to agents at /mcp\. To turn it off, set\s+dashboard\.mcp\.enabled=false\.'

  - it: says nothing new on an upgrade from a dashboard that served MCP
    kubernetesProvider:
      scheme:
        "apps/v1/Deployment":
          gvr: {group: apps, version: v1, resource: deployments}
          namespaced: true
      objects:
        - kind: Deployment
          apiVersion: apps/v1
          metadata: {name: pacto-dashboard, namespace: pacto-operator-system}
          spec:
            template:
              spec:
                containers:
                  - name: dashboard
                    env:
                      - {name: PACTO_DASHBOARD_TOKEN_LOGIN, value: "true"}
                      - {name: PACTO_DASHBOARD_MCP, value: "true"}
    asserts:
      - notMatchRegexRaw:
          pattern: now also serves MCP
