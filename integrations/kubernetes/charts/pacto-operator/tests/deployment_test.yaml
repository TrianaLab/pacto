suite: deployment tests
templates:
  - templates/deployment.yaml
tests:
  - it: should create a Deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 1

  - it: should use the default image
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "ghcr.io/trianalab/pacto/operator:.*"

  - it: should set security context
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  - it: should set POD_NAMESPACE from downward API
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace

  - it: should include leader-elect arg
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--leader-elect=true"

  - it: should include dashboard args when enabled
    set:
      dashboard.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--enable-dashboard"

  - it: should not include dashboard args when disabled
    set:
      dashboard.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--enable-dashboard"

  - it: should not include watch-namespace by default (cluster-wide)
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--watch-namespace="
        any: true

  - it: should include watch-namespace when set
    set:
      controller.watchNamespace: production
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--watch-namespace=production"

  - it: should not enable probing, metrics observation or kernel evidence by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--enable-probing"
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--enable-metrics-observation"
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--enable-kernel-evidence"

  - it: should pass the observation feature flags when enabled
    set:
      controller.enableProbing: true
      controller.enableMetricsObservation: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--enable-probing"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--enable-metrics-observation"

  - it: should enable kernel evidence with the operator-namespace default
    set:
      controller.kernelEvidence.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--enable-kernel-evidence"
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--kernel-evidence-namespace="
        any: true
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--kernel-evidence-staleness="
        any: true

  - it: should pass the kernel evidence namespace and staleness when set
    set:
      controller.kernelEvidence.enabled: true
      controller.kernelEvidence.namespace: node-agents
      controller.kernelEvidence.staleness: 2m
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--kernel-evidence-namespace=node-agents"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--kernel-evidence-staleness=2m"

  - it: should ignore the Flannel and Calico namespaces by default
    set:
      controller.kernelEvidence.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--caller-coverage-ignore-namespace=calico-system"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--caller-coverage-ignore-namespace=kube-flannel"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--caller-coverage-ignore-namespace=tigera-operator"

  - it: should pass each extra namespace caller coverage ignores
    set:
      controller.kernelEvidence.enabled: true
      controller.kernelEvidence.callerIgnoreNamespaces: [cilium, longhorn-system]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--caller-coverage-ignore-namespace=cilium"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--caller-coverage-ignore-namespace=longhorn-system"

  - it: should ignore kernel evidence settings while it is disabled
    set:
      controller.kernelEvidence.namespace: node-agents
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--kernel-evidence-namespace=node-agents"

  - it: should use custom image tag
    set:
      image.tag: "v1.2.3"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/trianalab/pacto/operator:v1.2.3"

  - it: pins the image by digest when image.digest is set
    set:
      image.tag: "v1.2.3"
      image.digest: "sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/trianalab/pacto/operator:v1.2.3@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

  - it: refuses an image.digest that is not a sha256 digest
    set:
      image.digest: "latest"
    asserts:
      - failedTemplate: {}

  - it: should disable leader election
    set:
      leaderElection.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--leader-elect=false"

  - it: should disable metrics bind address when metrics disabled
    set:
      metrics.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--metrics-bind-address=0"
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--metrics-secure=true"

  - it: rejects the removed dashboard.ociSecret value (use dashboard.ociSecrets)
    set:
      dashboard.enabled: true
      dashboard.ociSecret: my-secret
    asserts:
      - failedTemplate:
          errorPattern: "Additional property ociSecret is not allowed"

  - it: should include dashboard OCI secrets arg when list is set
    set:
      dashboard.enabled: true
      dashboard.ociSecrets:
        - ghcr-creds
        - ecr-creds
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--dashboard-oci-secrets=ghcr-creds,ecr-creds"

  - it: should pass no sign-in by default
    set:
      dashboard.enabled: true
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[*]
          pattern: "--dashboard-oidc|--dashboard-mira|--dashboard-delivery|--dashboard-auth|--dashboard-session|--dashboard-token"

  - it: should pass the dashboard sign-in, the client secret by reference only
    set:
      dashboard.enabled: true
      dashboard.miraURL: http://mira.observability:4318
      dashboard.auth.deliveryNamespace: delivery
      dashboard.auth.oidc:
        issuerURL: https://idp.example
        clientID: pacto-dashboard
        redirectURL: https://dash.example/auth/callback
        extraScopes: [audience:server:client_id:pacto-cli]
        clientSecretRef: {name: dashboard-oidc}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --dashboard-oidc-issuer-url=https://idp.example
      - contains:
          path: spec.template.spec.containers[0].args
          content: --dashboard-oidc-client-id=pacto-dashboard
      - contains:
          path: spec.template.spec.containers[0].args
          content: --dashboard-oidc-redirect-url=https://dash.example/auth/callback
      - contains:
          path: spec.template.spec.containers[0].args
          content: --dashboard-oidc-extra-scopes=audience:server:client_id:pacto-cli
      - contains:
          path: spec.template.spec.containers[0].args
          content: --dashboard-oidc-client-secret-name=dashboard-oidc
      - contains:
          path: spec.template.spec.containers[0].args
          content: --dashboard-oidc-client-secret-key=client-secret
      - contains:
          path: spec.template.spec.containers[0].args
          content: --dashboard-delivery-namespace=delivery
      - contains:
          path: spec.template.spec.containers[0].args
          content: --dashboard-mira-url=http://mira.observability:4318

  - it: should pass the internal issuer address and the issuer CA bundle from a ConfigMap
    set:
      dashboard.enabled: true
      dashboard.auth.oidc:
        issuerURL: https://idp.example
        clientID: pacto-dashboard
        redirectURL: https://dash.example/auth/callback
        internalIssuerURL: http://dex.dex:5556
        caBundle: {configMap: corp-ca}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --dashboard-oidc-internal-issuer-url=http://dex.dex:5556
      - contains:
          path: spec.template.spec.containers[0].args
          content: --dashboard-oidc-ca-configmap=corp-ca
      - contains:
          path: spec.template.spec.containers[0].args
          content: --dashboard-oidc-ca-key=ca.crt
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --dashboard-oidc-ca-secret=
          any: true

  - it: should pass the issuer CA bundle from a Secret key
    set:
      dashboard.enabled: true
      dashboard.auth.oidc:
        issuerURL: https://idp.example
        clientID: pacto-dashboard
        redirectURL: https://dash.example/auth/callback
        caBundle: {secret: corp-ca, key: bundle.pem}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --dashboard-oidc-ca-secret=corp-ca
      - contains:
          path: spec.template.spec.containers[0].args
          content: --dashboard-oidc-ca-key=bundle.pem

  - it: should refuse an issuer CA bundle from both a ConfigMap and a Secret
    set:
      dashboard.enabled: true
      dashboard.auth.oidc:
        issuerURL: https://idp.example
        clientID: pacto-dashboard
        redirectURL: https://dash.example/auth/callback
        caBundle: {configMap: corp-ca, secret: corp-ca}
    asserts:
      - failedTemplate:
          errorMessage: dashboard.auth.oidc.caBundle takes a configMap or a secret, not both

  - it: should refuse an internal issuer URL that is not http or https
    set:
      dashboard.enabled: true
      dashboard.auth.oidc.internalIssuerURL: dex.dex:5556
    asserts:
      - failedTemplate: {}

  - it: should pass the delivery trust config the dashboard verifies History with
    set:
      dashboard.enabled: true
      dashboard.deliveryTrust: {configMap: delivery-trust}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --dashboard-delivery-trust-configmap=delivery-trust
      - contains:
          path: spec.template.spec.containers[0].args
          content: --dashboard-delivery-trust-key=trust.yaml

  - it: should pass the claim mapping the API server uses, the session lifetime and token sign-in
    set:
      dashboard.enabled: true
      dashboard.auth.oidc:
        issuerURL: https://idp.example
        clientID: pacto-dashboard
        redirectURL: https://dash.example/auth/callback
        usernameClaim: email
        usernamePrefix: "oidc:"
        groupsClaim: roles
        groupsPrefix: "oidc:"
      dashboard.auth.session: {idleTimeout: 30m, maxAge: 8h}
      dashboard.auth.tokenLogin.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --dashboard-oidc-username-claim=email
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--dashboard-oidc-username-prefix=oidc:"
      - contains:
          path: spec.template.spec.containers[0].args
          content: --dashboard-oidc-groups-claim=roles
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--dashboard-oidc-groups-prefix=oidc:"
      - contains:
          path: spec.template.spec.containers[0].args
          content: --dashboard-session-idle-timeout=30m
      - contains:
          path: spec.template.spec.containers[0].args
          content: --dashboard-session-max-age=8h
      - contains:
          path: spec.template.spec.containers[0].args
          content: --dashboard-token-login

  - it: should keep the issuer prefix with its hash intact
    set:
      dashboard.enabled: true
      dashboard.auth.oidc: {issuerURL: https://idp.example, clientID: c, redirectURL: https://dash.example/auth/callback, usernamePrefix: "https://idp.example#"}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--dashboard-oidc-username-prefix=https://idp.example#"

  - it: should offer token sign-in without an issuer
    set:
      dashboard.enabled: true
      dashboard.auth.tokenLogin.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --dashboard-token-login
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[*]
          pattern: "--dashboard-oidc"

  - it: should refuse a session lifetime that is no duration
    set:
      dashboard.enabled: true
      dashboard.auth.session.maxAge: twelve hours
    asserts:
      - failedTemplate: {}

  - it: should refuse a claim mapping key the chart does not know
    set:
      dashboard.enabled: true
      dashboard.auth.oidc.usernameClaims: email
    asserts:
      - failedTemplate: {}

  - it: should require a client id with an issuer
    set:
      dashboard.enabled: true
      dashboard.auth.oidc.issuerURL: https://idp.example
    asserts:
      - failedTemplate:
          errorPattern: "clientID is required"

  - it: should include no trace-source arg by default
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[*]
          pattern: "--dashboard-trace-source"

  - it: should include a PVC-backed observation source arg
    set:
      dashboard.enabled: true
      dashboard.observation.sources:
        - name: orders
          file: traces.json
          existingClaim: orders-trace-export
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--dashboard-trace-source=name=orders,file=traces.json,existingClaim=orders-trace-export"

  - it: should include a ConfigMap-backed observation source arg
    set:
      dashboard.enabled: true
      dashboard.observation.sources:
        - name: fixture
          file: traces.json
          configMap: fixture-traces
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--dashboard-trace-source=name=fixture,file=traces.json,configMap=fixture-traces"

  # An "=" in the file name survives the wire: only the FIRST "=" of a field
  # separates key from value, so the parser reads this back as one file name.
  - it: should carry an = in the file name through unescaped
    set:
      dashboard.enabled: true
      dashboard.observation.sources:
        - name: orders
          file: trace=export.json
          existingClaim: orders-trace-export
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--dashboard-trace-source=name=orders,file=trace=export.json,existingClaim=orders-trace-export"

  # The counterexample the wire cannot represent. Rejecting it in the schema is
  # what keeps every value the chart accepts parseable by the controller.
  - it: should reject a file name containing the flag's field separator
    set:
      dashboard.enabled: true
      dashboard.observation.sources:
        - name: orders
          file: trace,part.json
          existingClaim: orders-trace-export
    asserts:
      - failedTemplate: {}

  - it: should reject a nested file path
    set:
      dashboard.enabled: true
      dashboard.observation.sources:
        - name: orders
          file: exports/traces.json
          existingClaim: orders-trace-export
    asserts:
      - failedTemplate: {}

  - it: should reject a backing name that is not a Kubernetes object name
    set:
      dashboard.enabled: true
      dashboard.observation.sources:
        - name: orders
          file: traces.json
          existingClaim: Orders_Trace_Export
    asserts:
      - failedTemplate: {}

  - it: should pass every declared observation source through
    set:
      dashboard.enabled: true
      dashboard.observation.sources:
        - name: orders
          file: traces.json
          existingClaim: orders-trace-export
        - name: checkout
          file: traces.json
          configMap: checkout-traces
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--dashboard-trace-source=name=orders,file=traces.json,existingClaim=orders-trace-export"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--dashboard-trace-source=name=checkout,file=traces.json,configMap=checkout-traces"

  - it: should drop the trace-source args when the dashboard is disabled
    set:
      dashboard.enabled: false
      dashboard.observation.sources:
        - name: orders
          file: traces.json
          existingClaim: orders-trace-export
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[*]
          pattern: "--dashboard-trace-source"

  - it: should not declare a plain-HTTP registry allowance by default
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[*].name
          pattern: "PACTO_INSECURE_REGISTRIES"

  - it: should pass the plain-HTTP registry hosts to the controller environment
    set:
      insecureRegistries:
        - pacto-registry.pacto-system.svc.cluster.local:5000
        - other.svc:5000
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PACTO_INSECURE_REGISTRIES
            value: "pacto-registry.pacto-system.svc.cluster.local:5000,other.svc:5000"
