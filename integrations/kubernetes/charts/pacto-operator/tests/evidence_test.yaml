suite: evidence server tests
tests:
  # --- operator args wiring ---
  - it: does not pass evidence flags when evidence is disabled (default)
    template: templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --enable-evidence-server

  - it: passes the evidence flags when enabled
    template: templates/deployment.yaml
    set:
      evidence.enabled: true
      evidence.trust.existingSecret: my-keys
      evidence.registry.subjects:
        - oci://ghcr.io/acme/orders@sha256:1111111111111111111111111111111111111111111111111111111111111111
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --enable-evidence-server
      - contains:
          path: spec.template.spec.containers[0].args
          content: --evidence-trust-secret=my-keys
      - contains:
          path: spec.template.spec.containers[0].args
          content: --evidence-subject=oci://ghcr.io/acme/orders@sha256:1111111111111111111111111111111111111111111111111111111111111111
      # The bucket store is gone: no flag may reintroduce a second place evidence
      # could live.
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[*]
          pattern: evidence-(bucket-url|prefix|persistence|existing-claim|storage-class)

  - it: passes every configured subject and the credentials secret
    template: templates/deployment.yaml
    set:
      evidence.enabled: true
      evidence.trust.existingSecret: my-keys
      evidence.registry.credentialsSecret: registry-creds
      evidence.registry.subjects:
        - oci://ghcr.io/acme/orders@sha256:1111111111111111111111111111111111111111111111111111111111111111
        - oci://ghcr.io/acme/payments@sha256:2222222222222222222222222222222222222222222222222222222222222222
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --evidence-subject=oci://ghcr.io/acme/orders@sha256:1111111111111111111111111111111111111111111111111111111111111111
      - contains:
          path: spec.template.spec.containers[0].args
          content: --evidence-subject=oci://ghcr.io/acme/payments@sha256:2222222222222222222222222222222222222222222222222222222222222222
      - contains:
          path: spec.template.spec.containers[0].args
          content: --evidence-credentials-secret=registry-creds

  - it: passes no trust config key by default (bare-key mode)
    template: templates/deployment.yaml
    set:
      evidence.enabled: true
      evidence.trust.existingSecret: my-keys
      evidence.registry.subjects:
        - oci://ghcr.io/acme/orders@sha256:1111111111111111111111111111111111111111111111111111111111111111
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[*]
          pattern: evidence-trust-config-key

  - it: passes the structured trust config key when set
    template: templates/deployment.yaml
    set:
      evidence.enabled: true
      evidence.trust.existingSecret: my-keys
      evidence.trust.configKey: trust.yaml
      evidence.registry.subjects:
        - oci://ghcr.io/acme/orders@sha256:1111111111111111111111111111111111111111111111111111111111111111
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --evidence-trust-config-key=trust.yaml

  # The server picks the structured mode by extension, so a key it would read
  # as a bare public key is rejected at install time.
  - it: rejects a trust config key without a yaml extension
    template: templates/deployment.yaml
    set:
      evidence.enabled: true
      evidence.trust.existingSecret: my-keys
      evidence.trust.configKey: adapter.pub
      evidence.registry.subjects:
        - oci://ghcr.io/acme/orders@sha256:1111111111111111111111111111111111111111111111111111111111111111
    asserts:
      - failedTemplate: {}

  # Enabling evidence without naming a subject is an install-time failure, not a
  # server that starts and reports an authoritative empty world.
  - it: fails when evidence is enabled with no subject
    template: templates/deployment.yaml
    set:
      evidence.enabled: true
      evidence.trust.existingSecret: my-keys
    asserts:
      - failedTemplate:
          # `.` for the separator on purpose: helm's bundled schema validator and
          # the standalone plugin spell the failing path differently, and a gate
          # that only fires on one of them is a gate that silently stops firing.
          errorPattern: "evidence.registry.subjects"

  # --- subject prefixes (#572) ---
  - it: subjectPrefixes alone renders --evidence-subject-prefix
    template: templates/deployment.yaml
    set:
      evidence.enabled: true
      evidence.trust.existingSecret: my-keys
      evidence.registry.subjectPrefixes: ["oci://zot.acme.internal/acme/"]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --evidence-subject-prefix=oci://zot.acme.internal/acme/
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[*]
          pattern: ^--evidence-subject=

  - it: subjects alone renders as before
    template: templates/deployment.yaml
    set:
      evidence.enabled: true
      evidence.trust.existingSecret: my-keys
      evidence.registry.subjects:
        - oci://ghcr.io/acme/orders@sha256:1111111111111111111111111111111111111111111111111111111111111111
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --evidence-subject=oci://ghcr.io/acme/orders@sha256:1111111111111111111111111111111111111111111111111111111111111111
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[*]
          pattern: ^--evidence-subject-prefix=

  - it: neither subjects nor subjectPrefixes fails with the message
    template: templates/deployment.yaml
    set:
      evidence.enabled: true
      evidence.trust.existingSecret: my-keys
      evidence.registry.subjects: []
      evidence.registry.subjectPrefixes: []
    asserts:
      # The schema's anyOf fires before the template's own fail; both name the
      # evidence.registry values.
      - failedTemplate:
          errorPattern: "evidence.registry"

  - it: schema refuses a prefix without a trailing slash
    template: templates/deployment.yaml
    set:
      evidence.enabled: true
      evidence.trust.existingSecret: my-keys
      evidence.registry.subjectPrefixes: ["oci://zot.acme.internal/acme"]
    asserts:
      - failedTemplate: {}

  - it: schema refuses a prefix holding a digest
    template: templates/deployment.yaml
    set:
      evidence.enabled: true
      evidence.trust.existingSecret: my-keys
      evidence.registry.subjectPrefixes: ["oci://zot.acme.internal/acme@sha256:aa/"]
    asserts:
      - failedTemplate: {}

  # The ledger is written by the Evidence Server with its own credential: the
  # operator's push prefixes (its keychains and the capped Installation row)
  # never gain it.
  - it: subjectPrefixes adds no --registry-push-prefix
    template: templates/deployment.yaml
    set:
      registry: zot.acme.internal/acme
      evidence.enabled: true
      evidence.trust.existingSecret: my-keys
      evidence.registry.subjectPrefixes: ["oci://zot.acme.internal/acme/"]
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[*]
          pattern: ^--registry-push-prefix=.*pacto-evidence
      - contains:
          path: spec.template.spec.containers[0].args
          content: --registry-push-prefix=zot.acme.internal/acme/pacto-targets

  - it: NOTES names <prefix>pacto-evidence as the Evidence Server's ledger when registry and evidence are set
    template: templates/NOTES.txt
    set:
      registry: zot.acme.internal/acme
      evidence.enabled: true
      evidence.trust.existingSecret: my-keys
      evidence.registry.subjectPrefixes: ["oci://zot.acme.internal/acme/"]
    asserts:
      - matchRegexRaw:
          pattern: "only\\n?\\s*its subject ledgers:\\n\\s+zot\\.acme\\.internal/acme/pacto-evidence"
      - matchRegexRaw:
          pattern: "set allowedContractRepos per key in a trust config"

  - it: NOTES drops the unscoped-keys sentence with a trust config
    template: templates/NOTES.txt
    set:
      evidence.enabled: true
      evidence.trust.existingSecret: my-keys
      evidence.trust.configKey: trust.yaml
      evidence.registry.subjectPrefixes: ["oci://ghcr.io/acme/"]
    asserts:
      - matchRegexRaw:
          pattern: "ghcr\\.io/acme/pacto-evidence"
      - notMatchRegexRaw:
          pattern: "set allowedContractRepos per key"

  - it: NOTES names no ledger with only subjects
    template: templates/NOTES.txt
    set:
      evidence.enabled: true
      evidence.trust.existingSecret: my-keys
      evidence.registry.subjects:
        - oci://ghcr.io/acme/orders@sha256:1111111111111111111111111111111111111111111111111111111111111111
    asserts:
      - notMatchRegexRaw:
          pattern: "subject ledgers"

  # --- RBAC ---
  # A fresh install grants no storage permission at all. Regaining PVC RBAC would
  # mean the operator could once again create a place evidence lives outside the
  # registry.
  - it: never grants PVC RBAC
    template: templates/clusterrole.yaml
    set:
      evidence.enabled: true
      evidence.registry.subjects: [oci://ghcr.io/acme/orders@sha256:1111111111111111111111111111111111111111111111111111111111111111]
    asserts:
      - notExists:
          path: $.rules[?(@.resources[*]=="persistentvolumeclaims")]

  - it: always grants evidence teardown RBAC in the release namespace
    template: templates/role.yaml
    documentIndex: 0
    set:
      evidence.enabled: false
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [apps]
            resources: [deployments]
            verbs: [get, delete]
            resourceNames: [pacto-evidence]

  # Pull secrets, Secret-backed configurations and dashboard.ociSecrets in the
  # release namespace are read with this always-on namespaced get.
  - it: always grants secrets get in the release namespace, even with every component off
    template: templates/role.yaml
    documentIndex: 0
    set:
      dashboard.enabled: false
      evidence.enabled: false
    asserts:
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [get]

  # --- optional exposure ---
  - it: renders no chart external evidence Service by default (ClusterIP, no exposure)
    template: templates/evidence-service.yaml
    set:
      evidence.enabled: true
      evidence.trust.existingSecret: my-keys
      evidence.registry.subjects: [oci://ghcr.io/acme/orders@sha256:1111111111111111111111111111111111111111111111111111111111111111]
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an external evidence Service for NodePort
    template: templates/evidence-service.yaml
    set:
      evidence.enabled: true
      evidence.trust.existingSecret: my-keys
      evidence.registry.subjects: [oci://ghcr.io/acme/orders@sha256:1111111111111111111111111111111111111111111111111111111111111111]
      evidence.service.type: NodePort
      evidence.service.nodePort: 30686
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.ports[0].targetPort
          value: 8686
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/component: evidence
            app.kubernetes.io/name: pacto-evidence

  - it: renders an evidence Ingress when enabled
    template: templates/evidence-ingress.yaml
    set:
      evidence.enabled: true
      evidence.trust.existingSecret: my-keys
      evidence.registry.subjects: [oci://ghcr.io/acme/orders@sha256:1111111111111111111111111111111111111111111111111111111111111111]
      evidence.ingress.enabled: true
    asserts:
      - isKind:
          of: Ingress

  - it: renders no evidence Ingress by default
    template: templates/evidence-ingress.yaml
    set:
      evidence.enabled: true
      evidence.trust.existingSecret: my-keys
      evidence.registry.subjects: [oci://ghcr.io/acme/orders@sha256:1111111111111111111111111111111111111111111111111111111111111111]
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an evidence HTTPRoute when enabled
    template: templates/evidence-httproute.yaml
    set:
      evidence.enabled: true
      evidence.trust.existingSecret: my-keys
      evidence.registry.subjects: [oci://ghcr.io/acme/orders@sha256:1111111111111111111111111111111111111111111111111111111111111111]
      evidence.httpRoute.enabled: true
    asserts:
      - isKind:
          of: HTTPRoute
