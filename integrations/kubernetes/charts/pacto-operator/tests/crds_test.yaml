suite: CRDs
templates:
  - templates/crds.yaml
release:
  name: p
  namespace: pacto-system
tests:
  - it: renders the three operator CRDs and no delivery CRD by default
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: CustomResourceDefinition
      - containsDocument:
          kind: CustomResourceDefinition
          apiVersion: apiextensions.k8s.io/v1
          name: pactos.pacto.trianalab.io
          any: true
      - containsDocument:
          kind: CustomResourceDefinition
          apiVersion: apiextensions.k8s.io/v1
          name: pactorevisions.pacto.trianalab.io
          any: true
      - containsDocument:
          kind: CustomResourceDefinition
          apiVersion: apiextensions.k8s.io/v1
          name: noderuntimeobservations.pacto.trianalab.io
          any: true
      - equal:
          path: spec.group
          value: pacto.trianalab.io

  - it: adds the three delivery CRDs when delivery is enabled
    set:
      delivery.enabled: true
    asserts:
      - hasDocuments:
          count: 6
      - containsDocument:
          kind: CustomResourceDefinition
          apiVersion: apiextensions.k8s.io/v1
          name: stages.delivery.pacto.trianalab.io
          any: true
      - containsDocument:
          kind: CustomResourceDefinition
          apiVersion: apiextensions.k8s.io/v1
          name: operations.delivery.pacto.trianalab.io
          any: true
      - containsDocument:
          kind: CustomResourceDefinition
          apiVersion: apiextensions.k8s.io/v1
          name: approvals.delivery.pacto.trianalab.io
          any: true

  - it: keeps every CRD on helm uninstall
    set:
      delivery.enabled: true
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - isNotNullOrEmpty:
          path: metadata.annotations["controller-gen.kubebuilder.io/version"]
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm

  - it: renders every CRD on helm upgrade, so the upgrade updates them
    release:
      upgrade: true
    set:
      delivery.enabled: true
    asserts:
      - hasDocuments:
          count: 6
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: renders no CRD when you manage them yourself
    set:
      crds.install: false
      delivery.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: serves v1 as storage and v1alpha1 deprecated on every CRD
    asserts:
      - lengthEqual:
          path: spec.versions
          count: 2
      - equal:
          path: spec.versions[0].name
          value: v1
      - equal:
          path: spec.versions[1].name
          value: v1alpha1
      - equal:
          path: spec.versions[0].storage
          value: true
      - equal:
          path: spec.versions[1].storage
          value: false
      - equal:
          path: spec.versions[1].served
          value: true
      - equal:
          path: spec.versions[1].deprecated
          value: true
      - matchRegex:
          path: spec.versions[1].deprecationWarning
          pattern: "v1alpha1 is deprecated; use v1 \\(removed in chart 8\\.0\\)$"

  - it: serves v1 as storage and v1alpha1 deprecated on every delivery CRD
    set:
      delivery.enabled: true
    asserts:
      - hasDocuments:
          count: 6
      - lengthEqual:
          path: spec.versions
          count: 2
      - equal:
          path: spec.versions[0].name
          value: v1
      - equal:
          path: spec.versions[1].name
          value: v1alpha1
      - equal:
          path: spec.versions[0].storage
          value: true
      - equal:
          path: spec.versions[1].deprecated
          value: true

  - it: refuses a CRD that drops a stored version
    release:
      upgrade: true
    kubernetesProvider:
      scheme:
        "apiextensions.k8s.io/v1/CustomResourceDefinition":
          gvr: {group: apiextensions.k8s.io, version: v1, resource: customresourcedefinitions}
          namespaced: false
      objects:
        - kind: CustomResourceDefinition
          apiVersion: apiextensions.k8s.io/v1
          metadata: {name: pactos.pacto.trianalab.io}
          status: {storedVersions: [v1beta9, v1]}
    asserts:
      - failedTemplate:
          errorPattern: "pactos.pacto.trianalab.io still stores objects as v1beta9, which this chart no longer serves. Upgrade to the latest chart of the previous major first and wait until kubectl get crd pactos.pacto.trianalab.io -o jsonpath='\\{.status.storedVersions\\}' prints \\[\"v1\"\\]. See MIGRATION.md."

  - it: renders when the cluster stores v1alpha1 and v1
    release:
      upgrade: true
    kubernetesProvider:
      scheme:
        "apiextensions.k8s.io/v1/CustomResourceDefinition":
          gvr: {group: apiextensions.k8s.io, version: v1, resource: customresourcedefinitions}
          namespaced: false
      objects:
        - kind: CustomResourceDefinition
          apiVersion: apiextensions.k8s.io/v1
          metadata: {name: pactos.pacto.trianalab.io}
          status: {storedVersions: [v1alpha1, v1]}
    asserts:
      - hasDocuments:
          count: 3

  - it: renders with no cluster
    release:
      upgrade: true
    asserts:
      - hasDocuments:
          count: 3
