# The RBAC inventory: every Role, ClusterRole and binding the chart renders, in
# eleven full renders and four single-template renders, with its exact rules,
# roleRef and subjects. A new rule, verb,
# subject or retargeted binding fails here; review it against the least-privilege
# rules (no cluster-wide Secret read, a namespace list renders no ClusterRole
# beyond the node agent, the dashboard's delivery half and the dashboard's
# TokenReview grant) before updating it.
# TestRBACInventoryListsEveryRBACTemplate fails when a template that renders RBAC
# is missing from templates below.
# A member cluster (one that joins a hub through the registry) needs no rule
# beyond its install: the `registry` render is the member install and the
# `hardened with registry` render the member and hardened install.
suite: rbac inventory
templates:
  - templates/clusterrole.yaml
  - templates/clusterrolebinding.yaml
  - templates/role.yaml
  - templates/leader-election-role.yaml
  - templates/nodeagent-namespace.yaml
  - templates/watch-namespaces.yaml
  - templates/secret-grants.yaml
  - templates/delivery/rbac.yaml
  - templates/delivery/recorder.yaml
  - templates/delivery/identities.yaml
  - templates/dashboard-signin.yaml
  - templates/cluster-identity-role.yaml
release:
  name: pacto-operator
  namespace: pacto-operator-system
capabilities:
  apiVersions:
    - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    # a cluster with Flux: delivery.flux.enabled defaults to auto
    - source.toolkit.fluxcd.io/v1/OCIRepository
tests:
  - it: default renders no Secret rule in the ClusterRole
    template: templates/clusterrole.yaml
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
          any: true

  - it: watchNamespaces renders no ClusterRole
    set:
      controller.watchNamespaces: [payments, ledger]
    asserts:
      - hasDocuments:
          count: 0
        template: templates/clusterrole.yaml
      - hasDocuments:
          count: 0
        template: templates/clusterrolebinding.yaml

  - it: watchNamespaces with delivery keeps only the delivery half
    template: templates/clusterrole.yaml
    set:
      controller.watchNamespaces: [payments, ledger]
      delivery.enabled: true
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [namespaces]
              resourceNames: [kube-system]
              verbs: [get]
            - apiGroups: [rbac.authorization.k8s.io]
              resources: [clusterroles, clusterrolebindings]
              verbs: [create, delete, get, list, patch, update, watch]
            - apiGroups: [authorization.k8s.io]
              resources: [subjectaccessreviews]
              verbs: [create]
            - apiGroups: [delivery.pacto.trianalab.io]
              resources: [stages, operations]
              verbs: [get, list, watch]
            - apiGroups: [""]
              resources: [namespaces]
              verbs: [list]

  - it: watchNamespaces renders a watch Role and a dashboard watch Role per namespace
    template: templates/watch-namespaces.yaml
    set:
      controller.watchNamespaces: [payments, ledger]
    asserts:
      - hasDocuments:
          count: 8
      - equal:
          path: metadata.namespace
          value: ledger
        documentIndex: 0
      - equal:
          path: metadata.name
          value: pacto-operator-watch
        documentIndex: 0
      - equal:
          path: metadata.name
          value: pacto-dashboard-watch
        documentIndex: 2
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: pacto-dashboard
              namespace: pacto-operator-system
        documentIndex: 3
      - equal:
          path: metadata.namespace
          value: payments
        documentIndex: 4

  - it: watching the release namespace keeps the manager Role beside the watch Role
    set:
      controller.watchNamespaces: [pacto-operator-system, payments]
    asserts:
      - equal:
          path: metadata.name
          value: pacto-operator-manager
        documentIndex: 0
        template: templates/role.yaml
      - equal:
          path: metadata.namespace
          value: pacto-operator-system
        documentIndex: 0
        template: templates/role.yaml
      - equal:
          path: metadata.name
          value: pacto-operator-watch
        documentIndex: 0
        template: templates/watch-namespaces.yaml
      - equal:
          path: metadata.namespace
          value: pacto-operator-system
        documentIndex: 0
        template: templates/watch-namespaces.yaml

  - it: kernel evidence reads move to a Role in its namespace
    template: templates/watch-namespaces.yaml
    set:
      controller.watchNamespaces: [payments]
      nodeAgent.enabled: true
    asserts:
      - hasDocuments:
          count: 6
      - equal:
          path: metadata.name
          value: pacto-operator-kernel-reader
        documentIndex: 4
      - equal:
          path: metadata.namespace
          value: pacto-node-agent
        documentIndex: 4
      - equal:
          path: rules
          value:
            - apiGroups: [pacto.trianalab.io]
              resources: [noderuntimeobservations]
              verbs: [delete, get, list, watch]
            - apiGroups: [coordination.k8s.io]
              resources: [leases]
              verbs: [get, list, watch]
        documentIndex: 4
      - equal:
          path: roleRef.name
          value: pacto-operator-kernel-reader
        documentIndex: 5

  - it: kernel evidence with watchNamespaces leaves only the node agent half in the ClusterRole
    template: templates/clusterrole.yaml
    set:
      controller.watchNamespaces: [payments]
      nodeAgent.enabled: true
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [nodes]
              verbs: [get]
            - apiGroups: [""]
              resources: [namespaces]
              verbs: [get, patch]
              resourceNames: [pacto-node-agent]

  - it: should grant namespace get in each watched namespace's Role under auto
    template: templates/watch-namespaces.yaml
    set:
      controller.watchNamespaces: [payments, ledger]
      dashboard.enabled: false
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [namespaces]
            verbs: [get]
        documentSelector:
          path: kind
          value: Role
          matchMany: true

  - it: should not grant namespace get in the watched namespaces' Roles with both on
    template: templates/watch-namespaces.yaml
    set:
      controller.watchNamespaces: [payments, ledger]
      controller.probing: "on"
      controller.metricsObservation: "on"
      dashboard.enabled: false
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [namespaces]
            verbs: [get]
        documentSelector:
          path: kind
          value: Role
          matchMany: true

  - it: secretGrants renders name-scoped Roles
    template: templates/secret-grants.yaml
    set:
      controller.secretGrants: [payments/regcred, ledger/b, ledger/a]
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: metadata.namespace
          value: ledger
        documentIndex: 0
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [secrets]
              verbs: [get]
              resourceNames: [a, b]
        documentIndex: 0
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [secrets]
              verbs: [get]
              resourceNames: [regcred]
        documentIndex: 2
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: pacto-operator-secret-grant
        documentIndex: 3

  - it: the dashboard Role grants localsubjectaccessreviews
    template: templates/watch-namespaces.yaml
    set:
      controller.watchNamespaces: [payments]
    documentIndex: 2
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [authorization.k8s.io]
            resources: [localsubjectaccessreviews]
            verbs: [create]

  - it: the dashboard reads workloads and no pods or Secrets
    template: templates/watch-namespaces.yaml
    set:
      controller.watchNamespaces: [payments]
    documentIndex: 2
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [apps]
            resources: [deployments, statefulsets, daemonsets]
            verbs: [list]
      - contains:
          path: rules
          content:
            apiGroups: [batch]
            resources: [cronjobs]
            verbs: [list]
      - notContains:
          path: rules
          content:
            apiGroups: ['']
            resources: [pods]
          any: true
      - notContains:
          path: rules
          content:
            apiGroups: ['']
            resources: [secrets]
          any: true

  # These list grants return whole objects, inline Helm values included
  # (spec.source.helm.values, spec.values, spec.postBuild.substitute), which can
  # hold credentials: Pacto decodes only the source and status fields it names.
  - it: the dashboard lists GitOps objects and reads no Secrets
    template: templates/watch-namespaces.yaml
    set:
      controller.watchNamespaces: [payments]
    documentIndex: 2
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [argoproj.io]
            resources: [applications]
            verbs: [list]
      - contains:
          path: rules
          content:
            apiGroups: [kustomize.toolkit.fluxcd.io]
            resources: [kustomizations]
            verbs: [list]
      - contains:
          path: rules
          content:
            apiGroups: [helm.toolkit.fluxcd.io]
            resources: [helmreleases]
            verbs: [list]
      - contains:
          path: rules
          content:
            apiGroups: [source.toolkit.fluxcd.io]
            resources: [gitrepositories]
            verbs: [list]
      - notContains:
          path: rules
          content:
            apiGroups: ['']
            resources: [secrets]
          any: true

  - it: the operator holds the GitOps list grants of the dashboard ClusterRole and reads no Secrets cluster-wide
    template: templates/clusterrole.yaml
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [argoproj.io]
            resources: [applications]
            verbs: [list]
      - contains:
          path: rules
          content:
            apiGroups: [kustomize.toolkit.fluxcd.io]
            resources: [kustomizations]
            verbs: [list]
      - contains:
          path: rules
          content:
            apiGroups: [helm.toolkit.fluxcd.io]
            resources: [helmreleases]
            verbs: [list]
      - contains:
          path: rules
          content:
            apiGroups: [source.toolkit.fluxcd.io]
            resources: [gitrepositories]
            verbs: [list]
      - notContains:
          path: rules
          content:
            apiGroups: ['']
            resources: [secrets]
          any: true

  - it: watching the node agent namespace fails
    template: templates/watch-namespaces.yaml
    set:
      controller.watchNamespaces: [pacto-node-agent]
    asserts:
      - failedTemplate:
          errorPattern: must not hold the node agent namespace

  # The pinned renders below run without the Istio API: these two add the
  # ServiceEntry read the externals list needs when the cluster serves it.
  - it: the Istio API adds the ServiceEntry read to the ClusterRole
    template: templates/clusterrole.yaml
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
        - networking.istio.io/v1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [networking.istio.io]
            resources: [serviceentries]
            verbs: [get, list, watch]

  - it: the Istio API adds the ServiceEntry read to each watch Role
    template: templates/watch-namespaces.yaml
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
        - networking.istio.io/v1
    set:
      controller.watchNamespaces: [payments]
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [networking.istio.io]
            resources: [serviceentries]
            verbs: [get, list, watch]

  # Every binding's roleRef and subjects are pinned: the per-render cases below.
  - it: 'default: every rule, roleRef and subject of clusterrole.yaml is pinned'
    template: templates/clusterrole.yaml
    asserts:
    - hasDocuments: {count: 1}
    - equal: {path: kind, value: ClusterRole}
      documentIndex: 0
    - equal: {path: metadata.name, value: pacto-operator-manager}
      documentIndex: 0
    - notExists: {path: metadata.namespace}
      documentIndex: 0
    - equal:
        path: rules
        value:
        - apiGroups: ['']
          resources: [events]
          verbs: [create, patch]
        - apiGroups: ['']
          resources: [services]
          verbs: [get, list, watch]
        - apiGroups: ['']
          resources: [configmaps]
          verbs: [get, list, watch]
        - apiGroups: ['']
          resources: [pods]
          verbs: [get, list, watch]
        - apiGroups: [pacto.trianalab.io]
          resources: [noderuntimeobservations]
          verbs: [delete, get, list, watch]
        - apiGroups: [networking.k8s.io]
          resources: [ingresses]
          verbs: [get, list, watch]
        - apiGroups: [gateway.networking.k8s.io]
          resources: [httproutes]
          verbs: [get, list, watch]
        - apiGroups: [discovery.k8s.io]
          resources: [endpointslices]
          verbs: [get, list, watch]
        - apiGroups: [apps]
          resources: [deployments, replicasets, statefulsets, daemonsets]
          verbs: [get, list, watch]
        - apiGroups: [batch]
          resources: [cronjobs, jobs]
          verbs: [get, list, watch]
        - apiGroups: [argoproj.io]
          resources: [applications]
          verbs: [list]
        - apiGroups: [kustomize.toolkit.fluxcd.io]
          resources: [kustomizations]
          verbs: [list]
        - apiGroups: [helm.toolkit.fluxcd.io]
          resources: [helmreleases]
          verbs: [list]
        - apiGroups: [source.toolkit.fluxcd.io]
          resources: [gitrepositories]
          verbs: [list]
        - apiGroups: [pacto.trianalab.io]
          resources: [pactos]
          verbs: [create, delete, get, list, patch, update, watch]
        - apiGroups: [pacto.trianalab.io]
          resources: [pactos/status]
          verbs: [get, patch, update]
        - apiGroups: [pacto.trianalab.io]
          resources: [pactos/finalizers]
          verbs: [update]
        - apiGroups: [pacto.trianalab.io]
          resources: [pactorevisions]
          verbs: [create, get, list, watch]
        - apiGroups: [pacto.trianalab.io]
          resources: [pactorevisions/status]
          verbs: [get, patch, update]
        - apiGroups: [rbac.authorization.k8s.io]
          resourceNames: [pacto-dashboard]
          resources: [clusterroles, clusterrolebindings]
          verbs: [get, delete]
        - apiGroups: ['']
          resourceNames: [kube-system]
          resources: [namespaces]
          verbs: [get]
        - apiGroups: ['']
          resources: [nodes]
          verbs: [list]
        - apiGroups: ['']
          resources: [namespaces]
          verbs: [get]
        - apiGroups: [rbac.authorization.k8s.io]
          resources: [clusterroles, clusterrolebindings]
          verbs: [create, delete, get, list, patch, update, watch]
        - apiGroups: [authorization.k8s.io]
          resources: [subjectaccessreviews]
          verbs: [create]
        - apiGroups: [delivery.pacto.trianalab.io]
          resources: [stages, operations]
          verbs: [get, list, watch]
        - apiGroups: ['']
          resources: [namespaces]
          verbs: [list]
      documentIndex: 0
  - it: 'default: every rule, roleRef and subject of clusterrolebinding.yaml is pinned'
    template: templates/clusterrolebinding.yaml
    asserts:
    - hasDocuments: {count: 1}
    - equal: {path: kind, value: ClusterRoleBinding}
      documentIndex: 0
    - equal: {path: metadata.name, value: pacto-operator-manager}
      documentIndex: 0
    - notExists: {path: metadata.namespace}
      documentIndex: 0
    - equal:
        path: roleRef
        value: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: pacto-operator-manager}
      documentIndex: 0
    - equal:
        path: subjects
        value:
        - {kind: ServiceAccount, name: pacto-operator, namespace: pacto-operator-system}
      documentIndex: 0
  - it: 'default: every rule, roleRef and subject of role.yaml is pinned'
    template: templates/role.yaml
    asserts:
    - hasDocuments: {count: 2}
    - equal: {path: kind, value: Role}
      documentIndex: 0
    - equal: {path: metadata.name, value: pacto-operator-manager}
      documentIndex: 0
    - equal: {path: metadata.namespace, value: pacto-operator-system}
      documentIndex: 0
    - equal:
        path: rules
        value:
        - apiGroups: ['']
          resourceNames: [pacto-dashboard]
          resources: [serviceaccounts, services]
          verbs: [get, delete]
        - apiGroups: ['']
          resourceNames: [pacto-dashboard-oci-creds]
          resources: [secrets]
          verbs: [get, delete]
        - apiGroups: [apps]
          resourceNames: [pacto-dashboard]
          resources: [deployments]
          verbs: [get, delete]
        - apiGroups: ['']
          resourceNames: [pacto-evidence]
          resources: [services]
          verbs: [get, delete]
        - apiGroups: [apps]
          resourceNames: [pacto-evidence]
          resources: [deployments]
          verbs: [get, delete]
        - apiGroups: [apps]
          resourceNames: [pacto-node-agent]
          resources: [daemonsets]
          verbs: [get, delete]
        - apiGroups: [rbac.authorization.k8s.io]
          resourceNames: [pacto-node-agent]
          resources: [roles, rolebindings]
          verbs: [get, delete]
        - apiGroups: ['']
          resourceNames: [pacto-node-agent]
          resources: [serviceaccounts]
          verbs: [get, delete]
        - apiGroups: ['']
          resources: [secrets]
          verbs: [get]
        - apiGroups: ['']
          resources: [configmaps]
          verbs: [create]
        - apiGroups: ['']
          resourceNames: [pacto-operator-detected]
          resources: [configmaps]
          verbs: [get, patch]
        - apiGroups: [apps]
          resourceNames: [pacto-operator]
          resources: [deployments]
          verbs: [get]
        - apiGroups: ['']
          resources: [secrets, serviceaccounts, services]
          verbs: [create, delete, get, patch, update]
        - apiGroups: [apps]
          resources: [deployments]
          verbs: [create, delete, get, patch, update]
      documentIndex: 0
    - equal: {path: kind, value: RoleBinding}
      documentIndex: 1
    - equal: {path: metadata.name, value: pacto-operator-manager}
      documentIndex: 1
    - equal: {path: metadata.namespace, value: pacto-operator-system}
      documentIndex: 1
    - equal:
        path: roleRef
        value: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: pacto-operator-manager}
      documentIndex: 1
    - equal:
        path: subjects
        value:
        - {kind: ServiceAccount, name: pacto-operator, namespace: pacto-operator-system}
      documentIndex: 1
  - it: 'default: every rule, roleRef and subject of leader-election-role.yaml is pinned'
    template: templates/leader-election-role.yaml
    asserts:
    - hasDocuments: {count: 2}
    - equal: {path: kind, value: Role}
      documentIndex: 0
    - equal: {path: metadata.name, value: pacto-operator-leader-election}
      documentIndex: 0
    - equal: {path: metadata.namespace, value: pacto-operator-system}
      documentIndex: 0
    - equal:
        path: rules
        value:
        - apiGroups: [coordination.k8s.io]
          resources: [leases]
          verbs: [get, list, watch, create, update, patch, delete]
        - apiGroups: ['']
          resources: [events]
          verbs: [create, patch]
      documentIndex: 0
    - equal: {path: kind, value: RoleBinding}
      documentIndex: 1
    - equal: {path: metadata.name, value: pacto-operator-leader-election}
      documentIndex: 1
    - equal: {path: metadata.namespace, value: pacto-operator-system}
      documentIndex: 1
    - equal:
        path: roleRef
        value: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: pacto-operator-leader-election}
      documentIndex: 1
    - equal:
        path: subjects
        value:
        - {kind: ServiceAccount, name: pacto-operator, namespace: pacto-operator-system}
      documentIndex: 1
  - it: 'default: every rule, roleRef and subject of nodeagent-namespace.yaml is pinned'
    template: templates/nodeagent-namespace.yaml
    asserts:
    - hasDocuments: {count: 0}
  - it: 'default: every rule, roleRef and subject of watch-namespaces.yaml is pinned'
    template: templates/watch-namespaces.yaml
    asserts:
    - hasDocuments: {count: 0}
  - it: 'default: every rule, roleRef and subject of secret-grants.yaml is pinned'
    template: templates/secret-grants.yaml
    asserts:
    - hasDocuments: {count: 0}
  - it: 'default: every rule, roleRef and subject of delivery/rbac.yaml is pinned'
    template: templates/delivery/rbac.yaml
    asserts:
    - hasDocuments: {count: 0}
  - it: 'default: every rule, roleRef and subject of delivery/recorder.yaml is pinned'
    template: templates/delivery/recorder.yaml
    asserts:
    - hasDocuments: {count: 0}
  - it: 'default: every rule, roleRef and subject of delivery/identities.yaml is pinned'
    template: templates/delivery/identities.yaml
    asserts:
    - hasDocuments: {count: 0}
  - it: 'watchNamespaces: every rule, roleRef and subject of clusterrole.yaml is pinned'
    template: templates/clusterrole.yaml
    set: &id001
      controller.watchNamespaces: [payments, ledger]
    asserts:
    - hasDocuments: {count: 0}
  - it: 'watchNamespaces: every rule, roleRef and subject of clusterrolebinding.yaml is pinned'
    template: templates/clusterrolebinding.yaml
    set: *id001
    asserts:
    - hasDocuments: {count: 0}
  - it: 'watchNamespaces: every rule, roleRef and subject of role.yaml is pinned'
    template: templates/role.yaml
    set: *id001
    asserts:
    - hasDocuments: {count: 2}
    - equal: {path: kind, value: Role}
      documentIndex: 0
    - equal: {path: metadata.name, value: pacto-operator-manager}
      documentIndex: 0
    - equal: {path: metadata.namespace, value: pacto-operator-system}
      documentIndex: 0
    - equal:
        path: rules
        value:
        - apiGroups: ['']
          resourceNames: [pacto-dashboard]
          resources: [serviceaccounts, services]
          verbs: [get, delete]
        - apiGroups: ['']
          resourceNames: [pacto-dashboard-oci-creds]
          resources: [secrets]
          verbs: [get, delete]
        - apiGroups: [apps]
          resourceNames: [pacto-dashboard]
          resources: [deployments]
          verbs: [get, delete]
        - apiGroups: ['']
          resourceNames: [pacto-evidence]
          resources: [services]
          verbs: [get, delete]
        - apiGroups: [apps]
          resourceNames: [pacto-evidence]
          resources: [deployments]
          verbs: [get, delete]
        - apiGroups: [apps]
          resourceNames: [pacto-node-agent]
          resources: [daemonsets]
          verbs: [get, delete]
        - apiGroups: [rbac.authorization.k8s.io]
          resourceNames: [pacto-node-agent]
          resources: [roles, rolebindings]
          verbs: [get, delete]
        - apiGroups: ['']
          resourceNames: [pacto-node-agent]
          resources: [serviceaccounts]
          verbs: [get, delete]
        - apiGroups: ['']
          resources: [secrets]
          verbs: [get]
        - apiGroups: ['']
          resources: [configmaps]
          verbs: [create]
        - apiGroups: ['']
          resourceNames: [pacto-operator-detected]
          resources: [configmaps]
          verbs: [get, patch]
        - apiGroups: [apps]
          resourceNames: [pacto-operator]
          resources: [deployments]
          verbs: [get]
        - apiGroups: ['']
          resources: [secrets, serviceaccounts, services]
          verbs: [create, delete, get, patch, update]
        - apiGroups: [apps]
          resources: [deployments]
          verbs: [create, delete, get, patch, update]
      documentIndex: 0
    - equal: {path: kind, value: RoleBinding}
      documentIndex: 1
    - equal: {path: metadata.name, value: pacto-operator-manager}
      documentIndex: 1
    - equal: {path: metadata.namespace, value: pacto-operator-system}
      documentIndex: 1
    - equal:
        path: roleRef
        value: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: pacto-operator-manager}
      documentIndex: 1
    - equal:
        path: subjects
        value:
        - {kind: ServiceAccount, name: pacto-operator, namespace: pacto-operator-system}
      documentIndex: 1
  - it: 'watchNamespaces: every rule, roleRef and subject of leader-election-role.yaml is pinned'
    template: templates/leader-election-role.yaml
    set: *id001
    asserts:
    - hasDocuments: {count: 2}
