# The installation registry (510-S6): the controller flags the top-level
# registry renders, the one by-name grant registryPullSecret adds, and the
# operator-side target snapshot (delivery_recorder_test.yaml pins that the
# recorder no longer publishes it).
suite: registry
templates:
  - templates/deployment.yaml
  - templates/secret-grants.yaml
  - templates/role.yaml
  - templates/watch-namespaces.yaml
  - templates/crds.yaml
  - templates/delivery/admission.yaml
  - templates/delivery/deployment.yaml
  - templates/delivery/fingerprints.yaml
  - templates/delivery/identities.yaml
  - templates/delivery/metrics.yaml
  - templates/delivery/monitoring.yaml
  - templates/delivery/namespace.yaml
  - templates/delivery/publishers.yaml
  - templates/delivery/rbac.yaml
  - templates/delivery/recorder.yaml
release:
  name: pacto-operator
  namespace: pacto-operator-system
capabilities:
  apiVersions:
    - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    - monitoring.coreos.com/v1/ServiceMonitor
tests:
  - it: registry renders --registry on the controller
    template: templates/deployment.yaml
    set:
      registry: ghcr.io/acme
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --registry=ghcr.io/acme

  - it: no registry renders no --registry
    template: templates/deployment.yaml
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[*]
          pattern: ^--registry
      - hasDocuments:
          count: 0
        template: templates/secret-grants.yaml

  - it: registry renders one --registry-push-prefix per installation repository
    template: templates/deployment.yaml
    set:
      registry: ghcr.io/acme
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --registry-push-prefix=ghcr.io/acme/pacto-targets
      - contains:
          path: spec.template.spec.containers[0].args
          content: --registry-push-prefix=ghcr.io/acme/pacto-index
      - contains:
          path: spec.template.spec.containers[0].args
          content: --registry-push-prefix=ghcr.io/acme/pacto-inferred
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[*]
          pattern: ^--registry-pull-secret

  - it: registryPullSecret renders a Role scoped to that Secret in its namespace
    template: templates/secret-grants.yaml
    set:
      registry: ghcr.io/acme
      registryPullSecret: ci/regcred
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.namespace
          value: ci
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [secrets]
              verbs: [get]
              resourceNames: [regcred]
        documentIndex: 0
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: pacto-operator-secret-grant
        documentIndex: 1
      - equal:
          path: subjects
          value:
            - {kind: ServiceAccount, name: pacto-operator, namespace: pacto-operator-system}
        documentIndex: 1

  - it: registryPullSecret renders --registry-pull-secret
    template: templates/deployment.yaml
    set:
      registry: ghcr.io/acme
      registryPullSecret: ci/regcred
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --registry-pull-secret=ci/regcred

  - it: registryPullSecret also in controller.secretGrants renders one Role
    template: templates/secret-grants.yaml
    set:
      registry: ghcr.io/acme
      registryPullSecret: ci/regcred
      controller.secretGrants: [ci/regcred, ci/other]
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: rules[0].resourceNames
          value: [other, regcred]
        documentIndex: 0

  - it: registryPullSecret without registry fails
    template: templates/deployment.yaml
    set:
      registryPullSecret: ci/regcred
    asserts:
      - failedTemplate:
          errorPattern: registryPullSecret needs registry

  - it: the schema refuses registryPullSecret without a namespace
    template: templates/deployment.yaml
    set:
      registry: ghcr.io/acme
      registryPullSecret: regcred
    asserts:
      - failedTemplate:
          errorPattern: "(?i)registryPullSecret.*does not match pattern"

  - it: registry grants the operator secrets create in its namespace
    template: templates/role.yaml
    documentIndex: 0
    set:
      registry: ghcr.io/acme
    asserts:
      - equal:
          path: metadata.namespace
          value: pacto-operator-system
      - contains:
          path: rules
          content: {apiGroups: [""], resources: [secrets], verbs: [create]}

  - it: no registry renders no secrets create unless the dashboard is on
    template: templates/role.yaml
    documentIndex: 0
    set:
      dashboard.enabled: false
    asserts:
      - notContains:
          path: rules
          content: {apiGroups: [""], resources: [secrets], verbs: [create]}
      - notContains:
          path: rules
          content: {apiGroups: [""], resources: [secrets, serviceaccounts, services], verbs: [create, delete, get, patch, update]}

  - it: the controller carries OPERATOR_SERVICE_ACCOUNT
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OPERATOR_SERVICE_ACCOUNT, value: pacto-operator}

  - it: registry lets a scoped operator list the DaemonSets of each watched namespace
    template: templates/watch-namespaces.yaml
    documentIndex: 0
    set:
      registry: ghcr.io/acme
      controller.watchNamespaces: [team-a]
    asserts:
      - contains:
          path: rules
          content: {apiGroups: [apps], resources: [daemonsets], verbs: [list]}

  - it: a scoped operator without registry lists no DaemonSets
    template: templates/watch-namespaces.yaml
    documentIndex: 0
    set:
      controller.watchNamespaces: [team-a]
    asserts:
      - notContains:
          path: rules
          content: {apiGroups: [apps], resources: [daemonsets], verbs: [list]}

  - it: registry alone renders no promoter, no recorder, no delivery RBAC
    set:
      registry: ghcr.io/acme
    asserts:
      - hasDocuments:
          count: 0
        template: templates/delivery/admission.yaml
      - hasDocuments:
          count: 0
        template: templates/delivery/deployment.yaml
      - hasDocuments:
          count: 0
        template: templates/delivery/fingerprints.yaml
      - hasDocuments:
          count: 0
        template: templates/delivery/identities.yaml
      - hasDocuments:
          count: 0
        template: templates/delivery/metrics.yaml
      - hasDocuments:
          count: 0
        template: templates/delivery/monitoring.yaml
      - hasDocuments:
          count: 0
        template: templates/delivery/namespace.yaml
      - hasDocuments:
          count: 0
        template: templates/delivery/publishers.yaml
      - hasDocuments:
          count: 0
        template: templates/delivery/rbac.yaml
      - hasDocuments:
          count: 0
        template: templates/delivery/recorder.yaml

  - it: registry alone installs no delivery CRD
    template: templates/crds.yaml
    set:
      registry: ghcr.io/acme
    asserts:
      - hasDocuments:
          count: 3
      - notMatchRegex:
          path: metadata.name
          pattern: delivery\.pacto\.trianalab\.io$

  - it: registry with delivery and the recorder derives the streams repository
    template: templates/delivery/recorder.yaml
    documentSelector: {path: kind, value: Deployment}
    set:
      registry: ghcr.io/acme
      delivery.enabled: true
      delivery.recorder.enabled: true
      delivery.recorder.signing.kms: awskms:///alias/r
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --streams-repository=ghcr.io/acme/pacto-streams
      - contains:
          path: spec.template.spec.containers[0].args
          content: --approvals-repository=ghcr.io/acme/pacto-streams-approvals
      - contains:
          path: spec.template.spec.containers[0].args
          content: --registry=ghcr.io/acme

  - it: an explicit streamsRepository overrides the derivation
    template: templates/delivery/recorder.yaml
    documentSelector: {path: kind, value: Deployment}
    set:
      registry: ghcr.io/acme
      delivery.enabled: true
      delivery.recorder.enabled: true
      delivery.recorder.streamsRepository: quay.io/other/streams
      delivery.recorder.signing.kms: awskms:///alias/r
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --streams-repository=quay.io/other/streams
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --streams-repository=ghcr.io/acme/pacto-streams

  - it: every push flag is under the installation prefixes or an explicit delivery value
    set:
      registry: ghcr.io/acme
      delivery.enabled: true
      delivery.recorder.enabled: true
      delivery.recorder.signing.kms: awskms:///alias/r
      delivery.stats.repository: ghcr.io/acme/stats
      delivery.publishers.registry: ghcr.io/acme
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --streams-repository=ghcr.io/acme/pacto-streams
        template: templates/delivery/recorder.yaml
        documentSelector: {path: kind, value: Deployment}
      - contains:
          path: spec.template.spec.containers[0].args
          content: --registry=ghcr.io/acme
        template: templates/delivery/recorder.yaml
        documentSelector: {path: kind, value: Deployment}
      - contains:
          path: spec.template.spec.containers[0].args
          content: --publishers-registry=ghcr.io/acme
        template: templates/delivery/deployment.yaml
        documentSelector: {path: kind, value: Deployment}
      - contains:
          path: spec.template.spec.containers[0].args
          content: --records-repository=ghcr.io/acme/pacto-streams
        template: templates/delivery/deployment.yaml
        documentSelector: {path: kind, value: Deployment}
      - contains:
          path: spec.template.spec.containers[0].args
          content: --stats-repository=ghcr.io/acme/stats
        template: templates/delivery/deployment.yaml
        documentSelector: {path: kind, value: Deployment}
      - contains:
          path: spec.template.spec.containers[0].args
          content: --registry=ghcr.io/acme
        template: templates/delivery/deployment.yaml
        documentSelector: {path: kind, value: Deployment}
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[*]
          pattern: ^--(streams-repository|approvals-repository|stats-repository|registry|registry-push-prefix)=[^g]
        template: templates/delivery/recorder.yaml
        documentSelector: {path: kind, value: Deployment}
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[*]
          pattern: ^--(stats-repository|registry|records-repository|publishers-registry)=[^g]
        template: templates/delivery/deployment.yaml
        documentSelector: {path: kind, value: Deployment}
      - contains:
          path: spec.template.spec.containers[0].args
          content: --registry-push-prefix=ghcr.io/acme/pacto-streams
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: --registry-push-prefix=ghcr.io/acme/pacto-streams-approvals
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: --registry-push-prefix=ghcr.io/acme/stats
        template: templates/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --registry-push-prefix=ghcr.io/acme
        template: templates/deployment.yaml

  - it: the recorder without registry or streamsRepository fails
    template: templates/delivery/recorder.yaml
    set:
      delivery.enabled: true
      delivery.recorder.enabled: true
      delivery.recorder.signing.kms: awskms:///alias/r
    asserts:
      - failedTemplate:
          errorPattern: "set registry or delivery.recorder.streamsRepository"

  - it: push prefixes list an explicit stats repository outside registry
    template: templates/deployment.yaml
    set:
      registry: ghcr.io/acme
      delivery.enabled: true
      delivery.stats.repository: quay.io/other/stats
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --registry-push-prefix=quay.io/other/stats

  - it: delivery off renders no delivery push prefix
    template: templates/deployment.yaml
    set:
      registry: ghcr.io/acme
      delivery.stats.repository: quay.io/other/stats
      delivery.recorder.streamsRepository: quay.io/other/streams
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[*]
          pattern: ^--registry-push-prefix=quay\.io
