global:
  # -- Registry of every image the chart runs (the controller, the delivery
  # promoter and the recorder), unless an image sets its own `registry`. Set it
  # empty to give each `repository` as a whole reference.
  imageRegistry: ghcr.io
  # -- Image pull secrets for every pod the chart runs, before each
  # component's own
  imagePullSecrets: []
  # -- Labels added to every object the chart renders
  commonLabels: {}
  # Pod securityContext of every pod the chart runs, unless a component sets
  # its own `podSecurityContext`
  podSecurityContext:
    # -- Run pod as non-root
    runAsNonRoot: true
    seccompProfile:
      # -- Seccomp profile type
      type: RuntimeDefault
  # Container securityContext of every container the chart runs, unless a
  # component sets its own `securityContext`
  securityContext:
    # -- Disallow privilege escalation
    allowPrivilegeEscalation: false
    capabilities:
      # -- Drop all capabilities
      drop:
        - ALL
    # -- Read-only root filesystem
    readOnlyRootFilesystem: true
    # -- Run as non-root
    runAsNonRoot: true
    # -- Run as UID 65532 (nonroot in distroless)
    runAsUser: 65532

# -- The installation registry (host[/path], no scheme), such as
# `ghcr.io/acme`. The operator publishes the cluster's target snapshot, signed
# with the installation key it creates once, to `<registry>/pacto-targets`,
# which `pacto impact` reads in CI and a hub reads to approve this cluster as a
# member (`pacto cluster approve`); empty publishes none. The managed dashboard
# lists the golden paths and offerings published under it. Delivery stays off
# until delivery.enabled=true.
registry: ""

# -- Installation profile: default, hardened or idp, or a list such as
# `{hardened,idp}` (hardened wins where they disagree). hardened needs
# controller.watchNamespaces and renders no ClusterRole, no managed dashboard,
# no node agent, no Pacto delivery and no namespace; idp turns probing, metrics
# observation and Pacto delivery on. See
# https://pacto.run/latest/integrations/kubernetes/profiles/
profile: default

# Opt-in upstream installs of profile idp, each upgraded with this release.
idp:
  flux:
    # -- Install upstream Flux (source, kustomize and helm controllers) with this release, at the version in
    # files/flux/VERSION, so profile idp can deliver workloads that no GitOps engine manages. Needs profile idp;
    # refused when another Flux runs. Uninstalling Pacto or turning this off leaves Flux, its CRDs and every
    # workload it applied in place. See https://pacto.run/latest/integrations/kubernetes/delivery-setup/#idp-mode
    install: false
  crossplane:
    # -- Install upstream Crossplane with this release. Needs profile idp;
    # refused when Crossplane is already installed. Turning it off removes the
    # Crossplane core and keeps its CRDs, XRDs, Compositions and claims. See
    # https://pacto.run/latest/integrations/kubernetes/profiles/#crossplane
    install: false

# -- namespace/name of an existing Secret that authenticates to `registry`, for
# a registry without workload identity. Pacto proposes one it saw running pods
# use (helm upgrade notes and Data sources) and never uses it until you name it
# here. The chart grants get on that Secret only.
registryPullSecret: ""

hub:
  # -- The hub's https:// or wss:// URL. Setting it makes this joined cluster a
  # member: the operator dials out to the hub, proves its installation key and
  # answers the hub's per-person reviews with this cluster's own
  # SubjectAccessReview. Nothing listens for the hub: no inbound port, Service
  # or Ingress. Needs `registry`; profile hardened runs no review channel.
  url: ""
  # -- ConfigMap in the release namespace holding `ca.crt`, the PEM CAs the
  # hub's certificate may chain to beside the system pool.
  caConfigMap: ""

# -- Number of controller replicas
replicaCount: 1

image:
  # -- Controller image registry (defaults to `global.imageRegistry`)
  registry: ""
  # -- Controller image repository
  repository: trianalab/pacto/operator
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag (default is the chart appVersion)
  tag: ""
  # -- Pins the image by digest (sha256:...), appended to the tag as tag@digest so
  # the runtime pulls exactly that image whatever the tag resolves to later
  digest: ""

# -- Image pull secrets of the controller pod, after `global.imagePullSecrets`.
# The managed node agent gets them too
imagePullSecrets: []
# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

crds:
  # -- Install and upgrade the CRDs with the chart, the delivery CRDs too when
  # `delivery.enabled`. They are kept on helm uninstall. Only one release in a
  # cluster can own them: every other release, for example one per watched
  # namespace, sets false. Set false to manage them yourself, for example from
  # a separate GitOps source; the operator and delivery need them before they
  # start
  install: true

# -- Registry hosts (`host:port`) to reach over plain HTTP, for a controlled
# in-cluster registry. Scoped per host, so every other registry stays
# HTTPS-only. The controller, the managed dashboard and the managed Evidence
# Server all inherit it, because each one resolves contract refs itself.
insecureRegistries: []

serviceAccount:
  # -- Create a ServiceAccount for the controller
  create: true
  # -- Automount API credentials
  automount: true
  # -- Annotations to add to the ServiceAccount
  annotations: {}
  # -- Name override (defaults to fullname)
  name: ""

# -- Annotations to add to the controller pod
podAnnotations: {}
# -- Labels to add to the controller pod
podLabels: {}

# -- Pod securityContext of the controller (defaults to `global.podSecurityContext`)
podSecurityContext: {}

# -- Container securityContext of the controller (defaults to `global.securityContext`)
securityContext: {}

# No CPU limit: the CPU request reserves the controller's share, and a limit
# throttles it on a busy node until its liveness probe times out.
resources:
  limits:
    # -- Memory limit of the controller. It caches every Deployment, StatefulSet,
    # ReplicaSet, Job, CronJob and Service it targets.
    memory: 256Mi
  requests:
    # -- CPU request of the controller
    cpu: 100m
    # -- Memory request of the controller
    memory: 128Mi

controller:
  # -- Namespaces the controller and the managed dashboard watch. Empty means
  # cluster-wide. With a list, the chart renders namespaced Roles, plus the
  # dashboard's TokenReview grant for token sign-in; fleet answers report the
  # rest as unknown.
  watchNamespaces: []
  # -- Deprecated: use watchNamespaces. Merged into it.
  watchNamespace: ""
  # -- Secrets outside the release namespace and watchNamespaces the operator may
  # read, as namespace/name: pull secrets and Secrets that back a contract
  # configuration. Each gets a Role limited to that Secret.
  secretGrants: []
  # -- Stabilization window: how long a sustained NEGATIVE observation must persist
  # before it converts to a confirmed violation (a transient blip reads Unknown
  # meanwhile). Empty string uses the controller default (2m). Accepts a Go
  # duration (e.g. "30s", "5m").
  stabilizationWindow: ""
  # -- Actively probe in-cluster endpoints: the health capability over HTTP and
  # the wire protocol of each present interface. Takes auto, on or off; true and
  # false still mean on and off. Empty means auto, and an explicit auto also
  # overrides the deprecated enableProbing set to true. auto turns probing on
  # only in namespaces whose owner labels them pacto.trianalab.io/observe=probing
  # (or probing.metrics). When off, health uses passive readiness-probe and
  # EndpointSlice signals only and interface protocols read unverified.
  probing: ""
  # -- Observe the metrics capability (annotation, named-port or contract
  # discovery plus an active scrape). Takes auto, on or off; true and false still
  # mean on and off. Empty means auto, and an explicit auto also overrides the
  # deprecated enableMetricsObservation set to true. auto turns it on only in
  # namespaces whose owner labels them pacto.trianalab.io/observe=metrics (or
  # probing.metrics). ServiceMonitor and PodMonitor discovery and the read
  # access it needs come with on only. When off, metrics read unsupported.
  metricsObservation: ""
  # -- Resolve an unbound interface's Service port by matching a Service port
  # whose name equals the interface name. A positive availability assist only:
  # it never produces an absent or error result.
  interfaceNameMatchDiscovery: false
  kernelEvidence:
    # -- Merge the node agent's kernel observations (NodeRuntimeObservation
    # objects) into interface and dependency evidence. Needs the node agent
    # running. Takes auto, on or "off" (quoted: a bare off is YAML false). auto
    # follows nodeAgent.enabled: a managed agent whose observations nobody merges
    # would be pure cost. Set on alone only for an agent you run yourself; "off"
    # refuses it even with the node agent. false keeps meaning auto.
    enabled: auto
    # -- Namespace the node agent publishes to. Empty uses nodeAgent.namespace.
    namespace: ""
    # -- How old a node's heartbeat may be before its evidence reads stale. Empty
    # uses three times the node agent's publish interval. Accepts a Go duration
    # (e.g. "2m").
    staleness: ""
    # -- Extra namespaces whose host-network pods are taken not to call
    # workloads. The node agent cannot tell a host-network pod's calls from
    # the node's own, so any such pod makes a Service's caller coverage
    # partial, except in kube-system, kube-public, kube-node-lease and the
    # node agent's namespace. The default lists the Flannel and Calico
    # namespaces. Keep only namespaces that exist on your cluster and that
    # you control: anyone who can create a listed namespace can call your
    # services from a host-network pod there unseen.
    callerIgnoreNamespaces: [kube-flannel, calico-system, tigera-operator]
  # -- Istio egress gateway access logs. auto finds Istio egress gateways and
  # proposes the value; on reads their access log tail, which adds pods/log
  # get; "off" stops both. on reads the istio-proxy log of the pods labelled
  # istio=egressgateway in istio-system and grants pods/log get and pods list
  # in a Role there, never in a ClusterRole. Quote "off": a bare off is YAML
  # false, and false keeps meaning auto; true means on.
  egressGatewayLogs: auto

leaderElection:
  # -- Enable leader election for HA deployments
  enabled: true

metrics:
  # -- Enable the metrics endpoint
  enabled: true
  # -- Serve metrics over HTTPS
  secure: true
  service:
    # -- Metrics service port
    port: 8443
  serviceMonitor:
    # -- Create a Prometheus ServiceMonitor
    enabled: false
    # -- Scrape interval
    interval: ""
    # -- Scrape timeout
    scrapeTimeout: ""
  # PrometheusRule alerting templates are available in config/prometheus/alerts.yaml.
  # Apply them manually with: kubectl apply -f config/prometheus/alerts.yaml

dashboard:
  # -- Enable the operator-managed dashboard deployment.
  # The dashboard image is controlled by the operator and derived from the
  # bundled Pacto library version. It is not user-configurable.
  enabled: true
  # -- List of Secret names for OCI registry credentials.
  # Supports Opaque (keys: registry + token, or registry + username + password)
  # and kubernetes.io/dockerconfigjson secrets.
  # When set, credentials from all secrets are merged; later secrets override earlier ones for the same registry.
  ociSecrets: []
  # -- Deprecated: with `registry` set, the dashboard lists every golden path
  # and offering published under it. Still read: oci:// references the
  # dashboard reads beside the contracts it discovers from Pacto resources.
  repositories: []
  # -- Organization external catalog merged over Pacto's default, as
  # oci://REPOSITORY@sha256:DIGEST. The dashboard reads it with the dashboard's
  # OCI credentials. Empty uses only the default catalog.
  externalCatalog: ""
  # A `# --` comment only reaches the generated Helm reference when it sits on a
  # LEAF key: the table is flattened, so a comment on `resources:` is never
  # rendered and its children publish as blank cells. One per leaf.
  resources:
    limits:
      # -- Memory limit for the dashboard container. The earlier default of
      # 128Mi was OOMKilled while monitoring several OCI repositories and CRs
      # at once; raise it further if the dashboard tracks a large fleet.
      memory: 512Mi
    requests:
      # -- CPU request for the dashboard container
      cpu: 50m
      # -- Memory request for the dashboard container
      memory: 128Mi
  observation:
    # -- Offline OTLP/JSON trace exports to mount read-only into the dashboard, so
    # its Operational Graph can reconcile declared dependencies against observed
    # ones. Each entry is one named data source:
    # `name` is its stable Data Source identity (a DNS-1123 label). Reordering
    # this list keeps every name, and each name must be unique across all the
    # dashboard's data sources (the live cluster, OCI, the disk cache, local
    # bundles, an Evidence Server). `file` is the trace file's name directly
    # inside that source's mount, as a single path segment, so mount a claim whose
    # export sits at the top of its own directory. Exactly one of
    # `existingClaim` (an existing PVC, for real exports) or `configMap` (small
    # static exports only, ~1 MiB cap) supplies it. Pacto reads only the
    # declared files, through a root that blocks symlinks out of the mount, and
    # never writes to them or scans the mount. Whoever owns that storage
    # produces and rotates the exports. These files are offline input; the
    # dashboard also receives OTLP/HTTP JSON from Collectors in the cluster,
    # and Pacto deploys no trace collector. The optional node
    # agent observes sockets with eBPF and handles no traces.
    sources: []
    #   - name: orders
    #     file: traces.json
    #     existingClaim: orders-trace-export
  # Sign-in for the dashboard. People sign in before the dashboard shows
  # anything: by default with a Kubernetes token (NOTES prints a short-lived
  # sign-in link), or with an issuer. A person's views and actions run with
  # what their own Kubernetes RBAC allows; the dashboard's ServiceAccount
  # stays read-only and holds no impersonation right. The delivery views
  # (`dashboard.delivery`) need a person's sign-in. With an issuer, the
  # cluster must trust it (structured authentication) with the same claim
  # mapping, and TLS must terminate in front of the dashboard because its
  # session cookie is Secure. See
  # https://pacto.run/latest/integrations/kubernetes/dashboard-authentication/
  auth:
    oidc:
      # -- OpenID Connect issuer URL people sign in with (empty: no sign-in)
      issuerURL: ""
      # -- Where the dashboard reaches the issuer when it differs from `issuerURL`, the address browsers use (for example an in-cluster Service). Discovery, tokens and keys are read there; ID tokens must still name `issuerURL`
      internalIssuerURL: ""
      # -- The identity provider's name on the sign-in button, as in "Sign in with Keycloak" (empty: "Sign in with OIDC")
      displayName: ""
      caBundle:
        # -- A ConfigMap in the operator namespace holding the PEM certificates of the CAs that sign the issuer's certificate (corporate or self-signed), trusted on top of the image's public roots
        configMap: ""
        # -- A Secret in the operator namespace holding that bundle, instead of a ConfigMap
        secret: ""
        # -- The key of the bundle in that ConfigMap or Secret
        key: ca.crt
      # -- The dashboard's client id at the issuer
      clientID: ""
      clientSecretRef:
        # -- Secret in the operator namespace holding the client secret (passed by secretKeyRef)
        name: ""
        # -- Key of the client secret in that Secret
        key: client-secret
      # -- The dashboard's `/auth/callback` URL as browsers reach it
      redirectURL: ""
      # -- Scopes asked for beyond openid, profile and groups (for example a cross-client audience scope)
      extraScopes: []
      # -- ID token claim the API server takes the username from; must match its `claimMappings.username` (empty: `sub`)
      usernameClaim: ""
      # -- Prefix the API server puts before the username; must match its `claimMappings.username.prefix` (empty: the issuer URL and `#`, none for the `email` claim; `-` for none)
      usernamePrefix: ""
      # -- ID token claim the API server takes the groups from; must match its `claimMappings.groups` (empty: `groups`)
      groupsClaim: ""
      # -- Prefix the API server puts before every group; must match its `claimMappings.groups.prefix`
      groupsPrefix: ""
      # -- A second client at the same issuer whose audience the installation's Fulcio trusts and the API server does not: a signed-in person logs in again with it to sign a declaration as themselves. Empty: the dashboard saves drafts and shows the CLI command
      signClientID: ""
      signClientSecretRef:
        # -- Secret in the operator namespace holding the sign client's secret (passed by secretKeyRef)
        name: ""
        # -- Key of the sign client's secret in that Secret
        key: client-secret
      # -- The dashboard's signing callback URL as browsers reach it; required with `signClientID`
      signRedirectURL: ""
    session:
      # -- A session without a request for this long ends, as a Go duration such as `30m` (empty: `1h`). The ID token renews with the refresh token in between
      idleTimeout: ""
      # -- A session ends this long after sign-in, renewed or not, as a Go duration such as `8h` (empty: `12h`)
      maxAge: ""
    tokenSignIn:
      # -- Let people sign in with a Kubernetes token. A ServiceAccount token minted with `--audience pacto-dashboard` reads the fleet only (NOTES prints one for `pacto-viewer`). A person's own token (an OIDC ID token, an EKS token) acts as them and may approve held changes. The chart grants the dashboard `create` on `tokenreviews` and creates the read-only `pacto-viewer` ServiceAccount
      enabled: true
    # -- Serve the dashboard without sign-in, only with tokenSignIn.enabled=false and no issuer. Everyone who reaches it reads every service the dashboard's ServiceAccount reads. With `false` and no sign-in the dashboard refuses to start
    allowAnonymous: false
  mcp:
    # -- Serve MCP to AI agents at /mcp on the dashboard, in the same process and with the same sign-in. A ServiceAccount token minted with `--audience pacto-dashboard` reads the fleet; one also minted for the cluster's own audience proposes and cancels delivery operations as that ServiceAccount. Nobody approves over MCP. Off with the managed dashboard under `profile: hardened`
    enabled: true
    # -- The /mcp URL as agents reach it, an absolute http(s) URL whose path is exactly `/mcp` (a path prefix is not supported; empty: derived from the Ingress or HTTPRoute host, else the address the agent used)
    url: ""
    # -- With `dashboard.auth.oidc`, the audience to exchange an agent's issuer token for, one the API server accepts. The dashboard's OIDC client exchanges it (RFC 8693). Needs a URL. Set: every token from that issuer must name the MCP URL as its audience. Empty: every token is checked as a Kubernetes token
    exchangeAudience: ""
  # What the dashboard's delivery views read. They need sign-in
  # (`dashboard.auth`), because every delivery read and action runs with the
  # signed-in person's token.
  delivery:
    # -- Namespace where Pacto delivery runs. The dashboard reads the identity policy it publishes there (agent, break-glass and human groups, team prefix), so it is never configured twice (empty: `delivery.namespace` when `delivery.enabled`, else `pacto-delivery`)
    namespace: ""
    trust:
      # -- A ConfigMap in the operator namespace holding the trust config the dashboard verifies delivery records with (the recorder's PEM public key or a YAML trust config), so History verifies signed records. Empty: History shows records unverified
      configMap: ""
      # -- The key of the trust config in that ConfigMap
      key: trust.yaml
    # -- Mira's address, to link the health-check citations in delivery views
    miraURL: ""
  # A Backstage catalog the dashboard (and its /mcp) reads owners, systems and
  # dependencies from, shown as inferred values that never clear a gate.
  backstage:
    # -- Base URL of the Backstage catalog, such as https://backstage.acme.internal. Empty: the dashboard reads the catalog the operator detected in the cluster, if any, without a token
    url: ""
    tokenSecret:
      # -- A Secret in the operator namespace holding the catalog reader token, sent only to `url`. Every dashboard user sees the owners, systems and dependencies this token can read; give it catalog read on entities every dashboard user may see. A named Secret that is missing keeps the dashboard pod pending. Needs `url`
      name: ""
      # -- The key of the token in that Secret
      key: token
  declare:
    registryCredentials:
      # -- A `kubernetes.io/dockerconfigjson` Secret in the operator namespace with push access to the bundle repositories under `registry`. Only the dashboard's Declare writer uses it; `dashboard.ociSecrets` stays read-only. Empty: the dashboard plans declarations and shows the CLI command
      secretName: ""
  # -- The organization index the dashboard reads every published service from: `auto` reads `<registry>/pacto-index` when `registry` is set, `none` reads none. The dashboard reads it with `dashboard.ociSecrets`
  index: auto
  stats:
    # -- Stats repository the dashboard's Metrics page reads run records from, such as ghcr.io/acme/pacto-stats. Empty: the page explains how to turn recording on. Credentials come from dashboard.ociSecrets
    registry: ""
  service:
    # -- Dashboard exposure Service type (ClusterIP, NodePort, LoadBalancer).
    # The operator manages an internal ClusterIP Service (pacto-dashboard) for
    # pod-to-pod communication. This chart-managed Service provides configurable
    # external access and serves as the backend for Ingress/HTTPRoute resources.
    # Selects dashboard pods via operator-defined labels.
    type: ClusterIP
    # -- Dashboard service port
    port: 3000
    # -- Node port (only used when type is NodePort)
    nodePort: ""
  ingress:
    # -- Enable Ingress for the dashboard
    enabled: false
    # -- Ingress class name
    className: ""
    # -- Ingress annotations
    annotations: {}
    # -- Ingress hosts
    hosts:
      - host: pacto-dashboard.local
        paths:
          - path: /
            pathType: Prefix
    # -- Ingress TLS configuration
    tls: []
  httpRoute:
    # -- Enable Gateway API HTTPRoute for the dashboard
    enabled: false
    # -- Parent gateway references
    parentRefs: []
    # -- Hostnames for the HTTPRoute
    hostnames: []
    # -- HTTPRoute rules. When empty, a single catch-all rule is generated that
    # routes all traffic to the chart-managed dashboard Service on dashboard.service.port.
    rules: []

evidence:
  # -- Enable the operator-managed Evidence Server deployment. Disabled by
  # default. When enabled the operator reconciles a SEPARATE Evidence Server
  # Deployment and an internal Service; the image is the same runtime image as
  # the dashboard and is not user-configurable. The Evidence Server is single-
  # writer, so its replica count is fixed at one.
  enabled: false
  registry:
    # -- Required when evidence is enabled: the exact, immutable contract
    # revisions evidence may be reported against, each an
    # oci://<repo>@sha256:<digest> reference. The registry holding them is the
    # durable evidence store: every accepted record is published as an OCI 1.1
    # referrer of one of these manifests, so the chart installs nothing durable
    # in the cluster. A mutable tag is rejected, because moving it onto another
    # manifest would change what the stored evidence reports on. A subject on a
    # registry without the OCI 1.1 Referrers API (GHCR, CNCF distribution) needs
    # a subjectPrefixes entry covering it, which stores its evidence as
    # write-once tags; uncovered, the Evidence Server stays not-ready.
    subjects: []
    # -- Optional registry prefixes, each oci://<registry>/<path>/ ending in /,
    # whose immutable revisions evidence may be reported against, including
    # revisions published after install, with no Helm edit and no restart. Refs
    # must still be @sha256 digests. The Evidence Server records each subject
    # in <prefix>pacto-evidence and, where the registry serves no OCI Referrers,
    # stores each record there as a write-once tag. The credentialsSecret must
    # allow push to <prefix>pacto-evidence. That repository holds the refs and
    # evidence of every revision under the prefix: keep it private, or no more
    # visible than the most restricted repository under the prefix. Keep the
    # existing subjects when you add a prefix, so their earlier evidence stays
    # in the replay check. Set allowedContractRepos per key in a trust config
    # (trust.configKey): a key with none may report on every revision under
    # the prefix. Either subjects or subjectPrefixes is required when evidence
    # is enabled.
    subjectPrefixes: []
    # -- Optional name of an EXISTING kubernetes.io/dockerconfigjson Secret with
    # credentials for that registry, mounted read-only. The chart never creates
    # it and never renders its contents. Empty means anonymous or in-cluster
    # access.
    credentialsSecret: ""
    # NOTE: retention, backup and garbage collection of accepted evidence are the
    # registry's responsibility; nothing in this cluster holds a copy. Deleting
    # a contract subject deletes the evidence stored as its referrers. Records
    # stored as write-once tags in <prefix>pacto-evidence outlive their subject.
    # A deleted revision never blocks new writes. Retention may delete old
    # evidence-<hash>-<12 hex> record tags as long as it keeps the newest record
    # per producer and per target; keep every anchor tag and every
    # evidence-<hash>-native marker tag. A ledger past 100,000 tags is unreadable and the Evidence Server refuses writes until pruned.
  trust:
    # -- Name of an existing Secret of trusted producer public keys, mounted
    # read-only. Signature verification is mandatory, so this is required when
    # evidence is enabled.
    existingSecret: ""
    # -- Optional key of the existingSecret holding a structured trust config
    # (apiVersion pacto.dev/evidence-trust/v1, a .yaml or .yml key). When set,
    # the Evidence Server starts with that file, so each key can carry subject,
    # contract-repository and observation-kind allowlists: a provisioning
    # adapter needs allowedObservationKinds [ResourceProvisioned], and
    # allowedProviderRepos scopes a provisioning adapter to the provider
    # repositories it serves. Its publicKeyFile entries name other keys of the
    # same Secret. Empty trusts
    # every *.pub key in the Secret for runtime evidence only.
    configKey: ""
  service:
    # -- Evidence exposure Service type (ClusterIP, NodePort, LoadBalancer). The
    # operator manages an internal ClusterIP Service (pacto-evidence) for
    # in-cluster access; this chart-managed Service provides optional external
    # access and backs any Ingress/HTTPRoute.
    type: ClusterIP
    # -- Evidence service port.
    port: 8686
    # -- Node port (only used when type is NodePort).
    nodePort: ""
  ingress:
    # -- Enable Ingress for the Evidence Server.
    enabled: false
    # -- Ingress class name.
    className: ""
    # -- Ingress annotations.
    annotations: {}
    # -- Ingress hosts.
    hosts:
      - host: pacto-evidence.local
        paths:
          - path: /
            pathType: Prefix
    # -- Ingress TLS configuration.
    tls: []
  httpRoute:
    # -- Enable Gateway API HTTPRoute for the Evidence Server.
    enabled: false
    # -- Parent gateway references.
    parentRefs: []
    # -- Hostnames for the HTTPRoute.
    hostnames: []
    # -- HTTPRoute rules. When empty, a single catch-all rule routes to the
    # chart-managed evidence Service on evidence.service.port.
    rules: []
  resources:
    requests:
      # -- CPU request for the Evidence Server container
      cpu: 25m
      # -- Memory request for the Evidence Server container
      memory: 64Mi
    limits:
      # -- Memory limit for the Evidence Server container. It verifies and
      # forwards one envelope at a time and stores nothing locally, so this is
      # sized for a single writer.
      memory: 256Mi

# The node agent: a DaemonSet the operator creates in its own dedicated
# namespace, one pod per node (every taint tolerated), running `pacto agent`
# from the pacto runtime image the operator was built with (the image the
# Evidence Server runs). It watches TCP socket state with eBPF and publishes
# each node's listeners and connections as a NodeRuntimeObservation object and
# renews a heartbeat Lease per node; it opens no port. Enabling it also turns on
# controller kernel evidence (see controller.kernelEvidence).
#
# The pod needs hostPID, root and the BPF, PERFMON and SYS_PTRACE capabilities,
# which only the privileged Pod Security level admits. The chart creates
# nodeAgent.namespace with pod-security.kubernetes.io/enforce, audit and warn
# set to privileged and the operator keeps them so; the release namespace keeps
# whatever level you set. Where the API serves ValidatingAdmissionPolicy, the
# chart also binds each agent's writes to its own node's objects.
# The kernel needs BTF (/sys/kernel/btf/vmlinux), which current distribution
# kernels ship.
nodeAgent:
  # -- Deploy the node agent DaemonSet. Off by default.
  enabled: false
  # -- Full image reference of the node agent. Empty uses the runtime image the
  # operator was built with.
  image: ""
  # -- Dedicated namespace the agents run and publish in. The chart creates it
  # and labels it privileged for Pod Security; it must not be the release
  # namespace and must not exist outside this release.
  namespace: pacto-node-agent
  # -- Create nodeAgent.namespace. Set false to create it yourself first with
  # the privileged Pod Security labels.
  createNamespace: true
  # -- How often each agent publishes its node's observation. A Go duration;
  # kernel evidence reads stale after three intervals unless
  # controller.kernelEvidence.staleness says otherwise.
  publishInterval: "30s"
  resources:
    requests:
      # -- CPU request for the node agent container
      cpu: 50m
      # -- Memory request for the node agent container
      memory: 64Mi
    limits:
      # -- CPU limit for the node agent container
      cpu: 200m
      # -- Memory limit for the node agent container. The agent caps the pods
      # and connections it tracks, and the kernel ring buffer is charged here.
      memory: 256Mi

# The workload managers and promoters this installation runs, as data: Pacto
# ships no code for any of them. Optional; nothing needs it to work. The chart
# renders it into a ConfigMap the dashboard and the delivery promoter read as
# --fingerprints. Each entry names a product and exactly one matcher.
fingerprints:
  # -- Tools that apply workloads, each named by a `fieldManager`, a `label` or
  # an `annotation` key it leaves on a workload. A workload one of them manages
  # reads `external: <product>`, and the delivery promoter runs the gates and
  # writes no pointer for it.
  managers: []
  # -- Tools that promote versions, each named by a `crd` (`<plural>.<group>`)
  # the cluster serves, or a `label` or `annotation` key on a workload. Data
  # sources reads `promotion owned by <product>` for each one found, with the
  # entry's optional `offer` (`id`, `text`, an `https` `doc`) as the Pacto
  # integration that row offers. These three are examples of an open list: add any IDP's promoter, public or
  # private, as one more entry, or set it to null for none.
  promoters:
    - product: Kargo
      crd: stages.kargo.akuity.io
      offer:
        id: kargo-analysis-template
        text: Gate every Kargo promotion with one shared AnalysisTemplate
        doc: https://pacto.run/latest/integrations/kubernetes/gitops-kargo/#kargo
    - product: Kargo
      crd: warehouses.kargo.akuity.io
      offer:
        id: kargo-analysis-template
        text: Gate every Kargo promotion with one shared AnalysisTemplate
        doc: https://pacto.run/latest/integrations/kubernetes/gitops-kargo/#kargo
    - product: Argo CD Image Updater
      annotation: argocd-image-updater.argoproj.io/image-list
    - product: Flux ImageUpdateAutomation
      crd: imageupdateautomations.image.toolkit.fluxcd.io

# -- Node selector for the controller pod
nodeSelector: {}
# -- Tolerations for the controller pod
tolerations: []
# -- Affinity rules for the controller pod
affinity: {}

# Pacto delivery: the promoter that decides which version each environment
# runs, its signed-record recorder and the admission policies that guard them.
# Off by default; with it off the chart renders exactly as without this section.
# It runs with its own ServiceAccounts and roles, so the observing operator
# gains no write right. Needs Kubernetes 1.30 or later (ValidatingAdmissionPolicy).
delivery:
  # -- Install Pacto delivery: the promoter, its CRDs (Stage, Operation, Approval), roles and admission policies
  enabled: false
  # -- Dedicated namespace the promoter and the recorder run in. The chart
  # creates it; it must not be the release or node agent namespace (the
  # operator can create Deployments, DaemonSets and Secrets there).
  namespace: pacto-delivery
  # -- Create `delivery.namespace`. Set false to create it yourself first, for
  # example to put the recorder key Secret in it before the install
  createNamespace: true
  # -- Number of promoter replicas. Only the elected leader acts.
  replicaCount: 1

  image:
    # -- Promoter and recorder image registry (defaults to `global.imageRegistry`)
    registry: ""
    # -- Promoter and recorder image repository (the pacto-delivery image)
    repository: trianalab/pacto/delivery
    # -- Image pull policy
    pullPolicy: IfNotPresent
    # -- Overrides the image tag (default is the chart appVersion)
    tag: ""
    # -- Pins the image by digest (sha256:...), appended to the tag as tag@digest so
    # the runtime pulls exactly that image whatever the tag resolves to later
    digest: ""

  # -- Image pull secrets of the promoter and the recorder, after `global.imagePullSecrets`
  imagePullSecrets: []

  # -- Annotations to add to the promoter and recorder pods
  podAnnotations: {}
  # -- Labels to add to the promoter and recorder pods
  podLabels: {}

  serviceAccount:
    # -- Create a ServiceAccount for the promoter
    create: true
    # -- Annotations to add to the ServiceAccount
    annotations: {}
    # -- Name override (defaults to `<fullname>-delivery`)
    name: ""

  promoter:
    # -- How often an operation waiting on Flux, Pacto or a person is looked at (a Go duration)
    poll: 3s
    # -- How often a Stage is looked at when nothing it watches changed (a Go duration). A change to
    # its operations, upstream Stage or the Flux or Argo CD objects the promoter watches wakes it at once
    resync: 1m
    # -- How many operations and Stages the promoter reconciles at once, so one slow health provider does not hold up the rest
    workers: 4
    # -- How old a person's login may be when their approval is given, as a Go duration such as `15m`; an older one is ignored,
    # so deciding needs a fresh sign-in. Empty or a zero duration (`0`, `0s`): any signed-in person decides with the session they have. Every Stage publishes it in `status.authFreshness`
    authFreshness: ""
    # -- Elect one active promoter
    leaderElect: true
    # -- The recorder keys of other clusters, as a trust config in YAML (keys per stream glob). A Stage
    # with `candidates.upstreamRecords` promotes only on records one of these keys signed for that
    # stream; without it such a Stage is not Ready. Public keys only.
    upstreamTrust: ""
    registryCredentials:
      # -- A `kubernetes.io/dockerconfigjson` Secret with read access to the contract and deploy
      # repositories, for a private registry. Without it the promoter reads only public ones.
      secretName: ""

  # Who may publish a version a Stage with `candidates.registry` accepts. These are the only trust
  # inputs the chart holds: the publisher rule's registry, the Sigstore root and the bootstrap
  # delivery policy. A signer no rule covers is confirmed once per service in the delivery inbox, and
  # the recorder writes that confirmation to the registry as a signed pin.
  publishers:
    # -- The registry (`host/org`) the installation's services publish to. On `ghcr.io` and
    # `registry.gitlab.com` the promoter derives a rule from it: the organization's CI on the default
    # branch. Empty: no publisher rule, so only the signed policy or a person's confirmation in the
    # delivery inbox accepts a signer
    registry: ""
    # -- The default branch whose CI the derived rule accepts
    defaultBranch: main
    # -- A signed delivery policy (`repository:tag`) whose publisher rules replace the derived rule
    # once verified. Needs `policySigners`
    policy: ""
    # -- The keys that sign the delivery policy, as a trust config in YAML with `role: policy` keys
    # (`keys: [{publicKey: <PEM>, role: policy}]`). Public keys only
    policySigners: ""
    # -- A Sigstore trusted root (`trusted_root.json`) publisher signatures must chain to, for a
    # private Sigstore. Empty uses public-good Sigstore
    trustedRoot: ""

  metrics:
    # -- Expose the promoter's metrics (plain HTTP, port 8080) through a Service. The recorder's come with `delivery.recorder.monitoring`
    enabled: true
    serviceMonitor:
      # -- Create a Prometheus Operator ServiceMonitor for that Service
      enabled: false
      # -- Scrape interval (empty uses Prometheus' default)
      interval: ""
      # -- Scrape timeout (empty uses Prometheus' default)
      scrapeTimeout: ""

  stats:
    # -- A repository (`host/path`) the promoter publishes an unsigned run record of every concluded
    # operation to, attached to one anchor per service. Empty records none. Records are statistics for
    # `pacto stats` and the dashboard Metrics page; nothing that decides reads them.
    # Keep the repository private: pull access to it equals read access to the delivery history of
    # every Stage in every cluster that records to it, so grant pull only to the identities that run
    # `pacto stats` or the dashboard. A registry without the OCI Referrers API (GHCR) uses the
    # run-record tag fallback, where concurrent writers to one service can lose a record without it
    # being counted.
    repository: ""
    registryCredentials:
      # -- A `kubernetes.io/dockerconfigjson` Secret in `delivery.namespace` with push access to
      # `delivery.stats.repository`. Only the promoter mounts it. Without it the promoter uses
      # `delivery.promoter.registryCredentials`, which is usually read-only.
      secretName: ""

  gates:
    # -- Health gate providers a Stage may name in `spec.gates.verify.checks[].provider`, each
    # `{name, type, url}` with type `mira` (Mira's query API), `http` (any tool behind the
    # plug-in format) or `eval` (a runner for the check suites a version ships, named by `checks[].suite`). The URL is operator configuration: a Stage only names a provider and an
    # agent names nothing. `pacto.contract` and `pacto.runtime` are built in. The URL must be
    # https: a verdict ends up in a signed record, so an answer forged in transit could get a
    # Pass signed. Plain http works only on loopback, or with `allowPlainHTTP: true` on a test cluster.
    # An `eval` provider also needs `signers`: the runners whose signed answers it trusts, each
    # `{name, publicKey}` or `{name, identity, issuer, trustedRoot}`. An answer no signer signed is
    # Unknown, and the verdict names the runner that signed it. Each provider's name and type (never its
    # URL or signers) is also published in the identity policy ConfigMap, so `pacto delivery plan` and
    # the dashboard predict an eval check's hold as the promoter does.
    providers: []
    caBundle:
      # -- A ConfigMap in `delivery.namespace` holding the PEM certificates of the CAs that sign
      # your in-cluster providers' https certificates, so they need no `allowPlainHTTP`. The
      # promoter trusts them on top of the image's public roots. Empty trusts the public roots only.
      configMap: ""
      # -- The key in that ConfigMap
      key: ca.crt

  identities:
    # -- Groups whose members are agents. Agents may propose, never approve or unfreeze.
    # Service accounts other than the promoter, other `system:` users and unauthenticated requests
    # are always agents; every other signed-in identity is a person. Use it for automation that
    # signs in through OIDC.
    agentGroups:
      - pacto:agents
    # -- Groups that may raise an override and edit an OCIRepository's spec.ref.digest directly
    breakGlassGroups:
      - pacto:break-glass
    # -- Set it to narrow who may answer to the owner teams: a contract owner team `T` is then
    # the group `T` (with `""`) or this prefix followed by `T` (for example `acme:`). A `system:`
    # group is never a team. Unset, whoever may update the Stage's workload answers.
    teamGroupPrefix: null
    # -- A held question whose service and consumers declare no owner team is answered by nobody,
    # and only break-glass can override. False lets whoever may update the workload answer it.
    requireOwnerTeam: false
    # -- Deprecated: people and agents are told apart by how they sign in. When set, anyone in none
    # of these groups is an agent.
    humanGroups: []
    # -- Issuers whose keyless certificates may sign an approval (`pacto delivery approve`). Each
    # entry has `issuer` (the OIDC issuer URL), `clientID` (the OIDC client the CLI logs in with),
    # `usernamePrefix` (put before the certificate's email to name the Kubernetes user),
    # `subjects` (required: a regular expression every approver's whole email must match, anchored
    # at both ends, for example `[^@]+@acme\.com`), `fulcioURL`, `timestampURL` and `trustedRoot` (the Sigstore
    # trusted_root.json the certificate chains to). Empty, keyless approvals never count and the
    # CLI records Approvals in the cluster. Privacy: public-good Fulcio logs every certificate,
    # the approver's email included, to Certificate Transparency.
    signers: []

  recorder:
    # -- (bool or null) Run the recorder, which writes a signed record of every concluded operation
    # to the registry as OCI referrers. `true` runs it and fails the render on a missing or incomplete
    # signing method or streams repository. `false` keeps it off under every profile. Unset (`null`,
    # the default) is off, except under profile idp, which runs it when a streams repository and
    # exactly one complete signing method are set. When on, the promoter leaves the record finalizer
    # to it. The recorder detects whether the registry serves the OCI Referrers API and otherwise
    # writes one write-once, content-addressed tag per record in the streams repository. It also
    # signs every Approval into the registry, and the promoter then counts an Approval only once its
    # record is written. Upgrade the CLIs and the promoters that follow these streams first: an older
    # reader refuses an operation record that names its approvals' records.
    # @default -- `null`
    enabled: null
    # -- Repository (`host/path`) that holds one anchor per Stage stream. Defaults to
    # `<registry>/pacto-streams` when the top-level `registry` is set; required otherwise when enabled.
    streamsRepository: ""
    # -- Repository (`host/path`) a person's client pushes signed approvals to, one anchor per Stage
    # stream. Empty is `<streamsRepository>-approvals`. Approvers need push access here and only here:
    # only the recorder pushes to the streams repository.
    approvalsRepository: ""
    # -- How long a registry or signer failure backs off (a Go duration)
    poll: 30s
    # -- Elect one active recorder
    leaderElect: true
    serviceAccount:
      # -- Create a ServiceAccount for the recorder
      create: true
      # -- Annotations to add to the recorder's ServiceAccount (workload identity for KMS or keyless)
      annotations: {}
      # -- Name override (defaults to `<fullname>-delivery-recorder`)
      name: ""
    registryCredentials:
      # -- A `kubernetes.io/dockerconfigjson` Secret with push access to the streams, apply and contract
      # repositories. Only the recorder mounts it.
      secretName: ""
    signing:
      ed25519:
        # -- A Secret holding a PKCS#8 PEM Ed25519 private key (for kind and tests)
        secretName: ""
        # -- The key in that Secret
        key: key.pem
        # -- Generate that Secret at install, with a new Ed25519 key kept across upgrades (for evaluation)
        generate: false
      # -- Say yes to an Ed25519 key in a Secret the operator may read. The operator reads Secrets in
      # the release namespace, in each of `controller.watchNamespaces` and the ones
      # `controller.secretGrants` names, so the chart refuses `ed25519.secretName` unless this is true
      # when `delivery.namespace` is the release namespace, is watched, or the key is granted by name:
      # the recorder would not be the key's only holder. Prefer KMS or keyless signing
      allowOperatorReadableKey: false
      # -- A KMS key URI (`awskms://`, `gcpkms://`, `azurekms://`, `hashivault://`). The default image
      # includes every provider; an image built with `--build-arg GO_TAGS=` has none, and one built with
      # `GO_TAGS=kms_aws` (or `kms_gcp`, `kms_azure`, `kms_hashivault`) has only that one
      kms: ""
      keyless:
        # -- Sign keyless with a Fulcio certificate for the recorder's workload identity, presented as a
        # projected service account token for the `sigstore` audience. Rekor upload is off; a timestamp
        # authority dates each signature.
        enabled: false
        # -- The certificate identity keyless signing produces
        identity: ""
        # -- The OIDC issuer keyless signing uses
        issuer: ""
        # -- The Fulcio that issues the certificate
        fulcioURL: ""
        # -- The timestamp authority whose signed time a short-lived certificate verifies at
        timestampURL: ""
        # -- The Sigstore trusted root (`trusted_root.json`) naming that Fulcio and timestamp authority.
        # Required with keyless: without it a self-signed certificate could name the recorder's identity.
        trustedRoot: ""
      # -- The recorder's public key (PEM) for an Ed25519 or KMS recorder, so the promoter and clients
      # verify the publisher pins it writes. Keyless signing needs none: its identity names the signer.
      # Empty with an Ed25519 or KMS recorder: no new publisher can be confirmed
      publicKey: ""
    # -- Keep a recorded operation this long after it concluded, then delete it: its record holds what
    # happened. The operation a Stage runs is never deleted. `0s` keeps them all (a Go duration).
    operationTTL: 168h
    # -- Other keys whose records the recorder accepts, as a trust config in YAML
    # (`keys: [{publicKey: <PEM>, streams: ["*/prod/*"]}]`): list the old key here while you rotate to a
    # new one, and set `untilSeq` and `untilRecord` on a leaked key to revoke it after the last record it
    # signed. The recorder's own key is always trusted. A record no listed key signed is skipped as
    # untrusted.
    trust: ""
    # -- A URL the recorder POSTs a CDEvent (CloudEvents, structured mode) to for every record and when
    # a Stage is created or deleted (environment.created, environment.deleted), best effort. Empty
    # sends none.
    cdeventsSink: ""
    monitoring:
      # -- Scrape the recorder's metrics and alert when records fall behind: a metrics Service, a
      # ServiceMonitor and a PrometheusRule. Needs the Prometheus Operator CRDs.
      enabled: false
    # -- Extra environment for the recorder (for example the credentials a KMS client reads)
    extraEnv: []
    # No CPU limit, as for the controller: a throttled recorder fails its liveness probe.
    resources:
      limits:
        # -- Memory limit of the recorder
        memory: 256Mi
      requests:
        # -- CPU request of the recorder. Signing and pushing a record is the costly part.
        cpu: 50m
        # -- Memory request of the recorder
        memory: 64Mi

  argocd:
    # -- (bool or `auto`) Let Stages name an Argo CD Application as their applier
    # (`spec.applyRef.kind: Application`). Grants the promoter patch on `argoproj.io` Applications
    # (it only sets `spec.source.targetRevision`, and the pointer admission policy holds it to that)
    # and read access to the agent, approver and recorder roles. `auto` grants it when the cluster
    # serves `argoproj.io/v1alpha1` Application at install or upgrade: install Argo CD first, or run
    # `helm upgrade` after. `true` or `false` decide regardless of the API.
    enabled: auto

  flux:
    # -- (bool or `auto`) Let Stages apply through Flux: an OCIRepository with a Kustomization, or
    # a HelmRelease whose `spec.chartRef` names an OCIRepository. Grants the promoter patch on
    # OCIRepositories (admission holds it to `spec.ref.digest`) and Kustomization read. `auto` grants
    # it when the cluster serves `source.toolkit.fluxcd.io/v1` OCIRepository at install or upgrade,
    # and adds HelmRelease read when it also serves `helm.toolkit.fluxcd.io/v2` HelmRelease. `true`
    # grants both regardless of the API; `false` grants neither.
    enabled: auto

  # -- (bool or `auto`) Refuse a version that carries a cluster-scoped kind, an object outside the
  # Stage namespace or a RoleBinding to a ClusterRole, before the promoter writes its pointer.
  # `auto` is on wherever delivery is enabled; `false` opts out.
  manifestInspector: auto

  # -- Registry hosts (`host:port`) the promoter and the recorder reach over plain HTTP. An
  # OCIRepository with `spec.insecure: true` is read over HTTP anyway.
  insecureRegistries: []

  # The chart always installs the delivery ValidatingAdmissionPolicies (Kubernetes 1.30 or
  # later): an operation's actor is the requesting user, only the promoter may set witnessed,
  # override and unfreeze are limited to their raisers, cancel is refused once the pointer moved
  # and an agent cancels only its own operations, approvals come from people and never change,
  # spec.ref.digest is edited only by the promoter or break-glass, and on objects labelled
  # delivery.pacto.trianalab.io/apply-ref the label, the source and what a Kustomization applies
  # change only by break-glass, and only the promoter writes the status of a Stage or an Operation.
  # The promoter admits no operation and counts no approval while any of them is missing or does
  # not deny.
  admissionPolicies:
    # -- Users besides break-glass that may create or delete an OCIRepository, Kustomization
    # or Application labelled delivery.pacto.trianalab.io/apply-ref: the GitOps controllers
    # that apply them. Deleting one and creating it again is an edit, so a namespace editor
    # may do neither. The namespace controller and the garbage collector are always allowed.
    gitopsUsers:
      - system:serviceaccount:flux-system:kustomize-controller
      - system:serviceaccount:argocd:argocd-application-controller
    # -- Skip the chart's Kubernetes 1.30 and ValidatingAdmissionPolicy API check (for `helm lint`
    # or a `helm template` without `--api-versions`). The policies still render.
    skipCapabilityCheck: false

  # -- Pod securityContext of the promoter and the recorder (defaults to `global.podSecurityContext`)
  podSecurityContext: {}

  # -- Container securityContext of the promoter and the recorder (defaults to `global.securityContext`)
  securityContext: {}

  # No CPU limit, as for the controller: a throttled promoter fails its liveness probe.
  resources:
    limits:
      # -- Memory limit of the promoter
      memory: 256Mi
    requests:
      # -- CPU request of the promoter. It looks at every waiting operation once per
      # `promoter.poll`, so raise it with the number of Stages.
      cpu: 100m
      # -- Memory request of the promoter
      memory: 128Mi

  # -- Node selector for the promoter pod
  nodeSelector: {}
  # -- Tolerations for the promoter pod
  tolerations: []
  # -- Affinity for the promoter pod
  affinity: {}

# Who may set a service owner with `pacto declare`, beside the owner's own
# members. The chart renders it into an immutable, content-named ConfigMap the
# operator mounts, so only a person who can upgrade the chart changes it; with
# `registry` set the operator publishes it inside its signed target snapshot,
# where CLIs and agents read it. With `bootstrap` and `teams` empty nothing
# renders and every owner change reads as unverified.
declare:
  defaultApprovers:
    # -- Signers who may set any service owner, as a list of `{name, issuer, subject}`: `issuer` is the
    # OIDC issuer, compared exactly, and `subject` a pattern anchored with `^` and `$` that matches one
    # person, for example `^admin@acme\.com$`
    bootstrap: []
  # -- Per team, the signers who count as its members, as `team: [{name, issuer, subject}]`. A signing
  # certificate carries no groups, so without a rule only the owner's DRI or email contacts count
  teams: {}
  # -- Issuers whose email subjects match an owner's DRI or email contacts. Empty uses
  # `https://accounts.google.com`, `https://github.com/login/oauth` and `https://login.microsoftonline.com`
  emailIssuers: []
  # -- A Sigstore trusted root (`trusted_root.json`) the signature of a running bundle that changes its owner must
  # chain to, for an air-gapped install or a private Sigstore. Empty uses `delivery.publishers.trustedRoot`, else
  # public-good Sigstore. The owner check uses it when `defaultApprovers.bootstrap` or `teams` holds a rule, and the
  # dashboard (with `registry` set) verifies the declarations it signs with it
  trustedRoot: ""
  # The Sigstore a person's declaration is signed with in the dashboard.
  signing:
    # -- Fulcio the dashboard gets a person's signing certificate from (empty: public-good Sigstore)
    fulcioURL: ""
    # -- Rekor the dashboard records the signature in (empty: public-good Sigstore)
    rekorURL: ""
    # -- Timestamp authority the dashboard's signatures use (empty: public-good Sigstore)
    timestampURL: ""

# Optional bundled dependencies, all off by default. values-quickstart.yaml
# turns zot and dex on for an evaluation install and wires them. Every other
# key under `zot` and `dex` passes through to the upstream chart.
zot:
  # -- Install [zot](https://zotregistry.dev) from its official chart as an in-cluster OCI registry with native referrers. Its values are the upstream chart's
  enabled: false
dex:
  # -- Install [Dex](https://dexidp.io) from its official chart as the dashboard's OpenID Connect issuer. The chart then generates the dashboard's client secret into the Secret `dashboard.auth.oidc.clientSecretRef.name` names, with the keys `client-secret`, `admin-password` and `admin-password-hash`, and keeps it across upgrades. Its values are the upstream chart's
  enabled: false
