# -- Number of controller replicas
replicaCount: 1

image:
  # -- Controller image repository
  repository: ghcr.io/trianalab/pacto/operator
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag (default is the chart appVersion)
  tag: ""

# -- Image pull secrets for private registries
imagePullSecrets: []
# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

serviceAccount:
  # -- Create a ServiceAccount for the controller
  create: true
  # -- Automount API credentials
  automount: true
  # -- Annotations to add to the ServiceAccount
  annotations: {}
  # -- Name override (defaults to fullname)
  name: ""

# -- Annotations to add to the controller pod
podAnnotations: {}
# -- Labels to add to the controller pod
podLabels: {}

podSecurityContext:
  # -- Run pod as non-root
  runAsNonRoot: true
  seccompProfile:
    # -- Seccomp profile type
    type: RuntimeDefault

securityContext:
  # -- Disallow privilege escalation
  allowPrivilegeEscalation: false
  capabilities:
    # -- Drop all capabilities
    drop:
      - ALL
  # -- Read-only root filesystem
  readOnlyRootFilesystem: true
  # -- Run as non-root
  runAsNonRoot: true
  # -- Run as UID 65532 (nonroot in distroless)
  runAsUser: 65532

resources:
  limits:
    # -- CPU limit
    cpu: 500m
    # -- Memory limit
    memory: 128Mi
  requests:
    # -- CPU request
    cpu: 10m
    # -- Memory request
    memory: 64Mi

controller:
  # -- Restrict the controller's observation scope to a single namespace.
  # Empty string (default) means cluster-wide: the controller watches all namespaces.
  # The dashboard inherits this scope automatically.
  watchNamespace: ""
  # -- Stabilization window: how long a sustained NEGATIVE observation must persist
  # before it converts to a confirmed violation (a transient blip reads Unknown
  # meanwhile). Empty string uses the controller default (2m). Accepts a Go
  # duration (e.g. "30s", "5m").
  stabilizationWindow: ""

leaderElection:
  # -- Enable leader election for HA deployments
  enabled: true

metrics:
  # -- Enable the metrics endpoint
  enabled: true
  # -- Serve metrics over HTTPS
  secure: true
  service:
    # -- Metrics service port
    port: 8443
  serviceMonitor:
    # -- Create a Prometheus ServiceMonitor
    enabled: false
    # -- Scrape interval
    interval: ""
    # -- Scrape timeout
    scrapeTimeout: ""
  # PrometheusRule alerting templates are available in config/prometheus/alerts.yaml.
  # Apply them manually with: kubectl apply -f config/prometheus/alerts.yaml

dashboard:
  # -- Enable the operator-managed dashboard deployment.
  # The dashboard image is controlled by the operator and derived from the
  # bundled Pacto library version. It is not user-configurable.
  enabled: true
  # -- Optional Secret name for OCI registry credentials (backward compatible).
  # Supports Opaque secrets (keys: registry + token, or registry + username + password)
  # and kubernetes.io/dockerconfigjson secrets. Ignored when ociSecrets is set.
  ociSecret: ""
  # -- List of Secret names for OCI registry credentials.
  # Supports Opaque (with registry key) and kubernetes.io/dockerconfigjson secrets.
  # When set, credentials from all secrets are merged; later secrets override earlier ones for the same registry.
  # Takes precedence over ociSecret.
  ociSecrets: []
  # -- Resource requests and limits for the dashboard container.
  # The previous default of 128Mi memory limit caused OOMKill when monitoring
  # multiple OCI repositories and CRs simultaneously.
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
  observation:
    # -- Offline OTLP/JSON trace exports to mount read-only into the dashboard, so
    # its Operational Graph can reconcile declared dependencies against observed
    # ones. Each entry is one named data source:
    # `name` is its stable Data Source identity (a DNS-1123 label) — reordering
    # this list never renames a source, and it must not collide with any other
    # data source the dashboard has (the live cluster, OCI, the disk cache, local
    # bundles, an Evidence Server); `file` is the trace file's name directly
    # inside that source's mount — a single path segment, so mount a claim whose
    # export sits at the top of its own directory; and exactly one of
    # `existingClaim` (an existing PVC, for real exports) or `configMap` (small
    # static exports only, ~1 MiB cap) supplies it. Pacto reads exactly the
    # declared files — through a root it cannot follow a symlink out of — never
    # writes to them and never scans the mount. Whoever owns that storage owns
    # producing and rotating the exports. This configures OFFLINE input only:
    # Pacto ships no OTLP receiver and deploys no collector.
    sources: []
    #   - name: orders
    #     file: traces.json
    #     existingClaim: orders-trace-export
  service:
    # -- Dashboard exposure Service type (ClusterIP, NodePort, LoadBalancer).
    # The operator manages an internal ClusterIP Service (pacto-dashboard) for
    # pod-to-pod communication. This chart-managed Service provides configurable
    # external access and serves as the backend for Ingress/HTTPRoute resources.
    # Selects dashboard pods via operator-defined labels.
    type: ClusterIP
    # -- Dashboard service port
    port: 3000
    # -- Node port (only used when type is NodePort)
    nodePort: ""
  ingress:
    # -- Enable Ingress for the dashboard
    enabled: false
    # -- Ingress class name
    className: ""
    # -- Ingress annotations
    annotations: {}
    # -- Ingress hosts
    hosts:
      - host: pacto-dashboard.local
        paths:
          - path: /
            pathType: Prefix
    # -- Ingress TLS configuration
    tls: []
  httpRoute:
    # -- Enable Gateway API HTTPRoute for the dashboard
    enabled: false
    # -- Parent gateway references
    parentRefs: []
    # -- Hostnames for the HTTPRoute
    hostnames: []
    # -- HTTPRoute rules. When empty, a single catch-all rule is generated that
    # routes all traffic to the chart-managed dashboard Service on dashboard.service.port.
    rules: []

evidence:
  # -- Enable the operator-managed Evidence Server deployment. Disabled by
  # default. When enabled the operator reconciles a SEPARATE Evidence Server
  # Deployment and an internal Service; the image is the same runtime image as
  # the dashboard and is not user-configurable. The Evidence Server is single-
  # writer, so its replica count is fixed at one.
  enabled: false
  storage:
    # -- Durable evidence bucket URL. The default file:// needs no external
    # infrastructure (just the PVC below); s3://, gs:// and azblob:// use cloud
    # storage with the same evidence logic.
    bucketURL: file:///var/lib/pacto/evidence
    # -- Logical key prefix; every object is scoped below it, so installations
    # can safely share one bucket via distinct prefixes.
    prefix: pacto-evidence/v1
    persistence:
      # -- Provision a PVC for a file:// bucket. Set false for cloud buckets or
      # when using an existing claim.
      enabled: true
      # -- Use an externally-managed PVC instead of provisioning one.
      existingClaim: ""
      # -- Requested PVC size.
      size: 1Gi
      # -- StorageClass for the provisioned PVC. Empty uses the cluster default.
      storageClass: ""
      # -- PVC access modes. ReadWriteOnce is correct for a single writer.
      accessModes:
        - ReadWriteOnce
      # NOTE: the evidence PVC is ALWAYS retained on component disable and chart
      # uninstall — it carries no owner reference and is never garbage-collected
      # with the operator. To delete persisted evidence, remove the PVC manually
      # (kubectl delete pvc pacto-evidence-data). There is deliberately no toggle:
      # auto-deleting signed, accepted audit evidence would defeat the component,
      # and it is unimplementable at uninstall (the operator is already gone).
  trust:
    # -- Name of an existing Secret of trusted producer public keys, mounted
    # read-only. Signature verification is mandatory, so this is required when
    # evidence is enabled.
    existingSecret: ""
  service:
    # -- Evidence exposure Service type (ClusterIP, NodePort, LoadBalancer). The
    # operator manages an internal ClusterIP Service (pacto-evidence) for
    # in-cluster access; this chart-managed Service provides optional external
    # access and backs any Ingress/HTTPRoute.
    type: ClusterIP
    # -- Evidence service port.
    port: 8686
    # -- Node port (only used when type is NodePort).
    nodePort: ""
  ingress:
    # -- Enable Ingress for the Evidence Server.
    enabled: false
    # -- Ingress class name.
    className: ""
    # -- Ingress annotations.
    annotations: {}
    # -- Ingress hosts.
    hosts:
      - host: pacto-evidence.local
        paths:
          - path: /
            pathType: Prefix
    # -- Ingress TLS configuration.
    tls: []
  httpRoute:
    # -- Enable Gateway API HTTPRoute for the Evidence Server.
    enabled: false
    # -- Parent gateway references.
    parentRefs: []
    # -- Hostnames for the HTTPRoute.
    hostnames: []
    # -- HTTPRoute rules. When empty, a single catch-all rule routes to the
    # chart-managed evidence Service on evidence.service.port.
    rules: []
  # -- Resource requests and limits for the Evidence Server container.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

# -- Node selector for the controller pod
nodeSelector: {}
# -- Tolerations for the controller pod
tolerations: []
# -- Affinity rules for the controller pod
affinity: {}
