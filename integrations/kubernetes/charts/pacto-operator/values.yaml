# -- Number of controller replicas
replicaCount: 1

image:
  # -- Controller image repository
  repository: ghcr.io/trianalab/pacto/operator
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag (default is the chart appVersion)
  tag: ""
  # -- Pins the image by digest (sha256:...), appended to the tag as tag@digest so
  # the runtime pulls exactly that image whatever the tag resolves to later
  digest: ""

# -- Image pull secrets for private registries
imagePullSecrets: []
# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

# -- Registry hosts (`host:port`) to reach over plain HTTP instead of HTTPS, for a
# controlled in-cluster registry. Scoped per host, so every other registry stays
# HTTPS-only. The controller, the managed dashboard and the managed Evidence
# Server all inherit it — each resolves contract refs itself.
insecureRegistries: []

serviceAccount:
  # -- Create a ServiceAccount for the controller
  create: true
  # -- Automount API credentials
  automount: true
  # -- Annotations to add to the ServiceAccount
  annotations: {}
  # -- Name override (defaults to fullname)
  name: ""

# -- Annotations to add to the controller pod
podAnnotations: {}
# -- Labels to add to the controller pod
podLabels: {}

podSecurityContext:
  # -- Run pod as non-root
  runAsNonRoot: true
  seccompProfile:
    # -- Seccomp profile type
    type: RuntimeDefault

securityContext:
  # -- Disallow privilege escalation
  allowPrivilegeEscalation: false
  capabilities:
    # -- Drop all capabilities
    drop:
      - ALL
  # -- Read-only root filesystem
  readOnlyRootFilesystem: true
  # -- Run as non-root
  runAsNonRoot: true
  # -- Run as UID 65532 (nonroot in distroless)
  runAsUser: 65532

resources:
  limits:
    # -- CPU limit
    cpu: 500m
    # -- Memory limit
    memory: 128Mi
  requests:
    # -- CPU request
    cpu: 10m
    # -- Memory request
    memory: 64Mi

controller:
  # -- Restrict the controller's observation scope to a single namespace.
  # Empty string (default) means cluster-wide: the controller watches all namespaces.
  # The dashboard inherits this scope automatically.
  watchNamespace: ""
  # -- Stabilization window: how long a sustained NEGATIVE observation must persist
  # before it converts to a confirmed violation (a transient blip reads Unknown
  # meanwhile). Empty string uses the controller default (2m). Accepts a Go
  # duration (e.g. "30s", "5m").
  stabilizationWindow: ""
  # -- Actively probe in-cluster endpoints: the health capability over HTTP and
  # the wire protocol of each present interface. Off by default; when off, health
  # uses passive readiness-probe and EndpointSlice signals only and interface
  # protocols read unverified.
  enableProbing: false
  # -- Observe the metrics capability (ServiceMonitor, PodMonitor, annotation or
  # named-port discovery plus an active scrape). Also grants read access to
  # ServiceMonitors and PodMonitors. Off by default; when off, metrics read
  # unsupported.
  enableMetricsObservation: false
  kernelEvidence:
    # -- Merge the node agent's kernel observations (NodeRuntimeObservation
    # objects) into interface and dependency evidence. Needs the node agent
    # running; off by default, so evidence comes from the Kubernetes API only.
    # Kernel evidence is on whenever this OR nodeAgent.enabled is true: a
    # managed agent whose observations nobody merges would be pure cost. Set
    # this alone only for an agent you run yourself.
    enabled: false
    # -- Namespace the node agent publishes to. Empty uses nodeAgent.namespace.
    namespace: ""
    # -- How old a node's heartbeat may be before its evidence reads stale. Empty
    # uses three times the node agent's publish interval. Accepts a Go duration
    # (e.g. "2m").
    staleness: ""

leaderElection:
  # -- Enable leader election for HA deployments
  enabled: true

metrics:
  # -- Enable the metrics endpoint
  enabled: true
  # -- Serve metrics over HTTPS
  secure: true
  service:
    # -- Metrics service port
    port: 8443
  serviceMonitor:
    # -- Create a Prometheus ServiceMonitor
    enabled: false
    # -- Scrape interval
    interval: ""
    # -- Scrape timeout
    scrapeTimeout: ""
  # PrometheusRule alerting templates are available in config/prometheus/alerts.yaml.
  # Apply them manually with: kubectl apply -f config/prometheus/alerts.yaml

dashboard:
  # -- Enable the operator-managed dashboard deployment.
  # The dashboard image is controlled by the operator and derived from the
  # bundled Pacto library version. It is not user-configurable.
  enabled: true
  # -- List of Secret names for OCI registry credentials.
  # Supports Opaque (keys: registry + token, or registry + username + password)
  # and kubernetes.io/dockerconfigjson secrets.
  # When set, credentials from all secrets are merged; later secrets override earlier ones for the same registry.
  ociSecrets: []
  # A `# --` comment only reaches the generated Helm reference when it sits on a
  # LEAF key: the table is flattened, so a comment on `resources:` is never
  # rendered and its children publish as blank cells. One per leaf.
  resources:
    limits:
      # -- Memory limit for the dashboard container. The earlier default of
      # 128Mi was OOMKilled while monitoring several OCI repositories and CRs
      # at once; raise it further if the dashboard tracks a large fleet.
      memory: 512Mi
    requests:
      # -- CPU request for the dashboard container
      cpu: 50m
      # -- Memory request for the dashboard container
      memory: 128Mi
  observation:
    # -- Offline OTLP/JSON trace exports to mount read-only into the dashboard, so
    # its Operational Graph can reconcile declared dependencies against observed
    # ones. Each entry is one named data source:
    # `name` is its stable Data Source identity (a DNS-1123 label) — reordering
    # this list never renames a source, and it must not collide with any other
    # data source the dashboard has (the live cluster, OCI, the disk cache, local
    # bundles, an Evidence Server); `file` is the trace file's name directly
    # inside that source's mount — a single path segment, so mount a claim whose
    # export sits at the top of its own directory; and exactly one of
    # `existingClaim` (an existing PVC, for real exports) or `configMap` (small
    # static exports only, ~1 MiB cap) supplies it. Pacto reads exactly the
    # declared files — through a root it cannot follow a symlink out of — never
    # writes to them and never scans the mount. Whoever owns that storage owns
    # producing and rotating the exports. This configures OFFLINE input only:
    # Pacto ships no OTLP receiver and no trace collector (the optional node
    # agent is an eBPF socket observer, not a trace pipeline).
    sources: []
    #   - name: orders
    #     file: traces.json
    #     existingClaim: orders-trace-export
  # Sign-in for the dashboard. With it, the delivery views and actions run with
  # each signed-in person's own token; the dashboard's ServiceAccount stays
  # read-only and never gains a delivery right or impersonation. Without it the
  # dashboard serves no delivery data and no actions. The cluster must trust the
  # same issuer (structured authentication), and TLS must terminate in front of
  # the dashboard because its session cookie is Secure.
  auth:
    oidc:
      # -- OpenID Connect issuer URL people sign in with (empty: no sign-in)
      issuerURL: ""
      # -- The dashboard's client id at the issuer
      clientID: ""
      clientSecretRef:
        # -- Secret in the operator namespace holding the client secret (passed by secretKeyRef)
        name: ""
        # -- Key of the client secret in that Secret
        key: client-secret
      # -- The dashboard's `/auth/callback` URL as browsers reach it
      redirectURL: ""
      # -- Scopes asked for beyond openid, profile and groups (for example a cross-client audience scope)
      extraScopes: []
    # -- Gate the fleet views and the whole API behind sign-in too, not only delivery (needs `oidc.issuerURL`)
    required: false
    # -- Namespace where Pacto delivery runs. The dashboard reads the identity policy it publishes there (agent, break-glass and human groups, team prefix), so it is never configured twice (empty: `delivery.namespace` when `delivery.enabled`, else `pacto-delivery`)
    deliveryNamespace: ""
  # -- Mira's address, to link the health-check citations in delivery views
  miraURL: ""
  service:
    # -- Dashboard exposure Service type (ClusterIP, NodePort, LoadBalancer).
    # The operator manages an internal ClusterIP Service (pacto-dashboard) for
    # pod-to-pod communication. This chart-managed Service provides configurable
    # external access and serves as the backend for Ingress/HTTPRoute resources.
    # Selects dashboard pods via operator-defined labels.
    type: ClusterIP
    # -- Dashboard service port
    port: 3000
    # -- Node port (only used when type is NodePort)
    nodePort: ""
  ingress:
    # -- Enable Ingress for the dashboard
    enabled: false
    # -- Ingress class name
    className: ""
    # -- Ingress annotations
    annotations: {}
    # -- Ingress hosts
    hosts:
      - host: pacto-dashboard.local
        paths:
          - path: /
            pathType: Prefix
    # -- Ingress TLS configuration
    tls: []
  httpRoute:
    # -- Enable Gateway API HTTPRoute for the dashboard
    enabled: false
    # -- Parent gateway references
    parentRefs: []
    # -- Hostnames for the HTTPRoute
    hostnames: []
    # -- HTTPRoute rules. When empty, a single catch-all rule is generated that
    # routes all traffic to the chart-managed dashboard Service on dashboard.service.port.
    rules: []

evidence:
  # -- Enable the operator-managed Evidence Server deployment. Disabled by
  # default. When enabled the operator reconciles a SEPARATE Evidence Server
  # Deployment and an internal Service; the image is the same runtime image as
  # the dashboard and is not user-configurable. The Evidence Server is single-
  # writer, so its replica count is fixed at one.
  enabled: false
  registry:
    # -- Required when evidence is enabled: the exact, immutable contract
    # revisions evidence may be reported against, each an
    # oci://<repo>@sha256:<digest> reference. The registry holding them IS the
    # durable evidence store — every accepted record is published as an OCI 1.1
    # referrer of one of these manifests — so the chart installs nothing durable
    # in the cluster. A mutable tag is rejected: it could be moved onto another
    # manifest and silently change what the stored evidence reports on. That
    # registry must serve the native OCI 1.1 Referrers API — GHCR and CNCF
    # distribution (registry:2, registry:3) do not, and the Evidence Server
    # stays permanently not-ready against them.
    subjects: []
    # -- Optional name of an EXISTING kubernetes.io/dockerconfigjson Secret with
    # credentials for that registry, mounted read-only. The chart never creates
    # it and never renders its contents. Empty means anonymous or in-cluster
    # access.
    credentialsSecret: ""
    # NOTE: retention, backup and garbage collection of accepted evidence are the
    # registry's responsibility. Deleting a contract subject or its referrers in
    # the registry deletes the evidence reported against it; nothing in this
    # cluster holds a copy.
  trust:
    # -- Name of an existing Secret of trusted producer public keys, mounted
    # read-only. Signature verification is mandatory, so this is required when
    # evidence is enabled.
    existingSecret: ""
  service:
    # -- Evidence exposure Service type (ClusterIP, NodePort, LoadBalancer). The
    # operator manages an internal ClusterIP Service (pacto-evidence) for
    # in-cluster access; this chart-managed Service provides optional external
    # access and backs any Ingress/HTTPRoute.
    type: ClusterIP
    # -- Evidence service port.
    port: 8686
    # -- Node port (only used when type is NodePort).
    nodePort: ""
  ingress:
    # -- Enable Ingress for the Evidence Server.
    enabled: false
    # -- Ingress class name.
    className: ""
    # -- Ingress annotations.
    annotations: {}
    # -- Ingress hosts.
    hosts:
      - host: pacto-evidence.local
        paths:
          - path: /
            pathType: Prefix
    # -- Ingress TLS configuration.
    tls: []
  httpRoute:
    # -- Enable Gateway API HTTPRoute for the Evidence Server.
    enabled: false
    # -- Parent gateway references.
    parentRefs: []
    # -- Hostnames for the HTTPRoute.
    hostnames: []
    # -- HTTPRoute rules. When empty, a single catch-all rule routes to the
    # chart-managed evidence Service on evidence.service.port.
    rules: []
  resources:
    requests:
      # -- CPU request for the Evidence Server container
      cpu: 25m
      # -- Memory request for the Evidence Server container
      memory: 64Mi
    limits:
      # -- Memory limit for the Evidence Server container. It verifies and
      # forwards one envelope at a time and stores nothing locally, so this is
      # sized for a single writer.
      memory: 256Mi

# The node agent: a DaemonSet the operator creates in its own dedicated
# namespace, one pod per node (every taint tolerated), running `pacto agent`
# from the pacto runtime image the operator was built with (the image the
# Evidence Server runs). It watches TCP socket state with eBPF and publishes
# each node's listeners and connections as a NodeRuntimeObservation object and
# renews a heartbeat Lease per node; it opens no port. Enabling it also turns on
# controller kernel evidence (see controller.kernelEvidence).
#
# The pod needs hostPID, root and the BPF, PERFMON and SYS_PTRACE capabilities,
# which only the privileged Pod Security level admits. The chart creates
# nodeAgent.namespace with pod-security.kubernetes.io/enforce, audit and warn
# set to privileged and the operator keeps them so; the release namespace keeps
# whatever level you set. Where the API serves ValidatingAdmissionPolicy, the
# chart also binds each agent's writes to its own node's objects.
# The kernel needs BTF (/sys/kernel/btf/vmlinux), which current distribution
# kernels ship.
nodeAgent:
  # -- Deploy the node agent DaemonSet. Off by default.
  enabled: false
  # -- Dedicated namespace the agents run and publish in. The chart creates it
  # and labels it privileged for Pod Security; it must not be the release
  # namespace and must not exist outside this release.
  namespace: pacto-node-agent
  # -- How often each agent publishes its node's observation. A Go duration;
  # kernel evidence reads stale after three intervals unless
  # controller.kernelEvidence.staleness says otherwise.
  publishInterval: "30s"
  resources:
    requests:
      # -- CPU request for the node agent container
      cpu: 50m
      # -- Memory request for the node agent container
      memory: 64Mi
    limits:
      # -- CPU limit for the node agent container
      cpu: 200m
      # -- Memory limit for the node agent container. The agent caps the pods
      # and connections it tracks, and the kernel ring buffer is charged here.
      memory: 256Mi

# -- Node selector for the controller pod
nodeSelector: {}
# -- Tolerations for the controller pod
tolerations: []
# -- Affinity rules for the controller pod
affinity: {}

# Pacto delivery: the promoter that decides which version each environment
# runs, its signed-record recorder and the admission policies that guard them.
# Off by default; with it off the chart renders exactly as without this section.
# It runs with its own ServiceAccounts and roles, so the observing operator
# gains no write right. Needs Kubernetes 1.30 or later (ValidatingAdmissionPolicy).
delivery:
  # -- Install Pacto delivery: the promoter, its CRDs (Stage, Operation, Approval), roles and admission policies
  enabled: false
  # -- Dedicated namespace the promoter and the recorder run in. The chart
  # creates it; it must not be the release or node agent namespace (the
  # operator can create Deployments, DaemonSets and Secrets there).
  namespace: pacto-delivery
  # -- Create `delivery.namespace`. Set false to create it yourself first, for
  # example to put the recorder key Secret in it before the install
  createNamespace: true
  # -- Number of promoter replicas. Only the elected leader acts.
  replicaCount: 1

  image:
    # -- Promoter image repository (the pacto-delivery image)
    repository: ghcr.io/trianalab/pacto/delivery
    # -- Image pull policy
    pullPolicy: IfNotPresent
    # -- Overrides the image tag (default is the chart appVersion)
    tag: ""
    # -- Pins the image by digest (sha256:...), appended to the tag as tag@digest so
    # the runtime pulls exactly that image whatever the tag resolves to later
    digest: ""

  # -- Image pull secrets for private registries
  imagePullSecrets: []

  serviceAccount:
    # -- Create a ServiceAccount for the promoter
    create: true
    # -- Annotations to add to the ServiceAccount
    annotations: {}
    # -- Name override (defaults to `<fullname>-delivery`)
    name: ""

  promoter:
    # -- How often an operation waiting on Flux, Pacto or a person is looked at (a Go duration)
    poll: 3s
    # -- How many operations and Stages the promoter reconciles at once, so one slow health provider does not hold up the rest
    workers: 4
    # -- How old a person's login may be when their approval is given; an older one is ignored (a Go duration). Every Stage publishes it in `status.authFreshness`
    authFreshness: 15m
    # -- Elect one active promoter
    leaderElect: true
    # -- The recorder keys of other clusters, as a trust config in YAML (keys per stream glob). A Stage
    # with `candidates.upstreamRecords` promotes only on records one of these keys signed for that
    # stream; without it such a Stage is not Ready. Public keys only.
    upstreamTrust: ""
    registryCredentials:
      # -- A `kubernetes.io/dockerconfigjson` Secret with read access to the contract and deploy
      # repositories, for a private registry. Without it the promoter reads only public ones.
      secretName: ""

  metrics:
    # -- Expose the promoter's metrics (plain HTTP, port 8080) through a Service. The recorder's come with `delivery.recorder.monitoring`
    enabled: true
    serviceMonitor:
      # -- Create a Prometheus Operator ServiceMonitor for that Service
      enabled: false
      # -- Scrape interval (empty uses Prometheus' default)
      interval: ""
      # -- Scrape timeout (empty uses Prometheus' default)
      scrapeTimeout: ""

  gates:
    # -- Health gate providers a Stage may name in `spec.gates.verify.checks[].provider`, each
    # `{name, type, url}` with type `mira` (Mira's query API), `http` (any tool behind the
    # plug-in format) or `eval` (a runner for the check suites a version ships, named by `checks[].suite`). The URL is operator configuration: a Stage only names a provider and an
    # agent names nothing. `pacto.contract` and `pacto.runtime` are built in. The URL must be
    # https: a verdict ends up in a signed record, so an answer forged in transit could get a
    # Pass signed. Plain http works only on loopback, or with `allowPlainHTTP: true` on a test cluster.
    # An `eval` provider also needs `signers`: the runners whose signed answers it trusts, each
    # `{name, publicKey}` or `{name, identity, issuer, trustedRoot}`. An answer no signer signed is
    # Unknown, and the verdict names the runner that signed it.
    providers: []

  identities:
    # -- Groups whose members are agents. Agents may propose, never approve or unfreeze.
    # Service accounts other than the promoter are always agents.
    agentGroups:
      - pacto:agents
    # -- Groups that may raise an override and edit an OCIRepository's spec.ref.digest directly
    breakGlassGroups:
      - pacto:break-glass
    # -- Only members of the teams a held question names may answer it. A contract owner team `T`
    # is the identity-provider group `T`, or once this prefix is set only this prefix followed by `T`
    # (for example `acme:`). A `system:` group is never a team.
    teamGroupPrefix: ""
    # -- A held question whose service and consumers declare no owner team is answered by nobody,
    # and only break-glass can override. Set false to let any person answer it, as before.
    requireOwnerTeam: true
    # -- When set, only members of these groups count as people. Anyone in none of them is an agent,
    # so an agent identity nobody enrolled in an agent group still cannot approve. Empty classifies
    # by `agentGroups` alone.
    humanGroups: []

  recorder:
    # -- Run the recorder, which writes a signed record of every concluded operation to the registry
    # as OCI referrers. Off by default. When on, the promoter leaves the record finalizer to it. The
    # registry must support the OCI Referrers API natively (GHCR and released `distribution` do not).
    enabled: false
    # -- Repository (`host/path`) that holds one anchor per Stage stream. Required when enabled.
    streamsRepository: ""
    # -- How long a registry or signer failure backs off (a Go duration)
    poll: 30s
    # -- Elect one active recorder
    leaderElect: true
    serviceAccount:
      # -- Create a ServiceAccount for the recorder
      create: true
      # -- Annotations to add to the recorder's ServiceAccount (workload identity for KMS or keyless)
      annotations: {}
      # -- Name override (defaults to `<fullname>-delivery-recorder`)
      name: ""
    registryCredentials:
      # -- A `kubernetes.io/dockerconfigjson` Secret with push access to the streams, apply and contract
      # repositories. Only the recorder mounts it.
      secretName: ""
    signing:
      ed25519:
        # -- A Secret holding a PKCS#8 PEM Ed25519 private key (for kind and tests)
        secretName: ""
        # -- The key in that Secret
        key: key.pem
      # -- Say yes to an Ed25519 key in a Secret. The operator reads every Secret in the cluster, so
      # it can read this key too and the recorder is not its only holder. The chart refuses
      # `ed25519.secretName` unless this is true. Prefer KMS or keyless signing
      allowOperatorReadableKey: false
      # -- A KMS key URI (`awskms://`, `gcpkms://`, `azurekms://`, `hashivault://`). The default image
      # includes every provider; an image built with `--build-arg GO_TAGS=` has none, and one built with
      # `GO_TAGS=kms_aws` (or `kms_gcp`, `kms_azure`, `kms_hashivault`) has only that one
      kms: ""
      keyless:
        # -- Sign keyless with a Fulcio certificate for the recorder's workload identity, presented as a
        # projected service account token for the `sigstore` audience. Rekor upload is off; a timestamp
        # authority dates each signature.
        enabled: false
        # -- The certificate identity keyless signing produces
        identity: ""
        # -- The OIDC issuer keyless signing uses
        issuer: ""
        # -- The Fulcio that issues the certificate
        fulcioURL: ""
        # -- The timestamp authority whose signed time a short-lived certificate verifies at
        timestampURL: ""
        # -- The Sigstore trusted root (`trusted_root.json`) naming that Fulcio and timestamp authority.
        # Required with keyless: without it a self-signed certificate could name the recorder's identity.
        trustedRoot: ""
    # -- Keep a recorded operation this long after it concluded, then delete it: its record holds what
    # happened. The operation a Stage runs is never deleted. `0s` keeps them all (a Go duration).
    operationTTL: 168h
    # -- Other keys whose records the recorder accepts, as a trust config in YAML
    # (`keys: [{publicKey: <PEM>, streams: ["*/prod/*"]}]`): list the old key here while you rotate to a
    # new one, and set `untilSeq` and `untilRecord` on a leaked key to revoke it after the last record it
    # signed. The recorder's own key is always trusted. A record no listed key signed is skipped as
    # untrusted.
    trust: ""
    # -- A URL the recorder POSTs a CDEvent (CloudEvents, structured mode) to for every record, best
    # effort. Empty sends none.
    cdeventsSink: ""
    monitoring:
      # -- Scrape the recorder's metrics and alert when records fall behind: a metrics Service, a
      # ServiceMonitor and a PrometheusRule. Needs the Prometheus Operator CRDs.
      enabled: false
    # -- Extra environment for the recorder (for example the credentials a KMS client reads)
    extraEnv: []
    resources:
      limits:
        # -- CPU limit
        cpu: 500m
        # -- Memory limit
        memory: 256Mi
      requests:
        # -- CPU request
        cpu: 10m
        # -- Memory request
        memory: 64Mi

  argocd:
    # -- Let Stages name an Argo CD Application as their applier (`spec.applyRef.kind: Application`).
    # Grants the promoter patch on `argoproj.io` Applications (it only sets `spec.source.targetRevision`,
    # and the pointer admission policy holds it to that) and read access to the agent, approver and
    # recorder roles. Off by default.
    enabled: false

  # -- Registry hosts (`host:port`) the promoter and the recorder reach over plain HTTP. An
  # OCIRepository with `spec.insecure: true` is read over HTTP anyway.
  insecureRegistries: []

  admissionPolicies:
    # -- Install the ValidatingAdmissionPolicies (Kubernetes 1.30 or later): an operation's
    # actor is the requesting user, only the promoter may set witnessed, override and
    # unfreeze are limited to their raisers, cancel is refused once the pointer moved
    # and an agent cancels only its own operations,
    # approvals come from people and never change, spec.ref.digest is edited only by the
    # promoter or break-glass, and on objects labelled delivery.pacto.trianalab.io/apply-ref
    # the label, the source and what a Kustomization applies change only by break-glass,
    # and only the promoter writes the status of a Stage or an Operation.
    # The promoter admits no operation and counts no approval while any of them is
    # missing or does not deny.
    enabled: true
    # -- Users besides break-glass that may create or delete an OCIRepository, Kustomization
    # or Application labelled delivery.pacto.trianalab.io/apply-ref: the GitOps controllers
    # that apply them. Deleting one and creating it again is an edit, so a namespace editor
    # may do neither. The namespace controller and the garbage collector are always allowed.
    gitopsUsers:
      - system:serviceaccount:flux-system:kustomize-controller
      - system:serviceaccount:argocd:argocd-application-controller
    # -- Render without the policies (enabled=false) anyway, and skip the chart's
    # Kubernetes 1.30 and ValidatingAdmissionPolicy API check. Without the policies
    # anyone who may create an Operation or an Approval can claim to be anyone, so
    # the chart refuses either unless this is set.
    allowUnguarded: false

  podSecurityContext:
    # -- Run pod as non-root
    runAsNonRoot: true
    seccompProfile:
      # -- Seccomp profile type
      type: RuntimeDefault

  securityContext:
    # -- Disallow privilege escalation
    allowPrivilegeEscalation: false
    capabilities:
      # -- Drop all capabilities
      drop:
        - ALL
    # -- Read-only root filesystem
    readOnlyRootFilesystem: true
    # -- Run as non-root
    runAsNonRoot: true
    # -- Run as UID 65532 (nonroot in distroless)
    runAsUser: 65532

  resources:
    limits:
      # -- CPU limit
      cpu: 500m
      # -- Memory limit
      memory: 256Mi
    requests:
      # -- CPU request
      cpu: 10m
      # -- Memory request
      memory: 64Mi

  # -- Node selector for the promoter pod
  nodeSelector: {}
  # -- Tolerations for the promoter pod
  tolerations: []
  # -- Affinity for the promoter pod
  affinity: {}
