apiVersion: v2
name: pacto-operator
description: Kubernetes operator that checks running workloads against their Pacto service contracts, with an opt-in delivery component (alpha)
type: application
version: 6.1.0
appVersion: "6.1.0"
keywords:
  - pacto
  - operator
  - contracts
  - kubernetes
  - validation
  - delivery
  - gitops
# Optional, off by default: a registry and an identity provider for an
# evaluation install (values-quickstart.yaml). The archives are vendored in
# charts/ and pinned by Chart.lock, so the chart packages offline.
dependencies:
  - name: zot
    version: 0.1.128
    repository: https://zotregistry.dev/helm-charts
    condition: zot.enabled
  - name: dex
    version: 0.26.0
    repository: https://charts.dexidp.io
    condition: dex.enabled
icon: https://raw.githubusercontent.com/TrianaLab/pacto/refs/heads/main/docs/assets/images/logo.png
maintainers:
  - name: edu-diaz
    url: https://edudiaz.dev
    email: edudiazasencio@gmail.com
sources:
  - https://github.com/TrianaLab/pacto/tree/main/integrations/kubernetes
  - https://github.com/TrianaLab/pacto
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: support
      url: https://github.com/TrianaLab/pacto/issues
    - name: documentation
      url: https://pacto.run/latest/integrations/kubernetes/overview/
  artifacthub.io/images: |
    - name: pacto-controller
      image: ghcr.io/trianalab/pacto/operator:6.1.0
    - name: pacto-delivery
      image: ghcr.io/trianalab/pacto/delivery:6.1.0
